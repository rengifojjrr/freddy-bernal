s históricos de TikTok no se identificó ni una sola pieza de tono electoral.","lead":""},{"t":"Lo que sí funciona como promesa cumplida es la fórmula de compromiso personal: «Soy un hombre de palabra, lo prometí y lo cumplí» (693.000 reproducciones, puesto 12 del top histórico) y «Yo no soy un demagogo para callar la gente. NO, yo doy la cara». Es promesa retrospectiva, no prospectiva, y es la que rinde.","lead":""},{"t":"LO QUE QUEDA DE CAMPAÑA ES RESIDUO SIN VIGILANCIA, no estrategia: la destacada «PLAN GOBIERNO» de Instagram con llamada al voto, y la biografía del TikTok secundario que sigue describiéndolo como «Candidato a la gobernación del Táchira» ante 19.400 seguidores. El M03 califica este último como el residuo de campaña con mayor visibilidad potencial de todo el ecosistema, porque el enlace lo pone la propia cuenta principal de forma activa.","lead":""}],"accion":"Retirar el residuo. La promesa vigente es de cumplimiento, no de campaña, y ya está probada."},{"n":4,"punto":"Storytelling: uso de historias personales y de terceros","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"PATRÓN VERIFICADO: cuando el vídeo incluye a otra persona con nombre propio, el rendimiento sube. El M13 lo documenta como uno de los cuatro rasgos formales del contenido exitoso: «protagonismo compartido — el contenido en que solo aparece él hablando a cámara rinde bien pero nunca alcanza los techos más altos».","lead":"PATRÓN VERIFICADO:"},{"t":"EL MEJOR CASO DOCUMENTADO: el vídeo del peluche enviado por niños de Cúcuta para los niños de La Guaira, con 39.316 visualizaciones en X. El M06 lo califica como «el mejor rendimiento cualitativo del semestre: alto alcance con reacción favorable y baja fricción. Historia concreta, humana, con protagonista distinto del emisor y eje binacional». El M13 lo señala como el ejemplo más limpio de alcance que se traduce en buena voluntad medible.","lead":"EL MEJOR CASO DOCUMENTADO:"},{"t":"EL CASO INVERSO, TAMBIÉN DOCUMENTADO: la historia personal mal servida produce el efecto contrario. El vídeo del helado en un Farmatodo de Caracas fue el mayor alcance del semestre (72.356 visualizaciones) y también el mayor desgaste: 365 respuestas frente a 160 me gusta, activando la narrativa de contraste de clase que constituye el 30% del sentimiento adverso.","lead":"EL CASO INVERSO, TAMBIÉN DOCUMENTADO:"},{"t":"LA REGLA QUE SE DESPRENDE, formulada en el M18: en un contexto de penuria económica, lo cotidiano debe mostrar cercanía, no consumo. La tizana en un negocio local funciona; el helado en una cadena de Caracas no.","lead":""}],"accion":"Sistematizar el storytelling de terceros: la historia con protagonista distinto del emisor es el formato de mejor rendimiento cualitativo documentado."},{"n":5,"punto":"Tono de voz: definición y consistencia entre plataformas","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"NO HAY DEFINICIÓN DE TONO DE VOZ, y la inconsistencia es medible y localizada.","lead":""},{"t":"EL PROBLEMA CENTRAL, documentado en el M02: conviven la primera persona («Hoy asistí…», «Tuve el inmenso honor…») y la tercera persona de nota de prensa («Freddy Bernal califica al presidente…», «Junto al gobernador del estado Táchira, Freddy Bernal;…»). La tercera persona delata contenido copiado de boletín institucional, y las publicaciones que la usan están entre las de peor rendimiento de la muestra. Aparecen además marcas de reciclaje como «#RESUMEN ///» que revelan contenido reutilizado de otro canal sin adaptar.","lead":""},{"t":"TRES REGISTROS IDENTIFICADOS EN X (M06): institucional-afectivo, que es el dominante y coherente con el personaje; autoridad tajante en materia de seguridad, que es el que mejor rinde; y confrontación personal, que aparece solo en el episodio del 4 al 6 de agosto y es el que más daño causa.","lead":"TRES REGISTROS IDENTIFICADOS EN X (M06):"},{"t":"EL M11 aporta el matiz más útil: el problema no es de carácter sino de canal. Su registro oral impulsivo, que en cámara se lee como firmeza y autenticidad, en texto se lee como destemplanza. La disociación entre su solvencia en vídeo y su fragilidad en texto es el riesgo de tono mejor documentado de toda la auditoría.","lead":""}],"accion":"Decisión de voz: siempre primera persona. Ningún texto de boletín pegado sin reescribir. Y un protocolo de pausa antes de responder por escrito a una crítica."},{"n":6,"punto":"Extensión de textos vs. capacidad de atención por plataforma","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"INSTAGRAM: longitud media de 474–502 caracteres, con casos de más de 1.100. Instagram corta en unos 125 caracteres con «más», de modo que todo lo que va después lo lee una minoría. Los tres peores resultados de la muestra superan los 1.000 caracteres. Es un desajuste medido, no una impresión.","lead":"INSTAGRAM:"},{"t":"X: los hilos son de dos entregas, con algunos de tres. No hay hilos largos de cinco o más, que son los que generan permanencia en el timeline. El problema en X no es la extensión sino el orden: el dato queda enterrado en la segunda o tercera línea.","lead":""},{"t":"YOUTUBE: el desajuste más extremo del ecosistema. Emisiones de 115 minutos de media publicadas íntegras, con 88,1 visualizaciones de media, frente a una pieza de 1 minuto 47 segundos que alcanzó 179. El formato largo se está sirviendo a una plataforma que no lo premia.","lead":"YOUTUBE:"},{"t":"ESTRUCTURA: en Instagram no se usan saltos de línea ni viñetas. Un párrafo de 500 caracteres sin respiración se lee mal en móvil.","lead":"ESTRUCTURA:"}],"accion":"Instagram: gancho en los primeros 100 caracteres, desarrollo en dos o tres bloques separados, cierre con acción. YouTube: derivar piezas cortas de cada emisión."},{"n":7,"punto":"Ganchos de apertura: tipología y efectividad","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"Es el punto mejor documentado de este módulo, porque los tres análisis de plataforma coinciden en el mismo patrón.","lead":""},{"t":"GANCHOS QUE FUNCIONAN. Imperativo o exclamación: «¡Miren dónde estoy!» (1.863 me gusta), «¡El Táchira no está solo!». Confidencia personal: «Una de mis frutas favoritas es el Sapote» (1.771). Pregunta directa al espectador: «¿Cómo lo llaman en tu territorio?» (1,2 millones de reproducciones en TikTok). Afirmación tajante de identidad: «Táchira, territorio de paz» (1,7 M), «Frontera de paz» (1,6 M), «Bienvenidos a Venezuela» (1,8 M). Compromiso en primera persona: «Soy un hombre de palabra, lo prometí y lo cumplí» (693 K). Autoridad tajante: «¡El que se vuelva loco y quiera delinquir irá preso!» (21.000 visualizaciones). Dato duro o escena: «La Guaira enfrenta el reto de gestionar 1.248 millones de toneladas de escombros» (17.931).","lead":"GANCHOS QUE FUNCIONAN."},{"t":"GANCHOS QUE FALLAN. Apertura institucional: «En el marco de…», «Siguiendo el legado del Comandante Chávez…», «Seguimos trabajando…». Reconocimiento jerárquico primero: «Bajo la orientación de la Presidenta @delcyrodriguezv y en perfecta unión entre el gobierno nacional, regional, municipal y el poder popular…» — la primera línea la ocupa la atribución, no el hecho. Fórmula genérica: «¡Seguimos brindando sonrisas a nuestra gente!» — no dice qué, ni dónde, ni a quién.","lead":"GANCHOS QUE FALLAN."},{"t":"LA PRUEBA DECISIVA, del M02: la efeméride doctrinal de 9.974 me gusta frente al «Siguiendo el legado del Comandante Chávez…» de 322 me gusta con 1.036 caracteres demuestra que NO ES EL TEMA, ES LA CONSTRUCCIÓN. El mismo asunto, con gancho o sin él, produce una diferencia de treinta veces.","lead":""},{"t":"EFECTIVIDAD MEDIDA EN VÍDEO: pendiente. Se cierra con cruzar los tres primeros segundos con la curva de retención, dato de Analíticas (ver M08, punto 17).","lead":"EFECTIVIDAD MEDIDA EN VÍDEO:"}],"accion":"Prohibir por escrito las aperturas «En el marco de» y «Siguiendo el legado de». Es la corrección de redacción de mayor impacto medido."},{"n":8,"punto":"Llamados a la acción: variedad, claridad y conversión","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"NO EXISTEN LLAMADAS A LA ACCIÓN SISTEMÁTICAS, y la causa raíz está identificada: no hay destino al que enviar. El M01 documenta que el 50,6% de la audiencia —618.000 personas en TikTok, Instagram, Threads, Facebook y YouTube— está en plataformas sin ningún enlace en biografía.","lead":""},{"t":"El M02 lo formula con precisión: «no se detectan CTA sistemáticos; sin enlace en biografía, tampoco habría destino al que enviar». El M06 documenta que ninguno de los hilos revisados en X termina con enlace, vía de contacto, dato verificable o petición concreta, PESE A QUE X SÍ TIENE ENLACE — es la única plataforma donde el destino existe y el cierre de hilo es la ocasión natural para dirigir tráfico, y no se usa nunca.","lead":""},{"t":"El M03 lo cierra: «el engagement existe; el embudo para aprovecharlo no». Con un engagement medido del 4,87% en TikTok y una media de 95 comentarios por pieza, el entusiasmo está probado y no tiene ningún lugar al que dirigirse.","lead":""},{"t":"ÚNICO CTA DOCUMENTADO QUE FUNCIONÓ, y con consecuencia negativa: la pregunta abierta «¿Cuál les gusta más? Los leo» (11 de junio, 23.111 visualizaciones) generó 217 respuestas frente a 35 me gusta — el peor ratio del semestre. Abrir una pregunta a una audiencia mayoritariamente adversa sin moderación convierte la publicación en un tablón de quejas.","lead":""}],"accion":"Crear el destino primero (enlace en biografía, canal de WhatsApp, formulario), y solo después sistematizar el CTA. En ese orden."},{"n":9,"punto":"Uso de datos, cifras y fuentes en el discurso","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"EL DATO CONCRETO ES UNO DE LOS CINCO RASGOS DEL CONTENIDO QUE FUNCIONA, según el M06: «lo que funciona: vídeo, frase corta, autoridad, CIFRA CONCRETA, historia con protagonista distinto del emisor».","lead":""},{"t":"EL MEJOR CASO DOCUMENTADO: «La Guaira enfrenta el reto de gestionar 1.248 millones de toneladas de escombros» (17.931 visualizaciones). El M06 lo califica como el mejor contenido de gestión del semestre —cifra concreta, magnitud comprensible, plan asociado— y el M13 lo señala como un caso raro de «conversión informativa»: la cifra generó comprensión pública de la magnitud del problema.","lead":"EL MEJOR CASO DOCUMENTADO:"},{"t":"EL CASO INVERSO: «entrega de financiamientos» sin cifra, sin beneficiario identificado y sin historia, entre las peores de la muestra de Instagram.","lead":"EL CASO INVERSO:"},{"t":"LA CARENCIA DE FORMATO: el M09 documenta que NO EXISTE plantilla gráfica de dato o cifra de gestión. Los datos se comunican en texto, sin visualización. El M18 identifica «la pieza de cifra única —un dato grande, una frase, fondo de color de marca— barata, muy compartible» como una de las innovaciones de formato que están funcionando en el estándar internacional, y que el sujeto no produce.","lead":"LA CARENCIA DE FORMATO:"},{"t":"FUENTES: no se detecta práctica de citar fuente junto al dato. Para contenido de gestión, es lo que separa el dato verificable de la afirmación.","lead":"FUENTES:"}],"accion":"Crear la plantilla de cifra única (ver M09, punto 8) y usarla sistemáticamente. La evidencia de que el dato concreto rinde ya está en los propios números."},{"n":10,"punto":"Consistencia del mensaje entre plataformas y entre voceros","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"ENTRE PLATAFORMAS: la inconsistencia está medida y es notable. El M13 documenta que la fórmula ganadora es transversal —paz fronteriza, seguridad con resultado, identidad regional, contenido humano— pero su peso varía radicalmente: en TikTok el eje de paz ocupa el 25% de la producción y domina el top histórico; en X e Instagram prácticamente no aparece. El M03 lo formula como «la adaptación fluye en la dirección equivocada: se baja el material del programa de radio a TikTok, en vez de subir la fórmula que funciona en TikTok al resto del ecosistema».","lead":"ENTRE PLATAFORMAS:"},{"t":"Además, el M01 documenta cuatro descripciones simultáneas del cargo publicadas y accesibles, dos de ellas falsas o caducas. La inconsistencia empieza en la propia identidad, antes que en el mensaje.","lead":""},{"t":"ENTRE VOCEROS: NO AUDITADO. Exige identificar y medir a los demás voceros del gobierno regional —la cuenta institucional @gobernaciondeltachira, el equipo de prensa, los alcaldes afines— y contrastar su mensaje con el del gobernador. El M17 lo señala como un competidor de atención sin coordinación visible: «dos canales emitiendo el mismo mensaje de gestión a la misma audiencia, sin reparto de roles declarado».","lead":"ENTRE VOCEROS:"},{"t":"El M20 aporta un indicio del proceso que lo causa: «existe una fuente de nota de prensa institucional cuyos textos se pegan sin adaptar. Hay al menos dos productores de texto con criterios distintos.»","lead":""}],"accion":"Medir a la cuenta institucional y declarar el reparto de roles: contenido institucional pesado a la Gobernación, registro humano a la cuenta personal."},{"n":11,"punto":"Eslóganes y frases memorables: efectividad y recordación","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"SÍ EXISTEN FRASES MEMORABLES Y ESTÁN MEDIDAS. «Yo doy la cara» / «Yo no soy un demagogo» es la muletilla de autoafirmación que el M11 identifica como remate recurrente cuando responde a una crítica. «Soy un hombre de palabra, lo prometí y lo cumplí»: 693.000 reproducciones, puesto 12 del top histórico de TikTok. «¡El que se vuelva loco y quiera delinquir irá preso!»: 21.000 visualizaciones en X, y el M06 lo señala como el registro de autoridad, el más eficaz de la cuenta. «Táchira, territorio de paz» / «Frontera de paz»: el eje verbal que ocupa 6 de los 20 mejores resultados históricos.","lead":"SÍ EXISTEN FRASES MEMORABLES Y ESTÁN MEDIDAS."},{"t":"El M13 lo recoge como rasgo formal del contenido exitoso: «frase corta y memorable como remate».","lead":""},{"t":"EL PROBLEMA DE RECORDACIÓN, documentado en el M09: ninguna de estas frases se convierte en pieza gráfica autónoma. Solo existen como subtítulo dentro del vídeo, que es el formato de menor circulación posible para una cita. «La ausencia de plantilla de cita es la más costosa: el contenido de la cuenta genera frases memorables con regularidad y ninguna se convierte en pieza compartible.»","lead":""},{"t":"ESLOGANES DE CAMPAÑA RESIDUALES: «Dudar es Traición» aparece en la gorra que usa en un vídeo-selfie, documentado en el M11 como un caso donde el vestuario traslada un mensaje de campaña a un contexto de vida cotidiana, mezclando registros.","lead":"ESLOGANES DE CAMPAÑA RESIDUALES:"}],"accion":"Convertir las cuatro frases probadas en piezas gráficas de cita. El material verbal ya existe y está validado con datos."},{"n":12,"punto":"Saturación y repetición: análisis de fatiga del mensaje","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"INDICIO FUERTE Y MEDIDO: el M02 documenta una caída del engagement de Instagram del 31% en un mes —del 0,382% en julio al 0,264% en agosto— mientras el volumen de publicación se mantenía por encima de tres diarias. La hipótesis explícita es la saturación: el mismo alcance repartido entre más piezas produce menos interacción por pieza.","lead":"INDICIO FUERTE Y MEDIDO:"},{"t":"SEGUNDO INDICIO, del M03: el hashtag «trabajo» es el más usado en términos absolutos (46% de las publicaciones) y rinde de forma solo moderada por sí solo. Es el caso más claro de repetición sin retorno: casi la mitad de la producción reciente lleva la misma etiqueta sin acompañamiento emocional.","lead":""},{"t":"TERCER INDICIO, del M13: el vocabulario doctrinal —«asedio», «guerra imperial», «bloqueo»— es «el único caso donde sí importa el tema y no solo la forma: incluso bien construido, rinde peor que el contenido de gestión o humano en el mismo canal». Es contenido dirigido a la militancia ya convencida.","lead":""},{"t":"LO QUE FALTA: un análisis formal de fatiga exige medir la evolución del rendimiento de cada eje temático a lo largo del tiempo, no solo su rendimiento medio. Con la serie disponible no es reconstruible.","lead":"LO QUE FALTA:"}],"accion":"Prueba controlada: bajar a dos publicaciones diarias en Instagram durante un mes y medir. Es la única forma de confirmar o descartar la saturación."},{"n":13,"punto":"Adaptación del mensaje por segmento de público","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"NO HAY ADAPTACIÓN POR SEGMENTO, pero los segmentos SÍ están construidos con datos reales en el M19, y cada uno necesita un mensaje distinto que hoy no recibe.","lead":""},{"t":"EL RESPALDO DEVOTO: comenta cada publicación en minutos con fórmulas religiosas y de bendición, registro emocional no argumentativo, predomina en Instagram. Núcleo de 10 a 20 cuentas recurrentes. Necesita RECONOCIMIENTO — una respuesta ocasional lo convertiría en embajador organizado.","lead":"EL RESPALDO DEVOTO:"},{"t":"EL TRABAJADOR DE LA VÍA: transportista o conductor de rutas nacionales, conoce el terreno y reclama con datos concretos (horas de espera, nombres de alcabalas en Barinas, Guanare, Ospino y Valencia). Necesita RESPUESTA OPERATIVA VERIFICABLE. Es el perfil más recuperable de todos.","lead":"EL TRABAJADOR DE LA VÍA:"},{"t":"EL VECINO CON UN RECLAMO: tachirense con demanda específica y localizable (la carretera Rubio–San Cristóbal, los cortes de luz, el agua). No es opositor: es usuario insatisfecho. Necesita el CICLO DENUNCIA-ACCIÓN-RESULTADO. Hoy no tiene ningún canal donde dejar su reclamo.","lead":"EL VECINO CON UN RECLAMO:"},{"t":"EL CRÍTICO DE CLASE: contrapone el consumo del gobernador a la penuria general, concentrado en X, 30% de la muestra de 108 comentarios. NO ES CONVERTIBLE POR COMUNICACIÓN. Solo cambia con resultados de gestión, o se neutraliza evitando contenido de consumo en contexto de escasez.","lead":"EL CRÍTICO DE CLASE:"},{"t":"HALLAZGO ADICIONAL DEL M19 CON CONSECUENCIA DIRECTA EN EL MENSAJE: existe audiencia significativa fuera del Táchira (transportistas que describen rutas nacionales, audiencia de La Guaira durante el terremoto, audiencia colombiana probable). «Parte del contenido hiperlocal del Táchira se está sirviendo a una audiencia que no vive allí, y parte de la audiencia nacional no encuentra contenido pensado para ella.»","lead":"HALLAZGO ADICIONAL DEL M19 CON CONSECUENCIA DIRECTA EN EL MENSAJE:"}],"accion":"Un mensaje distinto por perfil. El más urgente es el ciclo denuncia-acción-resultado para el vecino con un reclamo y el trabajador de la vía, que juntos son el segmento más recuperable."},{"n":14,"punto":"Uso de lenguaje inclusivo, regionalismos y localismos tachirenses","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"REGIONALISMOS Y LOCALISMOS: es una fortaleza documentada y bien ejecutada. El M11 registra acento regional andino-tachirense marcado y sin intención de neutralizarlo, lo que refuerza su identidad como voz local ante una audiencia que lo reconoce como «uno de los suyos». Usa modismos tachirenses y giros de calle en los vídeos-selfie, y nombra lugares por su denominación local («Curva de La Ceiba»).","lead":"REGIONALISMOS Y LOCALISMOS:"},{"t":"El contenido costumbrista basado en léxico local es de los que mejor rinden: «¿Cómo lo llaman en tu territorio?» sobre la esponjilla alcanzó 1,2 millones de reproducciones, y el sapote y la tizana de El Mirador entran en el top 15 de Instagram.","lead":""},{"t":"SEGMENTACIÓN LÉXICA DOCUMENTADA: usa un léxico marcadamente distinto según hable de gestión (sencillo, concreto, de calle) o de política nacional (cargado, doctrinal, repetitivo en las mismas fórmulas: «asedio», «bloqueo», «guerra imperial», «soberanía comunicacional»). Esta segunda familia coincide con el contenido de peor rendimiento y mayor fricción.","lead":"SEGMENTACIÓN LÉXICA DOCUMENTADA:"},{"t":"NIVEL DE COMPLEJIDAD FRENTE A LA AUDIENCIA: en modo gestión el ajuste es correcto —frases cortas, sujeto-verbo-predicado, referencias que cualquier tachirense reconoce. En modo político-doctrinal el lenguaje sube de complejidad y abstracción, y está pensado para la militancia y la prensa afín, no para el ciudadano medio que solo quiere saber cuándo se arregla la vía. No hay evidencia de que adapte el registro según el canal.","lead":"NIVEL DE COMPLEJIDAD FRENTE A LA AUDIENCIA:"},{"t":"LENGUAJE INCLUSIVO: no auditado específicamente. No se detectó como problema ni como práctica declarada en ninguno de los módulos.","lead":"LENGUAJE INCLUSIVO:"}],"accion":"Conservar y explotar el léxico regional, que es un activo probado. Reservar el vocabulario doctrinal para el programa largo, donde la audiencia lo busca por afinidad, y no para el vídeo corto."}]},{"id":"M11","titulo":"ORATORIA, VOCABULARIO Y DESEMPEÑO ANTE CÁMARA","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"Tres registros de vídeo reproducidos con audio · 16 líneas de análisis","fuente":"Análisis de Oratoria y Comunicación No Verbal. Reproducción directa con sonido de piezas de «Reporte Bernal» en formato escritorio, vídeos-selfie de terreno y una pieza de recorrido técnico de 92 segundos con equipo de gobierno, más búsqueda documental sobre su trayectoria comunicacional.","calificacion":"Es un orador de calle, no de atril. Su mayor activo es la autenticidad percibida; su mayor riesgo, la falta de filtro por escrito.","resumen":[{"t":"Es un orador de calle, no de atril: cómodo, físico y espontáneo cuando habla sin guion, y más plano cuando lee de un papel. Su mayor activo comunicacional es la autenticidad percibida —se le ve igual en un canal oficial que en un selfie en una terminal de autobuses— y su mayor riesgo es la falta de filtro, que ya ha derivado en errores de tono documentados por escrito en X.","lead":""},{"t":"DOS LÍMITES DECLARADOS. Primero: este entorno no tiene forma de extraer y transcribir el audio de plataformas de vídeo externas, por lo que la dicción, la velocidad exacta en palabras por minuto y el recuento de muletillas se basan en la reconstrucción del discurso a partir de los subtítulos incrustados que él mismo usa, contrastados con la duración real de cada pieza — método sólido para el ritmo global, pero no equivalente a un análisis fonético de laboratorio. Segundo: no se dispuso de vídeo propio en formato debate o entrevista confrontativa con periodista independiente.","lead":""}],"puntos":[{"n":1,"punto":"Dicción, vocalización y claridad de pronunciación","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"Vocalización clara y proyección adecuada al micrófono de escritorio; no se detectan trabas ni arrastre de sílabas en el formato «Reporte Bernal».","lead":""},{"t":"Acento regional andino-tachirense marcado y sin intención de neutralizarlo, lo que refuerza su identidad como voz local frente a una audiencia que lo reconoce como «uno de los suyos». Es un activo, no un defecto.","lead":""},{"t":"En los vídeos de calle grabados con el teléfono en mano, la vocalización baja de calidad por el ruido ambiente (motor de autobús, viento) y no por defecto de pronunciación propio.","lead":""},{"t":"No se detectan sonidos guturales ni golpes de tos que sugieran fatiga vocal, pese a que su programa dura dos horas semanales según fuentes documentales — una exigencia de resistencia vocal considerable que parece sostener bien.","lead":""},{"t":"LÍMITE DEL DATO: una medición fonética precisa (tasa de articulación, formantes, defectos de pronunciación específicos) requeriría análisis de audio con herramientas especializadas. La evaluación aquí es perceptiva, no acústica.","lead":"LÍMITE DEL DATO:"}],"accion":"Ninguna. Es un punto sólido."},{"n":2,"punto":"Ritmo y velocidad del habla (palabras por minuto)","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"Se reconstruyó el ritmo a partir de los subtítulos incrustados en el vídeo «Reporte Bernal» de 25,4 segundos, muestreados cada 4-5 segundos. El discurso llena de forma continua el 100% del tiempo muestreado: no hay huecos de silencio entre fragmentos.","lead":""},{"t":"Contrastando la densidad de palabras por segmento (entre 5 y 9 palabras por bloque de 3 segundos), la velocidad estimada se sitúa entre 150 y 175 PALABRAS POR MINUTO en el registro de escritorio.","lead":""},{"t":"Ese rango corresponde a un ritmo conversacional-rápido: por encima de la cadencia pausada de un discurso protocolario leído, y por debajo de la velocidad de un relator deportivo. Es coherente con alguien que domina su tema y no necesita pensar la frase mientras la dice — rasgo típico de comunicador de radio con años de oficio en vivo.","lead":""},{"t":"En el vídeo de terreno (92 segundos, registro de trabajo con mapas y funcionarios), el ritmo baja de forma perceptible: hay pausas para escuchar a los técnicos, señalar sobre el plano y dejar hablar a otros. Es el registro más lento y más «de escucha» de los tres formatos observados.","lead":""}],"accion":"Ninguna corrección. El ritmo es adecuado al formato.","tabla":{"headers":["Marca de tiempo","Fragmento de subtítulo capturado"],"rows":[["0:00 – 0:03","«Yo no soy un demagogo»"],["0:03 – 0:06","«para callar la gente. NO, yo doy la cara»"],["0:09 – 0:11","«a hablar con la ministra»"],["0:14 – 0:17","«cuáles viviendas hay que demoler»"],["0:19 – 0:22","«pero lo importante es que tenemos el compromiso»"]]}},{"n":3,"punto":"Muletillas y expresiones de relleno: frecuencia y tipo","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"En el registro de escritorio NO se detectan muletillas verbales clásicas de relleno («o sea», «esto», «en fin»): el discurso llega ya articulado en frases completas.","lead":""},{"t":"Sí aparecen dos patrones de repetición que funcionan como MULETILLA ESTRUCTURAL más que como relleno vacío. «Yo doy la cara» y variantes de «dar la cara» como remate recurrente cuando responde a una crítica: es una muletilla de autoafirmación, la usa para cerrar un argumento, no para ganar tiempo. Y la repetición del sujeto («yo… yo…») al iniciar frases de defensa personal, patrón habitual en el habla espontánea de alguien acostumbrado a hablar sin apuntes palabra por palabra.","lead":""},{"t":"EN EL REGISTRO ESCRITO aparecen muletillas distintas y más reveladoras: la risa escrita («jajajaja») como apertura de una respuesta a la defensiva, y la frase hecha «que no paras de escribir» para descalificar al interlocutor. Son muletillas de TENSIÓN, no de fluidez, y solo emergen en el modo confrontación, nunca en el modo discurso.","lead":""}],"accion":"Ninguna en el registro oral. En el escrito, el protocolo de no confrontación elimina el contexto donde aparecen."},{"n":4,"punto":"Riqueza de vocabulario y variedad léxica","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"El vocabulario es funcional y de registro medio, orientado a que lo entienda cualquier persona sin formación específica. No se detecta tecnicismo innecesario ni, en el otro extremo, un léxico empobrecido.","lead":""},{"t":"EL DATO MÁS INTERESANTE ES LA SEGMENTACIÓN: usa un léxico marcadamente distinto según hable de gestión (sencillo, concreto, de calle) o de política nacional (cargado, doctrinal, repetitivo en las mismas fórmulas: «asedio», «bloqueo», «guerra imperial»). Esta segunda familia léxica es la que, según el M06 y el M13, coincide con el contenido de peor rendimiento y mayor fricción cuando aparece en redes sociales.","lead":"EL DATO MÁS INTERESANTE ES LA SEGMENTACIÓN:"}],"accion":"Reservar el vocabulario doctrinal para el programa largo, donde la audiencia lo busca por afinidad, y no para el vídeo corto, donde compite por segundos de atención de una audiencia más amplia y menos cautiva.","tabla":{"headers":["Campo léxico","Ejemplos observados","Función"],"rows":[["Autoafirmación","«demagogo», «doy la cara», «compromiso»","Defensa de la propia integridad frente al escepticismo."],["Técnico-administrativo","«viviendas que hay que demoler», nombres de vías por su denominación local («Curva de La Ceiba»)","Precisión operativa: nombra lugares y decisiones concretas, no abstracciones."],["Coloquial regional","Modismos tachirenses y giros de calle en los vídeos-selfie","Cercanía y marca de pertenencia territorial."],["Doctrinal-político","«asedio», «guerra imperial», «soberanía comunicacional», «revolución»","Registro reservado casi en exclusiva al contenido político-ideológico, no a la gestión cotidiana."]]}},{"n":5,"punto":"Nivel de complejidad del lenguaje vs. audiencia objetivo","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Su audiencia principal es la población del Táchira, un estado con zonas urbanas y rurales, alta presencia de comercio fronterizo y un nivel educativo heterogéneo.","lead":""},{"t":"EN MODO GESTIÓN el ajuste es correcto: frases cortas, sujeto-verbo-predicado, referencias a lugares y hechos que cualquier tachirense reconoce sin esfuerzo.","lead":""},{"t":"EN MODO POLÍTICO-DOCTRINAL el lenguaje sube de complejidad y de abstracción («soberanía comunicacional», «guerra de amplio espectro»). Es un registro pensado para la militancia y la prensa afín, no para el ciudadano medio que solo quiere saber cuándo se arregla la vía.","lead":""},{"t":"NO HAY EVIDENCIA DE QUE ADAPTE EL REGISTRO SEGÚN EL CANAL: el mismo vocabulario doctrinal aparece igual en un vídeo corto de TikTok que en una alocución institucional larga, cuando el formato corto exigiría mayor simplicidad para no perder al espectador en los primeros tres segundos.","lead":"NO HAY EVIDENCIA DE QUE ADAPTE EL REGISTRO SEGÚN EL CANAL:"}],"accion":"Regla explícita: un registro por canal. Programa largo admite doctrina; vídeo corto, no."},{"n":6,"punto":"Lenguaje corporal: postura, manos, gestualidad","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"EN FORMATO DE ESCRITORIO: postura erguida, apoyado sobre los antebrazos hacia el micrófono, inclinación leve hacia adelante que transmite involucramiento. Uso constante de las dos manos como herramienta de énfasis: palmas abiertas hacia el frente cuando apela a la transparencia («yo doy la cara»), gesto de conteo con los dedos cuando enumera, e índice señalando cuando corrige o desmiente. Las manos casi nunca están quietas, pero tampoco invaden el espacio de forma errática: se mueven dentro de un radio corto, coherente con estar sentado tras un escritorio.","lead":"EN FORMATO DE ESCRITORIO:"},{"t":"EN VÍDEO-SELFIE DE CALLE: sostiene el teléfono con el brazo extendido, cámara ligeramente en picado — el ángulo típico del selfie caminando, sin producción. El rostro ocupa la mayor parte del encuadre y los gestos de manos quedan fuera de plano, lo que traslada todo el peso expresivo a la cara y la voz. Sonríe con facilidad y de forma que se lee como espontánea, no forzada: los pliegues oculares acompañan la sonrisa en los fotogramas capturados.","lead":"EN VÍDEO-SELFIE DE CALLE:"},{"t":"EN TERRENO: de pie, con las manos frecuentemente entrelazadas o en los bolsillos mientras escucha a otros — postura de escucha activa, no de protagonismo permanente. Se inclina físicamente sobre el plano técnico junto con los demás funcionarios, en plano de igual altura, sin marcar distancia jerárquica en el lenguaje corporal. Cuando interviene, señala directamente sobre el mapa o el terreno en lugar de solo hablar de ello, gesto que refuerza la percepción de conocimiento operativo real del problema.","lead":"EN TERRENO:"},{"t":"CONCLUSIÓN: la gestualidad es uno de sus recursos más sólidos y, a diferencia de otros aspectos, se mantiene consistente en los tres registros observados.","lead":"CONCLUSIÓN:"}],"accion":"Fortaleza a conservar. No tocar."},{"n":7,"punto":"Contacto visual con cámara y conexión con el espectador","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"En el formato de escritorio, el contacto visual con el objetivo es alto pero no constante: hay tramos de mirada sostenida a cámara (los momentos de mayor convicción, como «yo doy la cara») y tramos de mirada hacia abajo, hacia el cuaderno o carpeta abierta frente a él, que coinciden con pasajes más enumerativos o de datos concretos.","lead":""},{"t":"Esa alternancia es reveladora: no lee un guion palabra por palabra —de hacerlo, la mirada bajaría de forma rítmica y previsible— sino que consulta una nota puntual y vuelve a levantar la vista.","lead":""},{"t":"En el vídeo-selfie, el contacto visual es total y directo durante todo el clip, reforzado por la cercanía física del teléfono al rostro. Es el formato donde la sensación de conexión personal es más fuerte.","lead":""},{"t":"En terreno, el contacto visual se dirige a los interlocutores reales (funcionarios, plano técnico) y no a cámara, lo cual es correcto para ese formato: sería artificial que mirara al lente mientras revisa una obra con su equipo.","lead":""}],"accion":"Ninguna. Correcto en los tres registros."},{"n":8,"punto":"Manejo del silencio, pausas y énfasis","estado":"VERIFICADO","prioridad":"BAJA","hallazgo":[{"t":"En el registro de escritorio, las pausas son escasas y breves: el discurso muestreado no presenta huecos de silencio detectables, coherente con una velocidad de 150-175 palabras por minuto y con la experiencia de comunicador de radio en vivo, donde el silencio «suena mal» y se evita por reflejo profesional.","lead":""},{"t":"El énfasis se logra por otras vías: elevación de volumen en la palabra clave («NO, yo doy la cara»), golpe de mano coincidente con la palabra, y repetición inmediata de la idea con otras palabras.","lead":""},{"t":"En terreno, el manejo del silencio es distinto y más maduro: deja hablar a los técnicos sin interrumpir mientras explican el plano, y solo retoma la palabra cuando le corresponde. Es el registro donde mejor demuestra capacidad de ceder el turno.","lead":""},{"t":"AUSENCIA IDENTIFICADA: no se observó el recurso de la PAUSA DRAMÁTICA DELIBERADA (silencio prolongado antes de una frase importante), herramienta retórica clásica ausente de su repertorio que podría reforzar los momentos de mayor autoridad si se incorporara de forma consciente.","lead":"AUSENCIA IDENTIFICADA:"}],"accion":"Incorporar conscientemente la pausa antes de la frase de autoridad. Es el único recurso retórico clásico que falta en su repertorio."},{"n":9,"punto":"Energía, entusiasmo y carisma percibido","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"La energía es alta y estable en los tres registros observados, sin caídas de tono perceptibles ni siquiera en el pasaje de defensa personal («no soy un demagogo»), donde otros oradores bajarían la energía a la defensiva y él, en cambio, la sube.","lead":""},{"t":"El carisma percibido NO DEPENDE DE UN SOLO RECURSO, lo cual es una fortaleza: no es únicamente «buen orador de tarima» ni únicamente «cercano en redes», sino que sostiene ambos registros con solvencia.","lead":""},{"t":"EL RIESGO: esa misma energía alta y esa comodidad hablando sin filtro, cuando se traslada al terreno escrito (comentarios, respuestas en X), pierde el control de tono que sí mantiene frente a una cámara. El carisma en vídeo no se transfiere automáticamente al texto.","lead":"EL RIESGO:"}],"accion":"Fortaleza a conservar en vídeo. El riesgo se gestiona en el canal escrito, no en el oral.","tabla":{"headers":["Registro","Nivel de energía","Fuente del carisma"],"rows":[["Escritorio institucional","Alto, sostenido","Convicción verbal y gestualidad de manos; carisma «de tribuna» en formato reducido."],["Selfie de calle","Alto, cálido","Sonrisa espontánea y cercanía física con la cámara; carisma de trato directo, «el vecino que gobierna»."],["Terreno técnico","Medio, concentrado","Autoridad tranquila y dominio aparente del tema; carisma de competencia más que de espectáculo."]]}},{"n":10,"punto":"Vestuario, estilismo y coherencia con el mensaje","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"EL PATRÓN DE FONDO: cuando el vestuario refuerza el contexto (escritorio, terreno) funciona bien y de forma casi intuitiva. Cuando el vestuario se convierte en mensaje por sí mismo —la gorra de campaña en un momento de ocio, el disfraz simbólico— el riesgo de que se lea como sobreactuado sube considerablemente, y hay al menos un precedente documentado de que ese riesgo se materializó.","lead":"EL PATRÓN DE FONDO:"}],"accion":"Cualquier gesto de vestuario que se convierta en mensaje por sí mismo debe pasar antes por una prueba de lectura hostil: «¿cómo se vería esto en un titular burlón?».","tabla":{"headers":["Contexto","Vestuario observado","Coherencia con el mensaje"],"rows":[["«Reporte Bernal» (escritorio)","Traje sport claro (gris perla), camisa celeste sin corbata, cuello abierto","CORRECTA: formal pero accesible. Punto medio adecuado entre autoridad institucional y cercanía radial."],["Vídeo-selfie (terminal de autobuses)","Chaqueta deportiva azul con rayas blancas, gorra con el lema de campaña «Dudar es Traición»","Coherente con el contexto informal. La gorra, sin embargo, traslada un mensaje de campaña a un contexto de vida cotidiana, mezclando registros."],["Terreno técnico","Camisa de manga larga clara, pantalón informal, sin chaqueta","CORRECTA: vestuario de trabajo de campo, sin artificio."],["Antecedente documentado (prensa, octubre de 2023)","Vestimenta árabe completa en un episodio de «Reporte Bernal» como gesto de solidaridad con Gaza","GESTO DE ALTO RIESGO: generó cobertura de prensa con tono burlón. No observado en el material de 2026, pero es un precedente relevante de estilismo que se paga en credibilidad."]]}},{"n":11,"punto":"Autenticidad y credibilidad percibida","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"Es, con diferencia, el atributo mejor calificado del análisis, y conviene explicar por qué con evidencia concreta.","lead":""},{"t":"Filma sus propios vídeos-selfie sin producción visible: cámara temblorosa, ángulo picado, ruido ambiente. No hay artificio ni intento de parecer un producto editorial cuidado. Eso, paradójicamente, aumenta la sensación de autenticidad frente a una audiencia que distingue el contenido genuino del contenido de agencia.","lead":""},{"t":"EL MISMO PATRÓN QUE EN X GENERA EL PROBLEMA, AQUÍ FUNCIONA A FAVOR: «opero yo mismo mi cuenta, sin filtro» produce en texto respuestas impulsivas con errores de tipeo, y en vídeo se lee como cercanía en vez de como impulsividad. Es la misma persona sin intermediarios; lo que cambia es el canal.","lead":"EL MISMO PATRÓN QUE EN X GENERA EL PROBLEMA, AQUÍ FUNCIONA A FAVOR:"},{"t":"Su gestualidad y su tono no cambian sustancialmente entre el registro institucional y el de calle, lo que refuerza la sensación de que no hay una versión «actuada» para las cámaras y otra distinta en privado.","lead":""},{"t":"EL PRINCIPAL RIESGO PARA LA CREDIBILIDAD no está en el vídeo, sino en la coherencia externa al vídeo: el M06 documentó publicaciones de gestión con alto rendimiento junto a un desgaste de imagen por contenido personal en un contexto de penuria económica (el caso del helado). La autenticidad audiovisual es un activo, pero no protege por sí sola de la lectura de contraste social si el contenido elegido es el equivocado.","lead":""}],"accion":"Seguir grabándose él mismo en terreno y en vídeos-selfie sin sobreproducir esas piezas. El M18 lo confirma como coincidente con la tendencia internacional: «autenticidad por encima de producción»."},{"n":12,"punto":"Manejo de improvisación y preguntas inesperadas","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"El vídeo de terreno es la mejor evidencia disponible, porque no es un discurso preparado: es una inspección en vivo donde un funcionario técnico expone un problema con un mapa desplegado y él reacciona en tiempo real.","lead":""},{"t":"Responde con preguntas de precisión («cuáles viviendas hay que demoler») en lugar de con generalidades, lo que sugiere comodidad real con el contenido técnico y no solo memorización de titulares.","lead":""},{"t":"Se apoya físicamente en el material que le muestran (se acerca al plano, señala) en vez de mantener distancia y limitarse a escuchar, comportamiento típico de quien no teme quedar expuesto por no saber algo.","lead":""},{"t":"LAGUNA DECLARADA: no se observó una situación de pregunta hostil o inesperada de un periodista independiente que permita evaluar su reacción bajo presión COMUNICACIONAL real —a diferencia de la presión OPERATIVA del terreno, que sí maneja con soltura. Es una laguna del análisis, no una debilidad confirmada.","lead":"LAGUNA DECLARADA:"}],"accion":"Cerrar la laguna reproduciendo una entrevista en medio no oficialista."},{"n":13,"punto":"Desempeño en entrevistas de medios","estado":"DIAGNÓSTICO POR EVIDENCIA","prioridad":"MEDIA","hallazgo":[{"t":"No se localizó ni reprodujo una entrevista completa con un medio independiente. La búsqueda documental confirma que sí concede entrevistas —a NTN24, a EVTV Miami (sobre un caso judicial de su hijo, en 2022) y en el pasado a «Dossier con Walter Martínez»— pero evaluar tono, evasivas o manejo de la pregunta incómoda exigiría reproducir esas piezas específicas.","lead":""},{"t":"LO QUE SÍ PUEDE INFERIRSE, cruzando el resto del análisis: su comodidad hablando sin guion en terreno y su experiencia de más de 250 emisiones de un programa propio en el que él mismo hace las veces de entrevistador y entrevistado sugieren que no debería sentirse intimidado por el formato de entrevista en sí.","lead":""},{"t":"LA INCÓGNITA REAL es cómo responde cuando el control de la conversación NO LO TIENE ÉL — algo que «Reporte Bernal», al ser su propio programa, nunca le exige.","lead":""}],"accion":"Reproducir específicamente una entrevista suya en un medio no oficialista. Es el complemento natural de este informe y el vacío más relevante del módulo."},{"n":14,"punto":"Desempeño en debates y confrontación","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"No se identificó participación en un debate formal cara a cara con un adversario político. Sí hay evidencia abundante de su estilo de confrontación pública indirecta.","lead":""},{"t":"EN PRENSA (2022): advirtió públicamente a bandas delictivas, con lenguaje directo y de desafío («a mí no me importa si la mafia se viste de blanco o rojo; mafia es mafia»).","lead":"EN PRENSA (2022):"},{"t":"EN VÍDEO: responde a la acusación de demagogia con negación directa y gesto físico de firmeza, sin evadir el tema.","lead":"EN VÍDEO:"},{"t":"EN REDES (M06): su confrontación con ciudadanos críticos, concentrada en el episodio del 4 al 6 de agosto de 2026, muestra un patrón muy distinto — tono personal, correcciones ortográficas al interlocutor, mensajes cortos con errores propios («Le falso acá eres tú!»).","lead":"EN REDES (M06):"},{"t":"LA CONCLUSIÓN MÁS SÓLIDA DEL MÓDULO: su confrontación funciona razonablemente bien cuando el formato es audiovisual y él controla el marco (su programa, su vídeo, su cámara), y se deteriora de forma notable cuando el formato es texto y la conversación la inicia otra persona. NO ES UN PROBLEMA DE CARÁCTER SINO DE CANAL: el registro oral impulsivo que en cámara se lee como firmeza, en texto se lee como destemplanza.","lead":"LA CONCLUSIÓN MÁS SÓLIDA DEL MÓDULO:"}],"accion":"Antes de responder por escrito a una crítica, aplicar la misma pausa que sí demuestra tener frente a una cámara. Es la corrección de comportamiento de mayor retorno de todo el informe."},{"n":15,"punto":"Uso de teleprompter, apuntes o memorización","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"NO HAY EVIDENCIA DE TELEPROMPTER. La mirada nunca se fija en un punto único y elevado frente al lente con el patrón de barrido horizontal característico de la lectura en pantalla.","lead":"NO HAY EVIDENCIA DE TELEPROMPTER."},{"t":"SÍ HAY APUNTES FÍSICOS: en el formato de escritorio se ve de forma clara una carpeta o cuaderno abierto frente a él, y su patrón de mirada —hacia abajo en tramos puntuales, hacia arriba en los de mayor convicción— es compatible con consulta ocasional de notas, no con lectura corrida.","lead":"SÍ HAY APUNTES FÍSICOS:"},{"t":"El origen documental de «Reporte Bernal» como programa de radio de dos horas, dirigido por su propio jefe de prensa, sugiere una estructura de pauta temática (temas a cubrir, quizás con datos y cifras anotados) más que un guion palabra por palabra. Es coherente con la velocidad y naturalidad del habla observada: alguien que lee un guion completo rara vez suena tan fluido a 150-175 palabras por minuto.","lead":""},{"t":"En terreno no hay ningún apoyo de notas visible, coherente con que es una actividad de inspección.","lead":""},{"t":"CONCLUSIÓN: domina el tema lo suficiente como para no depender de un texto cerrado, y usa la nota como respaldo de datos concretos (cifras, nombres) más que como muleta de contenido completo. Es el patrón de un comunicador experimentado.","lead":"CONCLUSIÓN:"}],"accion":"Ninguna. Conservar el uso de pauta y no migrar a guion cerrado ni a teleprompter: destruiría la naturalidad que es su principal activo."},{"n":16,"punto":"Comparativa de oratoria vs. competidores directos","estado":"FASE 2 — PROFUNDIZACIÓN","prioridad":"MEDIA","hallazgo":[{"t":"Una comparación de oratoria rigurosa exige aplicar exactamente esta misma metodología —vídeos reproducidos con audio, de duración y contexto equivalentes— a los perfiles de otros gobernadores venezolanos y, en su caso, a las principales voces de oposición del Táchira. Ese trabajo no formaba parte del material disponible y no debe improvisarse citando impresiones generales.","lead":""},{"t":"LO QUE SÍ PUEDE APORTARSE COMO MARCO DE REFERENCIA, no como comparación cerrada. Dentro del propio chavismo regional, la prensa lo describe como una figura «de incidencia» y con perfil propio y diferenciado frente a la figura estándar de «protector» territorial: ya existe una percepción externa de que su comunicación personal pesa más que la del cargo institucional promedio. Su formato de programa propio semanal, sostenido durante años, es una infraestructura comunicacional que la mayoría de los gobernadores regionales no tiene, y le da práctica acumulada en cámara muy por encima de la de un dirigente que solo aparece en actos protocolarios. Y su punto más comparable con cualquier otro dirigente con alta exposición en redes es la brecha entre desempeño audiovisual (fuerte) y desempeño en texto bajo presión (débil).","lead":""},{"t":"El M17 aporta el contraste más útil sobre el comparador natural: Rafael Lacava construye su ventaja precisamente sobre el registro humano y autoirónico que aquí solo aparece por excepción.","lead":""}],"accion":"Seleccionar dos o tres perfiles de referencia —otro gobernador chavista con alta actividad en redes y una figura opositora tachirense con presencia mediática— y aplicarles los quince puntos anteriores de este mismo informe."}]},{"id":"M12","titulo":"MÉTRICAS Y CRECIMIENTO","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"Cifras verificadas en pantalla en las ocho cuentas · 14 líneas de análisis","fuente":"M12 — Métricas y crecimiento. Corte: 5 de septiembre de 2026. Cifras de seguidores, engagement y visualizaciones por observación directa entre el 3 y el 5 de septiembre y de las muestras medidas en los módulos anteriores. Datos históricos de X procedentes de prensa contemporánea a los hechos.","calificacion":"Ninguna cifra de crecimiento estimada a partir de supuestos","resumen":[{"t":"Las cifras de audiencia, engagement y alcance de las ocho cuentas están verificadas por observación directa en pantalla entre el 3 y el 5 de septiembre de 2026, y son la fotografía exacta del ecosistema en esa fecha.","lead":""},{"t":"Una precisión metodológica que conviene tener presente: las plataformas no publican series históricas de seguidores a terceros. La evolución de los últimos 30, 60 y 90 días existe y está disponible dentro del panel de estadísticas de cada cuenta; este informe indica el camino exacto para capturarla y deja montado el sistema de registro mensual que convierte esa foto en una serie propia. Ninguna cifra de crecimiento se ha estimado a partir de supuestos: una proyección construida sobre datos inventados es peor que ninguna proyección.","lead":""}],"puntos":[{"n":1,"punto":"Seguidores actuales por plataforma (foto del momento)","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"CONCENTRACIÓN: tres plataformas (X, TikTok e Instagram) reúnen el 95,5% de la audiencia total. Las cinco restantes suman menos del 5% entre todas.","lead":"CONCENTRACIÓN:"},{"t":"NOTA IMPORTANTE: el total NO equivale a personas únicas. Es previsible un solapamiento alto entre las tres plataformas principales, por lo que la audiencia real de personas distintas es sustancialmente menor que 1,22 millones.","lead":"NOTA IMPORTANTE:"}],"accion":"Establecer un registro mensual: captura de seguidores de las ocho cuentas el primer día de cada mes. A partir del tercer registro existe serie temporal propia.","tabla":{"headers":["Plataforma","Cuenta","Seguidores","% del total","Estado"],"rows":[["X","@FreddyBernal","602.800","49,4%","Activa, publicación diaria"],["TikTok","@freddybernalr","319.200","26,1%","Activa. 3 millones de me gusta acumulados"],["Instagram","@freddybernalven","244.000","20,0%","Activa, ~3 publicaciones diarias"],["Facebook","perfil personal","32.000","2,6%","Activa"],["TikTok secundaria","@freddybernalvzla","19.400","1,6%","Activa, biografía desactualizada"],["Mastodon","@FreddyBernal@mastodon.social","2.900","0,2%","ABANDONADA desde junio de 2020"],["Threads","@freddybernalven","2.683","0,2%","Activa"],["YouTube","@FreddyBernalOficial","910","0,07%","ABANDONADO, 11 meses sin publicar"],["TOTAL","—","≈ 1.223.893","100%","—"]]}},{"n":2,"punto":"Crecimiento del último trimestre por plataforma","estado":"FASE 2 — PROFUNDIZACIÓN","prioridad":"CRÍTICA","hallazgo":[{"t":"No existe registro público de cuántos seguidores tenía cualquiera de las ocho cuentas hace tres meses. Las plataformas no lo publican y las capturas de buscador no son fiables como serie temporal: durante esta auditoría se observó que el índice de búsqueda mostraba 234.000 seguidores en Instagram mientras la cuenta real marcaba 244.000, sin que sea posible datar la primera cifra. Usar ese tipo de dato como punto de partida produciría una tasa de crecimiento inventada.","lead":""},{"t":"CÓMO OBTENERLO: Instagram, Facebook y TikTok muestran la evolución de seguidores de los últimos 30, 60 y 90 días dentro de su panel de estadísticas nativo. Entrando con la cuenta, este punto se cierra en DIEZ MINUTOS.","lead":"CÓMO OBTENERLO:"}],"accion":"Es, con diferencia, la tarea de mayor rendimiento pendiente en todo el encargo: una sola sesión de diez minutos cierra los puntos 2, 3, parte del 5 y el 8, y habilita el 6 y el 14."},{"n":3,"punto":"Crecimiento del último año por plataforma","estado":"FASE 2 — PROFUNDIZACIÓN","prioridad":"ALTA","hallazgo":[{"t":"Mismo límite que el punto 2. Si el equipo ha guardado capturas o informes mensuales previos, se reconstruye con eso. Si no existen, hay que empezar a registrarlo ahora: una captura mensual de cada cuenta convierte este punto en auditable a partir del próximo trimestre.","lead":""},{"t":"Alternativa inmediata pero parcial: contratar una herramienta de seguimiento con histórico. Cubren bien X y suelen tener series de TikTok e Instagram para cuentas grandes.","lead":""}],"accion":"Verificar si existen capturas históricas internas. Si no, iniciar el registro mensual hoy."},{"n":4,"punto":"Crecimiento histórico de los últimos 3 años","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"X es la única plataforma con dos puntos temporales documentados en fuentes públicas: más de 472.000 seguidores en enero de 2020 (prensa, en el momento de la suspensión de la cuenta) y 602.800 en septiembre de 2026 (observación directa).","lead":""},{"t":"Crecimiento absoluto en 6 años y 8 meses: aproximadamente +130.800 seguidores. Crecimiento porcentual acumulado: aproximadamente +27,7%.","lead":""},{"t":"LECTURA: es un ritmo bajo para un periodo que incluyó una elección ganada (2021), una gestión completa y una reelección (2025). Sugiere una base consolidada y leal, pero con muy poca captación de audiencia nueva. La cuenta no está creciendo: se está manteniendo.","lead":"LECTURA:"}],"accion":"Completar con las series de TikTok e Instagram, que son las plataformas donde el crecimiento probablemente sí está ocurriendo."},{"n":5,"punto":"Tasa de crecimiento mensual promedio y aceleración/desaceleración","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Tasa anual media compuesta en X: aproximadamente 3,7% anual. Tasa mensual media: aproximadamente 0,30%, unos 1.635 seguidores nuevos al mes.","lead":""},{"t":"La aceleración o desaceleración NO es calculable: con solo dos puntos temporales se obtiene una media, no una curva. Detectar si el ritmo se está acelerando o frenando exige la serie mensual del punto 2.","lead":""}],"accion":"Se cierra con el registro mensual."},{"n":6,"punto":"Proyección de crecimiento a 3, 6 y 12 meses (escenarios)","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"Construida sobre la única tasa verificada disponible (X, 0,30% mensual). Se presenta como ESCENARIOS EXPLÍCITOS, no como pronóstico.","lead":""},{"t":"ADVERTENCIA SOBRE ESTAS CIFRAS: los escenarios moderado y optimista no se apoyan en datos observados, sino en el supuesto de que las correcciones identificadas producen efecto. Son una herramienta de planificación, no una previsión. La proyección para TikTok e Instagram no se incluye porque no existe ninguna tasa base verificada sobre la que construirla, y proyectar sin base sería inventar.","lead":"ADVERTENCIA SOBRE ESTAS CIFRAS:"},{"t":"EL DATO QUE MÁS CONDICIONA CUALQUIER PROYECCIÓN: TikTok tiene la mitad de seguidores que X pero genera picos de hasta 2,7 millones de reproducciones. Si el crecimiento de seguidores en TikTok sigue una proporción parecida a su alcance, esa plataforma superará a X en audiencia en un plazo corto. Confirmarlo o descartarlo exige exactamente el dato del punto 2.","lead":"EL DATO QUE MÁS CONDICIONA CUALQUIER PROYECCIÓN:"}],"accion":"Rehacer la proyección con la serie real de las tres plataformas principales una vez capturada.","tabla":{"headers":["Escenario (solo X)","Supuesto","3 meses","6 meses","12 meses"],"rows":[["CONSERVADOR — continuidad","Se mantiene el ritmo histórico de 0,30% mensual, sin cambios en la estrategia","607.200","611.700","620.700"],["MODERADO — correcciones aplicadas","Se ejecutan las acciones de coste cero (enlace en biografía, cabecera de X, verificación, corrección de horarios). Duplica el ritmo a 0,6% mensual","613.700","624.800","647.700"],["OPTIMISTA — apalancamiento en TikTok","Se replica en X e Instagram la fórmula que ya funciona en TikTok (paz, identidad regional, contenido humano) y se corrige el horario nocturno. Ritmo de 1,2% mensual","624.800","648.000","696.000"]]}},{"n":7,"punto":"Tasa de engagement por plataforma vs. benchmark del sector","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"LA CONCLUSIÓN ES CONTRAINTUITIVA PERO SÓLIDA: la plataforma con menos seguidores de las tres principales es la que tiene la audiencia más viva. En TikTok, de cada 100 personas que ven un vídeo, casi 5 interactúan. En X, de cada 100 seguidores, apenas 0,56 llegan a ver siquiera la publicación.","lead":"LA CONCLUSIÓN ES CONTRAINTUITIVA PERO SÓLIDA:"},{"t":"MATIZ METODOLÓGICO: las tres métricas no son directamente comparables entre sí (TikTok mide sobre reproducciones y las otras dos sobre seguidores). La comparación válida es la de cada plataforma contra su propia referencia de sector, que es como está construida la tabla.","lead":"MATIZ METODOLÓGICO:"}],"accion":"La inversión de esfuerzo debe seguir a la audiencia viva, no al número de seguidores.","tabla":{"headers":["Plataforma","Métrica medida","Valor","Referencia habitual","Veredicto"],"rows":[["TikTok","Interacciones sobre reproducciones (muestra de 14)","4,87%","4-6% se considera bueno","SALUDABLE — la mejor cifra del ecosistema"],["Instagram","Me gusta sobre seguidores (julio)","0,382%","0,5-1,5% en cuentas institucionales grandes","POR DEBAJO"],["Instagram","Me gusta sobre seguidores (agosto)","0,264%","ídem","POR DEBAJO, y en caída del 31% en un mes"],["X","Visualizaciones sobre seguidores","0,56%","2-5% en cuentas activas","MUY POR DEBAJO"],["X","Me gusta medios por publicación","37 sobre 602.800","—","Equivale al 0,006% de la audiencia"]]}},{"n":8,"punto":"Alcance e impresiones: evolución y tendencia","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"La evolución del alcance y las impresiones a lo largo del tiempo solo está en las analíticas internas de cada plataforma.","lead":""},{"t":"EL ÚNICO INDICIO DE TENDENCIA DISPONIBLE ES INDIRECTO Y NEGATIVO: el engagement de Instagram cayó un 31% entre julio y agosto de 2026 mientras el volumen de publicación se mantenía por encima de tres diarias, lo que apunta a saturación.","lead":"EL ÚNICO INDICIO DE TENDENCIA DISPONIBLE ES INDIRECTO Y NEGATIVO:"}],"accion":"Se cierra con el acceso a analíticas."},{"n":9,"punto":"Visualizaciones de video: totales y promedio","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"EL DATO MÁS RELEVANTE DE TODO EL MÓDULO: el Reel de Instagram que alcanzó 340.000 reproducciones equivale al 139% de la base de seguidores de esa cuenta. Un valor por encima del 100% solo se explica con distribución masiva fuera de la propia base. Es la prueba de que la capacidad de captar audiencia nueva existe y funciona; el problema es que ocurre por excepción y no por método.","lead":"EL DATO MÁS RELEVANTE DE TODO EL MÓDULO:"}],"accion":"Identificar qué tenía el Reel de 340.000 y convertir la excepción en método.","tabla":{"headers":["Plataforma","Indicador","Valor"],"rows":[["TikTok","Me gusta acumulados históricos","3.000.000"],["TikTok","Reproducciones medias, muestra reciente de 63 vídeos","≈ 27.400"],["TikTok","Vídeo más visto del histórico","2.700.000"],["TikTok","Vídeos del histórico por encima del millón","8"],["Instagram","Reproducciones medianas de Reels (24 medidos)","16.600"],["Instagram","Reel de mayor alcance","340.000 — el 139% de su base de seguidores"],["X","Visualizaciones medias por publicación (192 medidas)","3.399"],["X","Publicación de mayor alcance del semestre","72.356"],["YouTube","Visualizaciones medias por emisión (22 medidas)","88,1"],["YouTube","Visualizaciones por hora de programa producida","46"]]}},{"n":10,"punto":"Calidad de audiencia: detección de seguidores falsos o inactivos","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"Una auditoría real de autenticidad requiere analizar una muestra de las cuentas seguidoras (antigüedad, foto de perfil, ratio de seguidos, actividad), lo que no es viable para cuentas de esta escala sin acceso a la plataforma. Lo que sí puede hacerse es evaluar los indicios que dejan los propios datos de interacción.","lead":""},{"t":"INDICIOS SOBRE X — AUDIENCIA PROBABLEMENTE INACTIVA, NO FALSA. Alcance sobre seguidores del 0,56%: de 602.800 seguidores, unos 3.400 ven cada publicación, tasa que indica una base mayoritariamente inactiva o desconectada de la plataforma. Me gusta medios de 37 por publicación: extraordinariamente bajo para la audiencia declarada, el 0,006%. Antigüedad: alta en febrero de 2010, dieciséis años de acumulación, y una parte relevante de esos seguidores son cuentas captadas hace más de una década, muchas probablemente abandonadas por sus dueños. Episodios de suspensión en enero y marzo de 2020: las suspensiones y reactivaciones suelen dejar seguidores fantasma.","lead":"INDICIOS SOBRE X —"},{"t":"VALORACIÓN: los datos apuntan a INACTIVIDAD ACUMULADA más que a compra de seguidores. El perfil de una cuenta con seguidores comprados suele mostrar crecimiento a saltos bruscos y engagement plano; aquí lo que se observa es crecimiento lento y sostenido (3,7% anual) con engagement decreciente, que es el patrón típico de una base envejecida en una plataforma que ha perdido uso en el país.","lead":"VALORACIÓN:"},{"t":"INDICIO CONTRARIO EN TIKTOK: el engagement del 4,87% es incompatible con una audiencia inflada artificialmente. Es una señal fuerte de que esa base de 319.200 seguidores es real y activa, y refuerza la lectura de que el problema de X no es de autenticidad sino de plataforma y de antigüedad.","lead":"INDICIO CONTRARIO EN TIKTOK:"}],"accion":"No hay evidencia de compra de seguidores. La acción no es limpiar la audiencia sino dejar de tratar X como si su cifra fuera comparable a la de TikTok."},{"n":11,"punto":"Picos de crecimiento: identificación de causas","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"No es posible correlacionar con picos de SEGUIDORES (dato no disponible), pero sí identificar los momentos de máxima EXPOSICIÓN y su causa.","lead":""}],"accion":"Establecer un protocolo de capitalización de picos: quién detecta el pico, en cuánto tiempo se derivan piezas, a qué plataformas.","tabla":{"headers":["Momento","Pico","Causa identificada"],"rows":[["Mayo de 2023","2,7 M de reproducciones en TikTok","Contenido de seguridad y frontera. El mayor pico de todo el histórico."],["Julio de 2024","2,1 M en TikTok","Seguridad y electricidad, en periodo electoral presidencial."],["Enero de 2026","36.747 visualizaciones en X, 400 reposts","Campaña por la situación de Nicolás Maduro y Cilia Flores. Máximo de X en el año."],["Enero de 2026","Reactivación de la cuenta de X tras silencio","Feria Internacional de San Sebastián."],["Junio–julio de 2026","Serie sostenida en TikTok e Instagram","Terremoto de La Guaira. Motor de la reactivación de X tras tres meses de silencio."],["Agosto de 2026","72.356 visualizaciones en X","Vídeo del helado en Farmatodo. Máximo alcance del semestre, pero con conversión negativa."]]}},{"n":12,"punto":"Caídas o pérdida de seguidores: causas","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"ENERO Y MARZO DE 2020 — Suspensión de la cuenta de X. Es el único episodio documentado con pérdida cierta de audiencia: la cuenta quedó inhabilitada teniendo más de 472.000 seguidores. En marzo de 2020 llegó a abrir una cuenta alternativa (@FreddyBernalR en Twitter) ante la negativa de restaurar la original, lo que fragmentó temporalmente la audiencia.","lead":"ENERO Y MARZO DE 2020 —"},{"t":"MARZO A MAYO DE 2026 — Silencio casi total en X: una publicación en marzo, cero en abril y cero en mayo. No hay dato de pérdida de seguidores, pero tres meses sin publicar en la plataforma principal es el escenario clásico de erosión de audiencia por inactividad.","lead":"MARZO A MAYO DE 2026 —"},{"t":"JULIO A AGOSTO DE 2026 — Caída del engagement de Instagram del 0,382% al 0,264%, un 31% en un mes, con el volumen de publicación mantenido. Apunta a saturación de la audiencia propia.","lead":"JULIO A AGOSTO DE 2026 —"},{"t":"OCTUBRE DE 2025 EN ADELANTE — YouTube sin publicar en el canal enlazado. 910 suscriptores estancados.","lead":"OCTUBRE DE 2025 EN ADELANTE —"}],"accion":"Se completa con la serie mensual. El registro de causas ya está construido."},{"n":13,"punto":"Benchmark de crecimiento vs. competidores directos","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"El comparador más pertinente es Rafael Lacava, gobernador de Carabobo: mismo partido, mismo cargo, reelecto igual que él, y reconocido públicamente como el dirigente regional con mayor proyección en redes del oficialismo venezolano.","lead":""},{"t":"LA LECCIÓN DEL BENCHMARK: la diferencia de 8 a 1 en Instagram no se explica por el tamaño del estado ni por los recursos. Lacava construyó su audiencia con exactamente el registro que en el caso de Bernal produce sus mejores resultados y está infraproducido: contenido humano, cotidiano, sin caja institucional. La auditoría de contenido documentó que la tizana de El Mirador y el sapote entran en su top 15, y que el eje de identidad regional da cuatro de sus veinte mejores resultados históricos en TikTok. La palanca está identificada y probada con datos propios; simplemente no se está accionando de forma sistemática.","lead":"LA LECCIÓN DEL BENCHMARK:"},{"t":"NOTA DE ALCANCE: este benchmark cubre Instagram, que es donde existe dato público comparable. Para un contraste completo habría que medir también X y TikTok de Lacava y de dos o tres gobernadores más, aplicando la misma metodología.","lead":"NOTA DE ALCANCE:"}],"accion":"Completar el benchmark midiendo X y TikTok de Lacava y de dos gobernadores más con esta misma metodología.","tabla":{"headers":["Indicador","Freddy Bernal","Rafael Lacava","Diferencia"],"rows":[["Instagram — seguidores","244.000","2.000.000","Lacava tiene 8,2 veces más"],["Publicaciones en Instagram","4.396","9.465","Lacava más que duplica el volumen histórico"],["Cuentas seguidas en Instagram","366","12","Lacava mantiene una cuenta de emisión pura"],["Aprobación de gestión (dic. 2024)","61%","73%","12 puntos por debajo"],["Perfil comunicacional","Registro institucional con aperturas humanas","Espontáneo, autocrítico, ropa deportiva, humor sobre sí mismo","Lacava explota sistemáticamente el registro que a Bernal solo le funciona por excepción"]]}},{"n":14,"punto":"Costo por seguidor orgánico estimado","estado":"DIAGNÓSTICO POR EVIDENCIA","prioridad":"MEDIA","hallazgo":[{"t":"Calcular el costo por seguidor exige conocer el gasto real de la operación de comunicación, y ese dato es interno: nóminas del equipo, honorarios de producción, equipamiento, y cualquier inversión publicitaria. Ninguna plataforma lo publica y ninguna herramienta externa puede inferirlo.","lead":""},{"t":"REFERENCIA ÚTIL PARA CUANDO SE CALCULE: con el ritmo histórico de X (unos 1.635 seguidores nuevos al mes), cualquier costo operativo mensual dividido entre esa cifra dará un costo por seguidor muy alto. Es previsible que el ejercicio confirme lo que ya apuntan el resto de módulos: el problema no es la falta de inversión sino que el esfuerzo se está aplicando en la plataforma y el horario equivocados.","lead":"REFERENCIA ÚTIL PARA CUANDO SE CALCULE:"}],"accion":"Reunir las partidas internas. El M20 detalla dónde está cada una.","tabla":{"headers":["Dato requerido","Dónde obtenerlo"],"rows":[["Costo mensual total del equipo de comunicación digital","Nómina y contratos"],["Costo de producción audiovisual (equipamiento amortizado, edición)","Contabilidad"],["Inversión publicitaria en plataformas, si existe","Administradores de anuncios de Meta y TikTok"],["Seguidores netos ganados en el periodo","Panel de estadísticas de cada plataforma (punto 2)"],["Fórmula","Costo total del periodo ÷ seguidores netos ganados en ese periodo"]]}}]},{"id":"M13","titulo":"RENDIMIENTO DE CONTENIDO (VIRAL vs. NO VIRAL)","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"382 publicaciones cruzadas entre tres plataformas · 10 líneas de análisis","fuente":"Análisis Cruzado de Rendimiento — X · Instagram · TikTok. Corte: 3 y 4 de septiembre de 2026. Cruza tres conjuntos: 192 publicaciones de X, 127 de Instagram (24 Reels medidos en reproducciones) y 66 vídeos de TikTok, 32 de ellos identificados mediante el ranking nativo «Popular».","calificacion":"El módulo que reorganiza todo el ecosistema","resumen":[{"t":"EL HALLAZGO QUE REORGANIZA TODO EL ECOSISTEMA: TikTok, con menos de la mitad de los seguidores de X, genera una magnitud de exposición que ninguna otra plataforma se acerca a igualar. Los veinte contenidos de mayor alcance de todo el ecosistema son, sin excepción, vídeos de TikTok — el mejor de X (72.356 vistas) queda muy por debajo del vigésimo puesto de TikTok (226.500).","lead":""},{"t":"ADVERTENCIA METODOLÓGICA IMPORTANTE: «reproducciones» no significa lo mismo en las tres plataformas. TikTok contabiliza una vista con criterio muy permisivo (fracciones de segundo, bucles automáticos incluidos), X mide impresiones con criterio más estricto e Instagram no publica vistas de publicaciones fijas. Una comparación cruda de cifras absolutas EXAGERA el peso de TikTok frente a X. Por eso este módulo combina dos vistas: un ranking de magnitud bruta con la salvedad explícita, y comparaciones dentro de cada plataforma contra su propio histórico, que es donde las conclusiones son más firmes.","lead":""},{"t":"Aun descontando esa diferencia de conteo, la diferencia de ORDEN DE MAGNITUD es real y tiene una causa identificable: el tema.","lead":""}],"puntos":[{"n":1,"punto":"Top 20 de contenido más viral de todas las cuentas","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"Los veinte primeros puestos del ecosistema completo son de TikTok, sin excepción. Para contexto: el mejor Reel de Instagram (340.000 reproducciones) quedaría en el puesto 21 de esta lista; la mejor publicación de X (72.356 visualizaciones, el vídeo del helado) no entraría ni en el top 30 de TikTok; y el peluche de Cúcuta (39.316) queda muy por debajo del umbral.","lead":""},{"t":"DISTRIBUCIÓN TEMÁTICA DEL TOP 20: seis puestos (30%) corresponden al eje de paz fronteriza y seguridad; cuatro (20%) a identidad y cultura regional; tres (15%) a contenido humano-familiar; dos (10%) a fechas festivas; y solo un puesto contiene una fotografía con una celebridad musical, que es el único caso de «invitado externo» en todo el top.","lead":"DISTRIBUCIÓN TEMÁTICA DEL TOP 20:"}],"accion":"La conclusión operativa es que el esfuerzo debe seguir a donde está el alcance real, no a donde está el número de seguidores.","tabla":{"headers":["#","Plataforma","Vistas","Tema / contenido"],"rows":[["1","TikTok","2,7 M","#seguridad #tachira #frontera"],["2","TikTok","2,1 M","#seguridad #tachira #electricidad"],["3","TikTok","1,8 M","«Bienvenidos a Venezuela»"],["4","TikTok","1,7 M","«Táchira, territorio de paz»"],["5","TikTok","1,6 M","«Frontera de paz»"],["6","TikTok","1,3 M","Trotar / ejercicio físico"],["7","TikTok","1,2 M","«¿Cómo lo llaman en tu territorio?» — la esponjilla"],["8","TikTok","1,1 M","Felicitación navideña"],["9","TikTok","956,2 K","Visita del cantante Jorge Celedón"],["10","TikTok","720,2 K","«Venezuela es tierra de paz»"],["11","TikTok","695,9 K","Contenido de familia"],["12","TikTok","693,0 K","«Soy un hombre de palabra, lo prometí y lo cumplí»"],["13","TikTok","682,3 K","Navidad, diciembre de 2024"],["14","TikTok","649,2 K","«Amor por el Táchira»"],["15","TikTok","628,6 K","Táchira / Potosí, contenido territorial"],["16","TikTok","602,9 K","Despliegue de seguridad en Ureña"],["17","TikTok","580,4 K","«Paz y alegría»"],["18","TikTok","567,6 K","Seguridad"],["19","TikTok","530,4 K","Seboruco: humor y trabajo comunitario en dificultad"],["20","TikTok","526,3 K","Ejercicio físico"],["—","Instagram (Reel)","340.000","Techo de alcance de la cuenta. Quedaría en el puesto 21."],["—","X","72.356","Vídeo del helado en Farmatodo. No entraría en el top 30 de TikTok."],["—","X","39.316","Peluche de los niños de Cúcuta para La Guaira."]]}},{"n":2,"punto":"Bottom 20 de contenido de menor rendimiento","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"Aquí se respeta la métrica propia de cada plataforma en vez de forzar una comparación entre vistas y me gusta que no significarían lo mismo.","lead":""},{"t":"X — BOTTOM 8 (de 192 publicaciones, por vistas): 12 «Trabajo en equipo, triunfo seguro!!!!»; 19 «Jajajajajaja creo que soy demasiado importa de para yo…»; 23 «Saludos compatriota. Bendiciones!»; 25 «Aprende a escribir primero y después hablamos»; 29 «Un simple boot contratado!»; 31 «Le falso acá eres tú!»; 58 «Un Gobierno Nacional que responde de manera oportuna…»; 62 «Que viva Venezuela y Colombia!!!!». Las ocho son respuestas de texto plano.","lead":""},{"t":"INSTAGRAM — BOTTOM 7 (de 127, por me gusta): 1 Coordinación desde Protección Civil; 2 Reencuentro con una tarjeta antigua; 6 «#ChavezSiempreChavez» como único texto; 15 publicación sin texto; 138 «¡Seguimos brindando sonrisas a nuestra gente!»; 144 copy de 1.122 caracteres; 176 Oro para Venezuela en la OMCC 2026. Los cuatro valores más bajos podrían reflejar un error de lectura del contador y se recomienda verificación manual antes de citarlos como definitivos.","lead":"INSTAGRAM —"},{"t":"TIKTOK — BOTTOM 5 (de 66, por reproducciones): 1.748, 3.016, 3.901, 4.632 y 4.738. Incluso el peor resultado de TikTok sigue siendo un volumen absoluto más alto que casi toda la muestra baja de X, otra manifestación de la diferencia de conteo entre plataformas.","lead":"TIKTOK —"}],"accion":"El contenido de valor nunca se publica como respuesta. Y ninguna publicación sale sin copy."},{"n":3,"punto":"Patrones comunes del contenido exitoso (fórmula ganadora)","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"LA FÓRMULA ES TRANSVERSAL A LAS TRES PLATAFORMAS Y NO ES UN MISTERIO. Cuatro ejes:","lead":""},{"t":"PAZ Y FRONTERA. Es, con diferencia, el eje más rentable de todo el ecosistema. Seis de los veinte primeros puestos de TikTok lo usan de forma explícita en el hashtag o en el titular («frontera de paz», «territorio de paz», «tierra de paz»). No es casualidad: conecta la ansiedad real de una población fronteriza con un mensaje de tranquilidad, y lo hace sin necesidad de cifra ni de dato duro.","lead":"PAZ Y FRONTERA."},{"t":"SEGURIDAD CON RESULTADO VERIFICABLE. Funciona en las tres plataformas por igual: «ordené la captura inmediata» en X (35.184 vistas), el despliegue en Ureña en TikTok (602.900), la detención tras difusión de un vídeo en Instagram (1.179 me gusta). El patrón común es AUTORIDAD MÁS HECHO CONCRETO, nunca autoridad en abstracto.","lead":"SEGURIDAD CON RESULTADO VERIFICABLE."},{"t":"IDENTIDAD Y CULTURA REGIONAL. La esponjilla, el sapote, la tizana de El Mirador, la Virgen de Táriba, el Santo Cristo. Es el eje menos político de todos y el que más rendimiento por esfuerzo produce: son piezas baratas de grabar y de las que mejor resultado dan de forma consistente.","lead":"IDENTIDAD Y CULTURA REGIONAL."},{"t":"CONTENIDO HUMANO SIN CARGA POLÍTICA. Familia, ejercicio físico, humor en la adversidad (Seboruco), el peluche de Cúcuta. Es el eje que mejor demuestra que la audiencia no busca solo información de gestión: busca ver a la persona.","lead":"CONTENIDO HUMANO SIN CARGA POLÍTICA."},{"t":"RASGOS FORMALES QUE ACOMPAÑAN AL CONTENIDO EXITOSO. Gancho en la primera línea o el primer segundo, nunca fórmula institucional. Formato vídeo por encima de imagen fija en las tres plataformas, salvo la excepción de una efeméride de altísima carga simbólica en Instagram. Frase corta y memorable como remate. Y protagonismo compartido: cuando el vídeo incluye a otra persona con nombre propio (Jorge Celedón, los niños de Cúcuta, un vecino de Seboruco), el rendimiento sube — el contenido en que solo aparece él hablando a cámara rinde bien pero nunca alcanza los techos más altos.","lead":"RASGOS FORMALES QUE ACOMPAÑAN AL CONTENIDO EXITOSO."}],"accion":"No hace falta inventar una estrategia nueva. Hace falta sostener la que el propio historial ya demuestra ganadora."},{"n":4,"punto":"Patrones comunes del contenido fallido (qué dejar de hacer)","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"HALLAZGO IMPORTANTE: el peor contenido de las tres plataformas NO FALLA POR HABLAR DE UN TEMA POCO INTERESANTE, SINO POR ESTAR MAL CONSTRUIDO. Esto es una buena noticia operativa, porque corregirlo no exige cambiar de qué se habla, solo cómo se dice.","lead":"HALLAZGO IMPORTANTE:"},{"t":"LA ÚNICA EXCEPCIÓN QUE CONFIRMA LA REGLA: el vocabulario doctrinal-político («asedio», «guerra imperial», «bloqueo») es el único caso donde sí importa el tema y no solo la forma. Incluso bien construido, rinde peor que el contenido de gestión o humano en el mismo canal. Es contenido dirigido a la militancia ya convencida, no a la audiencia general, y su presencia en formatos de alcance masivo (vídeo corto de TikTok, Reel de Instagram) es una desalineación entre el mensaje y el objetivo del formato.","lead":"LA ÚNICA EXCEPCIÓN QUE CONFIRMA LA REGLA:"}],"accion":"Es un problema de redacción y de calendario, no de agenda. Corregible sin cambiar de qué se habla.","tabla":{"headers":["Defecto","Dónde aparece","Ejemplo"],"rows":[["Apertura institucional larga","X e Instagram por igual","«En el marco de la conmemoración…», «Siguiendo el legado del Comandante…»"],["Texto reciclado de boletín, en tercera persona","Instagram","«Junto al gobernador del estado Táchira, Freddy Bernal; el vicepresidente…»"],["Copy desproporcionadamente largo","Instagram","Tres de los peores resultados superan los 1.000 caracteres"],["Publicación sin ningún texto","Instagram","Una publicación fija sin copy alguno, entre las peores de la muestra"],["Reunión interna sin interés ciudadano","Instagram y X","Reunión de la dirección del PSUV; «#RESUMEN /// Reunión del Equipo Regional»"],["Confrontación personal por escrito","X, exclusivamente","Las cuatro respuestas del 4 al 6 de agosto, con errores de redacción"],["Publicar en el día y la hora equivocados","TikTok, exclusivamente medido","70% del bottom 20 cae en los cuatro días de peor rendimiento medio"]]}},{"n":5,"punto":"Matriz tema × formato × rendimiento","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"Matriz consolidada sobre las tres plataformas, con la evidencia que respalda cada fila.","lead":""}],"accion":"Usar esta matriz como criterio de decisión editorial en la planificación semanal.","tabla":{"headers":["Tema","Mejor formato observado","Rendimiento típico","Plataforma(s) con evidencia"],"rows":[["Paz y frontera","Vídeo corto, discurso a cámara o escena en terreno","MUY ALTO","TikTok (dominante), X (moderado)"],["Seguridad con resultado","Vídeo corto con dato verificable","ALTO","Las tres plataformas"],["Identidad y cultura regional","Vídeo corto, tono cercano","ALTO","Instagram y TikTok"],["Contenido humano-cotidiano","Vídeo corto o selfie","ALTO, con riesgo de lectura de contraste social si se percibe como privilegio (caso del helado)","Las tres plataformas"],["Gestión de infraestructura y obras","Vídeo con cifra concreta","MEDIO","Instagram y X"],["Fechas festivas","Vídeo o imagen fija","MEDIO-ALTO","TikTok e Instagram"],["Efemérides político-partidistas de alto voltaje","Imagen fija o vídeo","ALTO solo en fechas de máxima carga simbólica; MEDIO-BAJO en el resto","Instagram (caso excepcional), X (bajo)"],["Actos y reuniones internas de partido","Cualquiera","BAJO","Instagram y X"],["Vocabulario doctrinal («asedio», «guerra imperial»)","Cualquiera","BAJO","X, principalmente"],["Confrontación personal por escrito","Texto de respuesta","MUY BAJO y con coste reputacional","X, exclusivamente"]]}},{"n":6,"punto":"Mejor y peor horario de publicación por plataforma","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"COINCIDENCIA VALIOSA ENTRE X E INSTAGRAM: la distribución es prácticamente idéntica —12:00-16:59 el 33% y 17:00-21:59 el 30% en ambas—, lo que sugiere que ambos equipos leen bien el mismo patrón de audiencia, se coordinen o no entre sí. Si hay libertad para fijar un horario estándar, la franja de 12:00 a 21:00 con picos al mediodía y en la noche es la que ya ha demostrado funcionar en dos de las tres plataformas.","lead":"COINCIDENCIA VALIOSA ENTRE X E INSTAGRAM:"},{"t":"PERO TIKTOK NO SIGUE ESE PATRÓN, Y ES EL HALLAZGO MÁS RENTABLE DE ESTE PUNTO. Medido sobre las 63 publicaciones recientes con hora verificada: la franja 22:00-23:59 rinde una media de 64.498 reproducciones —incluye el pico reciente de 346.200— frente a las 19.837 de la franja 12:00-16:59, que es la peor. La franja 07:00-11:59 es la segunda mejor con 50.380.","lead":"PERO TIKTOK NO SIGUE ESE PATRÓN, Y ES EL HALLAZGO MÁS RENTABLE DE ESTE PUNTO."},{"t":"LA ANOMALÍA A CORREGIR: la franja MÁS USADA en TikTok (17:00-21:59, con el 46% del volumen y 29 de las 63 publicaciones) rinde solo 16.048 de media. La MEJOR franja real (22:00-23:59) es también la MENOS explotada, con solo 7 publicaciones de 63.","lead":"LA ANOMALÍA A CORREGIR:"},{"t":"Trasladar una parte del volumen de la tarde-noche a la franja nocturna tardía es un ajuste de calendario, sin coste, con potencial de impacto directo en el alcance medio. Y es un patrón propio de TikTok que NO deb
