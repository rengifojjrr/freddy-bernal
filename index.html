te y fecha · 9 líneas de análisis"],["M15","ESCUCHA SOCIAL — NACIONAL","10","Momentos de exposición nacional documentados con cita textual y fecha · 10 líneas de análisis"],["M16","ESCUCHA SOCIAL — INTERNACIONAL","6","Diez listas de sanciones, siete medios y seis organizaciones verificados · 6 líneas de análisis"],["M17","ANÁLISIS DE COMPETIDORES DIRECTOS","15","Cinco competidores seleccionados y fichados · 15 líneas de análisis"],["M18","BENCHMARK INTERNACIONAL DE POLÍTICOS DEL MISMO RANGO","10","Cinco referentes internacionales · 10 líneas de análisis"],["M19","AUDIENCIA Y COMUNIDAD","11","Muestras de comentarios de tres plataformas · 11 líneas de análisis"],["M20","EQUIPO, PROCESOS Y TECNOLOGÍA","11","Capacidad de producción medida · estructura, flujo y cuestionario entregados · 11 líneas de análisis"],["M21","ENTREGABLES ESTRATÉGICOS (CIERRE DEL DIAGNÓSTICO)","12","Informe técnico, FODA, KPIs y hoja de ruta entregados · 12 líneas de análisis"],["","TOTAL — 21 módulos de análisis","267","8 cuentas · 6 plataformas · 382 publicaciones clasificadas · 20 figuras de verificación"]]},"intros":{"indice_modulos":{"t":"Los veintiún módulos que componen el diagnóstico, con el número de puntos que analiza cada uno y el alcance del trabajo realizado. El cuerpo del informe los recorre en este mismo orden.","lead":""},"cuerpo":{"t":"A partir de aquí el documento sigue exactamente el orden y la enumeración de la cotización. Cada módulo abre con su ficha (precio, cobertura, fuente y calificación), su resumen, y a continuación cada uno de los puntos contratados con su hallazgo, estado, prioridad y acción.","lead":""}},"plan_intro":{"t":"Construido cruzando las acciones recomendadas de los veintiún módulos y ordenadas por urgencia, coste y dependencia. El criterio de priorización es explícito: primero lo que elimina un riesgo confirmado y no tiene coste ni dependencias; después lo que desbloquea el resto del sistema; después lo que corrige la coherencia; y por último lo que construye capacidad nueva.","lead":""},"plan":[["BLOQUE 0 — PRIMERAS 24 HORAS",{"t":"Cinco acciones sin coste y sin dependencias que eliminan riesgos confirmados. Ninguna requiere presupuesto, aprobación externa ni producción.","lead":""},[["Registrar instagram.com/freddybernalr","M01",{"t":"Está libre HOY, comprobado en pantalla. Configurarlo como cuenta defensiva, con foto oficial y biografía que remita a @freddybernalven. Es la acción de mayor urgencia del informe porque el riesgo es de ocupación por terceros y se resuelve en dos minutos.","lead":""},1],["Reportar @freddybernalven1 como suplantación","M01",{"t":"Ante Instagram, adjuntando documento de identidad y acreditación del cargo. ANTES DE REPORTAR, capturar los comentarios: contienen peticiones ciudadanas reales, incluida al menos una sobre una desaparición forzada, que deben canalizarse por la vía correspondiente en lugar de perderse al eliminarse la cuenta.","lead":""},2],["Corregir la biografía de @freddybernalvzla en TikTok","M01 · M03",{"t":"Sustituir «Candidato a la gobernación del Táchira» por el cargo vigente. Hay 19.400 personas leyendo una descripción falsa del cargo, y la cuenta principal remite activamente a ella desde su propia biografía.","lead":""},3],["Resolver Mastodon","M01",{"t":"Recuperar el acceso y actualizar biografía, banner (todavía de la campaña presidencial de 2018) y enlaces —uno de ellos roto—, o cerrarla. Si no hay acceso, reclamarla o reportarla a la administración de mastodon.social.","lead":""},4],["Retirar el Gmail de los blogs heredados y activar verificación en dos pasos","M01",{"t":"Comprobar antes si esa dirección es correo de recuperación de alguna cuenta vigente: si lo es, el riesgo es de toma de control, no de spam. Activar verificación en dos pasos en las siete plataformas.","lead":""},5]]],["BLOQUE 1 — PRIMEROS 15 DÍAS",{"t":"Lo que desbloquea el resto del sistema. Incluye la única tarea de diez minutos que cierra siete puntos pendientes de la auditoría.","lead":""},[["Capturar la línea base de métricas en los paneles nativos","M12 · M19",{"t":"DIEZ MINUTOS. Entrar en Instagram, Facebook y TikTok y capturar: evolución de seguidores de 30/60/90 días, alcance de seguidores frente a no seguidores, horas de audiencia activa, demografía y geografía. Cierra los puntos 2, 3, parte del 5 y el 8 del M12, los puntos 1 a 4 del M19, y habilita el plan de crecimiento del M21. Es, con diferencia, la tarea de mayor rendimiento pendiente de todo el encargo.","lead":""},1],["Añadir enlace en biografía en cinco cuentas","M01 · M02 · M03",{"t":"TikTok, Instagram, Threads, Facebook y YouTube. Recupera 618.000 seguidores hoy sin ruta de conversión. Treinta segundos por cuenta.","lead":""},2],["Iniciar los expedientes de verificación","M01",{"t":"X (insignia gris de organización gubernamental, no la azul de suscripción individual), TikTok e Instagram. 1,17 millones de seguidores dependen de ello. Nota del M16: el resultado no es previsible desde fuera por la intervención de las listas de sanciones en las comprobaciones de cumplimiento; eso no desaconseja solicitarlo, pero obliga a no construir el plan sobre el supuesto de que se concederá.","lead":""},3],["Corregir la categoría de Instagram","M01 · M02",{"t":"De «Blog personal» a «Funcionario gubernamental». Es requisito previo para la verificación.","lead":""},4],["Corregir el enlace de YouTube en el sitio oficial","M04",{"t":"El sitio enlaza al canal INACTIVO (910 suscriptores, ~1 año sin publicar) en lugar del canal ACTIVO donde se publica el programa semanal. Todo el tráfico que la comunicación oficial genera hacia YouTube se está perdiendo. Corrección de minutos y probablemente la de mejor relación esfuerzo-resultado del estudio.","lead":""},5],["Publicar la página «Cuentas oficiales»","M01",{"t":"En freddybernaloficial.com, listando los ocho activos, declarando cuáles están abandonados y no representan al gobernador, y enlazándola desde cada biografía. Añadir al sitio los dos TikTok y Threads, hoy fuera de todo inventario oficial pese a sumar 338.600 seguidores.","lead":""},6],["Poner imagen de cabecera en X","M06 · M09",{"t":"El espacio gráfico más visible del perfil con 602.800 seguidores está vacío, en gris liso. El banner del sitio ya existe y se adapta a 1500×500 en minutos. Añadir también publicación fijada, hoy inexistente.","lead":""},7],["Retirar el material de campaña","M02 · M13",{"t":"Sustituir la portada de la destacada «PLAN GOBIERNO» de Instagram, que mantiene la llamada al voto «VOTE Bernal» en el perfil de un mandatario en ejercicio.","lead":""},8],["Higiene de datos en Facebook","M01",{"t":"Cerrar la lista de amigos, hoy pública, y revisar la fecha de nacimiento publicada (16 de junio de 1961), que no coincide con la de las fuentes públicas (16 de junio de 1962).","lead":""},9],["Activar subtítulos automáticos y texto alternativo","M02 · M08 · M09",{"t":"Subtítulos nativos en todos los Reels como complemento del subtítulo quemado, y texto alternativo en las fotografías del sitio y de las publicaciones fijas. Suma en accesibilidad y en distribución al mismo tiempo, y se hace en el momento de publicar.","lead":""},10],["Asignar la tarea de responder comentarios","M19",{"t":"Veinte respuestas diarias, priorizando preguntas y peticiones sobre servicios, empezando por Instagram —que es donde el entorno es favorable y el esfuerzo rinde más. No requiere presupuesto: requiere asignar la tarea a alguien.","lead":""},11],["Ajustar el calendario de TikTok","M03 · M13",{"t":"Trasladar volumen de la franja 17:00-21:59 (46% del volumen, 16.048 reproducciones de media) a la franja 22:00-23:59 (11% del volumen, 64.498 de media). Y redistribuir el martes y el sábado hacia miércoles, jueves y domingo. Coste cero, impacto directo en el alcance medio.","lead":""},12]]],["BLOQUE 2 — DÍAS 15 A 45",{"t":"Corrección de coherencia. Es donde se cierra la brecha entre lo que se produce y lo que la marca declara.","lead":""},[["Redactar el manual de marca mínimo","M09 · M21",{"t":"Dos páginas: azul primario y amarillo de acento con valores exactos, pareja tipográfica única, versiones del logotipo (monocroma, reducida para avatar, horizontal para cabecera, sobre fondo oscuro), y la regla escrita de cuándo aplica identidad personal frente a identidad de partido. Resuelve simultáneamente los cuatro sistemas gráficos, el logotipo sin desplegar y la alternancia sin criterio.","lead":""},1],["Crear las cuatro plantillas de pieza que faltan","M09",{"t":"Cita destacada, dato o cifra de gestión, convocatoria y agradecimiento. La plantilla de «COMUNICADO» ya demuestra que existe capacidad de hacerlas bien. La de CITA es la más costosa por su ausencia: la cuenta genera frases memorables con regularidad y ninguna se convierte en pieza compartible.","lead":""},2],["Corregir el reencuadre vertical de «Reporte Bernal»","M08",{"t":"Cada emisión repite el mismo defecto: rótulo cortado a media palabra («REPO»), sujeto sin aire superior y un tercio del cuadro desperdiciado en un faldón redundante. Dos soluciones sin coste: reencuadrar manualmente, o grabar una segunda toma en vertical nativo. Reubicar además el micrófono de brazo, que cruza el rostro.","lead":""},3],["Convertir el perfil de Facebook en Página","M05",{"t":"Es la recomendación de mayor impacto estructural del estudio de reputación. Facebook ofrece conversión nativa que preserva seguidores y contenido, y desbloquea de golpe estadísticas nativas, elegibilidad publicitaria, demografía de audiencia, métricas de vídeo y de directo, roles de administrador y tiempos de respuesta medidos. Cinco de los diez puntos del M05 son inexistentes sin ella.","lead":""},4],["Consolidar los dos canales de YouTube","M04",{"t":"Migrar la publicación al canal con más suscriptores y redirigir el otro. Mantener dos canales con nombres casi idénticos fragmenta la señal, divide el histórico y confunde al usuario.","lead":""},5],["Decidir el destino del TikTok secundario","M01 · M03",{"t":"Fusionar la audiencia en el principal o darle un rol propio y declarado. Dos cuentas activas sin criterio explícito confunden.","lead":""},6],["Unificar identidad visible","M01 · M09",{"t":"Misma fotografía de perfil en las siete plataformas, con fecha fijada de retorno del retrato en sustitución de la bandera de luto. Nombre visible homogéneo. Biografías homogeneizadas tomando la de X como plantilla, con los emojis 💛🖤❤️ extendidos a todas.","lead":""},7],["Reestructurar la redacción","M02 · M06 · M10",{"t":"Gancho en los primeros 100 caracteres, desarrollo en bloques separados, cierre con acción. Prohibir por escrito las aperturas «En el marco de» y «Siguiendo el legado de». Decisión de voz: siempre primera persona; ningún texto de boletín pegado sin reescribir. En X: dato o escena en la primera línea, atribución institucional en la última, cierre siempre con destino.","lead":""},8],["Protocolo de no confrontación","M06 · M11",{"t":"Ninguna respuesta a críticas personales. Si hay que corregir una información falsa, se hace con una cita o un hilo propio, nunca con una respuesta personal. El episodio del 4 al 6 de agosto obtuvo entre 19 y 31 visualizaciones con un coste reputacional desproporcionado.","lead":""},9],["Prueba controlada de saturación en Instagram","M02 · M12",{"t":"Bajar de tres publicaciones diarias a dos durante un mes y medir si el engagement se recupera. Es la única forma de confirmar o descartar la hipótesis de saturación que explica la caída del 31%.","lead":""},10],["Producir el calendario editorial trimestral","M20 · M21",{"t":"Los insumos están completos: distribución por pilar calculada, horario óptimo medido por plataforma, día óptimo medido, capacidad de producción cuantificada y flujo de trabajo propuesto. Falta el documento operativo.","lead":""},11]]],["BLOQUE 3 — DÍAS 45 A 90",{"t":"Construcción de capacidad nueva. Aquí es donde se abren los espacios que hoy nadie ocupa.","lead":""},[["Abrir un canal de difusión de WhatsApp","M01 · M17 · M18",{"t":"Cierra la brecha de mayor impacto y neutraliza el vector de suplantación de 2022, que se ejecutó por mensajería. Funciona con conectividad pobre, consume pocos datos y tiene penetración casi universal en Venezuela. Y ningún gobernador venezolano lo ha ocupado de forma estructurada: sería el primero.","lead":""},1],["Lanzar Spaces quincenales","M06 · M17",{"t":"Treinta minutos, tema anunciado 48 horas antes, moderado por el equipo de prensa, con dos o tres invitados del ámbito regional. Ataca simultáneamente la falta de conversación, la ausencia de canal de atención y la nula interlocución con el tejido no gubernamental. Su registro natural es oral y acumula más de 250 emisiones de programa propio de radio: es el formato donde su ventaja de oficio es mayor y donde ningún competidor compite.","lead":""},2],["Instalar el ciclo denuncia-acción-resultado como formato recurrente","M13 · M18 · M19",{"t":"Recoger públicamente un problema ciudadano, actuar, y comunicar el resultado cerrando el círculo. Ya hay un caso documentado funcionando —la detención tras difusión de un vídeo ciudadano— y es el mayor diferencial competitivo disponible: ningún gobernador de la región lo hace. Los comentarios ya están llenos de denuncias concretas y verificables sobre luz, agua y vialidad.","lead":""},3],["Convertir el eje binacional en línea editorial estable","M06 · M17 · M18",{"t":"Si solo se pudiera hacer una cosa, sería esta. Está probada con datos propios (el peluche de Cúcuta, segunda publicación más vista del semestre; «frontera de paz» dominando el top histórico de TikTok con picos de 1,6 a 2,7 millones), es territorio exclusivo que ningún competidor venezolano puede ocupar, y conecta con audiencia al otro lado de la frontera. Hoy se toca por accidente.","lead":""},4],["Añadir atención ciudadana y rendición de cuentas al sitio","M01",{"t":"Sección de atención con formulario y sección de rendición de cuentas con indicadores. Es la contramedida de fondo frente al fenómeno de la cuenta suplantadora: los ciudadanos dejan peticiones ahí porque no encuentran ningún canal oficial.","lead":""},5],["Contratar la herramienta de escucha social","M14 · M15",{"t":"Sin ella, cuatro de los nueve puntos del M14 y tres de los diez del M15 son estructuralmente inauditables, y volverán a serlo en cualquier revisión futura. El coste de una licencia básica es menor que el de una sola semana de la producción audiovisual descrita en el M04. Instrumentar antes de necesitarlo.","lead":""},6],["Auditoría técnica de indexación del sitio","M07",{"t":"Comprobar registro en Google Search Console, ausencia de directivas de bloqueo en robots.txt y de etiquetas noindex, existencia y envío de mapa del sitio, títulos y metadescripciones únicos por página. Implementar marcado schema.org/Person. Forzar https en todo el dominio. Migrar el boletín «Semanario» del Google Drive al propio dominio. Un sitio que publica a diario y no aparece para el nombre de su titular tiene un problema técnico, no de competencia.","lead":""},7],["Verificar elegibilidad publicitaria y viabilidad de la cadena de pago","M16 · M21",{"t":"ANTES de presupuestar cualquier partida de pauta. Las plataformas de Meta y Google aplican listas de sanciones a anunciantes y a cuentas comerciales. Es una comprobación previa de viabilidad, no una recomendación de comunicación, y planificar sin resolverla expone el plan a un rechazo en fase de ejecución.","lead":""},8],["Establecer enlaces recíprocos entre freddybernaloficial.com y tachira.gob.ve","M01 · M17",{"t":"Ambos ecosistemas existen sin enlazarse. Y declarar el reparto de roles con la cuenta institucional: contenido institucional pesado a la Gobernación, registro humano a la cuenta personal. Hoy duplican mensaje sobre las mismas personas.","lead":""},9],["Replantear el formato de «Reporte Bernal»","M04",{"t":"Mantener la emisión íntegra como archivo y derivar sistemáticamente de cinco a ocho piezas cortas por episodio, cada una con un solo asunto y titulada por ese asunto. Añadir capítulos a las emisiones completas. El dato interno lo respalda: la pieza de 1 minuto 47 segundos rindió más que emisiones de dos horas.","lead":""},10],["Adoptar los usos de IA de bajo riesgo","M18 · M20",{"t":"Subtitulado automático, análisis de comentarios a escala, reencuadre asistido vertical, asistencia en redacción de borradores. Prohibir por escrito los tres de alto riesgo: contenido sintético, respuestas automáticas sin supervisión y amplificación artificial. Regla práctica: usar IA para producir más rápido lo que ya se hace, nunca para sustituir la presencia real de la persona.","lead":""},11]]],["BLOQUE 4 — PERMANENTE",{"t":"Lo que convierte esta auditoría en un sistema y no en una foto.","lead":""},[["Registro mensual de métricas","M12 · M21",{"t":"Captura de las ocho cuentas el día 1 de cada mes, por la misma persona y con el mismo método, sobre el tablero de nueve indicadores del M21. A partir del tercer registro existe serie temporal propia y la medición deja de depender de terceros.","lead":""},1],["Barrido mensual de suplantaciones","M01",{"t":"Dentro de cada plataforma, con registro y reporte de los perfiles que usen imagen institucional. Y registro defensivo de los handles esperables que sigan libres.","lead":""},2],["Protocolo escrito de respuesta ante suplantación","M01",{"t":"Con desmentido tipo, canales y responsable asignado.","lead":""},3],["Procedimiento de cierre de canales","M01",{"t":"Ningún activo se abandona sin actualizar biografía, redirigir enlaces o cerrarlo. Es la regla que habría evitado los cuatro activos huérfanos, las cuatro descripciones de cargo simultáneas y el banner de 2018 que sigue publicado.","lead":""},4],["Control de calidad audiovisual antes de publicar","M08 · M20",{"t":"Revisar cada pieza EN TELÉFONO, en el formato de destino, antes de exportar. Cinco minutos por pieza. Es un procedimiento, no una contratación, y habría evitado que el rótulo cortado se repitiera durante meses.","lead":""},5],["Monitorización de publicaciones de organizaciones especializadas","M16",{"t":"Seguimiento sistemático de InSight Crime, International Crisis Group, Connectas, Transparencia Venezuela y los medios fronterizos colombianos. Conocer lo publicado en el momento de su publicación, no descubrirlo por vía de terceros.","lead":""},6],["Protocolo de capitalización de picos","M15",{"t":"Quién detecta el pico de exposición, en cuánto tiempo se derivan piezas, a qué plataformas. El episodio del 2 de junio de 2026 fue el momento de mayor exposición nacional del periodo y la estructura propia no lo capitalizó.","lead":""},7],["Atender por gestión las tres demandas repetidas","M14 · M19",{"t":"Cortes de energía eléctrica, la carretera Rubio–San Cristóbal, y el asunto del peso colombiano y las casas de cambio. Son las únicas demandas del corpus que se resuelven con hechos y no con comunicación, y responderlas tendría más efecto sobre el sentimiento que cualquier ajuste de contenido.","lead":""},8]]]],"vacios":{"intro":{"t":"El diagnóstico está cerrado. Este capítulo describe lo que la organización puede desbloquear a partir de él: qué se profundiza con acceso a los propios paneles de las cuentas, qué exige instrumentación permanente, y qué producción estratégica se construye sobre las decisiones que este informe permite tomar. Cada bloque indica el esfuerzo real que supone.","lead":""},"categorias":[["Bloque A · Una sesión de una hora dentro de las cuentas — el mayor retorno disponible",[{"t":"Qué desbloquea: la evolución de seguidores de los últimos 30, 60 y 90 días en las tres plataformas principales; el alcance desglosado entre seguidores y no seguidores; las horas reales de audiencia activa; la demografía por edad y sexo; la geografía por ciudad; la curva de retención de vídeo y el porcentaje de reproducción completa; y las métricas de Historias y de directos.","lead":""},{"t":"Dónde está cada dato, exactamente: Instagram → Estadísticas → Público (rango de edad, sexo, principales ubicaciones, horas más activas) y Alcance (seguidores / no seguidores). TikTok → Herramientas de creador → Analíticas → Seguidores y Contenido. Facebook → Estadísticas de la Página, disponibles una vez completada la conversión de perfil a Página. YouTube → YouTube Studio → Audiencia y Alcance.","lead":""},{"t":"Qué cambia con ello: los cuatro perfiles de audiencia construidos en el M19 pasan de cualitativos a cuantificados; el plan de crecimiento del M21 se cierra con tasa base real; y el calendario editorial se ajusta con la curva de audiencia activa en lugar de con el proxy de rendimiento.","lead":""},{"t":"ESFUERZO: una sesión de trabajo de aproximadamente una hora, sin coste. Es la acción de mayor retorno pendiente en todo el encargo.","lead":""}]],["Bloque B · Instrumentación de escucha social — la infraestructura que falta",[{"t":"Qué desbloquea: volumen total de menciones en el Táchira y a nivel nacional; distribución de sentimiento medida y no inferida; percepción desagregada por municipio; participación en la conversación (share of voice) frente a un conjunto definido de comparables; conversación de la diáspora venezolana en Colombia, Estados Unidos, España y Chile; y cobertura y sentimiento en Google Noticias.","lead":""},{"t":"Cómo instrumentarlo bien: antes de medir hay que fijar qué se va a medir —menciones por municipio, temas asociados, y sobre todo la separación entre comunicación de gestión y comunicación institucional. Sin esa definición previa los datos no serán comparables entre periodos.","lead":""},{"t":"La regla que debe quedar escrita en el diseño: el sitio de la Gobernación publica resúmenes del programa semanal del propio gobernador y la web personal republica esos mismos contenidos. Contar esa autopublicación como cobertura mediática infla artificialmente cualquier indicador de presencia. Las dos categorías deben separarse desde el primer día.","lead":""},{"t":"ESFUERZO: licencia básica de una plataforma tipo Brandwatch, Meltwater o Talkwalker. El coste es menor que el de una sola semana de la producción audiovisual que ya se está realizando.","lead":""}]],["Bloque C · Los archivos originales de grabación — cierra la auditoría técnica de vídeo",[{"t":"Qué desbloquea: resolución nativa y tasa de bits; ritmo de edición medido en cortes por minuto; inventario de transiciones y efectos; existencia y duración de cabecera y cierre; duración exacta por pieza contrastada con la óptima de cada plataforma; estructura narrativa del guion; efectividad medida del gancho de los tres primeros segundos; presencia y ubicación de la llamada a la acción; uso de material de apoyo y archivo; y tiempos reales de producción, de la grabación a la publicación.","lead":""},{"t":"Por qué no se lee desde la plataforma: ni Instagram ni TikTok exponen los metadatos del vídeo a la inspección externa. Instagram sirve el archivo como objeto cifrado y TikTok protege el elemento. Esos valores están en los archivos de grabación y se leen en minutos.","lead":""},{"t":"ESFUERZO: acceso a una muestra de ocho a diez piezas en su formato original, más una sesión de visionado.","lead":""}]],["Bloque D · Medición del competidor de referencia",[{"t":"Qué desbloquea: frecuencia de publicación, engagement real, calidad de producción audiovisual, calidad de diseño gráfico y contenido más viral de Rafael Lacava, el único competidor cuyo resultado cambiaría decisiones.","lead":""},{"t":"Por qué importa: hoy sabemos que Lacava tiene 2 millones de seguidores en Instagram frente a 244.000, ocho veces más. Lo que no sabemos es si esa audiencia es tan viva como la suya. El M12 documenta que en este ecosistema la cuenta con más seguidores (X, 602.800) es la menos viva, con un alcance del 0,56%. Sin el engagement de Lacava, la brecha de 8 a 1 es un dato de tamaño, no de influencia.","lead":""},{"t":"Método: replicar sobre él exactamente el protocolo aplicado al candidato en los módulos M01 a M13 — extraer entre 60 y 130 publicaciones por plataforma con fecha, hora, formato y métricas; calcular engagement sobre la referencia correspondiente; reproducir de tres a cinco piezas de vídeo; e inspeccionar su grilla.","lead":""},{"t":"ESFUERZO: entre cuatro y seis horas de extracción y análisis.","lead":""}]],["Bloque E · El cuestionario de verificación interna",[{"t":"Qué desbloquea: confirma o descarta los diagnósticos de proceso del M20 —estructura del equipo, flujo de aprobación, calendario editorial, banco de contenido, herramientas contratadas y costo real de la operación— y permite calcular el costo por seguidor orgánico que quedó formulado en el M12.","lead":""},{"t":"El cuestionario completo, con sus preguntas agrupadas por equipo, proceso, herramientas y costo, se entrega dentro del módulo M20. Se recomienda responderlo por escrito.","lead":""},{"t":"ESFUERZO: una reunión de equipo. Ninguna auditoría externa puede responder estas preguntas, y las respuestas convierten seis diagnósticos por evidencia en hechos confirmados.","lead":""}]],["Bloque F · Producción estratégica sobre el diagnóstico aprobado",[{"t":"Cuatro piezas se construyen sobre las decisiones que este informe permite tomar, y por eso van después y no antes: el manual de marca digital, el calendario editorial trimestral, la guía de tono de voz y el plan de inversión en pauta.","lead":""},{"t":"Sus insumos están íntegramente preparados aquí. Para el manual de marca: los valores cromáticos exactos extraídos del código, la pareja tipográfica en uso, el inventario de los cuatro sistemas gráficos que conviven, las cuatro tipologías de pieza que faltan y el diagnóstico completo de accesibilidad (M09). Para el calendario: la distribución por pilar calculada, el horario óptimo medido por plataforma, el día óptimo medido y la capacidad de producción cuantificada en 30-42 piezas semanales (M13, M03, M20). Para la guía de tono: la decisión de voz, la tipología de ganchos que funcionan y los que fallan, la estructura de copy y de hilo, y los cuatro perfiles de audiencia con su mensaje (M02, M06, M10, M19).","lead":""},{"t":"Para el plan de pauta hay dos condiciones previas de viabilidad que deben resolverse antes de presupuestar, y están documentadas en el M16 y el M05: verificar la elegibilidad publicitaria de las cuentas y de la entidad pagadora en las plataformas de Meta y Google, y completar la conversión del perfil de Facebook en Página, porque un perfil personal no admite alcance pagado en absoluto.","lead":""},{"t":"ESFUERZO: fase de producción, sobre el diagnóstico aprobado.","lead":""}]]]},"fuentes":{"documentos":[["Inventario y auditoría de presencia digital","Inspección directa de las diez propiedades digitales con sesión iniciada. Verificación de insignias, biografías literales, fotografías, portadas y enlaces. Reconstrucción de la línea de tiempo desde 2009. Corte: 3 de septiembre de 2026."],["Análisis de Instagram","127 publicaciones clasificadas en dos ventanas independientes (13 jul–2 ago y 13 ago–3 sep), con fecha, hora, formato, me gusta, longitud de copy, hashtags, menciones y emojis. 24 Reels medidos en reproducciones. 14 destacadas y pestaña de etiquetados. Corte: 3 de septiembre de 2026."],["Análisis de TikTok","63 publicaciones recientes con fecha y hora exactas calculadas desde los identificadores internos y verificadas contra un caso conocido. Ranking nativo «Popular» para el histórico completo. Submuestra de 14 piezas con me gusta y comentarios. Corte: 4 de septiembre de 2026."],["Análisis de X","193 publicaciones del periodo marzo–septiembre de 2026, más 17 de contexto, 40 reposts clasificados por origen y 108 respuestas recibidas analizadas por eje temático. Recolección por navegación directa con sesión iniciada. Corte: 3 de septiembre de 2026."],["Análisis de contenido audiovisual","Tres piezas reproducidas en el navegador con enlace de comprobación —programa de escritorio, vídeo-selfie de calle y acto institucional— más la grilla completa del perfil para evaluar coherencia. Corte: 4 de septiembre de 2026."],["Diseño gráfico e identidad visual","Valores cromáticos, familias tipográficas, tamaños base y atributos de accesibilidad obtenidos por consulta directa del código de las páginas, no por apreciación visual. Corte: 5 de septiembre de 2026."],["Oratoria y comunicación no verbal","Reproducción directa con sonido de tres registros: programa en formato escritorio, vídeo-selfie de terreno y recorrido técnico de 92 segundos con equipo de gobierno. Complementado con búsqueda documental sobre su trayectoria comunicacional."],["Métricas y crecimiento","Cifras de seguidores, engagement y visualizaciones de las ocho cuentas por observación directa. Datos históricos de X procedentes de prensa contemporánea a los hechos. Corte: 5 de septiembre de 2026."],["Análisis cruzado de rendimiento","Cruce de los tres conjuntos de datos —382 publicaciones entre X, Instagram y TikTok— para construir el top y bottom del ecosistema completo, la matriz tema × formato × rendimiento y la distribución por pilar. Corte: 3 y 4 de septiembre de 2026."],["Análisis de competidores directos","Selección y ficha de cinco competidores en tres categorías, con datos públicos verificables, ejes narrativos documentados, matriz comparativa y FODA. Corte: 5 de septiembre de 2026."],["Benchmark internacional","Cinco referentes de gobierno subnacional seleccionados por comparabilidad del problema comunicacional, no por notoriedad. Análisis de estrategias narrativas, innovaciones de formato y tendencias vigentes. Corte: 5 de septiembre de 2026."],["Audiencia y comunidad","Análisis cualitativo de las muestras de comentarios de las tres plataformas, patrones de detractores, núcleo de embajadores y construcción de los cuatro perfiles de audiencia con datos reales. Corte: 5 de septiembre de 2026."],["Equipo, procesos y tecnología","Diagnóstico del proceso interno por lectura de la evidencia publicada, medición de la capacidad de producción real, propuesta de estructura de equipo y flujo de trabajo, y cuestionario de verificación interna. Corte: 5 de septiembre de 2026."],["Estudio de presencia digital y reputación","Estudio complementario de seis áreas —YouTube, Facebook, buscadores y las tres escuchas— con diez figuras capturadas en pantalla, treinta enlaces citados y la serie completa de 22 emisiones del programa semanal. Corte: 4 de septiembre de 2026."]],"documentos_headers":["Componente","Base de datos y alcance"],"grupos":[["Componentes del análisis",[]],["Fuentes externas citadas en los documentos originales",[{"t":"OpenSanctions, ficha de entidad — opensanctions.org/entities/Q5496848/","lead":""},{"t":"OFAC, acción del 1 de abril de 2026 — ofac.treasury.gov/recent-actions/20260401","lead":""},{"t":"OFAC, licencia general del 25 de junio de 2026 — ofac.treasury.gov/recent-actions/20260625_33","lead":""},{"t":"Consejo de la UE, nota de prensa del 25 de junio de 2018 — consilium.europa.eu","lead":""},{"t":"Reglamento de Ejecución (UE) 2018/899, EUR-Lex — CELEX 32018R0899 (instrumento: Decisión CELEX 32018D0901)","lead":""},{"t":"InSight Crime, «Guerrilla Governance: The ELN's Social Control in Táchira», 8 de diciembre de 2025","lead":""},{"t":"InSight Crime, «Controversial Venezuela Official Named 'Protector' of Colombia Border State», 6 de febrero de 2018","lead":""},{"t":"Connectas, «Las caras del 'protector' de Maduro en la frontera»","lead":""},{"t":"Transparencia Venezuela, informe CLAP, abril de 2020","lead":""},{"t":"International Crisis Group, «A Glut of Arms: Curbing the Threat to Venezuela from Violent Groups»","lead":""},{"t":"Development and Change (Wiley), «State–Crime Cooperation and Extra-legal Governance in Colombia and Venezuela», 2026","lead":""},{"t":"El Nacional, retiro de retratos de Chávez y Maduro, 2 de junio de 2026","lead":""},{"t":"El Nacional, apagones en Táchira, junio de 2026","lead":""},{"t":"Noticias al Día y a la Hora, notificación a Delcy Rodríguez por apagones","lead":""},{"t":"El Tiempo, señalamiento ante la OEA — «quién es Freddy Bernal, el protector del Táchira»","lead":""},{"t":"La Prensa del Táchira, proclamación ante el CNE, mayo de 2025","lead":""},{"t":"La Opinión (Cúcuta), reelección como gobernador","lead":""},{"t":"Wikipedia, ficha biográfica (en) y cronología de Venezuela 2026","lead":""},{"t":"Gobernación del Táchira — tachira.gob.ve · Sitio personal — freddybernaloficial.com","lead":""}]],["Fuentes primarias pendientes de consulta",[{"t":"Apoyos secundarios que conviene sustituir en una revisión posterior:","lead":""},{"t":"Buscador de listas de OFAC (sanctionssearch.ofac.treas.gov): no respondió durante la elaboración del estudio. Debe consultarse manualmente para dejar constancia del estado exacto de la entrada.","lead":""},{"t":"Diario Oficial de la UE, CELEX 32018D0901: texto íntegro con el motivo individualizado de la designación, que la nota de prensa del Consejo no detalla por persona.","lead":""},{"t":"Titularidad real de la cuenta de Mastodon, estado de bernalfreddy.wordpress.com y fecha exacta de creación del TikTok principal: requieren credenciales internas.","lead":""}]]]},"nota":[{"t":"Los datos de este documento proceden de dos fases de trabajo documentadas en las fuentes originales. Fase documental: sitio oficial, blogs heredados, prensa venezolana y colombiana, registros oficiales de sanciones, publicaciones de organizaciones especializadas y metadatos de perfiles indexados. Fase de inspección: navegación directa a cada perfil con sesión iniciada entre el 3 y el 5 de septiembre de 2026, con captura de pantalla. De ahí proceden todas las cifras de seguidores, biografías, insignias, fotografías, portadas y enlaces.","lead":""},{"t":"Durante la inspección no se realizó ninguna acción sobre las cuentas: no se siguió, comentó, envió mensajes, dio me gusta ni reportó nada, ni en las cuentas propias ni en las de terceros. Los reportes de suplantación y el registro defensivo del handle libre quedan preparados en el plan de acción para que los ejecute el equipo, por ser acciones irreversibles y a nombre del titular.","lead":""},{"t":"Distinción que se mantiene en todo el documento: los HALLAZGOS están verificados con fuente y fecha; las RECOMENDACIONES son interpretación profesional del analista sobre esos hallazgos. Donde un dato no pudo verificarse, se consigna como no verificado en lugar de estimarse. Las proyecciones, cuando aparecen, se presentan como escenarios explícitos con su supuesto declarado.","lead":""},{"t":"Sobre las acusaciones recogidas en el M15 y el M16: todas son señalamientos publicados por fuentes identificables y NO CONSTA CONDENA FIRME sobre ninguna. La distinción entre acusación publicada y hecho probado es deliberada y debe mantenerse en cualquier uso posterior de este material.","lead":""},{"t":"Distinción que se mantiene en todo el documento: los HALLAZGOS están verificados con fuente y fecha; las RECOMENDACIONES son interpretación profesional del analista sobre esos hallazgos.","lead":""},{"t":"Las acusaciones recogidas en el M15 y el M16 son señalamientos publicados por fuentes identificables. No consta condena firme sobre ninguna. La distinción entre acusación publicada y hecho probado es deliberada y debe mantenerse en cualquier uso posterior de este material.","lead":""}],"capturas":[{"figura":1,"modulo":"M01","punto":5,"archivo":"figura-01.png","ancho":850,"alto":300,"pie":"Threads · @freddybernalven. Retrato distinto del que usan X, TikTok, Instagram y Facebook: es la segunda de las cuatro fotografías de perfil que conviven en el ecosistema. 2.686 seguidores, sin biografía y sin enlace. Captura del 4/9/2026."},{"figura":2,"modulo":"M03","punto":1,"archivo":"figura-02.png","ancho":1250,"alto":470,"pie":"TikTok · cuenta alterna @freddybernalvzla. 19.400 seguidores y 108.400 me gusta. La biografía sigue indicando «Candidato a la gobernación del Táchira» quince meses después de la proclamación como gobernador reelecto, y la cuenta principal remite activamente a ella. Captura del 4/9/2026."},{"figura"  Ninguna propiedad controlada por el sujeto aparece como resultado orgánico. Captura del 4/9/2026."},{"figura":9,"modulo":"M07","punto":5,"archivo":"figura-09.png","ancho":540,"alto":620,"pie":"Panel de conocimiento. La ficha de entidad existe y está poblada: Google lo identifica correctamente como «Governor of Táchira». El bloque «Profiles» reconoce Facebook, Instagram, TikTok y X — incluye TikTok, que el propio sitio web del titular no enlaza. Captura del 4/9/2026."},{"figura":10,"modulo":"M16","punto":4,"archivo":"figura-10.png","ancho":890,"alto":368,"pie":"Investigación de InSight Crime del 8 de diciembre de 2025 sobre el control social del ELN en Táchira, firmada por su unidad de investigación sobre Venezuela. Es la pieza internacional más reciente que involucra al sujeto. Captura del 4/9/2026."}],"graficos":[{"id":"g1","tipo":"tiles+barh","modulo":null,"punto":null,"titulo":"La audiencia declarada y la comunidad real no son la misma cifra","subtitulo":"De 1.166.000 seguidores en las tres plataformas principales, unas 1.700 personas interactúan por ciclo de publicación.","nota":"Comunidad activa como porcentaje de la audiencia declarada · TikTok genera 17 veces más interacción que X con la mitad de seguidores.","eje":"Comunidad activa como porcentaje de la audiencia declarada (ratio interacciones/seguidores, en %)","tiles":[{"valor":"1.166.000","etiqueta":"seguidores en X, Instagram y TikTok","detalle":""},{"valor":"1.712","etiqueta":"personas que interactúan por ciclo","detalle":""},{"valor":"0,147 %","etiqueta":"de la audiencia es comunidad activa","detalle":""}],"paneles":[{"nombre":"","unidad":"% de la audiencia declarada (comunidad activa / seguidores)","barras":[{"cat":"X","valor":0.009,"etiqueta":"0,009 %","detalle":"602.800 seg.","destaca":"B","color":"dim"},{"cat":"Instagram","valor":0.264,"etiqueta":"0,264 %","detalle":"244.000 seg.","destaca":"","color":"blue"},{"cat":"TikTok","valor":0.32,"etiqueta":"0,320 %","detalle":"319.200 seg.","destaca":"A", <script>
'use strict';

const DATA = JSON.parse(document.getElementById('datos').textContent);
const SERVIDOR = (function(){
  const el = document.getElementById('servidor');
  try { return el ? JSON.parse(el.textContent) : null; } catch (e){ return null; }
})();
const IMGS = JSON.parse(document.getElementById('capturas-b64').textContent);

/* ---------------- utilidades ---------------- */
const $  = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.prototype.slice.call((r || document).querySelectorAll(s));

function esc(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}
function norm(s){
  return String(s == null ? '' : s)
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
}
function slug(s){
  return norm(s).replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');
}

/* almacenamiento tolerante: si no hay localStorage, el informe sigue funcionando */
const Store = {
  get(k, d){
    try{ const v = localStorage.getItem(k); return v === null ? d : JSON.parse(v); }
    catch(e){ return d; }
  },
  set(k, v){
    try{ localStorage.setItem(k, JSON.stringify(v)); return true; }
    catch(e){ return false; }
  }
};

/* ---------------- vocabularios cerrados ---------------- */
const CLASE_PRIORIDAD = {
  'CRÍTICA':'p-critica', 'ALTA':'p-alta', 'MEDIA':'p-media', 'BAJA':'p-baja', '—':'p-info'
};
const ORDEN_PRIORIDAD = ['CRÍTICA','ALTA','MEDIA','BAJA','—'];
const CLASE_ESTADO = {
  'VERIFICADO':'e-verde',
  'ENTREGADO':'e-verde',
  'DIAGNÓSTICO POR EVIDENCIA':'e-marino',
  'HALLAZGO ESTRUCTURAL':'e-marino',
  'DATO INTERNO DE LA CUENTA':'e-dorado',
  'REQUIERE MONITORIZACIÓN CONTINUA':'e-dorado',
  'REQUIERE MATERIAL ORIGINAL':'e-dorado',
  'FASE 2 — PROFUNDIZACIÓN':'e-dorado',
  'EXCLUIDO POR CRITERIO PROFESIONAL':'e-gris'
};
const COLOR_PRIORIDAD = {
  'CRÍTICA':'var(--red)', 'ALTA':'var(--orange)', 'MEDIA':'var(--blue)',
  'BAJA':'var(--aqua)', '—':'var(--dim)'
};

/* definiciones de estado, tomadas literalmente de «Cómo leer este documento» */
const DEF_ESTADO = {};
(DATA.como_leer || []).forEach(function(sec){
  (sec[1] || []).forEach(function(p){
    if (p.lead) DEF_ESTADO[p.lead.replace(/[.:—\s]+$/,'').trim()] = p.t;
  });
});

/* ---------------- índice de búsqueda ---------------- */
const PUNTOS = [];
DATA.modulos.forEach(function(m){
  m.puntos.forEach(function(p){
    const partes = [p.punto, p.accion];
    (p.hallazgo || []).forEach(function(h){ partes.push(h.t); });
    if (p.tabla){
      partes.push(p.tabla.headers.join(' '));
      p.tabla.rows.forEach(function(r){ partes.push(r.join(' ')); });
    }
    PUNTOS.push({
      id: m.id.toLowerCase() + '-p' + p.n,
      modulo: m.id, n: p.n,
      estado: p.estado, prioridad: p.prioridad,
      texto: norm(partes.join(' \u00b7 '))
    });
  });
});

const CAPTURA_DE = {};
(DATA.capturas || []).forEach(function(c){
  const k = c.modulo + '-' + c.punto;
  (CAPTURA_DE[k] = CAPTURA_DE[k] || []).push(c);
});
const GRAFICO_DE = {};
(DATA.graficos || []).forEach(function(g){
  if (g.modulo && g.punto) GRAFICO_DE[g.modulo + '-' + g.punto] = g;
});

/* recuento de prioridades por módulo (no viene precalculado) */
const CUENTA = {};
DATA.modulos.forEach(function(m){
  const c = {'CRÍTICA':0,'ALTA':0,'MEDIA':0,'BAJA':0,'—':0};
  m.puntos.forEach(function(p){ if (c[p.prioridad] !== undefined) c[p.prioridad]++; });
  CUENTA[m.id] = c;
});

/* =========================================================================
   Render de texto
   ========================================================================= */

/* Un párrafo de hallazgo: la entradilla en versalitas va en negrita.
   'lead' es el prefijo exacto que el documento original marca en negrita. */
function parrafo(p){
  const t = p && p.t ? p.t : '';
  const lead = p && p.lead ? p.lead : '';
  if (lead && t.indexOf(lead) === 0){
    return '<p><b class="lead">' + esc(lead) + '</b>' + esc(t.slice(lead.length)) + '</p>';
  }
  return '<p>' + esc(t) + '</p>';
}
function prosa(ps){
  return '<div class="prosa">' + (ps || []).map(parrafo).join('') + '</div>';
}

function tablaHTML(t){
  if (!t) return '';
  let h = '<div class="tabla-caja"><table><thead><tr>';
  t.headers.forEach(function(c){ h += '<th>' + esc(c) + '</th>'; });
  h += '</tr></thead><tbody>';
  t.rows.forEach(function(r){
    h += '<tr>';
    r.forEach(function(c){ h += '<td>' + esc(c) + '</td>'; });
    h += '</tr>';
  });
  return h + '</tbody></table></div>';
}

function badgePrioridad(v){
  return '<span class="badge ' + (CLASE_PRIORIDAD[v] || 'p-info') + '" data-tip-t="Prioridad" data-tip-d="' +
    esc(v) + '">' + esc(v === '—' ? '— informativo' : v) + '</span>';
}
function badgeEstado(v){
  const def = DEF_ESTADO[v] || '';
  return '<a class="badge ' + (CLASE_ESTADO[v] || 'e-gris') + '" href="#como-leer"' +
    ' data-tip-t="' + esc(v) + '" data-tip-d="' + esc(def || 'Tipo de evidencia. Ver «Cómo leer este informe».') + '">' +
    esc(v) + '</a>';
}

/* =========================================================================
   Gráficos — SVG a mano, sin librerías
   ========================================================================= */

const VB = 1000;

function ejeMax(vals){
  const m = Math.max.apply(null, vals.map(Math.abs).concat([0]));
  if (m <= 0) return 1;
  const exp = Math.pow(10, Math.floor(Math.log(m) / Math.LN10));
  const paso = m / exp <= 2 ? exp / 2 : (m / exp <= 5 ? exp : exp * 2);
  return Math.ceil(m / paso) * paso;
}

/* Ancho aproximado de una cadena en unidades del viewBox. No hace falta
   precision tipografica: solo dimensionar la columna de etiquetas. */
function anchoTexto(s, tam){
  let w = 0;
  for (let i = 0; i < s.length; i++){
    const ch = s[i];
    if (/[A-ZÁÉÍÓÚÑÜ0-9@#%&]/.test(ch)) w += tam * 0.72;
    else if (/[iljtfr.,'·:;!| ]/.test(ch)) w += tam * 0.34;
    else if (/[mwMW]/.test(ch)) w += tam * 0.88;
    else w += tam * 0.58;
  }
  return w;
}
function recortar(s, maxW, tam){
  if (anchoTexto(s, tam) <= maxW) return s;
  let t = s;
  while (t.length > 3 && anchoTexto(t + '…', tam) > maxW) t = t.slice(0, -1);
  return t.replace(/[\s·,.\-–—]+$/, '') + '…';
}

/* El color de cada barra se midio sobre el PNG original, pixel a pixel:
   es el del grafico del informe, no una interpretacion. */
const COLOR_BARRA = {
  blue:'var(--blue)', orange:'var(--orange)', aqua:'var(--aqua)',
  red:'var(--red)', dim:'var(--barra-base)', base:'var(--barra-base)',
  navy:'var(--texto)'
};
function colorBarra(b){
  if (b.color && COLOR_BARRA[b.color]) return COLOR_BARRA[b.color];
  if (b.destaca === 'A') return 'var(--aqua)';
  if (b.destaca === 'B') return 'var(--red)';
  return 'var(--barra-base)';
}

function tipAttrs(b, unidad){
  return ' data-tip-t="' + esc(b.cat) + '"' +
         ' data-tip-v="' + esc(b.etiqueta + (unidad ? ' ' + unidad : '')) + '"' +
         (b.detalle ? ' data-tip-d="' + esc(b.detalle) + '"' : '');
}

/* Panel de barras horizontales. Devuelve {svg, alto}. */
function panelBarras(panel, opts){
  opts = opts || {};
  const barras = panel.barras || [];
  const TAM_CAT = 13, TAM_DET = 11.5;
  let anchoLbl = opts.anchoLbl;
  if (anchoLbl == null){
    let mx = 0;
    barras.forEach(function(b){
      mx = Math.max(mx, anchoTexto(b.cat || '', TAM_CAT));
      if (b.detalle) mx = Math.max(mx, anchoTexto(b.detalle, TAM_DET));
    });
    anchoLbl = Math.min(opts.maxLbl != null ? opts.maxLbl : 360, Math.max(110, mx + 16));
  }
  const x0 = opts.x0 != null ? opts.x0 : 0;
  const ancho = opts.ancho != null ? opts.ancho : VB;
  const rowH = opts.rowH != null ? opts.rowH : 30;
  const gap = opts.gap != null ? opts.gap : 9;
  const divergente = !!opts.divergente;
  /* hueco para la etiqueta de valor, segun la etiqueta mas larga del panel */
  let finEtiqueta = 26;
  barras.forEach(function(b){
    finEtiqueta = Math.max(finEtiqueta, anchoTexto(b.etiqueta || '', 13) + 20);
  });
  finEtiqueta = Math.min(finEtiqueta, 130);
  const bx = x0 + anchoLbl;                      // inicio del área de barras
  const bw = ancho - anchoLbl - finEtiqueta;

  let y = opts.y0 || 0;
  let s = '';

  let dominio = barras.map(function(b){ return b.valor; });
  if (panel.banda) dominio = dominio.concat([panel.banda.min, panel.banda.max]);
  const max = opts.max != null ? opts.max : ejeMax(dominio);
  const cero = divergente ? bx + bw / 2 : bx;
  const escala = divergente ? (bw / 2) / max : bw / max;

  if (panel.nombre){
    s += '<text class="panel-tit" x="' + x0 + '" y="' + (y + 11) + '">' + esc(panel.nombre) + '</text>';
    y += 26;
  }

  const yTop = y;
  const alturaBarras = barras.length * (rowH + gap) - gap;

  /* rejilla discreta */
  const nT = divergente ? 4 : 4;
  for (let i = 0; i <= nT; i++){
    const v = divergente ? (-max + (2 * max * i) / nT) : (max * i) / nT;
    const gx = cero + v * escala;
    s += '<line class="rejilla" x1="' + gx.toFixed(1) + '" y1="' + yTop +
         '" x2="' + gx.toFixed(1) + '" y2="' + (yTop + alturaBarras) + '"/>';
  }
  if (divergente){
    s += '<line class="eje" x1="' + cero + '" y1="' + yTop + '" x2="' + cero +
         '" y2="' + (yTop + alturaBarras) + '"/>';
  }

  /* banda de referencia sombreada, detrás de las barras */
  if (panel.banda){
    const b1 = cero + panel.banda.min * escala;
    const b2 = cero + panel.banda.max * escala;
    s += '<rect class="banda" x="' + Math.min(b1,b2).toFixed(1) + '" y="' + yTop +
         '" width="' + Math.abs(b2-b1).toFixed(1) + '" height="' + alturaBarras + '"/>';
    if (panel.banda.etiqueta){
      s += '<text class="det" x="' + ((b1+b2)/2).toFixed(1) + '" y="' + (yTop - 6) +
           '" text-anchor="middle">' + esc(panel.banda.etiqueta) + '</text>';
    }
  }

  barras.forEach(function(b){
    const v = b.valor || 0;
    const w = Math.abs(v) * escala;
    const bxi = v < 0 ? cero - w : cero;
    const cy = y + rowH / 2;

    s += '<g class="barra"' + tipAttrs(b, panel.unidad) + '>';
    /* pista de fondo, casi invisible */
    s += '<rect x="' + bx + '" y="' + y + '" width="' + (bw) + '" height="' + rowH +
         '" fill="transparent"/>';
    s += '<rect class="b" x="' + bxi.toFixed(1) + '" y="' + y + '" width="' + Math.max(w,1).toFixed(1) +
         '" height="' + rowH + '" fill="' + colorBarra(b) + '" rx="1"/>';

    /* etiqueta de categoría */
    s += '<text class="cat" data-max="' + (anchoLbl - 14).toFixed(0) + '" x="' + (x0 + anchoLbl - 12) +
         '" y="' + (cy + 4.5) + '" text-anchor="end">' + esc(b.cat || '') + '</text>';

    /* etiqueta de valor, directamente sobre la barra */
    const vx = v < 0 ? bxi - 8 : bxi + w + 8;
    const anc = v < 0 ? 'end' : 'start';
    s += '<text class="val" x="' + vx.toFixed(1) + '" y="' + (cy + 4.5) +
         '" text-anchor="' + anc + '">' + esc(b.etiqueta) + '</text>';

    if (b.detalle){
      s += '<text class="det" data-max="' + (anchoLbl - 14).toFixed(0) + '" x="' + (x0 + anchoLbl - 12) +
           '" y="' + (cy + 17) + '" text-anchor="end">' + esc(b.detalle) + '</text>';
    }
    s += '</g>';
    y += rowH + gap;
  });

  return { svg: s, alto: y - (opts.y0 || 0) - gap };
}

/* g4 — tres paneles con columna vertical y banda de referencia sombreada
   detras, tal y como esta en la figura original. Cada panel lleva su propia
   escala: las tres metricas no son comparables entre si. */
function panelesConBanda(g){
  const paneles = g.paneles || [];
  const n = paneles.length || 1;
  const HUECO = 38;
  const ANCHO = (VB - HUECO * (n - 1)) / n;
  const Y_TIT = 13, Y_TOP = 54, ALTO = 186;
  const Y_BASE = Y_TOP + ALTO;
  let s = '';

  paneles.forEach(function(p, i){
    const x0 = i * (ANCHO + HUECO);
    const b = (p.barras || [])[0];
    if (!b) return;
    let dominio = [b.valor];
    if (p.banda) dominio = dominio.concat([p.banda.min, p.banda.max]);
    const max = ejeMax(dominio);
    const k = ALTO / max;

    s += '<text class="panel-tit" x="' + (x0 + ANCHO / 2).toFixed(1) + '" y="' + Y_TIT +
         '" text-anchor="middle">' + esc(p.nombre) + '</text>';

    /* banda de referencia, detras de la columna */
    if (p.banda){
      const yA = Y_BASE - p.banda.max * k;
      const yB = Y_BASE - p.banda.min * k;
      s += '<rect class="banda" x="' + x0.toFixed(1) + '" y="' + yA.toFixed(1) +
           '" width="' + ANCHO.toFixed(1) + '" height="' + Math.max(yB - yA, 3).toFixed(1) + '"/>';
      if (p.banda.etiqueta){
        const m = p.banda.etiqueta.match(/^(\S+)\s+(.+)$/);
        const yc = (yA + yB) / 2;
        const xe = x0 + ANCHO - 12;
        if (m){
          s += '<text class="det" x="' + xe.toFixed(1) + '" y="' + (yc - 2).toFixed(1) +
               '" text-anchor="end">' + esc(m[1]) + '</text>';
          s += '<text class="det" x="' + xe.toFixed(1) + '" y="' + (yc + 14).toFixed(1) +
               '" text-anchor="end">' + esc(m[2]) + '</text>';
        } else {
          s += '<text class="det" x="' + xe.toFixed(1) + '" y="' + (yc + 5).toFixed(1) +
               '" text-anchor="end">' + esc(p.banda.etiqueta) + '</text>';
        }
      }
    }

    /* la columna */
    const cw = ANCHO * 0.30;
    const cx = x0 + ANCHO * 0.13;
    const h = Math.max(b.valor * k, 3);
    const cy = Y_BASE - h;
    s += '<g class="barra"' + tipAttrs(b, p.unidad) + '>' +
         '<rect class="b" x="' + cx.toFixed(1) + '" y="' + cy.toFixed(1) +
         '" width="' + cw.toFixed(1) + '" height="' + h.toFixed(1) +
         '" fill="' + colorBarra(b) + '"/></g>';

    /* etiqueta de valor, justo encima de la columna */
    s += '<text class="val val-col" x="' + cx.toFixed(1) + '" y="' + (cy - 11).toFixed(1) +
         '">' + esc(b.etiqueta) + '</text>';

    /* linea de base */
    s += '<line class="eje" x1="' + x0.toFixed(1) + '" y1="' + Y_BASE +
         '" x2="' + (x0 + ANCHO).toFixed(1) + '" y2="' + Y_BASE + '"/>';

    /* bajo la base: que mide y como sale. El texto es literal; solo se parte
       en dos lineas por el separador que ya trae. */
    const partes = (b.detalle || '').split(' · ');
    if (partes[0]){
      s += '<text class="det" x="' + (x0 + ANCHO / 2).toFixed(1) + '" y="' + (Y_BASE + 21) +
           '" text-anchor="middle">' + esc(partes[0]) + '</text>';
    }
    if (partes[1]){
      s += '<text class="veredicto" x="' + (x0 + ANCHO / 2).toFixed(1) + '" y="' + (Y_BASE + 41) +
           '" text-anchor="middle" fill="' + colorBarra(b) + '">' + esc(partes[1]) + '</text>';
    }
  });

  return svgEnvoltorio(s, Y_BASE + 52);
}

function svgEnvoltorio(inner, alto){
  return '<svg viewBox="0 0 ' + VB + ' ' + Math.ceil(alto) + '" preserveAspectRatio="xMidYMid meet" ' +
         'role="img" xmlns="http://www.w3.org/2000/svg">' + inner + '</svg>';
}

function dibujarGrafico(g){
  const paneles = g.paneles || [];
  let inner = '', alto = 0;

  if (g.tipo === 'barhDoble' && paneles.length >= 2){
    const anchoPanel = VB / 2 - 18;
    const a = panelBarras(paneles[0], {x0:0, ancho:anchoPanel, maxLbl:200, rowH:26, gap:8});
    const b = panelBarras(paneles[1], {x0:VB/2 + 18, ancho:anchoPanel, maxLbl:160, rowH:26, gap:8});
    inner = a.svg + b.svg;
    alto = Math.max(a.alto, b.alto) + 12;

  } else if (g.tipo === 'panelesConBanda'){
    return panelesConBanda(g);

  } else if (g.tipo === 'barh+composicion' && paneles.length >= 2){
    const a = panelBarras(paneles[0], {x0:0, ancho:VB*0.63, maxLbl:250, rowH:22, gap:6});
    const b = panelBarras(paneles[1], {x0:VB*0.63 + 26, ancho:VB*0.37 - 26, maxLbl:180, rowH:26, gap:9});
    inner = a.svg + b.svg;
    alto = Math.max(a.alto, b.alto) + 12;

  } else if (g.tipo === 'divergente'){
    const r = panelBarras(paneles[0] || {barras:[]}, {x0:0, ancho:VB, maxLbl:330, rowH:30, gap:10, divergente:true});
    inner = r.svg; alto = r.alto + 12;

  } else if (g.tipo === 'apiladaPorModulo'){
    return dibujarApilada(g);

  } else {
    let y = 0;
    paneles.forEach(function(p){
      const r = panelBarras(p, {x0:0, ancho:VB, maxLbl:380, rowH:30, gap:10, y0:y});
      inner += r.svg;
      y += r.alto + 30;
    });
    alto = y + 6;
  }

  return svgEnvoltorio(inner, alto);
}

/* g9 — dos paneles: la distribucion de prioridades modulo a modulo y el
   total del diagnostico. Los recuentos NO vienen precalculados: se cuentan
   aqui sobre modulos[].puntos[].prioridad. */
function dibujarApilada(g){
  const ROW = 22, GAP = 7;
  const ANCHO_IZQ = VB * 0.56, X_DER = VB * 0.615;
  const LBL_IZQ = 52, FIN_IZQ = 52;
  const bxI = LBL_IZQ, bwI = ANCHO_IZQ - LBL_IZQ - FIN_IZQ;
  const total = DATA.modulos.reduce(function(a, m){ return a + m.puntos.length; }, 0);
  const maxTot = Math.max.apply(null, DATA.modulos.map(function(m){ return m.puntos.length; }));

  let s = '', y = 0;
  s += '<text class="panel-tit" x="0" y="11">Puntos por módulo</text>';
  s += '<text class="panel-tit" x="' + X_DER + '" y="11">Total del diagnóstico</text>';
  y = 34;

  const yTop = y;
  DATA.modulos.forEach(function(m){
    const c = CUENTA[m.id];
    const n = m.puntos.length;
    let x = bxI;
    const cy = y + ROW / 2;
    s += '<text class="cat" x="' + (LBL_IZQ - 12) + '" y="' + (cy + 4.5) +
         '" text-anchor="end">' + esc(m.id) + '</text>';
    ORDEN_PRIORIDAD.forEach(function(pr){
      const k = c[pr];
      if (!k) return;
      const w = (k / maxTot) * bwI;
      s += '<g class="barra" data-tip-t="' + esc(m.id + ' · ' + m.titulo) + '"' +
           ' data-tip-v="' + k + (k === 1 ? ' punto ' : ' puntos ') +
           esc(pr === '—' ? 'informativos' : 'de prioridad ' + pr.toLowerCase()) + '"' +
           ' data-tip-d="' + n + ' puntos en el módulo">' +
           '<rect class="b" x="' + x.toFixed(1) + '" y="' + y + '" width="' + Math.max(w, 1).toFixed(1) +
           '" height="' + ROW + '" fill="' + COLOR_PRIORIDAD[pr] + '"/></g>';
      x += w;
    });
    s += '<text class="tick" x="' + (x + 9).toFixed(1) + '" y="' + (cy + 4.5) + '">' + n + '</text>';
    y += ROW + GAP;
  });
  const yFinIzq = y;

  /* panel derecho: el total por prioridad */
  const LBL_DER = 104, FIN_DER = 104;
  const bxD = X_DER + LBL_DER;
  const bwD = VB - bxD - FIN_DER;
  const maxPr = Math.max.apply(null, ORDEN_PRIORIDAD.map(function(pr){ return CUENTA_TOTAL[pr]; }));
  const alto = 54, hueco = (yFinIzq - yTop - 5 * alto) / 4;
  let yd = yTop;
  ORDEN_PRIORIDAD.forEach(function(pr){
    const n = CUENTA_TOTAL[pr];
    const w = (n / maxPr) * bwD;
    const pct = Math.round(n / total * 100);
    const cy = yd + alto / 2;
    s += '<text class="cat" x="' + (bxD - 12) + '" y="' + (cy + 4.5) + '" text-anchor="end">' +
         esc(pr === '—' ? 'Informativo' : pr) + '</text>';
    s += '<g class="barra" data-tip-t="' + esc(pr === '—' ? 'Informativo · sin corrección' : pr) + '"' +
         ' data-tip-v="' + n + ' de ' + total + ' puntos · ' + pct + ' %">' +
         '<rect class="b" x="' + bxD + '" y="' + yd + '" width="' + Math.max(w, 1).toFixed(1) +
         '" height="' + alto + '" fill="' + COLOR_PRIORIDAD[pr] + '"/></g>';
    s += '<text class="val" x="' + (bxD + w + 10).toFixed(1) + '" y="' + (cy + 4.5) + '">' +
         n + '   (' + pct + ' %)</text>';
    yd += alto + hueco;
  });

  /* leyenda: cinco series apiladas la hacen imprescindible */
  y += 16;
  let lx = 0;
  ORDEN_PRIORIDAD.forEach(function(pr){
    const et = pr === '—' ? 'Informativo' : pr.charAt(0) + pr.slice(1).toLowerCase();
    s += '<rect x="' + lx + '" y="' + (y - 9) + '" width="10" height="10" fill="' +
         COLOR_PRIORIDAD[pr] + '"/>';
    s += '<text class="tick" x="' + (lx + 15) + '" y="' + y + '">' + esc(et) + '</text>';
    lx += 25 + anchoTexto(et, 11) + 22;
  });
  y += 10;

  return svgEnvoltorio(s, Math.max(y, yd + 6));
}

/* La estimacion de ancho sirve para dimensionar la columna; el recorte
   definitivo se hace midiendo el texto ya renderizado, que es exacto. */
function ajustarEtiquetas(raiz){
  const textos = (raiz || document).querySelectorAll('figure.gr svg text[data-max]');
  for (let i = 0; i < textos.length; i++){
    const t = textos[i];
    const max = parseFloat(t.getAttribute('data-max'));
    const completo = t.getAttribute('data-full') || t.textContent;
    t.setAttribute('data-full', completo);
    t.textContent = completo;
    let largo;
    try { largo = t.getComputedTextLength(); } catch (e) { continue; }
    if (largo <= max) continue;
    let lo = 0, hi = completo.length;
    while (lo < hi){
      const mid = Math.ceil((lo + hi) / 2);
      t.textContent = completo.slice(0, mid) + '…';
      if (t.getComputedTextLength() <= max) lo = mid; else hi = mid - 1;
    }
    t.textContent = completo.slice(0, lo).replace(/[\s·,.\-–—]+$/, '') + '…';
    /* la etiqueta recortada mantiene el texto integro en el tooltip */
    const g = t.closest('g.barra');
    if (g && !g.getAttribute('data-tip-d')) g.setAttribute('data-tip-d', completo);
  }
}

function graficoHTML(g){
  if (!g) return '';
  let h = '<figure class="gr" id="grafico-' + esc(g.id) + '">';
  h += '<div class="gr-cab"><h4>' + esc(g.titulo) + '</h4>';

    h += '<div class="gr-tiles">';
    g.tiles.forEach(function(t){
      h += '<div class="gr-tile"><b>' + esc(t.valor) + '</b><span>' + esc(t.etiqueta) + '</span>' +
           (t.detalle ? '<em>' + esc(t.detalle) + '</em>' : '') + '</div>';

    h += '</div>';
  }
  h += dibujarGrafico(g);
  if (g.nota) h += '<figcaption class="gr-nota">' + esc(g.nota) + '</figcaption>';
  return h + '</figure>';
}

/* ---------------- búsqueda y filtrado ---------------- */
const estado = { q:'', prioridad:new Set(), estado:new Set() };
/* Filtrar oculta puntos y encoge el documento, así que el navegador recorta la
   posición de lectura y quitar la búsqueda te lanzaría al principio del
   informe. Se ancla a un elemento concreto —no a una coordenada, que no
   sobrevive al cambio de altura— y se devuelve al limpiar. */
let filtrandoAntes = false, anclaGuardada = null;

function anclaVisible(){
  const els = $$('.modulo, .punto');
  for (let i = 0; i < els.length; i++){
    const el = els[i];
    if (el.hidden || !el.id) continue;
    const r = el.getBoundingClientRect();
    if (r.bottom > 90) return { id: el.id, off: r.top };
  }
  return null;
}
function devuelveAncla(a){
  if (!a) return;
  const el = document.getElementById(a.id);
  if (!el || el.hidden) return;
  scrollBy(0, el.getBoundingClientRect().top - a.off);
}
let tarjetas = null;
const resaltadas = new Set();

function indexarTarjetas(){
  tarjetas = {};
  $$('.punto').forEach(function(el){ tarjetas[el.id] = el; });
}

function resaltar(el, q){
  if (!q) return;
  const nq = norm(q);
  const walker = document.createTreeWalker(el, NodeFilter.SHOW_TEXT, {
    acceptNode: function(n){
      if (!n.nodeValue.trim()) return NodeFilter.FILTER_REJECT;
      const p = n.parentNode.nodeName;
      if (p === 'SCRIPT' || p === 'STYLE' || p === 'MARK') return NodeFilter.FILTER_REJECT;
      /* mientras se edita, el resaltado no entra en los bloques escribibles:
         el <mark> acabaría dentro del texto guardado */
      if (typeof EDITANDO !== 'undefined' && EDITANDO &&
          n.parentElement && n.parentElement.closest('.zona')) return NodeFilter.FILTER_REJECT;
      return NodeFilter.FILTER_ACCEPT;
    }
  });
  const objetivos = [];
  let n;
  while ((n = walker.nextNode())) {
    if (norm(n.nodeValue).indexOf(nq) !== -1) objetivos.push(n);
  }
  objetivos.forEach(function(nodo){
    const texto = nodo.nodeValue;
    const base = norm(texto);
    const frag = document.createDocumentFragment();
    let i = 0, k;
    while ((k = base.indexOf(nq, i)) !== -1){
      if (k > i) frag.appendChild(document.createTextNode(texto.slice(i, k)));
      const mk = document.createElement('mark');
      mk.textContent = texto.slice(k, k + nq.length);
      frag.appendChild(mk);
      i = k + nq.length;
    }
    if (i < texto.length) frag.appendChild(document.createTextNode(texto.slice(i)));
    nodo.parentNode.replaceChild(frag, nodo);
  });
}

function quitarResaltado(el){
  const marcas = el.querySelectorAll('mark');
  if (!marcas.length) return;
  for (let i = 0; i < marcas.length; i++){
    const m = marcas[i];
    m.parentNode.replaceChild(document.createTextNode(m.textContent), m);
  }
  el.normalize();
}

function aplicar(){
  const q = norm(estado.q.trim());
  const fp = estado.prioridad, fe = estado.estado;
  const filtrando = !!(q || fp.size || fe.size);

  /* el ancla se toma antes de ocultar nada: después el navegador ya ha
     recortado la posición de lectura y no hay qué recuperar */
  if (filtrando && !filtrandoAntes) anclaGuardada = anclaVisible();

  let nP = 0;
  const modulosVivos = new Set();

  PUNTOS.forEach(function(p){
    let ok = true;
    if (fp.size && !fp.has(p.prioridad)) ok = false;
    if (ok && fe.size && !fe.has(p.estado)) ok = false;
    if (ok && q && p.texto.indexOf(q) === -1) ok = false;

    const el = tarjetas[p.id];
    if (!el) return;

    /* el resaltado se hace y se deshace sobre nodos de texto: nunca se
       reconstruye el HTML, para no volver a decodificar las capturas */
    if (resaltadas.has(p.id)){ quitarResaltado(el); resaltadas.delete(p.id); }

    el.hidden = !ok;
    if (ok){
      nP++;
      modulosVivos.add(p.modulo);
      if (q){ resaltar(el, estado.q.trim()); resaltadas.add(p.id); }
    }
  });

  $$('.modulo').forEach(function(m){
    m.hidden = !modulosVivos.has(m.id.toUpperCase());
  });
  $$('.t-modulos tbody tr[data-ir]').forEach(function(tr){
    tr.style.opacity = modulosVivos.has(tr.dataset.ir.toUpperCase()) ? '' : '.34';
  });

  if (!filtrando && filtrandoAntes && anclaGuardada){
    const a = anclaGuardada;
    anclaGuardada = null;
    /* dos cuadros: el primero deja que el navegador rehaga el alto */
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ devuelveAncla(a); }); });
  }
  filtrandoAntes = filtrando;

  $('#sin-resultados').hidden = nP !== 0 || !filtrando;
  $('#contador').innerHTML = '<b>' + nP + '</b> de ' + DATA.meta.total_puntos + ' puntos' +
    (filtrando ? ' · ' + modulosVivos.size + ' de ' + DATA.meta.total_modulos + ' módulos' : '');
  $('#limpiar-todo').hidden = !filtrando;

  /* cuántos filtros hay puestos, para el botón del móvil */
  const nf = fp.size + fe.size;
  const marca = $('#n-filtros');
  if (marca){ marca.hidden = !nf; marca.textContent = nf; }
}

const CLAVE = 'fb360.plan.v1';
function initPlan(){
  const guardado = Store.get(CLAVE, {}) || {};
  $$('input[data-tarea]').forEach(function(cb){
    cb.checked = !!guardado[cb.dataset.tarea];
    cb.closest('.tarea').classList.toggle('hecha', cb.checked);
    cb.addEventListener('change', function(){
      const g = Store.get(CLAVE, {}) || {};
      if (cb.checked) g[cb.dataset.tarea] = 1; else delete g[cb.dataset.tarea];
      Store.set(CLAVE, g);
      cb.closest('.tarea').classList.toggle('hecha', cb.checked);
      progreso();
    });
  });
  progreso();
}
function progreso(){
  const todas = $$('input[data-tarea]');
  const hechas = todas.filter(function(c){ return c.checked; }).length;
  const pct = todas.length ? Math.round(hechas / todas.length * 100) : 0;
  $('#pg-n').textContent = hechas;
  $('#pg-b').style.width = pct + '%';
  $('#pg-p').textContent = pct + '%';

  DATA.plan.forEach(function(bl, bi){
    const cbs = $$('.tarea[data-bloque="' + bi + '"] input');
    const n = cbs.filter(function(c){ return c.checked; }).length;
    const b = $('[data-bp="' + bi + '"]');
    if (b) b.style.width = (cbs.length ? n / cbs.length * 100 : 0) + '%';
    const t = $('[data-bn="' + bi + '"]');
    if (t) t.textContent = n + ' / ' + cbs.length;
  });
}

/* ---------------- tooltip ---------------- */
function initTooltip(){
  const tip = $('#tip');
  let visible = false;
  document.addEventListener('mouseover', function(e){
    const el = e.target.closest ? e.target.closest('[data-tip-t]') : null;
    if (!el){ if (visible){ tip.style.opacity = 0; visible = false; } return; }
    let h = '<b>' + esc(el.dataset.tipT) + '</b>';
    if (el.dataset.tipV) h += esc(el.dataset.tipV);
    if (el.dataset.tipD) h += '<i>' + esc(el.dataset.tipD) + '</i>';
    tip.innerHTML = h;
    tip.style.opacity = 1;
    visible = true;
  });
  document.addEventListener('mousemove', function(e){
    if (!visible) return;
    const r = tip.getBoundingClientRect();
    let x = e.clientX + 14, y = e.clientY + 16;
    if (x + r.width > innerWidth - 8) x = e.clientX - r.width - 14;
    if (y + r.height > innerHeight - 8) y = e.clientY - r.height - 12;
    tip.style.left = x + 'px';
    tip.style.top = y + 'px';
  });
  document.addEventListener('mouseout', function(e){
    if (!e.relatedTarget || !e.relatedTarget.closest || !e.relatedTarget.closest('[data-tip-t]')){
      tip.style.opacity = 0; visible = false;
    }
  });
}

function initLightbox(){
  const lb = $('#lightbox'), img = $('#lb-img'), cap = $('#lb-cap');
  let previo = null;
  document.addEventListener('click', function(e){
    const t = e.target;
    if (t.tagName === 'IMG' && t.dataset.fig){
      previo = t;
      img.src = t.src; img.alt = t.alt;
      cap.textContent = t.alt;
      lb.classList.add('abierto');
      $('#lb-cerrar').focus();
    }
  });
  function cerrar(){
    lb.classList.remove('abierto');
    img.src = '';
    if (previo) previo.focus();
  }
  lb.addEventListener('click', function(e){ if (e.target === lb || e.target.id === 'lb-cerrar') cerrar(); });
  document.addEventListener('keydown', function(e){
    if (e.key === 'Escape' && lb.classList.contains('abierto')) cerrar();
  });
}

/* ---------------- enlaces profundos ---------------- */
function initHash(){
  let ultimo = location.hash;
  const obs = new IntersectionObserver(function(ents){
    ents.forEach(function(en){
      if (!en.isIntersecting) return;
      const h = '#' + en.target.id;
      if (h !== ultimo){
        ultimo = h;
        history.replaceState(null, '', h);
        marcarNav(en.target.id);
      }
    });
  }, { rootMargin: '-70px 0px -75% 0px', threshold: 0 });

  $$('.punto, .modulo, .seccion, .portada').forEach(function(el){ if (el.id) obs.observe(el); });

  if (location.hash){
    const el = document.getElementById(location.hash.slice(1));
    if (el) setTimeout(function(){ el.scrollIntoView(); }, 40);
  }
}
function marcarNav(id){
  const base = id.split('-p')[0];
  $$('.nav-a').forEach(function(a){
    a.classList.toggle('activo', a.getAttribute('href') === '#' + base || a.getAttribute('href') === '#' + id);
  });
}
