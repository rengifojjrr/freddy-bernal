ESTE CONTEXTO."},{"t":"LA RECOMENDACIÓN ÚNICA, SI SOLO SE PUDIERA HACER UNA: explotar el eje binacional de forma sistemática. Es la única que reúne los cuatro criterios — está probada con datos propios (el peluche de Cúcuta, «frontera de paz» dominando su top de TikTok), es territorio exclusivo que ningún competidor venezolano puede ocupar, conecta con una audiencia adicional al otro lado de la frontera, y coincide con la tendencia internacional de comunicación subnacional con identidad territorial diferenciada. Hoy se toca por accidente; convertirlo en línea editorial estable es la mayor oportunidad identificada en toda la auditoría.","lead":"LA RECOMENDACIÓN ÚNICA, SI SOLO SE PUDIERA HACER UNA:"}],"accion":"Si solo se puede hacer una cosa: convertir el eje binacional en línea editorial estable."}]},{"id":"M19","titulo":"AUDIENCIA Y COMUNIDAD","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"Muestras de comentarios de tres plataformas · 11 líneas de análisis","fuente":"M19 — Audiencia y comunidad. Corte: 5 de septiembre de 2026. Análisis apoyado en las muestras de comentarios recogidas por observación directa en los módulos anteriores. No incluye listados nominales de ciudadanos particulares, ni detractores ni seguidores activos.","calificacion":"1,22 millones de audiencia declarada. Aproximadamente 1.700 personas de comunidad real","resumen":[{"t":"Este módulo audita todo lo que la audiencia hace en público: qué comenta, con qué tono, qué reclama, cuánto se le responde y cuál es la distancia real entre quienes ven y quienes actúan. De ahí sale el hallazgo central de toda la auditoría: 1,22 millones de audiencia declarada frente a una comunidad activa del orden de 1.700 personas.","lead":""},{"t":"La demografía, la geografía y los intereses de la audiencia existen y están disponibles dentro del panel de estadísticas de cada cuenta. Este informe indica la ruta exacta para capturarlos —pantalla por pantalla— y deja construidos los cuatro perfiles de audiencia con datos reales de comentarios, listos para cuantificarse en cuanto esas capturas estén disponibles.","lead":""}],"puntos":[{"n":1,"punto":"Demografía de audiencia: edad y género por plataforma","estado":"DATO INTERNO DE LA CUENTA","prioridad":"ALTA","hallazgo":[{"t":"Ninguna plataforma publica la edad ni el sexo de los seguidores de una cuenta ajena.","lead":""},{"t":"DÓNDE SE OBTIENE EXACTAMENTE: Instagram → Estadísticas → Público → Rango de edad y Sexo. TikTok → Herramientas de creador → Analíticas → Seguidores. Facebook → Estadísticas de la Página (INEXISTENTE mientras la presencia sea un perfil personal, según el M05).","lead":"DÓNDE SE OBTIENE EXACTAMENTE:"},{"t":"Con las capturas de Insights, los cuatro perfiles cualitativos del punto 10 pasarían de cualitativos a cuantificados.","lead":""}],"accion":"Capturar los cuatro paneles en una sola sesión de trabajo. Cierra los puntos 1 a 4 de este módulo."},{"n":2,"punto":"Geografía de audiencia: países, estados y ciudades","estado":"DATO INTERNO DE LA CUENTA","prioridad":"ALTA","hallazgo":[{"t":"DÓNDE SE OBTIENE: mismos paneles, sección «Principales ubicaciones». Instagram y TikTok desglosan por ciudad, no solo por país.","lead":"DÓNDE SE OBTIENE:"},{"t":"INDICIOS EXTERNOS QUE SÍ PERMITEN AFIRMAR ALGO SUSTANCIAL: existe audiencia significativa FUERA del Táchira. Los comentarios recogidos incluyen intervenciones sobre alcabalas y rutas en Barinas, Portuguesa, Guanare, Ospino y Valencia, escritas por transportistas que describen trayectos nacionales completos — esa audiencia no es tachirense. También comentarios referidos a La Guaira durante la cobertura del terremoto de junio de 2026. Y el contenido de «frontera de paz» y la relación con Cúcuta sugiere audiencia colombiana, aunque no es verificable sin el dato de plataforma.","lead":"INDICIOS EXTERNOS QUE SÍ PERMITEN AFIRMAR ALGO SUSTANCIAL:"},{"t":"CONSECUENCIA PRÁCTICA: parte del contenido hiperlocal del Táchira se está sirviendo a una audiencia que no vive allí, y parte de la audiencia nacional no encuentra contenido pensado para ella.","lead":"CONSECUENCIA PRÁCTICA:"}],"accion":"Capturar. Y ajustar el mensaje al hallazgo: hay audiencia nacional sin contenido propio."},{"n":3,"punto":"Intereses y afinidades declaradas de la audiencia","estado":"DATO INTERNO DE LA CUENTA","prioridad":"MEDIA","hallazgo":[{"t":"Solo Meta lo ofrece con detalle, en Audience Insights del administrador de anuncios. TikTok no publica intereses de seguidores propios.","lead":""},{"t":"LIMITACIÓN ADICIONAL DEL M05: mientras la presencia en Facebook sea un perfil personal y no una Página, no hay Business Manager ni Audience Insights disponibles. Este punto depende por tanto de la conversión a Página.","lead":"LIMITACIÓN ADICIONAL DEL M05:"}],"accion":"Convertir Facebook a Página (M05, punto 1) y después capturar Audience Insights."},{"n":4,"punto":"Horarios de mayor actividad de la audiencia","estado":"DATO INTERNO DE LA CUENTA","prioridad":"ALTA","hallazgo":[{"t":"DÓNDE SE OBTIENE: Instagram → Público → Horas más activas. TikTok → Analíticas → Seguidores → Horas de actividad.","lead":"DÓNDE SE OBTIENE:"},{"t":"PROXY MEDIDO Y MUY ÚTIL: en ausencia del dato de audiencia activa, el M03 midió el RENDIMIENTO REAL por franja horaria en TikTok sobre 63 publicaciones, que es el mejor sustituto disponible. La franja de 22:00 a 23:59 rinde una media de 64.498 reproducciones frente a las 19.837 de la franja de 12:00 a 16:59. Eso indica dónde está la audiencia despierta, aunque no lo confirme directamente.","lead":"PROXY MEDIDO Y MUY ÚTIL:"},{"t":"Y el M13 documenta la coincidencia entre X e Instagram (12:00-16:59 el 33% y 17:00-21:59 el 30% en ambas), lo que sugiere que ambos equipos leen bien el mismo patrón — aunque ese patrón NO es el de TikTok.","lead":""}],"accion":"Capturar la curva real. El proxy ya indica que la franja nocturna de TikTok está infraexplotada."},{"n":5,"punto":"Análisis cualitativo de comentarios: temas, tono y demandas","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"EL CONTRASTE ENTRE PLATAFORMAS ES EL HALLAZGO MÁS ÚTIL DEL MÓDULO. En X el tono es HOSTIL: aproximadamente una respuesta favorable por cada quince críticas, con reproches de clase, ironía e insulto. En TikTok es MIXTO Y CONCRETO: convive el apoyo con la demanda específica y verificable —preguntas por la carretera Rubio–San Cristóbal, quejas por tiempos de espera en alcabalas— junto a mensajes de respaldo. En Instagram es FAVORABLE: es el entorno más amable del ecosistema, con mensajes de bendición, felicitación y respaldo a la gestión.","lead":"EL CONTRASTE ENTRE PLATAFORMAS ES EL HALLAZGO MÁS ÚTIL DEL MÓDULO."},{"t":"CONSECUENCIA ESTRATÉGICA: la percepción de «la gente está en contra» procede casi por completo de X, que es la plataforma con la audiencia más envejecida y el menor alcance real (0,56% sobre seguidores). En TikTok e Instagram, donde está la audiencia viva, el entorno es sustancialmente más favorable. TOMAR DECISIONES DE COMUNICACIÓN LEYENDO SOLO LOS COMENTARIOS DE X SERÍA LEER EL PEOR TERMÓMETRO DISPONIBLE.","lead":"CONSECUENCIA ESTRATÉGICA:"},{"t":"LAS TRES DEMANDAS QUE SE REPITEN Y SON SUYAS. Primero, CORTES DE ENERGÍA ELÉCTRICA: aparece en X y en TikTok, con detalle de horas; es verificable y es competencia regional. Segundo, VIALIDAD: la carretera Rubio–San Cristóbal citada por nombre en varios comentarios de forma independiente, incluyendo uno que afirma que lleva tres años en mal estado. Tercero, PESO COLOMBIANO Y CASAS DE CAMBIO: minoritaria en volumen pero muy específica, propia de una economía fronteriza y sin competencia informativa.","lead":"LAS TRES DEMANDAS QUE SE REPITEN Y SON SUYAS."},{"t":"Estas tres son las ÚNICAS demandas del corpus que se resuelven con GESTIÓN y no con comunicación. Responderlas con hechos tendría más efecto sobre el sentimiento que cualquier ajuste de contenido.","lead":""}],"accion":"Atender por gestión las tres demandas repetidas y comunicar el resultado. Es la única vía que mueve el sentimiento del segmento recuperable.","tabla":{"headers":["Eje (muestra de 108 comentarios en X)","Peso","Naturaleza de la demanda"],"rows":[["Contraste privilegio / penuria","30%","No es una demanda, es un juicio moral. Compara su consumo con la situación económica del ciudadano."],["Insulto directo","13%","Sin contenido accionable."],["Servicios públicos","9%","DEMANDA ACCIONABLE. Cortes de luz de más de seis horas, agua, hospitales, escuelas, salarios de docentes y médicos."],["Corrupción","8%","Acusación genérica, no accionable."],["Situación de Maduro y Cilia Flores","5%","Agenda nacional, ajena a su competencia."],["Peso colombiano y casas de cambio","2%","DEMANDA ACCIONABLE Y ESPECÍFICA. Competencia regional directa y nadie más la está atendiendo."],["Apoyo explícito","4%","Agradecimientos y respaldo."]]}},{"n":6,"punto":"Detractores recurrentes: identificación y patrón de ataque","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"SOBRE LA IDENTIFICACIÓN NOMINAL: este informe NO incluye un listado con nombres de usuario de detractores individuales, y conviene explicar por qué. Se trata en su mayoría de ciudadanos particulares, no de figuras públicas, y compilar un registro nominal de personas que critican a una autoridad es una práctica con implicaciones que exceden lo comunicacional.","lead":"SOBRE LA IDENTIFICACIÓN NOMINAL:"},{"t":"Lo que sí es legítimo y útil es el análisis de PATRÓN, que es lo que se entrega.","lead":""},{"t":"MÉTODO CORRECTO si el equipo necesita distinguir crítica ciudadana genuina de una eventual campaña coordinada: medir la reincidencia de cuentas a través de veinte o treinta publicaciones distintas y observar señales objetivas —cuentas creadas en fechas próximas entre sí, actividad concentrada exclusivamente en este perfil, textos casi idénticos. Una sola coincidencia dentro de un hilo no prueba nada.","lead":""}],"accion":"Aplicar el método de reincidencia sobre veinte o treinta publicaciones antes de concluir nada sobre coordinación.","tabla":{"headers":["Patrón","Descripción","Riesgo"],"rows":[["Reproche de clase","Es el patrón dominante. Toma cualquier contenido personal del gobernador y lo contrapone a la penuria económica. No ataca la gestión, ataca la legitimidad para disfrutar.","ALTO. Se activa solo, sin coordinación, y crece cuando el contenido es cotidiano en contexto de escasez."],["Reclamo de servicio convertido en ataque","Un ciudadano con una queja real (luz, vialidad) la formula en tono agresivo por acumulación de frustración.","MEDIO. Es recuperable: detrás hay una demanda legítima que puede atenderse."],["Insulto sin contenido","Descalificación personal directa.","BAJO en sí mismo, pero es el que provocó el episodio de confrontación del 4 al 6 de agosto documentado en el M06."],["Reincidencia dentro de un mismo hilo","Se detectaron cuentas interviniendo repetidamente en la misma publicación, una de ellas cuatro veces.","INDETERMINADO. Una muestra de un solo hilo no permite distinguir crítica genuina intensa de actividad coordinada."]]}},{"n":7,"punto":"Embajadores y seguidores más activos (superfans)","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"En Instagram se identifica con claridad un NÚCLEO DE SEGUIDORES RECURRENTES que comentan de forma sistemática y en tono de respaldo explícito, con fórmulas de bendición, felicitación y defensa de la gestión. Aparecen en publicaciones distintas y responden en cuestión de minutos tras la publicación.","lead":""},{"t":"OPORTUNIDAD DESAPROVECHADA: un núcleo de entre diez y veinte personas que comentan cada publicación en minutos y en tono favorable es exactamente el activo que otras operaciones cultivan deliberadamente. Responderles ocasionalmente, agruparlos en un canal de difusión o darles acceso anticipado a anuncios convertiría un comportamiento espontáneo en una capacidad organizada. HOY NO SE HACE NADA CON ELLOS.","lead":"OPORTUNIDAD DESAPROVECHADA:"},{"t":"Por el mismo criterio del punto anterior, no se incluye listado nominal. El equipo puede identificarlos en minutos revisando los comentarios de las últimas veinte publicaciones y anotando qué cuentas se repiten.","lead":""}],"accion":"Identificar el núcleo y darle un papel. Coste cero, retorno inmediato.","tabla":{"headers":["Característica del núcleo activo","Observación"],"rows":[["Tamaño estimado","Entre 10 y 20 cuentas que aparecen de forma repetida en las publicaciones revisadas de Instagram"],["Velocidad de reacción","Comentarios registrados a los pocos minutos de publicar, lo que indica notificaciones activadas"],["Registro","Emocional y religioso («Dios lo bendiga», «es admirable»), no argumentativo"],["Función real","Ocupan las primeras posiciones del hilo de comentarios, lo que en Instagram influye en cómo se percibe el tono general de la publicación"],["Aprovechamiento actual","NULO. No reciben respuesta, no están agrupados, no se les da ningún papel"]]}},{"n":8,"punto":"Tiempo de respuesta y tasa de atención a la comunidad","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"DIAGNÓSTICO: la tasa de atención a la comunidad es ESENCIALMENTE CERO en las tres plataformas principales. No es un problema de velocidad de respuesta: ES QUE NO EXISTE LA FUNCIÓN DE ATENCIÓN.","lead":"DIAGNÓSTICO:"},{"t":"Y el vacío tiene una consecuencia documentada y grave: en la cuenta suplantadora inactiva de Instagram se acumulan peticiones ciudadanas reales, incluida una sobre una desaparición forzada, dirigidas al gobernador por su nombre y sin leer desde hace más de un año.","lead":""},{"t":"El M20 lo formula como fallo de proceso, no de velocidad: «cero respuestas a comentarios en tres plataformas no es lentitud: es que la tarea no está asignada a nadie».","lead":""}],"accion":"Veinte respuestas diarias, priorizando preguntas y peticiones sobre servicios, empezando por Instagram —que es donde el entorno es favorable y el esfuerzo rinde más. No requiere presupuesto: requiere asignar la tarea a alguien.","tabla":{"headers":["Plataforma","Tasa de respuesta medida","Tiempo de reacción"],"rows":[["Instagram","0 respuestas de 14 comentarios revisados en la publicación más reciente","No medible: no hay respuestas que cronometrar"],["X","9 respuestas a terceros en 3 meses, sobre 192 publicaciones","De las 9, cuatro fueron confrontaciones concentradas en 48 horas"],["TikTok","No se detectaron respuestas del titular en los hilos revisados","No medible"],["Mensajería directa","No auditable desde fuera","—"]]}},{"n":9,"punto":"Diferencia entre audiencia (quien ve) y comunidad (quien actúa)","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"Audiencia es quien PODRÍA ver; comunidad es quien ACTÚA. La distancia entre ambas cifras es enorme y muy distinta según la plataforma.","lead":""},{"t":"TRADUCIDO A PERSONAS CONCRETAS. En X, de cada 100.000 seguidores, unos 9 interactúan: la comunidad real ronda las 57 personas por publicación sobre una audiencia declarada de 602.800. En TikTok, la comunidad ronda las 1.010 personas por publicación — ES 17 VECES MAYOR QUE LA DE X CON LA MITAD DE SEGUIDORES.","lead":"TRADUCIDO A PERSONAS CONCRETAS."},{"t":"LA COMUNIDAD TOTAL ACTIVA DEL ECOSISTEMA, sumando las tres plataformas, se sitúa en el orden de 1.700 PERSONAS por ciclo de publicación. Frente a una audiencia declarada de 1,22 millones.","lead":""},{"t":"LA LECTURA QUE CONVIENE INTERIORIZAR: el ecosistema tiene 1,22 millones de seguidores y una comunidad de aproximadamente 1.700 personas activas. La cifra grande sirve para el titular; la pequeña es la que sostiene cualquier movilización real. Y la comunidad NO ESTÁ DONDE ESTÁ LA AUDIENCIA: está en TikTok, la plataforma con menos seguidores de las tres principales.","lead":"LA LECTURA QUE CONVIENE INTERIORIZAR:"}],"accion":"Redistribuir el esfuerzo hacia donde está la comunidad, no hacia donde está el número de seguidores.","tabla":{"headers":["Plataforma","Audiencia (seguidores)","Alcance real medio","Comunidad activa (interacciones)","Ratio comunidad / audiencia"],"rows":[["X","602.800","3.399 visualizaciones","37 me gusta + 20 respuestas ≈ 57","0,009%"],["Instagram","244.000","Mediana de Reels: 16.600","645 me gusta (agosto)","0,264%"],["TikTok","319.200","27.400 reproducciones medias","915 me gusta + 95 comentarios ≈ 1.010","0,32%"]]}},{"n":10,"punto":"Perfiles de votante (personas) construidos con datos reales","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Estos cuatro perfiles NO son invenciones de manual: cada uno se deriva de comentarios efectivamente registrados en las muestras de los módulos anteriores.","lead":""},{"t":"NOTA SOBRE LO QUE FALTA: sin el dato demográfico de plataforma no es posible asignar edad, sexo ni ubicación a cada perfil. Con las capturas de Insights descritas en los puntos 1 a 4, estos cuatro perfiles pasarían de cualitativos a cuantificados.","lead":"NOTA SOBRE LO QUE FALTA:"}],"accion":"El trabajador de la vía y el vecino con un reclamo son, juntos, el segmento más recuperable. Ambos necesitan lo mismo: un canal donde dejar el reclamo y ver el resultado.","tabla":{"headers":["Perfil","Descripción","Evidencia de origen","Qué necesita"],"rows":[["EL RESPALDO DEVOTO","Comenta cada publicación en minutos, con fórmulas religiosas y de bendición. Registro emocional, no argumentativo. Predomina en Instagram.","Núcleo de 10-20 cuentas recurrentes en Instagram","RECONOCIMIENTO. Una respuesta ocasional lo convertiría en embajador organizado."],["EL TRABAJADOR DE LA VÍA","Transportista o conductor que recorre rutas nacionales. Conoce el terreno con detalle y reclama con datos concretos: horas de espera, nombres de alcabalas, estado de carreteras.","Comentario documentado en TikTok describiendo tiempos de retención en alcabalas de Barinas, Guanare, Ospino y Valencia","RESPUESTA OPERATIVA VERIFICABLE. Es el perfil más recuperable de todos."],["EL VECINO CON UN RECLAMO","Tachirense con una demanda específica y localizable: la carretera Rubio–San Cristóbal, los cortes de luz, el agua. NO ES OPOSITOR: es usuario insatisfecho.","Comentarios independientes citando la misma carretera por nombre y las horas diarias sin electricidad","CICLO DENUNCIA-ACCIÓN-RESULTADO. Hoy no tiene ningún canal donde dejar su reclamo."],["EL CRÍTICO DE CLASE","Contrapone el consumo del gobernador a la penuria general. No pide nada: emite un juicio moral. Concentrado en X.","30% de la muestra de 108 comentarios en X","NO ES CONVERTIBLE POR COMUNICACIÓN. Solo cambia con resultados de gestión, o se neutraliza evitando contenido de consumo en contexto de escasez."]]}},{"n":11,"punto":"Solapamiento de audiencia con competidores","estado":"DIAGNÓSTICO POR EVIDENCIA","prioridad":"MEDIA","hallazgo":[{"t":"Ninguna plataforma permite cruzar la lista de seguidores de dos cuentas ajenas. Existen herramientas comerciales que estiman solapamiento por muestreo, pero sus márgenes de error en cuentas de cientos de miles de seguidores son demasiado amplios para fundamentar una decisión.","lead":""},{"t":"LO QUE SÍ PUEDE AFIRMARSE. SOLAPAMIENTO INTERNO ALTO: es previsible que una parte sustancial de los 1,22 millones sean las mismas personas siguiendo varias de sus cuentas; la audiencia de personas únicas es sensiblemente menor que la suma. SOLAPAMIENTO CON LACAVA PROBABLEMENTE BAJO: opera en Carabobo, con audiencia mayoritariamente nacional y de otra región, mientras la del candidato tiene un componente hiperlocal tachirense que no comparte. SOLAPAMIENTO CON LA GOBERNACIÓN DEL TÁCHIRA PROBABLEMENTE MUY ALTO: ambas cuentas hablan a la misma población sobre los mismos temas — es el solapamiento que más conviene medir y el ÚNICO que puede resolverse internamente, porque ambas cuentas son suyas.","lead":"LO QUE SÍ PUEDE AFIRMARSE."},{"t":"MÉTODO VIABLE PARA EL ÚNICO CASO ACCIONABLE: si el equipo controla ambas cuentas, Meta permite comparar públicos entre páginas propias desde el administrador de anuncios. Eso resolvería si conviene diferenciar roles entre la cuenta personal y la institucional o si están duplicando esfuerzo sobre las mismas personas.","lead":"MÉTODO VIABLE PARA EL ÚNICO CASO ACCIONABLE:"}],"accion":"Medir solo el solapamiento con la Gobernación del Táchira. Es el único accionable y el que decide el reparto de roles."}]},{"id":"M20","titulo":"EQUIPO, PROCESOS Y TECNOLOGÍA","estado_modulo":"DIAGNÓSTICO COMPLETO + PROPUESTA DE ESTRUCTURA","alcance":"Capacidad de producción medida · estructura, flujo y cuestionario entregados · 11 líneas de análisis","fuente":"M20 — Equipo, procesos y tecnología. Corte: 5 de septiembre de 2026. Todos los diagnósticos marcados como INFERIDO se apoyan en evidencia publicada y verificable recogida en los módulos anteriores, y se presentan como hipótesis consistentes con esa evidencia, no como hechos confirmados.","calificacion":"El cuello de botella no está en la capacidad de producción, sino en la arquitectura sobre la que esa producción se apoya","resumen":[{"t":"CÓMO LEER ESTE MÓDULO. Es el más interno de todo el encargo. La estructura del equipo, el flujo de aprobación, las herramientas contratadas, el calendario editorial y el costo de la operación son información que vive dentro de la Gobernación: ninguna auditoría externa puede observarlos directamente.","lead":""},{"t":"Lo que sí es posible, y es el enfoque de este informe, es LEER EL RESULTADO PUBLICADO COMO UNA RADIOGRAFÍA DEL PROCESO QUE LO PRODUJO. Un vídeo con el rótulo cortado, un correo personal expuesto en un blog de 2016, seis convenciones distintas de usuario o tres meses de silencio en la plataforma principal no son accidentes: son huellas de cómo está organizado el trabajo.","lead":""},{"t":"El módulo se cierra con dos entregables que no dependen de acceso interno: una propuesta completa de estructura de equipo con perfiles y criterios de costo, y un cuestionario de verificación interna.","lead":""}],"puntos":[{"n":1,"punto":"Estructura del equipo de comunicación digital","estado":"DIAGNÓSTICO POR EVIDENCIA","prioridad":"ALTA","hallazgo":[{"t":"ESTRUCTURA PROBABLE, ofrecida como hipótesis a confirmar, no como hecho: un equipo de prensa institucional que produce notas y contenido en registro formal y tercera persona; una producción audiovisual con capacidad de estudio, dedicada principalmente a «Reporte Bernal»; el propio gobernador operando de forma directa al menos X y los vídeos-selfie, sin intermediación; y NINGUNA FIGURA VISIBLE de dirección de marca ni de responsable único de comunidad.","lead":""}],"accion":"Responder el cuestionario del punto 10 para convertir estas hipótesis en hechos confirmados o descartados.","tabla":{"headers":["Evidencia publicada","Qué revela del proceso"],"rows":[["Programa «Reporte Bernal» con más de 250 emisiones y set físico propio","Existe una estructura de producción audiovisual estable, con estudio, iluminación y micrófono dedicado. No es una operación improvisada."],["Respuestas en X del 4 al 6 de agosto con errores de tipeo («Le falso acá eres tú!»)","La cuenta de X la opera él personalmente, al menos en parte, sin filtro de equipo. No hay validación previa a la publicación en ese canal."],["Copies en tercera persona en Instagram («Junto al gobernador… Freddy Bernal;»)","Existe una fuente de nota de prensa institucional cuyos textos se pegan sin adaptar. Hay al menos dos productores de texto con criterios distintos."],["Marca «#RESUMEN ///» heredada de otro canal en una publicación de Instagram","Se recicla contenido entre canales sin paso de adaptación."],["Tres meses de silencio en X mientras Instagram mantenía ritmo","Las plataformas no comparten calendario. Probablemente no comparten responsable."],["Nombres de archivo tipo «photo_4963…_y.jpg» en el sitio oficial","El material gráfico circula por Telegram y se publica sin renombrar ni procesar. No hay repositorio central en el flujo."],["Seis convenciones distintas de @usuario y cuatro sistemas gráficos","No existe una figura con autoridad sobre la marca que valide antes de abrir un canal o publicar una pieza."],["Cuenta de Mastodon abandonada en 2020 y blogs sin tocar desde 2016","No hay procedimiento de cierre de canales ni inventario de activos."]]}},{"n":2,"punto":"Roles necesarios","estado":"ENTREGADO","prioridad":"CRÍTICA","hallazgo":[{"t":"Esta propuesta está dimensionada para sostener la capacidad ya demostrada (30-42 piezas semanales) y corregir los fallos documentados en toda la auditoría. NO REQUIERE NECESARIAMENTE AMPLIAR PLANTILLA: buena parte es reasignación de funciones.","lead":""},{"t":"El resto de roles probablemente ya existen bajo otros nombres. El problema no es que falte gente, es que no hay atribuciones claras.","lead":""}],"accion":"PRIORIDAD 1: gestor de comunidad. PRIORIDAD 2: responsable de marca (puede ser una atribución, no una contratación). PRIORIDAD 3: control de calidad audiovisual (puede resolverse con un procedimiento, no con personal).","tabla":{"headers":["Rol","Responsabilidad","Qué fallo corrige","Dedicación"],"rows":[["DIRECTOR DE COMUNICACIÓN DIGITAL","Decide calendario transversal, aprueba línea editorial, responde por métricas","Los tres meses de silencio en X; la falta de calendario común","Completa"],["RESPONSABLE DE MARCA","Autoridad única sobre identidad visual. Ninguna pieza se publica sin su criterio","Cuatro sistemas gráficos, logotipo sin desplegar, cabecera de X vacía","Media o compartida con diseño"],["GESTOR DE COMUNIDAD","Responde comentarios, detecta demandas repetidas, escala reclamos a gestión","Tasa de respuesta cero; peticiones ciudadanas perdidas en la cuenta suplantadora","Completa — ES EL ROL MÁS URGENTE"],["EDITOR AUDIOVISUAL","Produce y controla calidad final en el formato de destino","Rótulo cortado, recorte vertical deficiente, ausencia de plantilla","Completa"],["DISEÑADOR GRÁFICO","Plantillas de las tipologías que faltan: cita, dato, convocatoria, agradecimiento","Ausencia de cuatro tipologías de pieza documentada en el M09","Media"],["ANALISTA DE DATOS","Registro mensual de métricas, informe de rendimiento, ajuste de horarios","Publicar en el peor horario y el peor día; imposibilidad de medir crecimiento","Parcial — puede ser una tarea, no una persona"],["REDACTOR","Adapta la nota institucional a registro de redes en primera persona","Copies en tercera persona, aperturas institucionales, textos de 1.000+ caracteres","Media"]]}},{"n":3,"punto":"Flujo de aprobación de contenido y cuellos de botella","estado":"DIAGNÓSTICO POR EVIDENCIA","prioridad":"CRÍTICA","hallazgo":[{"t":"CUATRO CUELLOS DE BOTELLA IDENTIFICABLES DESDE EL RESULTADO.","lead":""},{"t":"AUSENCIA DE CONTROL DE CALIDAD PREVIO. El rótulo cortado en cada emisión de «Reporte Bernal» lleva meses repitiéndose. Nadie revisa la pieza en el formato en que se va a ver antes de publicarla.","lead":"AUSENCIA DE CONTROL DE CALIDAD PREVIO."},{"t":"NADIE DECIDE SOBRE LA MARCA. Cuatro sistemas gráficos y un logotipo profesional sin desplegar indican que las decisiones de identidad se toman pieza a pieza.","lead":"NADIE DECIDE SOBRE LA MARCA."},{"t":"EL GOBERNADOR COMO CUELLO DE BOTELLA Y COMO RIESGO. Que opere personalmente su cuenta principal explica a la vez su mayor fortaleza (autenticidad, documentada en el M11) y su mayor incidente (las cuatro respuestas de agosto, documentadas en el M06).","lead":"EL GOBERNADOR COMO CUELLO DE BOTELLA Y COMO RIESGO."},{"t":"SIN RESPONSABLE DE COMUNIDAD. Cero respuestas a comentarios en tres plataformas no es lentitud: es que la tarea no está asignada a nadie.","lead":"SIN RESPONSABLE DE COMUNIDAD."}],"accion":"El flujo propuesto del punto 9 elimina los cuatro cuellos sin añadir burocracia que ralentice la publicación, que es el riesgo opuesto y también real en comunicación política."},{"n":4,"punto":"Herramientas y software en uso (y su costo)","estado":"DIAGNÓSTICO POR EVIDENCIA","prioridad":"ALTA","hallazgo":[{"t":"HERRAMIENTAS QUE NO SE DETECTAN Y DEBERÍAN EXISTIR. PROGRAMADOR DE PUBLICACIONES: los horarios de publicación medidos son orgánicos e irregulares, sin patrón de programación, lo que explica el desaprovechamiento de la franja nocturna en TikTok documentado en el M03. REPOSITORIO CENTRAL DE ACTIVOS: los nombres de archivo de Telegram lo descartan. HERRAMIENTA DE ESCUCHA Y GESTIÓN DE COMENTARIOS: la tasa de respuesta cero lo confirma, y es además la infraestructura que convierte la escucha del M14 y el M15 en una serie medible. HERRAMIENTA DE ANALÍTICA CONSOLIDADA: no hay indicio de seguimiento de métricas entre plataformas.","lead":"HERRAMIENTAS QUE NO SE DETECTAN Y DEBERÍAN EXISTIR."},{"t":"SOBRE EL COSTO: las licencias y contratos son información interna del equipo. Lo que sí puede afirmarse es que la mayor parte del ecosistema técnico detectado es GRATUITO O DE BAJO COSTE, lo que refuerza el diagnóstico general: el problema no es de presupuesto en herramientas, es de proceso.","lead":"SOBRE EL COSTO:"}],"accion":"Contratar la herramienta de escucha (cierra 7 puntos entre M14 y M15) y un programador de publicaciones (habilita el ajuste horario de coste cero del M13).","tabla":{"headers":["Herramienta detectada","Evidencia","Costo"],"rows":[["WordPress","El sitio oficial está construido sobre esta plataforma; el favicon se cargó en diciembre de 2025 mediante su gestor de medios","Variable según alojamiento y plantilla"],["Telegram","Nombres de archivo de exportación en las fotografías del sitio","Gratuito"],["Google Drive","El boletín «Semanario» se distribuye mediante enlace a archivo alojado ahí","Gratuito o plan básico"],["Edición de vídeo con subtitulado","Subtítulos quemados con estilo consistente, tipografía y sombra uniformes","No identificable con precisión"],["Bibliotecas de audio nativas","Uso de pistas de la biblioteca de TikTok («Aesthetic - Tollan Kim»)","Gratuito"],["Diseño gráfico","La plantilla de «COMUNICADO» y el logotipo indican software de diseño profesional","No identificable"]]}},{"n":5,"punto":"Calendario editorial: existencia, formato y cumplimiento","estado":"DIAGNÓSTICO POR EVIDENCIA","prioridad":"CRÍTICA","hallazgo":[{"t":"DIAGNÓSTICO: NO EXISTE, O EXISTE Y NO SE CUMPLE. La evidencia medida es concluyente.","lead":"DIAGNÓSTICO:"}],"accion":"Calendario semanal transversal con reparto por plataforma, pilar temático y franja horaria óptima. Una hora los lunes.","tabla":{"headers":["Indicio medido","Qué demuestra"],"rows":[["Tres meses sin publicar en X (marzo a mayo de 2026) mientras Instagram seguía activo","No hay calendario transversal a plataformas"],["El jueves concentra 36 publicaciones en X y el lunes solo 17; en Instagram el jueves 15 y el miércoles 4","La distribución semanal es reactiva a la agenda de actos, no planificada"],["El martes en TikTok tiene el mismo volumen que el jueves (11 piezas) pero un tercio de su rendimiento","No se publica según criterio de rendimiento"],["La franja de mejor rendimiento en TikTok (22:00-23:59) concentra solo 7 de 63 publicaciones","No hay decisión de horario basada en datos"],["Reactivación de X en enero por la Feria y en junio por el terremoto","La publicación la dispara el acontecimiento, no un plan"]]}},{"n":6,"punto":"Banco de contenido: existencia, organización y disponibilidad","estado":"DIAGNÓSTICO POR EVIDENCIA","prioridad":"ALTA","hallazgo":[{"t":"DIAGNÓSTICO: NO EXISTE UN BANCO ORGANIZADO.","lead":"DIAGNÓSTICO:"},{"t":"Los nombres de archivo del sitio oficial conservan la nomenclatura automática de exportación de Telegram, lo que indica que el material no pasa por ningún repositorio con convención de nombres.","lead":""},{"t":"Las imágenes publicadas tienen dimensiones dispares (1080×585, 1080×600, 1280×847, 896×607 en la misma página), lo que descarta un flujo de exportación normalizado.","lead":""},{"t":"No hay evidencia de reutilización de archivo: el contenido conmemorativo no reaprovecha material histórico propio.","lead":""},{"t":"CONSECUENCIA PRÁCTICA: Telegram recomprime las imágenes al enviarlas, de modo que el material pierde calidad ANTES DE LLEGAR SIQUIERA al equipo que lo publica.","lead":"CONSECUENCIA PRÁCTICA:"}],"accion":"Sustituir el flujo por mensajería por un repositorio compartido con estructura de carpetas por fecha y tema, y convención de nombres."},{"n":7,"punto":"Capacidad de producción real (piezas por semana)","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"Es el único punto de este módulo con medición directa. Procede de los conteos de los módulos M02, M03 y del análisis de X.","lead":""},{"t":"LECTURA: entre 30 y 42 piezas semanales es una CAPACIDAD DE PRODUCCIÓN ALTA, propia de un equipo dedicado y no de una persona. El problema documentado a lo largo de toda la auditoría NUNCA FUE DE VOLUMEN: fue de destino, de horario, de coherencia y de conversión. Este equipo produce mucho; lo que le falta es criterio de distribución y control de calidad, no capacidad.","lead":"LECTURA:"},{"t":"MATIZ IMPORTANTE SOBRE LA IRREGULARIDAD: esa capacidad no es sostenida. Entre marzo y mayo de 2026 la producción en X cayó a cero durante tres meses, mientras Instagram mantenía su ritmo. Eso sugiere que las plataformas no se gestionan con un mismo calendario ni, posiblemente, por las mismas personas.","lead":"MATIZ IMPORTANTE SOBRE LA IRREGULARIDAD:"},{"t":"A esas 30-42 piezas semanales hay que sumar, para dimensionar el esfuerzo total, las 42,1 horas de programa producidas en algo más de siete meses que documenta el M04 — equivalentes a una jornada laboral semanal dedicada íntegramente a grabar.","lead":""}],"accion":"No aumentar la producción. Redistribuirla y controlarla.","tabla":{"headers":["Plataforma","Ritmo medido","Piezas por semana"],"rows":[["Instagram","3,05 publicaciones diarias (127 piezas en 41,7 días)","≈ 21"],["TikTok cuenta principal","Casi diaria (63 piezas en 68 días)","≈ 6,5"],["X","2,1 publicaciones diarias en periodo activo (192 en 91 días)","≈ 15"],["Facebook y Threads","Activas, sin conteo específico","No medido"],["CAPACIDAD TOTAL ESTIMADA","Sumando las tres principales, con solapamiento de piezas reutilizadas","≈ 30 a 42 piezas semanales"]]}},{"n":8,"punto":"Costo actual de la operación digital","estado":"DIAGNÓSTICO POR EVIDENCIA","prioridad":"MEDIA","hallazgo":[{"t":"El costo de una operación de comunicación pública depende de nóminas, contratos de servicios, amortización de equipamiento y eventual inversión publicitaria. Nada de eso es observable externamente y ninguna estimación sería responsable.","lead":""},{"t":"DATOS QUE EL EQUIPO NECESITA REUNIR: nómina del personal dedicado a comunicación digital (Recursos humanos); contratos de servicios externos de diseño, producción y edición (Administración); amortización de equipamiento — cámaras, iluminación, set (Inventario y contabilidad); licencias de software (Administración); alojamiento web y dominio (Facturación de proveedor); inversión publicitaria en plataformas, si existe (Administradores de anuncios de Meta y TikTok).","lead":"DATOS QUE EL EQUIPO NECESITA REUNIR:"},{"t":"Con esas partidas y el dato de crecimiento neto de seguidores del M12, se obtiene el costo por seguidor orgánico que quedó pendiente en aquel módulo.","lead":""}],"accion":"Reunir las seis partidas. Es el prerrequisito del punto 14 del M12."},{"n":9,"punto":"Estructura de equipo recomendada con perfiles y costos","estado":"ENTREGADO","prioridad":"CRÍTICA","hallazgo":[{"t":"CRITERIOS DE COSTO: no se incluyen cifras salariales porque dependen de la escala retributiva de la administración regional y de si los perfiles son de plantilla o contratados. Lo que sí puede orientarse es la PRIORIDAD DE INVERSIÓN. Prioridad 1, gestor de comunidad: corrige el fallo con consecuencias más graves (peticiones ciudadanas sin atender) y es el que menos infraestructura requiere — una persona con criterio y acceso a las cuentas. Prioridad 2, responsable de marca: no necesita ser una contratación, puede ser una atribución explícita a alguien del equipo actual, con autoridad real de veto. Prioridad 3, control de calidad audiovisual: puede resolverse con un procedimiento, no con personal — revisar cada pieza en vertical, en un teléfono, antes de publicar.","lead":"CRITERIOS DE COSTO:"},{"t":"UNA SALVEDAD DELIBERADA Y CRÍTICA: este flujo NO DEBE APLICARSE A LOS VÍDEOS-SELFIE ESPONTÁNEOS DEL GOBERNADOR. Toda la auditoría documenta que su mayor activo es la autenticidad, y meter ese contenido en un circuito de aprobación lo destruiría. La regla debería ser explícita: el contenido espontáneo del gobernador se publica sin proceso; todo lo demás pasa por control de calidad.","lead":"UNA SALVEDAD DELIBERADA Y CRÍTICA:"}],"accion":"Implantar el flujo con la salvedad del contenido espontáneo. Es lo que convierte la capacidad existente en resultado.","tabla":{"headers":["Etapa","Quién","Qué ocurre","Tiempo objetivo"],"rows":[["1. Planificación semanal","Director digital","Calendario de la semana con reparto por plataforma, pilar temático y franja horaria óptima según los datos del M03 y el M13","Lunes, 1 hora"],["2. Producción","Audiovisual y redacción","Grabación y redacción. REGLA: si es para vertical, se graba en vertical","Continuo"],["3. Control de calidad","Editor audiovisual","Revisión obligatoria EN TELÉFONO, en formato de destino, antes de exportar","5 minutos por pieza"],["4. Validación de marca","Responsable de marca","Solo para piezas gráficas nuevas o cambios de identidad. No para contenido diario","Solo cuando aplica"],["5. Publicación","Director digital o programador","En la franja definida, no cuando se termina la pieza","Programada"],["6. Atención","Gestor de comunidad","Veinte respuestas diarias mínimo. Escalado de reclamos verificables a la unidad de gestión correspondiente","Diario"],["7. Medición","Analista","Registro mensual de las ocho cuentas y ajuste del calendario del mes siguiente","Día 1 de cada mes"]]}},{"n":10,"punto":"Nivel de adopción de IA en el flujo de trabajo","estado":"DIAGNÓSTICO POR EVIDENCIA","prioridad":"ALTA","hallazgo":[{"t":"NIVEL DE ADOPCIÓN ESTIMADO: NULO O MUY BAJO. No se detectó ningún indicio de uso de inteligencia artificial en la producción, y los indicios apuntan en la dirección contraria.","lead":"NIVEL DE ADOPCIÓN ESTIMADO:"},{"t":"Es, paradójicamente, una buena noticia: significa que las mejoras de eficiencia más accesibles están todas sin explotar y no requieren cambiar el equipo, solo incorporar herramientas. El M18 detalla cuáles adoptar (transcripción y subtitulado automático, análisis de comentarios a escala, reencuadre asistido, asistencia en redacción) y cuáles evitar (contenido sintético, respuestas automáticas, amplificación artificial).","lead":""}],"accion":"Adoptar los cinco usos de bajo riesgo del M18. Regla práctica: usar IA para producir más rápido lo que ya se hace, nunca para sustituir la presencia real de la persona.","tabla":{"headers":["Indicio","Lectura"],"rows":[["Subtítulos quemados sin pista de texto accesible","Si se usara subtitulado automático de plataforma, existiría la pista de texto. El texto se está incrustando manualmente en edición."],["Ausencia total de texto alternativo en las imágenes del sitio","Cualquier flujo asistido por IA generaría descripciones automáticas."],["Recorte vertical central sin reencuadre inteligente en «Reporte Bernal»","Las herramientas de reencuadre asistido detectan el sujeto y lo mantienen centrado. Aquí el recorte es geométrico."],["Errores de tipeo en respuestas publicadas","Sin paso de revisión asistida."],["Textos en tercera persona pegados sin adaptar","Sin asistencia de reescritura."]]}},{"n":11,"punto":"＋. CUESTIONARIO DE VERIFICACIÓN INTERNA (entregable adicional del módulo)","estado":"ENTREGADO","prioridad":"ALTA","hallazgo":[{"t":"Estas preguntas cierran los puntos que ninguna auditoría externa puede responder. Se recomienda contestarlas POR ESCRITO: las respuestas convertirán los diagnósticos inferidos de este informe en hechos confirmados o descartados.","lead":""},{"t":"SOBRE EL EQUIPO. ¿Cuántas personas dedican jornada completa a comunicación digital? ¿Y parcial? ¿Quién decide qué se publica y qué no: existe esa figura o se decide caso por caso? ¿Quién opera cada cuenta? ¿Hay alguna que opere el gobernador directamente? ¿Alguien tiene la tarea explícita de responder comentarios?","lead":"SOBRE EL EQUIPO."},{"t":"SOBRE EL PROCESO. ¿Existe un calendario editorial escrito? ¿Con qué antelación se planifica? ¿Cuántas personas deben aprobar una publicación antes de que salga? ¿Cuánto tarda? ¿Se revisa cada vídeo en un teléfono, en vertical, antes de publicarlo? ¿Por qué X estuvo tres meses sin publicar entre marzo y mayo: fue una decisión o un descuido?","lead":"SOBRE EL PROCESO."},{"t":"SOBRE HERRAMIENTAS Y ARCHIVO. ¿Qué software de edición y diseño se usa? ¿Con licencia? ¿Existe un repositorio central de material o el contenido circula por Telegram y WhatsApp? ¿Se conservan los archivos editables del logotipo y de las plantillas? ¿Cuánto tarda alguien del equipo en localizar una grabación de hace seis meses? ¿Hay copia de seguridad del material en al menos dos ubicaciones?","lead":"SOBRE HERRAMIENTAS Y ARCHIVO."},{"t":"SOBRE COSTO. ¿Cuál es el costo mensual total de la operación, sumando nómina, servicios y licencias? ¿Existe inversión publicitaria en plataformas? ¿De cuánto?","lead":"SOBRE COSTO."}],"accion":"Responder por escrito. Es el prerrequisito para convertir seis diagnósticos inferidos en hechos."}]},{"id":"M21","titulo":"ENTREGABLES ESTRATÉGICOS (CIERRE DEL DIAGNÓSTICO)","estado_modulo":"ENTREGABLES ESTRATÉGICOS","alcance":"Informe técnico, FODA, KPIs y hoja de ruta entregados · 12 líneas de análisis","fuente":"Cierre estratégico construido sobre los hallazgos verificados de los veinte módulos anteriores.","calificacion":"Cierre estratégico: informe técnico, FODA, tablero de KPIs y hoja de ruta a 90 días","resumen":[{"t":"Este capítulo reúne el cierre estratégico del diagnóstico: el informe técnico completo, el FODA digital consolidado, el tablero de KPIs con línea base medida y la hoja de ruta priorizada a 90 días.","lead":""},{"t":"Los cuatro entregables de producción —manual de marca, calendario editorial trimestral, guía de tono y plan de inversión en pauta— se construyen sobre las decisiones que el cliente tome a partir de este diagnóstico, y sus insumos están íntegramente preparados aquí: valores cromáticos exactos, pareja tipográfica, distribución por pilar, horario y día óptimos por plataforma, y capacidad de producción cuantificada. Ese es el orden correcto: primero el diagnóstico aprobado, después la producción sobre él.","lead":""}],"puntos":[{"n":1,"punto":"Informe ejecutivo del diagnóstico (resumen para el candidato)","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"El resumen ejecutivo transversal está construido y encabeza este informe. Sus seis hallazgos son: el ecosistema tiene 1,22 millones de audiencia declarada y aproximadamente 1.700 personas de comunidad real; hay cero verificaciones en siete plataformas, con una cuenta suplantadora activa que acumula peticiones ciudadanas reales sin leer y un handle histórico libre; el 50,6% de la audiencia (618.000 personas) no tiene ninguna ruta de salida hacia un destino propio; la fórmula de contenido ganadora está probada con datos de tres años y representa menos de una cuarta parte de la producción; el cuello de botella no es la capacidad de producción (30-42 piezas semanales más 42,1 horas de programa) sino la arquitectura sobre la que se apoya; y el registro de sanciones internacionales condiciona la elegibilidad publicitaria y de verificación, por lo que cualquier plan que lo ignore partirá de un supuesto falso.","lead":""},{"t":"FALTA la versión de una página, en formato de presentación al principal, que es lo que normalmente se entiende por «informe ejecutivo para el candidato».","lead":""}],"accion":"Producir la versión de una página a partir del resumen ejecutivo de este documento."},{"n":2,"punto":"Informe técnico completo del diagnóstico 360","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"este informe ES el informe técnico completo del diagnóstico 360: recorre los 21 módulos de la cotización, punto por punto, con el hallazgo verificado de cada uno, su estado de auditoría y su acción recomendada, y declara la evidencia que sostiene cada uno.","lead":""},{"t":"Se apoya en catorce componentes de análisis con fechas de corte entre el 3 y el 5 de septiembre de 2026, detallados en el Anexo A.","lead":""}],"accion":"Entregado."},{"n":3,"punto":"FODA digital consolidado","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"FORTALEZAS. Audiencia total de 1,22 millones, la segunda mayor del conjunto de comparables conocidos. TikTok con engagement del 4,87% —dentro del rango que se considera bueno— y picos históricos de 2,7 millones de reproducciones, con audiencia demostradamente real y activa. Eje de paz fronteriza sin competencia: ningún otro gobernador venezolano puede ocuparlo. Autenticidad audiovisual alta y consistente en los tres registros de vídeo. Capacidad de producción alta y demostrada: 30-42 piezas semanales más 42,1 horas de programa en siete meses. Biografía de X y @usuario @FreddyBernal: los mejores identificadores del ecosistema, listos para replicar. Un logotipo de marca personal de calidad profesional, ya construido y pagado.","lead":"FORTALEZAS."},{"t":"DEBILIDADES. Cero verificaciones en las siete plataformas. Sin enlace en biografía en cinco de ocho cuentas: 618.000 seguidores sin ruta de salida. Engagement de X en 0,56%, muy por debajo de la referencia de 2-5%. Ocho cuentas dispersas con seis convenciones de @usuario y cuatro descripciones simultáneas del cargo, dos de ellas falsas o caducas. Cuatro sistemas gráficos conviviendo sin regla y un logotipo sin desplegar en ninguno de los ocho puntos de contacto. Tasa de atención a la comunidad esencialmente cero. Ausencia total de calendario editorial transversal, con tres meses de silencio en la plataforma principal. Adopción de IA nula o muy baja.","lead":"DEBILIDADES."},{"t":"OPORTUNIDADES. El registro humano y de identidad regional que Lacava explota con éxito ya está probado en los propios datos y está infraproducido. La frontera con Colombia es territorio narrativo exclusivo con rendimiento demostrado. Un canal de WhatsApp oficial: ningún gobernador venezolano lo ha ocupado de forma estructurada. Spaces y audio en vivo: formato donde su oficio de radio le da ventaja y donde nadie compite. Accesibilidad: diferencial de bajo coste que nadie trabaja en el panorama regional. Un núcleo de 10-20 embajadores espontáneos sin ningún aprovechamiento. El reparto de roles con la cuenta institucional de la Gobernación, que podría absorber el contenido pesado.","lead":"OPORTUNIDADES."},{"t":"AMENAZAS. La brecha con Lacava se amplía cada trimestre. El handle instagram.com/freddybernalr sigue libre y cualquiera puede registrarlo. La cuenta suplantadora acumula peticiones ciudadanas reales, incluida una sobre una desaparición forzada, sin atender desde hace más de un año. El reproche de clase se activa solo, sin coordinación, y crece con el contenido de consumo en contexto de escasez. El registro de sanciones internacionales condiciona la elegibilidad publicitaria, la cadena de pago y los procesos de verificación. Y la exposición del correo personal en los blogs heredados es un vector de toma de control si es correo de recuperación de alguna cuenta vigente.","lead":"AMENAZAS."}],"accion":"Entregado. Actualizar tras el cierre del Bloque 0 del plan de acción."},{"n":4,"punto":"Calendario editorial trimestral listo para ejecutar","estado":"FASE 2 — PROFUNDIZACIÓN","prioridad":"ALTA","hallazgo":[{"t":"Corresponde a la fase de producción.","lead":""},{"t":"LOS INSUMOS ESTÁN COMPLETOS Y SON DE CALIDAD INUSUAL, lo que hace que la producción sea relativamente rápida. La distribución por pilar está calculada (M13, punto 8, y M03, punto 8). El horario óptimo por plataforma está medido: 12:00-21:00 en X e Instagram, 22:00-23:59 en TikTok (M13, punto 6). El día óptimo está medido: jueves en las tres plataformas, con el martes y el sábado a evitar en TikTok (M13, punto 7). La capacidad de producción real está cuantificada: 30-42 piezas semanales (M20, punto 7). Y el flujo de trabajo que lo sostiene está propuesto (M20, punto 9).","lead":""},{"t":"Lo que falta es el documento operativo: la parrilla trimestral concreta con reparto por semana, plataforma, pilar y franja.","lead":""}],"accion":"Producir. Con los insumos disponibles es un trabajo de horas, no de semanas."},{"n":5,"punto":"Manual de marca digital (visual + verbal)","estado":"FASE 2 — PROFUNDIZACIÓN","prioridad":"CRÍTICA","hallazgo":[{"t":"Corresponde a la fase de producción.","lead":""},{"t":"LOS INSUMOS ESTÁN COMPLETOS. Del lado VISUAL, el M09 entrega los valores cromáticos exactos verificados en código (rgb(29,32,39), rgb(67,67,67), rgb(59,96,254), rgb(26,96,159), blanco), las familias tipográficas en uso (Encode Sans Condensed 700 y DM Sans, más cuatro familias no reconciliadas), el inventario de los cuatro sistemas gráficos conviviendo, las cuatro tipologías de pieza que faltan, y el diagnóstico de accesibilidad. Del lado VERBAL, el M10 consolidado entrega el mensaje central emergente («paz y frontera»), la distribución por pilar, la tipología de ganchos que funcionan y los que fallan, la decisión de voz pendiente (primera persona), y las cuatro frases probadas con datos.","lead":"LOS INSUMOS ESTÁN COMPLETOS."},{"t":"El M09 llega incluso a especificar el alcance mínimo: «un manual de marca mínimo de dos páginas: azul primario y amarillo de acento con valores exactos, pareja tipográfica única, versiones del logotipo, y la regla de cuándo aplica identidad personal frente a identidad de partido».","lead":""},{"t":"Es el entregable de mayor impacto pendiente, porque resuelve simultáneamente los cuatro sistemas gráficos, el logotipo sin desplegar, la alternancia de identidad sin criterio y la inconsistencia de voz.","lead":""}],"accion":"Producir. Empezar por la versión mínima de dos páginas que el M09 especifica; el manual completo puede venir después."},{"n":6,"punto":"Guía de tono de voz y lineamientos de redacción","estado":"FASE 2 — PROFUNDIZACIÓN","prioridad":"ALTA","hallazgo":[{"t":"Los LINEAMIENTOS ESTÁN TODOS DOCUMENTADOS Y MEDIDOS. Decisión de voz: siempre primera persona; ningún texto de boletín pegado sin reescribir (M02, M10). Estructura de copy: gancho en los primeros 100 caracteres, desarrollo en dos o tres bloques separados por salto de línea, cierre con acción concreta (M02). Aperturas prohibidas: «En el marco de», «Siguiendo el legado de», «Seguimos trabajando» (M02, M13). Aperturas que funcionan: imperativo, confidencia, pregunta directa, afirmación tajante de identidad, compromiso en primera persona, dato duro o escena (M10, punto 7). Estructura de hilo en X: dato o escena en la primera línea, atribución institucional en la última, cierre siempre con destino (M06). Registro por canal: vocabulario doctrinal reservado al programa largo, nunca al vídeo corto (M11). Protocolo de no confrontación: ninguna respuesta a críticas personales; si hay que corregir una información falsa, se hace con una cita o un hilo propio (M06). Y el mensaje por segmento de público, con los cuatro perfiles construidos con datos reales (M19, punto 10).","lead":""},{"t":"Lo que falta es el documento que reúna todo esto en forma de guía operativa para quien redacta.","lead":""}],"accion":"Producir. Puede integrarse como la mitad verbal del manual de marca del punto 5."},{"n":7,"punto":"Definición de KPIs y tablero de medición","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"Se propone un tablero de nueve indicadores, todos con línea base medida en esta auditoría, lo que permite medir progreso desde el primer mes. Ningún indicador propuesto requiere una herramienta que el equipo no pueda obtener.","lead":""},{"t":"REGLA DE MEDICIÓN: captura el día 1 de cada mes, de las ocho cuentas, por la misma persona y con el mismo método. A partir del tercer registro existe serie temporal propia y la auditoría deja de depender de terceros.","lead":"REGLA DE MEDICIÓN:"}],"accion":"Adoptar el tablero e iniciar el registro mensual. Es lo que convierte esta auditoría en un sistema y no en una foto.","tabla":{"headers":["Indicador","Línea base (sep. 2026)","Fuente del dato","Meta orientativa"],"rows":[["Cuentas verificadas","0 de 7","Observación directa","3 (X, TikTok, Instagram) en 90 días"],["Cuentas con enlace en biografía","1 de 8 (solo X)","Observación directa","6 de 8 en 15 días"],["Audiencia sin ruta de conversión","618.000 personas (50,6%)","Cálculo sobre inventario","Menos de 50.000 en 15 días"],["Engagement TikTok (interacciones/reproducciones)","4,87%","Muestra de 14 piezas","Sostener por encima del 4%"],["Engagement Instagram (me gusta/seguidores)","0,264% (agosto), en caída del 31%","Muestra de 127 piezas","Recuperar 0,382% (nivel de julio)"],["Alcance X sobre seguidores","0,56%","Muestra de 192 piezas","1,5% en 90 días"],["Comunidad activa total por ciclo","≈ 1.700 personas","Cálculo M19","3.000 en 90 días"],["Respuestas a comentarios por día","0","Observación directa","20 diarias desde el día 1"],["Peso de los tres pilares que rinden (paz, identidad, humano)","≈ 25% de la producción","Estimación M13","48% según distribución ideal"]]}},{"n":8,"punto":"Plan de crecimiento con metas por plataforma y periodo","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"SOLO X TIENE ESCENARIOS CONSTRUIBLES, porque es la única plataforma con dos puntos temporales documentados. Los tres escenarios (conservador 620.700, moderado 647.700, optimista 696.000 a doce meses) están en el M12, punto 6.","lead":""},{"t":"PARA TIKTOK E INSTAGRAM NO EXISTE TASA BASE VERIFICADA sobre la que construir proyección, y proyectar sin base sería inventar. El M12 lo declara expresamente.","lead":""},{"t":"EL DATO QUE MÁS CONDICIONA EL PLAN: TikTok tiene la mitad de seguidores que X pero genera picos de hasta 2,7 millones de reproducciones. Si el crecimiento de seguidores en TikTok sigue una proporción parecida a su alcance, esa plataforma superará a X en audiencia en plazo corto. Confirmarlo o descartarlo exige el dato del punto 2 del M12, que se obtiene en diez minutos.","lead":"EL DATO QUE MÁS CONDICIONA EL PLAN:"},{"t":"El plan de crecimiento completo, por tanto, NO PUEDE CERRARSE hasta capturar la evolución de seguidores de los últimos 30, 60 y 90 días en las tres plataformas principales. Es un bloqueo de diez minutos, no de recursos.","lead":""}],"accion":"Capturar la línea base y rehacer el plan. Es el prerrequisito, y es trivial de resolver."},{"n":9,"punto":"Plan de inversión en pauta con distribución por objetivo","estado":"FASE 2 — PROFUNDIZACIÓN","prioridad":"CRÍTICA","hallazgo":[{"t":"Y antes de producirlo hay una CONDICIÓN PREVIA DE VIABILIDAD que debe resolverse, documentada en el M16, punto 6: las plataformas de Meta y Google aplican listas de sanciones a anunciantes y a cuentas comerciales, y el sujeto está designado en diez listas de ocho jurisdicciones. Antes de presupuestar cualquier partida de pauta corresponde comprobar si las cuentas y la entidad pagadora son elegibles.","lead":""},{"t":"El mismo criterio aplica a la cadena de pago: pasarelas, herramientas de suscripción, plataformas de correo y proveedores con exposición a jurisdicciones sancionadoras.","lead":""},{"t":"Y hay una segunda condición estructural, del M05: Facebook es hoy un PERFIL PERSONAL, no una Página, y un perfil personal NO ADMITE ALCANCE PAGADO en absoluto. La conversión a Página es requisito previo para que Facebook siquiera pueda formar parte de un plan de pauta.","lead":""},{"t":"PLANIFICAR INVERSIÓN PUBLICITARIA SIN RESOLVER ESTOS DOS PUNTOS EXPONE EL PLAN A UN RECHAZO EN FASE DE EJECUCIÓN. La recomendación no es no hacerlo: es verificar primero.","lead":""}],"accion":"Verificar elegibilidad publicitaria y viabilidad de la cadena de pago ANTES de producir el plan. Convertir Facebook a Página. Solo entonces presupuestar."},{"n":10,"punto":"Presentación ejecutiva de resultados (deck)","estado":"FASE 2 — PROFUNDIZACIÓN","prioridad":"MEDIA","hallazgo":[{"t":"Se cierra con producción específica en formato de presentación.","lead":""},{"t":"El contenido está íntegramente disponible en este informe y en el resumen ejecutivo consolidado. Resta el trabajo de síntesis y diseño de la presentación.","lead":""}],"accion":"Producir a partir de este documento, priorizando los seis hallazgos del resumen ejecutivo y el plan de acción por bloques."},{"n":11,"punto":"Sesión presencial/virtual de presentación de hallazgos","estado":"FASE 2 — PROFUNDIZACIÓN","prioridad":"MEDIA","hallazgo":[{"t":"Es el único punto del módulo que no es un entregable documental sino un servicio, y por tanto no puede consolidarse desde el material existente.","lead":""},{"t":"Depende del punto 10 (el deck) como soporte.","lead":""}],"accion":"Agendar tras producir el deck."},{"n":12,"punto":"Hoja de ruta de implementación priorizada (90 días)","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"CONSOLIDADO Y ENTREGADO. La hoja de ruta completa a 90 días, en cinco bloques —primeras 24 horas, primeros 15 días, días 15 a 45, días 45 a 90 y permanente—, se entrega en el capítulo «Plan de acción consolidado» de este informe, construida cruzando las acciones recomendadas de los veinte módulos y ordenadas por urgencia, coste y dependencia.","lead":"CONSOLIDADO Y ENTREGADO."},{"t":"El criterio de priorización aplicado es explícito: primero lo que elimina un riesgo confirmado y no tiene coste ni dependencias (Bloque 0); después lo que desbloquea el resto del sistema (verificación, enlaces, línea base de métricas); después lo que corrige la coherencia; y por último lo que construye capacidad nueva.","lead":""},{"t":"Los cinco entregables pendientes de este módulo (puntos 4, 5, 6, 9 y 10) están incorporados a esa hoja de ruta con su bloque asignado.","lead":""}],"accion":"Ver el capítulo «
