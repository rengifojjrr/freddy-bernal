s. Es un canal de alcance cruzado sin usar.","lead":"ETIQUETADOS:"}],"accion":"Definir una plantilla mínima —franja inferior con logotipo de la Gobernación, tipografía única y ubicación fija del rótulo— y aplicarla a todos los vídeos. No requiere cambiar el estilo de grabación, solo unificar el remate."},{"n":5,"punto":"Desempeño por formato: Reels vs. carrusel vs. imagen fija","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Dos lecturas que conviene no confundir. En ME GUSTA, la diferencia entre formatos es pequeña y cambia de mes a mes: en julio las publicaciones fijas superaron a los Reels, pero eso lo explica un solo caso extremo —la pieza «Bolívar a Chávez», con 9.974 me gusta— que arrastra toda la media. Sin ese caso, los Reels rinden por encima.","lead":""},{"t":"En ALCANCE no hay comparación posible. Los Reels muestran reproducciones y las publicaciones fijas no. La mediana de reproducciones de un Reel es de 16.600 frente a una mediana de me gusta que ronda los 600. El Reel es el único formato que sale de la base de seguidores.","lead":""},{"t":"EL DATO MÁS IMPORTANTE DEL MÓDULO: un Reel alcanzó 340.000 reproducciones, el 139% de la base de seguidores. Eso significa que la mayoría de quienes lo vieron no lo seguían. Es la única evidencia, en todo el ecosistema auditado —X incluido, donde la media es del 0,56% de la audiencia propia—, de capacidad real de llegar a gente nueva. La distancia entre la mediana (6,8%) y el máximo (139%) indica que el potencial existe y que hoy se alcanza por casualidad, no por método.","lead":"EL DATO MÁS IMPORTANTE DEL MÓDULO:"}],"accion":"Analizar el Reel de 340.000 reproducciones: qué tema, qué gancho, qué duración, qué hora. Es el único caso documentado de alcance masivo del ecosistema y convertir esa excepción en método es la mayor palanca de la cuenta.","tabla":{"headers":["Métrica de los 24 Reels medidos","Valor","% sobre 244.000 seguidores"],"rows":[["Máximo","340.000 reproducciones","139%"],["Media","39.407","16,2%"],["Mediana","16.600","6,8%"],["Mínimo","5.004","2,1%"],["Reels por encima de 50.000","5 de 24","—"],["Reels por debajo de 10.000","5 de 24","—"]]}},{"n":6,"punto":"Frecuencia de publicación en feed (últimos 3, 6 y 12 meses)","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"Ritmo medido: 3,14 publicaciones diarias del 13 de julio al 2 de agosto (64 piezas en 20,4 días) y 2,96 del 13 de agosto al 3 de septiembre (63 piezas en 21,3 días). Media de ambas ventanas: 3,05 diarias sobre 127 publicaciones en 41,7 días.","lead":""},{"t":"Últimos 3 meses: aproximadamente 275 publicaciones. PROYECCIÓN sobre dos ventanas medidas y consistentes entre sí; fiabilidad alta. Últimos 6 meses: aproximadamente 550. PROYECCIÓN no verificada por la limitación de tasa de Instagram; fiabilidad media. Últimos 12 meses: aproximadamente 1.100. PROYECCIÓN no verificada; fiabilidad baja, y probablemente sobreestima, porque el histórico de la cuenta (4.392 publicaciones totales) sugiere que el ritmo actual es superior al promedio histórico.","lead":""},{"t":"CONTRASTE RELEVANTE CON X: allí la cuenta estuvo casi tres meses en silencio (marzo, abril y mayo de 2026). En Instagram, durante el mismo periodo, no se detecta ninguna caída equivalente. Son dos canales gestionados con criterios distintos, probablemente por equipos o rutinas distintas. Instagram es, con diferencia, el canal más disciplinado del ecosistema.","lead":"CONTRASTE RELEVANTE CON X:"},{"t":"ADVERTENCIA SOBRE EL VOLUMEN: tres publicaciones diarias sostenidas es un ritmo alto. Combinado con la caída del engagement del 31% entre julio y agosto, la hipótesis a comprobar es la saturación: más publicaciones repartiendo el mismo alcance entre más piezas.","lead":"ADVERTENCIA SOBRE EL VOLUMEN:"}],"accion":"Bajar el volumen de tres publicaciones diarias a dos y medir si el engagement se recupera. La hipótesis de saturación merece una prueba controlada."},{"n":7,"punto":"Horarios y días de publicación vs. horarios de audiencia activa","estado":"DATO INTERNO DE LA CUENTA","prioridad":"MEDIA","hallazgo":[{"t":"DISTRIBUCIÓN HORARIA (hora de Venezuela, 127 publicaciones): 00:00–06:59 el 2% (prácticamente nula, correcto); 07:00–11:59 el 26% (mañana sólida, arranque a las 8); 12:00–16:59 el 33% (franja más cargada, picos a las 13, 14 y 16); 17:00–21:59 el 30% (tarde-noche bien cubierta, segundo pico a las 21); 22:00–23:59 el 9%.","lead":""},{"t":"DISTRIBUCIÓN SEMANAL: Lun 6 · Mar 8 · Mié 4 · Jue 15 · Vie 13 · Sáb 10 · Dom 7. Jueves y viernes concentran el 44% del volumen; el miércoles es el día más débil con 4 publicaciones. Es la misma anomalía detectada en X: el arranque de semana está infracubierto y el pico llega al final.","lead":"DISTRIBUCIÓN SEMANAL:"},{"t":"HORARIOS DE AUDIENCIA ACTIVA: La franja en que la audiencia propia está activa solo la entrega Insights, en «Público → Horas más activas». Sin ese dato no se puede afirmar que los horarios de publicación coincidan con los de consumo. Lo que sí puede decirse desde fuera: la distribución actual cubre las tres franjas principales sin concentrarse en ninguna, lo cual es defendible cuando no se dispone del dato, pero es exactamente la clase de decisión que debería tomarse con la métrica delante. Los dos picos actuales (13–14h y 21h) son plausibles para Venezuela, aunque no están validados.","lead":"HORARIOS DE AUDIENCIA ACTIVA:"}],"accion":"Entrar en Insights, capturar la curva de horas activas y contrastarla con la distribución real. Es una comprobación de diez minutos que puede reordenar toda la parrilla. Reforzar el miércoles."},{"n":8,"punto":"Análisis de copies: extensión, gancho, estructura, CTA y emojis","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"LONGITUD MEDIA: 474–502 caracteres. LARGOS. Instagram corta en unos 125 caracteres con «más»; todo lo que va después lo lee una minoría. Se detectan copies de más de 1.100 caracteres.","lead":"LONGITUD MEDIA:"},{"t":"GANCHO (primeros 125 caracteres): los que funcionan abren con exclamación e imperativo («¡Miren dónde estoy!», «¡El Táchira no está solo!») o con una confidencia («Una de mis frutas favoritas es el Sapote»). Los que fallan abren con fórmula institucional («En el marco de…», «Siguiendo el legado del Comandante Chávez…»).","lead":""},{"t":"ESTRUCTURA: bloque único. No se usan saltos de línea ni viñetas. Un párrafo de 500 caracteres sin respiración se lee mal en móvil.","lead":"ESTRUCTURA:"},{"t":"LLAMADA A LA ACCIÓN: casi ausente. No se detectan CTA sistemáticos —y sin enlace en biografía tampoco habría destino al que enviar.","lead":"LLAMADA A LA ACCIÓN:"},{"t":"EMOJIS: presentes en el 24% de las publicaciones. Uso bajo e irregular; cuando aparecen funcionan bien como señalización (🚨 en la alerta vial, 🏡 en vivienda).","lead":"EMOJIS:"},{"t":"VOZ: INCONSISTENTE, y es el problema de fondo. Conviven la primera persona («Hoy asistí…», «Tuve el inmenso honor…») y la tercera persona de nota de prensa («Freddy Bernal califica al presidente…», «Junto al gobernador del estado Táchira, Freddy Bernal;…»). La tercera persona delata contenido copiado de boletín institucional.","lead":""},{"t":"ETIQUETAS DE RECICLAJE: aparecen marcas como «#RESUMEN ///» que revelan contenido reutilizado de otro canal sin adaptar.","lead":"ETIQUETAS DE RECICLAJE:"}],"accion":"Gancho en los primeros 100 caracteres, desarrollo en dos o tres bloques separados por salto de línea, cierre con acción concreta. Decisión de voz: siempre primera persona; si el texto viene de boletín, se reescribe, no se pega."},{"n":9,"punto":"Estrategia de hashtags: cantidad, relevancia, volumen y repetición","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"Solo entre el 19% y el 25% de las publicaciones lleva hashtag: tres de cada cuatro no llevan ninguno. La media es de 0,5 hashtags por publicación, muy por debajo de cualquier práctica de descubrimiento.","lead":""},{"t":"Las etiquetas usadas son principalmente #Tachira, #Venezuela, #ChavezSiempreChavez y #SANTOCRISTO: son etiquetas de identidad y de adscripción política, no de búsqueda. No generan descubrimiento porque nadie las explora para encontrar servicios o gestión.","lead":""},{"t":"No existe un conjunto fijo de etiquetas de marca reutilizado sistemáticamente, ni evidencia de selección por volumen de búsqueda, ni mezcla entre etiquetas amplias y de nicho.","lead":""},{"t":"DATO REVELADOR: la publicación con menos rendimiento de toda la muestra de julio llevaba como único texto «#ChavezSiempreChavez». El hashtag como sustituto del copy no funciona.","lead":"DATO REVELADOR:"}],"accion":"Construir un conjunto fijo de tres a cinco hashtags de marca y aplicarlos sistemáticamente, complementados con dos o tres de descubrimiento por pieza."},{"n":10,"punto":"Historias: frecuencia diaria, secuencias, stickers, encuestas y preguntas","estado":"DATO INTERNO DE LA CUENTA","prioridad":"MEDIA","hallazgo":[{"t":"Las Historias caducan a las 24 horas. Un análisis de frecuencia diaria, secuencias, uso de stickers, encuestas y cajas de preguntas exige monitorización durante dos o tres semanas o el archivo de la cuenta. Ninguna de las dos vías estaba disponible en el momento de la auditoría.","lead":""},{"t":"Lo que sí indica el perfil: la existencia de 14 destacadas demuestra que sí se publican Historias con regularidad y que se archivan por temas. No se pudo verificar el uso de stickers interactivos.","lead":""},{"t":"Dado que la cuenta no responde comentarios ni tiene enlace en biografía, las cajas de preguntas y las encuestas serían hoy la vía más barata de abrir un canal de escucha.","lead":""}],"accion":"Incorporar stickers de encuesta y caja de preguntas en Historias como canal de escucha mientras no exista formulario de atención."},{"n":11,"punto":"Tasa de engagement por publicación y promedio de cuenta","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"La tasa cayó un 31% en un mes: del 0,382% en la ventana de julio (933 me gusta medios sobre 244.000 seguidores) al 0,264% en la de agosto (645 me gusta medios). Una pérdida de 0,118 puntos.","lead":""},{"t":"Es el indicador más preocupante del módulo. Se produce mientras el volumen de publicación se mantiene por encima de tres diarias, lo que apunta a saturación: el mismo alcance repartido entre más piezas produce menos interacción por pieza.","lead":""},{"t":"Como referencia de orden de magnitud, una cuenta institucional grande y sana suele moverse entre el 0,5% y el 1,5%. Estos valores están por debajo, aunque conviene medirlos contra otros gobernadores venezolanos antes de sacar conclusiones definitivas.","lead":""}],"accion":"Prueba controlada: bajar a dos publicaciones diarias durante un mes y medir."},{"n":12,"punto":"Alcance de seguidores vs. no seguidores (penetración orgánica)","estado":"DATO INTERNO DE LA CUENTA","prioridad":"ALTA","hallazgo":[{"t":"El desglose exacto solo lo entrega Insights, en «Alcance → Seguidores / No seguidores».","lead":""},{"t":"Lo que sí puede establecerse desde fuera, y es sustancial: el Reel de 340.000 reproducciones equivale al 139% de la base de seguidores. Aunque un mismo usuario pueda contar varias veces, una cifra por encima del 100% solo se explica con distribución masiva fuera de la base propia. Hubo penetración real en no seguidores.","lead":""},{"t":"La mediana de 16.600 reproducciones equivale al 6,8% de los seguidores, valor compatible con una distribución mayoritariamente interna: la publicación llega sobre todo a quienes ya siguen la cuenta.","lead":""},{"t":"La conclusión operativa es que la cuenta tiene dos regímenes: uno habitual y encerrado en su propia base, y otro excepcional con alcance masivo.","lead":""}],"accion":"Capturar el desglose en Insights. Sin ese dato el punto queda incompleto por diseño."},{"n":13,"punto":"Top 15 publicaciones de mayor rendimiento y por qué funcionaron","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"TRES PATRONES GANADORES. Identidad regional profunda: la devoción a la Virgen de Táriba y al Santo Cristo aparece tres veces en el top 15; es el territorio emocional más rentable de la cuenta. Autoridad con resultado: seguridad y detenciones, siempre con un hecho concreto y verificable. Cotidiano y sensorial: la tizana y el sapote entran en el top 15 sin ninguna carga política, y son las dos publicaciones que mejor demuestran que el registro humano funciona — y también las dos menos replicadas.","lead":"TRES PATRONES GANADORES."}],"accion":"Explotar deliberadamente los dos filones probados: identidad regional profunda y registro cotidiano-sensorial. Son los territorios donde el rendimiento está demostrado y la producción es barata.","tabla":{"headers":["♥","Formato","Contenido","Por qué funcionó"],"rows":[["9.974","Fija","Conmemoración semana «Bolívar a Chávez», 72 natalicio","Efeméride política de máxima carga simbólica. Movilizó a la base militante."],["6.836","Reel","Misma efeméride, versión vídeo","Confirma el efecto: el tema, no el formato, explica el resultado."],["3.496","Reel","Declaración calificando a Donald Trump de «provocador permanente»","Confrontación internacional, titular claro. El copy en tercera persona indica origen en boletín."],["2.451","Reel","«Lo que se hace con amor, fluye»","Registro emocional y frase memorable de apertura."],["2.390","Reel","Tizana en el Sector El Mirador de San Cristóbal","COTIDIANO. Recomendación local, tono cercano, protagonismo del negocio y no del cargo."],["2.020","Reel","Tradición de la Virgen de la Consolación","Devoción regional, eje de máxima identificación del Táchira."],["1.939","Reel","Seguridad: «uno de los estados más seguros del occidente»","Registro de autoridad con dato comparativo."],["1.863","Reel","«¡Miren dónde estoy!» — Gran Parada del Corozo","Gancho imperativo en la primera línea. Curiosidad inmediata."],["1.771","Reel","El sapote: «mezcla entre lechoza y mango»","COTIDIANO otra vez. Descubrimiento sensorial, cero política."],["1.396","Reel","Ayuda tras las lluvias por instrucción de la Presidenta","Respuesta a emergencia con acción concreta."],["1.367","Fija","Eucaristía en honor a la Virgen de la Consolación de Táriba","Devoción regional."],["1.187","Reel","Despliegue con ministros en la Curva de La Ceiba","Gestión visible con equipo nacional."],["1.180","Fija","Peregrinación de la Virgen de Táriba","Devoción regional."],["1.179","Reel","Detención de un sujeto tras difusión de un vídeo","Autoridad con resultado verificable y trazable."],["1.176","Reel","«Táchira sigue siendo territorio de paz y seguridad»","Registro de autoridad."]]}},{"n":14,"punto":"Bottom 15 publicaciones de menor rendimiento y por qué fallaron","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"CUATRO CAUSAS DE FALLO, por orden de frecuencia. Apertura institucional: «En el marco de», «Siguiendo el legado de», «Seguimos trabajando» queman los 125 caracteres visibles sin decir nada. Copy desproporcionado: los tres peores resultados de la muestra superan los 1.000 caracteres. Voz ajena: los textos en tercera persona y las marcas de reciclaje («#RESUMEN ///») señalan contenido no adaptado, y el público lo detecta. Protagonista equivocado: las reuniones de partido y los actos internos no tienen público fuera de la sala.","lead":""},{"t":"El contraste decisivo: la efeméride doctrinal de 9.974 me gusta frente al «Siguiendo el legado del Comandante Chávez…» de 322 me gusta con 1.036 caracteres demuestra que no es el tema, es la construcción.","lead":""},{"t":"NOTA DE CALIDAD DEL DATO: los cuatro registros más bajos (1, 2, 6 y 15 me gusta) pueden estar afectados por un error de lectura del contador durante la extracción automática. Se recomienda verificarlos manualmente antes de citarlos fuera de este documento. El patrón general no depende de ellos.","lead":"NOTA DE CALIDAD DEL DATO:"}],"accion":"Prohibir las aperturas «En el marco de» y «Siguiendo el legado de». Ningún texto de boletín pegado sin reescribir.","tabla":{"headers":["♥","Formato","Contenido","Por qué falló"],"rows":[["1*","Reel","Coordinación desde Protección Civil en San Cristóbal","Puramente operativo, sin gancho ni protagonista."],["2*","Reel","Reencuentro con una tarjeta antigua entre papeles","Íntimo sin contexto suficiente para que importe."],["6*","Fija","Único texto: «#ChavezSiempreChavez»","Hashtag como sustituto del copy."],["15*","Fija","Sin texto","Publicación sin copy. Nada que leer, nada que compartir."],["138","Reel","«¡Seguimos brindando sonrisas a nuestra gente!»","Fórmula genérica. No dice qué, ni dónde, ni a quién."],["144","Reel","Copy de 1.122 caracteres","Extensión desproporcionada."],["176","Fija","Oro para Venezuela en la OMCC 2026, joven tachirense","Buena historia mal servida: merecía vídeo, no imagen fija."],["196","Fija","Reunión de la Presidenta con la dirección del PSUV","Contenido de partido. El protagonista no es él ni el estado."],["207","Reel","«#RESUMEN /// Reunión del Equipo Regional y Consejo Político»","Contenido reciclado con marca de otro canal."],["239","Reel","Copy en tercera persona: «Junto al gobernador… Freddy Bernal;…»","Nota de prensa pegada sin adaptar. La voz no es suya."],["243","Reel","Entrega de financiamientos","Acto institucional sin cifra, sin beneficiario, sin historia."],["294","Fija","Reunión de trabajo con la Presidenta y gobernadores","Foto de reunión. Copy de 113 caracteres sin información útil."],["302","Reel","Respuesta a un vídeo difundido (1.127 caracteres)","Reactivo y larguísimo. La explicación se pierde."],["307","Reel","Buenas noticias sobre la vía Rubio – San Cristóbal","Buen tema, mal gancho: la noticia no está en la primera línea."],["322","Reel","«Siguiendo el legado del Comandante Chávez…» (1.036 caracteres)","Apertura doctrinal más copy larguísimo."]]}},{"n":15,"punto":"Colaboraciones, menciones, etiquetas y contenido compartido","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"El 27% de las publicaciones incluye alguna mención, dato razonable, aunque las menciones se dirigen casi siempre a cuentas institucionales o de partido.","lead":""},{"t":"NO SE DETECTÓ NI UNA SOLA PUBLICACIÓN EN COLABORACIÓN (el formato de coautoría de Instagram, que hace aparecer la pieza en el feed de ambas cuentas). Es la herramienta de alcance cruzado más potente de la plataforma y está sin usar.","lead":""},{"t":"La pestaña de etiquetados tiene solo 12 elementos, lo que confirma la ausencia de práctica de etiquetado recíproco.","lead":""}],"accion":"Estrenar el formato de publicación en colaboración con alcaldías, gremios y cuentas de turismo regional."},{"n":16,"punto":"Uso de audios y tendencias en Reels","estado":"VERIFICADO","prioridad":"BAJA","hallazgo":[{"t":"Los Reels revisados utilizan audio original: voz del gobernador a cámara, sonido ambiente de los actos o locución institucional. No se detectó uso de audios en tendencia ni de plantillas de la plataforma.","lead":""},{"t":"Es una decisión defendible para un cargo público —el audio original transmite autenticidad y evita asociaciones indeseadas— pero renuncia por completo a la vía de descubrimiento que ofrecen los audios populares. Dado que la mediana de alcance es del 6,8% de los seguidores, esa renuncia tiene un coste medible.","lead":""}],"accion":"Decisión consciente a revisar, no error a corregir. Evaluar excepciones puntuales en contenido cultural o costumbrista."},{"n":17,"punto":"Gestión de comentarios: tasa de respuesta y tiempo de reacción","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Se revisaron los comentarios de la publicación más reciente: 14 comentarios visibles, CERO respuestas del titular de la cuenta. El tiempo de reacción no es medible porque no hay respuestas que cronometrar.","lead":""},{"t":"Los comentarios son mayoritariamente de apoyo («Excelente nuestro Gobernador Freddy Bernal», «Venezuela Renace, desde el Táchira…»), a diferencia del entorno hostil documentado en X.","lead":""},{"t":"OPORTUNIDAD ALTA: Instagram es el único canal donde el entorno de comentarios es amable. No responder ahí desaprovecha el terreno más fácil de todo el ecosistema.","lead":"OPORTUNIDAD ALTA:"}],"accion":"Rutina de veinte respuestas diarias, priorizando preguntas y peticiones, empezando por Instagram."},{"n":18,"punto":"Instagram Live: frecuencia, duración, picos de audiencia y retención","estado":"DATO INTERNO DE LA CUENTA","prioridad":"MEDIA","hallazgo":[{"t":"La frecuencia, duración, picos de audiencia y retención de las emisiones en directo solo constan en Insights. No se detectaron Lives archivados en el perfil público.","lead":""},{"t":"Contexto útil: en TikTok sí consta actividad de directos. Si el equipo emite en TikTok y no en Instagram, hay una audiencia de 244.000 personas sin acceso a ese formato. Y si emite en ambos, no queda rastro público en Instagram, lo que sugiere que no se archivan ni se reaprovechan.","lead":""}],"accion":"Capturar en Insights. Decidir si se archivan los Lives como contenido reutilizable."},{"n":19,"punto":"Accesibilidad: subtítulos, texto alternativo y contraste","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"TEXTO ALTERNATIVO: AUSENTE. No se detectó texto alternativo personalizado en las imágenes revisadas. Instagram genera una descripción automática, pero es genérica: un usuario con lector de pantalla no recibe información útil.","lead":"TEXTO ALTERNATIVO:"},{"t":"SUBTÍTULOS EN VÍDEO: no se detectó pista de subtítulos. Muchos vídeos incorporan rótulos gráficos incrustados, que ayudan al consumo sin sonido pero no son accesibles para lectores de pantalla ni traducibles.","lead":"SUBTÍTULOS EN VÍDEO:"},{"t":"CONTRASTE DE RÓTULOS: IRREGULAR. Varían en tipografía, tamaño y posición; algunos aparecen sobre imagen clara sin caja de fondo.","lead":"CONTRASTE DE RÓTULOS:"},{"t":"DESCRIPCIÓN EN EL COPY: PARCIAL. Los copies describen la actividad pero no la escena, por lo que no suplen la falta de texto alternativo.","lead":"DESCRIPCIÓN EN EL COPY:"},{"t":"La accesibilidad no es solo una obligación de buenas prácticas para una institución pública: Instagram usa el texto alternativo para clasificar contenido, de modo que rellenarlo mejora también la distribución. Es una de las pocas correcciones que suma en cumplimiento y en alcance al mismo tiempo.","lead":""}],"accion":"Activar los subtítulos automáticos en todos los Reels (Configuración avanzada → Subtítulos) y rellenar el texto alternativo en las publicaciones fijas. Se hacen en el momento de publicar y no cuestan producción."}]},{"id":"M03","titulo":"ANÁLISIS DE TIKTOK","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"63 publicaciones con hora exacta · histórico completo por ranking nativo · 16 líneas de análisis","fuente":"M03 — Análisis de TikTok @freddybernalr. Corte: 4 de septiembre de 2026. Base: 63 publicaciones recientes (29 jun–4 sep 2026) con fecha y hora exactas calculadas desde los identificadores internos, más el ranking nativo «Popular» que cubre el histórico completo, más submuestra de 14 piezas con me gusta y comentarios verificados.","calificacion":"La plataforma que mejor entiende su oficio y peor aprovecha su éxito","resumen":[{"t":"TikTok es, de las tres plataformas auditadas, la que mejor entiende su propio oficio: publica con ritmo casi diario, en el eje temático correcto, y logra picos de alcance que ninguna otra plataforma del ecosistema se acerca a igualar. También es la que peor aprovecha ese éxito, porque no hay ningún mecanismo que convierta ese alcance en algo más que views.","lead":""},{"t":"Límite honesto: el histórico de la cuenta ronda las 500-600 publicaciones a lo largo de más de tres años, y las 63 más recientes son una ventana de dos meses y una semana. Las conclusiones sobre horario y día son sólidas dentro de esa ventana; el top 20 histórico sí cubre todo el histórico porque procede del ranking nativo de la plataforma.","lead":""}],"puntos":[{"n":1,"punto":"Perfil: nombre, bio, foto y coherencia con otras plataformas","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"Nombre visible «Freddy Bernal», coherente con X. Biografía: «Gobernador del estado Táchira / Sígueme en mi cuenta alterna @freddybernalvzla». 115 cuentas seguidas. Foto: bandera con lazo negro, coherente con las otras tres plataformas principales.","lead":""},{"t":"SIN ENLACE EN BIOGRAFÍA. La segunda mayor audiencia del ecosistema (319.200 seguidores, 3 millones de me gusta acumulados) no tiene ninguna ruta de salida hacia un destino propio.","lead":"SIN ENLACE EN BIOGRAFÍA."},{"t":"SIN INSIGNIA DE VERIFICACIÓN, pese a que la audiencia y el cargo cumplen sobradamente el umbral de figura pública.","lead":""},{"t":"SIN EMOJIS de la bandera del Táchira, a diferencia de X e Instagram: el único elemento de marca transversal del ecosistema no llega a esta plataforma.","lead":""},{"t":"EL PROBLEMA MÁS GRAVE DEL PERFIL: la biografía remite activamente a @freddybernalvzla, cuenta que sigue describiéndose como «Candidato a la gobernación del Táchira». Cualquier persona que llegue desde el canal de mejor rendimiento del ecosistema puede terminar, en un clic, en un perfil que todavía se presenta como candidatura.","lead":"EL PROBLEMA MÁS GRAVE DEL PERFIL:"},{"t":"La cuenta principal NO está enlazada desde el sitio oficial. 319.200 seguidores fuera de todo inventario oficial.","lead":""}],"accion":"Añadir enlace en biografía. Corregir la biografía de la cuenta secundaria o retirar la remisión desde la principal. Iniciar verificación."},{"n":2,"punto":"Frecuencia de publicación y consistencia (3, 6 y 12 meses)","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"Ritmo casi diario en la ventana medida: 63 publicaciones en 68 días (29 de junio a 4 de septiembre de 2026), es decir aproximadamente 6,5 piezas por semana.","lead":""},{"t":"La consistencia es notablemente mejor que la de X, que estuvo tres meses en silencio en el mismo año. TikTok e Instagram mantienen ritmo; X no.","lead":""},{"t":"Los tramos de 6 y 12 meses no se pudieron medir: el histórico ronda las 500-600 publicaciones a lo largo de más de tres años y recorrerlo completo exigía una extracción que corresponde a la fase de profundización.","lead":""}],"accion":"Registro mensual de publicaciones para construir serie propia."},{"n":3,"punto":"Gancho en los primeros 3 segundos: tipología y efectividad","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"La tipología de gancho sí es identificable por el contenido del top histórico: pregunta directa al espectador («¿Cómo lo llaman en tu territorio?», 1,2 M de reproducciones), afirmación tajante de identidad («Táchira, territorio de paz», 1,7 M; «Frontera de paz», 1,6 M; «Bienvenidos a Venezuela», 1,8 M) y compromiso personal en primera persona («Soy un hombre de palabra, lo prometí y lo cumplí», 693 K).","lead":""},{"t":"Ninguno de los ganchos del top histórico abre con fórmula institucional. El patrón es consistente con lo observado en X e Instagram.","lead":""},{"t":"La EFECTIVIDAD MEDIDA del gancho —qué porcentaje de espectadores sigue viendo después del tercer segundo— es un dato de la analítica interna de la cuenta (Herramientas de creador → Analíticas) y no es observable desde fuera. Cruzarlo con la tipología es lo que convertiría esta observación en método.","lead":""}],"accion":"Capturar la curva de retención en Analíticas y cruzarla con la tipología de gancho de las 20 mejores piezas."},{"n":4,"punto":"Curva de retención y porcentaje de reproducción completa","estado":"DATO INTERNO DE LA CUENTA","prioridad":"ALTA","hallazgo":[{"t":"TikTok entrega la curva de retención y el porcentaje de reproducción completa únicamente en Herramientas de creador → Analíticas, con la cuenta iniciada. No hay ninguna vía externa de obtenerlo.","lead":""},{"t":"Es, junto con el punto 3, el dato que más cambiaría la producción: permite saber en qué segundo exacto se pierde la audiencia y ajustar la duración en consecuencia.","lead":""}],"accion":"Capturar en una sola sesión de trabajo. Cierra este punto y el 3, y habilita el 5."},{"n":5,"punto":"Duración óptima de video según rendimiento histórico","estado":"FASE 2 — PROFUNDIZACIÓN","prioridad":"MEDIA","hallazgo":[{"t":"Determinar la duración óptima exige cruzar la duración de cada pieza con su tasa de reproducción completa. Sin la analítica interna, cualquier cifra sería una suposición.","lead":""},{"t":"Lo que sí consta desde el M04 y el M08 es la evidencia inversa y muy elocuente en otro formato: en YouTube, una pieza de 1 minuto 47 segundos sobre cultura y raíces alcanzó 179 visualizaciones, por encima de la media de emisiones completas de dos horas del mismo canal. La dirección del hallazgo —lo corto rinde más— está documentada aunque el óptimo exacto no.","lead":""}],"accion":"Con la analítica delante, agrupar las piezas por tramos de duración y comparar tasa de reproducción completa."},{"n":6,"punto":"Uso de sonidos en tendencia vs. audio original","estado":"VERIFICADO","prioridad":"BAJA","hallazgo":[{"t":"Predomina el audio original: «sonido original - Freddy Bernal» en las piezas de «Reporte Bernal» y en el contenido de declaración. Se detectó al menos un uso de pista de la biblioteca nativa («Aesthetic - Tollan Kim» en un selfie de calle).","lead":""},{"t":"No se detectó uso sistemático de audios en tendencia. Es defendible para un cargo público —evita asociaciones indeseadas— pero renuncia a una vía de descubrimiento.","lead":""},{"t":"LICENCIAS: sin riesgo detectado. Se usa audio propio o pistas de las bibliotecas nativas de la plataforma, que son las opciones legalmente seguras.","lead":"LICENCIAS:"}],"accion":"Decisión consciente. Evaluar excepciones en contenido costumbrista o cultural."},{"n":7,"punto":"Texto en pantalla: legibilidad, ubicación, tiempo de lectura","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"Sans-serif de peso alto, geométrica y redondeada; blanco puro con sombra proyectada oscura, con buen contraste sobre fondos claros y oscuros. Tamaño aproximado del 8% de la altura del cuadro, adecuado para pantalla pequeña. Segmentación en dos líneas cortas por bloque con corte de frase natural («Yo no soy un / demagogo»), que facilita la lectura rápida.","lead":""},{"t":"PROBLEMA DE UBICACIÓN: el texto va centrado en el tercio inferior del área de vídeo, lo que en TikTok queda cerca de la zona que ocupa la interfaz de la plataforma (descripción, hashtags, botones). Es el ajuste más fácil de corregir de este punto.","lead":"PROBLEMA DE UBICACIÓN:"}],"accion":"Subir el bloque de texto para evitar la superposición con la interfaz nativa de TikTok."},{"n":8,"punto":"Subtítulos: presencia, precisión, estilo y sincronización","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Los subtítulos están QUEMADOS en la imagen, no son pista de texto real: la propiedad de pistas de texto del elemento de vídeo devuelve cero en todas las piezas revisadas.","lead":""},{"t":"Consecuencias: no son accesibles para lectores de pantalla, no son traducibles automáticamente por la plataforma —relevante en un estado fronterizo— y no son desactivables ni adaptables por el usuario. En positivo: garantizan que el texto se ve igual en cualquier reproductor y sobreviven a la redifusión, que es probablemente la razón de la elección.","lead":""},{"t":"ORTOGRAFÍA: sin errores detectados en los fragmentos revisados. La transcripción es fiel al audio.","lead":"ORTOGRAFÍA:"},{"t":"SINCRONIZACIÓN: no verificable. Exige recorrer el vídeo en el tiempo, y Se cierra con los archivos originales del equipo.","lead":"SINCRONIZACIÓN:"}],"accion":"Activar los subtítulos nativos de la plataforma COMO COMPLEMENTO del subtítulo quemado, para recuperar accesibilidad y traducción automática sin perder la ventaja de la redifusión."},{"n":9,"punto":"Duetos, stitches y contenido de reacción","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"No se detectó ningún dueto, stitch ni contenido de reacción en la muestra de 63 publicaciones recientes ni en el top 20 histórico.","lead":""},{"t":"Es el mismo patrón documentado en X con la ausencia total de citas: la cuenta no participa en ninguna conversación que no haya iniciado ella misma. En una plataforma cuya mecánica de descubrimiento premia precisamente la conversación entre cuentas, la renuncia es más costosa que en X.","lead":""},{"t":"Hay un caso que demuestra el potencial y que se produjo por accidente: la visita del cantante Jorge Celedón alcanzó 956,2 K de reproducciones, el único puesto del top 20 que depende de una figura externa.","lead":""}],"accion":"Incorporar el formato de reacción a denuncias ciudadanas: es el vehículo natural del ciclo denuncia-acción-resultado documentado en M18 y M19."},{"n":10,"punto":"Series, playlists y organización del contenido","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"No se detectó uso de playlists ni de series numeradas en la cuenta.","lead":""},{"t":"Es una carencia con coste porque SÍ existe material que pide esa organización: entre finales de junio y mediados de julio de 2026 la cuenta publicó una secuencia casi diaria sobre el terremoto de La Guaira con las mismas etiquetas (#LaGuaira, #terremoto, #fe, #ayuda humanitaria) y evolución de la ayuda a lo largo de varios días. Es el único tramo del histórico reciente donde se ve una estrategia de contenido sostenida, y alcanzó picos de 80.900 reproducciones.","lead":""},{"t":"Ese bloque habría sido una playlist natural, y el hecho de que no lo sea confirma que la constancia temática se produjo por la propia emergencia, no por diseño editorial.","lead":""}],"accion":"Crear playlists por eje: paz y frontera, seguridad con resultado, identidad regional, y una por cada emergencia o campaña sostenida."},{"n":11,"punto":"Comentarios: volumen, sentimiento y aprovechamiento para contenido","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Volumen medido sobre la submuestra de 14 publicaciones: media de 95 comentarios por pieza, sobre una media de 27.382 reproducciones y 915 me gusta.","lead":""},{"t":"SENTIMIENTO: MIXTO Y CONCRETO, muy distinto del de X. Convive el apoyo con la demanda específica y verificable: preguntas por la carretera Rubio–San Cristóbal, quejas por tiempos de espera en alcabalas con nombres de puestos concretos (Barinas, Guanare, Ospino, Valencia), junto a mensajes de respaldo.","lead":"SENTIMIENTO:"},{"t":"APROVECHAMIENTO PARA CONTENIDO: NULO. No se detectaron respuestas del titular en los hilos revisados ni piezas de contenido derivadas de comentarios. Es material de la mejor calidad posible —denuncia concreta, localizable y verificable— y se está desperdiciando por completo.","lead":"APROVECHAMIENTO PARA CONTENIDO:"}],"accion":"Convertir los comentarios en materia prima: el formato «respondo» en vídeo resuelve la conversación sin exponerse al hilo abierto."},{"n":12,"punto":"TikTok LIVE: frecuencia, duración y audiencia","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"Consta actividad de directos en TikTok, a diferencia de Instagram donde no se detectó ninguno archivado. La frecuencia, duración y audiencia solo constan en las analíticas de la cuenta.","lead":""},{"t":"La consecuencia estratégica sí es evaluable: si el equipo emite en TikTok y no en Instagram, hay una audiencia de 244.000 personas sin acceso a ese formato.","lead":""}],"accion":"Capturar métricas de Live en Analíticas. Decidir si se replica el formato en Instagram."},{"n":13,"punto":"Top 15 videos más virales y patrones replicables","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"Extraído del ranking nativo «Popular» de TikTok, que ordena todo el histórico desde la apertura de la cuenta. Las fechas se calcularon desde el identificador interno de cada vídeo y se verificaron contra un caso de fecha conocida con exactitud de minutos.","lead":""},{"t":"LECTURA DE CONJUNTO: el vídeo más antiguo del top 20 es de octubre de 2021 (recién asumido el cargo) y el más reciente de diciembre de 2025, lo que demuestra que la fórmula ganadora no es una moda pasajera sino un patrón sostenido durante toda la gestión.","lead":"LECTURA DE CONJUNTO:"},{"t":"DISTRIBUCIÓN DEL TOP 20: seis puestos corresponden al eje de paz y frontera, cuatro a identidad y cultura regional, tres a contenido humano-familiar, dos a fechas festivas y dos a seguridad con resultado. Solo un puesto —la visita de Jorge Celedón— depende de una figura externa, lo que confirma que el propio contenido institucional, bien elegido, funciona sin necesidad de invitados de fama.","lead":"DISTRIBUCIÓN DEL TOP 20:"},{"t":"TRES EJES VERBALES DOMINAN EL HISTÓRICO. PAZ: aparece en el 25% de las publicaciones recientes (16 de 63) y en 6 de los 20 mejores resultados; es la palabra más rentable de toda la cuenta. FE / AMOR: combinadas aparecen en más de un tercio de las publicaciones recientes (37% amor, 27% fe) y sostienen el bloque del terremoto de La Guaira. TRABAJO: es el hashtag más usado en términos absolutos (46%) pero rinde solo de forma moderada por sí solo — la combinación que dispara el resultado es «trabajo» más «paz» o «seguridad», nunca «trabajo» en solitario.","lead":"TRES EJES VERBALES DOMINAN EL HISTÓRICO."}],"accion":"La fórmula está probada con datos propios de tres años. No hay que inventar estrategia: hay que sostenerla.","tabla":{"headers":["#","Vistas","Fecha","Tema / contenido"],"rows":[["1","2,7 M","7 may 2023 (dom)","#seguridad #tachira #frontera"],["2","2,1 M","27 jul 2024 (sáb)","#seguridad #tachira #electricidad"],["3","1,8 M","13 ene 2025 (lun)","«Bienvenidos a Venezuela»"],["4","1,7 M","30 jul 2024 (mar)","«Táchira, territorio de paz»"],["5","1,6 M","12 may 2023 (vie)","«Frontera de paz»"],["6","1,3 M","22 sep 2024 (dom)","Trotar / ejercicio físico"],["7","1,2 M","22 jul 2023 (sáb)","«¿Cómo lo llaman en tu territorio?» — la esponjilla"],["8","1,1 M","22 nov 2025 (sáb)","Felicitación navideña"],["9","956,2 K","5 jul 2024 (vie)","Visita del cantante Jorge Celedón"],["10","720,2 K","13 ene 2025 (lun)","«Venezuela es tierra de paz»"],["11","695,9 K","31 dic 2024 (mar)","Contenido de familia"],["12","693,0 K","4 oct 2021 (lun)","«Soy un hombre de palabra, lo prometí y lo cumplí»"],["13","682,3 K","19 dic 2024 (jue)","Navidad"],["14","649,2 K","5 ene 2025 (dom)","«Amor por el Táchira»"],["15","628,6 K","10 mar 2024 (dom)","Táchira / Potosí, contenido territorial"],["16","602,9 K","12 may 2023 (vie)","Despliegue de seguridad en Ureña"],["17","580,4 K","31 dic 2025 (mié)","«Paz y alegría»"],["18","567,6 K","10 feb 2023 (vie)","Seguridad"],["19","530,4 K","18 may 2022 (mié)","Seboruco: humor y trabajo comunitario en dificultad"],["20","526,3 K","14 nov 2023 (mar)","Ejercicio físico"]]}},{"n":14,"punto":"Bottom 15 videos y causas de bajo rendimiento","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"EL HALLAZGO CENTRAL DE ESTE PUNTO: catorce de los veinte peores resultados (70%) caen en lunes, martes, miércoles o sábado — exactamente los cuatro días identificados como de menor rendimiento medio. Ninguno de los peores resultados cae en jueves antes de las 20:00, que es el día de mejor desempeño medio.","lead":"EL HALLAZGO CENTRAL DE ESTE PUNTO:"},{"t":"Eso significa que buena parte del bottom 20 no es un problema de contenido sino de calendario: piezas razonables publicadas en el peor momento posible. Es el patrón de fallo más claro y más fácil de corregir de todo el módulo.","lead":""},{"t":"OTRAS DOS CAUSAS. Etiquetas demasiado genéricas o rotas: dos publicaciones del bottom usan combinaciones sin sentido aparente («#66 #a») o etiquetas de una sola palabra sin contexto («#ayuda» a solas), lo que sugiere publicaciones subidas con prisa. Ausencia de etiqueta de descubrimiento en contenido de gestión pura: las publicaciones centradas solo en «trabajo» o «vialidad», sin eje emocional acompañante, rinden de forma discreta.","lead":"OTRAS DOS CAUSAS."},{"t":"El peor registro de la ventana es de 594 reproducciones (4 de septiembre, 19:17, viernes).","lead":""}],"accion":"Antes de tocar el contenido, corregir el calendario. Es coste cero."},{"n":15,"punto":"Penetración en «Para Ti» vs. tráfico de seguidores","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"El desglose exacto de fuentes de tráfico está en las analíticas de la cuenta. Lo que sí puede establecerse desde fuera es concluyente por magnitud: la cuenta tiene 319.200 seguidores y su top histórico registra piezas de 2,7 y 2,1 millones de reproducciones, entre seis y ocho veces su base de seguidores. Un resultado así solo se explica con distribución masiva en «Para Ti».","lead":""},{"t":"En la ventana reciente, la media de 27.400 reproducciones equivale al 8,6% de la base, valor compatible con distribución mayoritariamente interna. La cuenta tiene por tanto los mismos dos regímenes documentados en Instagram: uno habitual encerrado en su base y otro excepcional con alcance masivo.","lead":""},{"t":"La diferencia con Instagram es la magnitud del régimen excepcional: allí el techo fue 340.000 (139% de la base); aquí es 2,7 millones (846% de la base).","lead":""}],"accion":"Capturar el desglose de fuentes de tráfico en Analíticas."},{"n":16,"punto":"Adaptación de contenido de otras plataformas a TikTok (o falta de ella)","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Sí hay adaptación, y está mal resuelta en su caso más recurrente. «Reporte Bernal» se graba en horizontal para un formato de programa y se recorta a vertical 9:16 con un recorte central automático, sin reencuadre inteligente: el rótulo del set queda cortado a media palabra —en pantalla solo se lee «REPO»—, la cabeza del gobernador queda pegada al borde superior sin aire, y el tercio inferior lo ocupa un faldón gráfico redundante que consume aproximadamente el 30% del área útil.","lead":""},{"t":"Es contenido recurrente, no puntual: cada emisión arrastra el mismo defecto.","lead":""},{"t":"En sentido inverso, el contenido nativo de TikTok NO se está adaptando hacia arriba: el eje de paz y frontera, que domina el top histórico de esta plataforma con picos de 1,6 a 2,7 millones, apenas aparece en X e Instagram. La adaptación fluye en la dirección equivocada — se baja el material del programa de radio a TikTok, en vez de subir la fórmula que funciona en TikTok al resto del ecosistema.","lead":""}],"accion":"Grabar una segunda toma en vertical nativo para «Reporte Bernal», o reencuadrar manualmente. Y replicar en X e Instagram el eje temático que ya está probado aquí."}]},{"id":"M04","titulo":"ANÁLISIS DE YOUTUBE","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"Dos canales auditados · serie completa de 22 emisiones · 17 líneas de análisis","fuente":"Estudio de Presencia Digital y Reputación, capítulo 4 (M04). Corte: 4 de septiembre de 2026. Métricas históricas obtenidas por interfaz de datos de YouTube (vidIQ); serie completa de 22 emisiones del programa semanal, enero–agosto de 2026.","calificacion":"42,1 horas de programa producidas para 1.939 visualizaciones y 1 comentario","resumen":[{"t":"El hallazgo estructural: existen DOS canales con nombres casi idénticos, y el que la comunicación oficial presenta al público no es el que está en uso. El sitio web enlaza a @FreddyBernalOficial (910 suscriptores, sin banner, contenido destacado de hace un año); el canal donde realmente se publica el programa semanal es @FreddyBernal.oficial (175 suscriptores, banner de marca, publicación hace 6 días) y no está enlazado desde ningún sitio oficial.","lead":""},{"t":"Un ciudadano que llegue desde freddybernaloficial.com aterriza en el canal inactivo.","lead":""},{"t":"En algo más de siete meses, la estructura de comunicación ha producido cuarenta y dos horas de televisión. Es un volumen considerable: equivale a una jornada laboral semanal dedicada íntegramente a grabar, y presupone equipo técnico, realización, plató o unidad móvil y postproducción. El retorno medible es de 1.939 visualizaciones y un comentario.","lead":""}],"puntos":[{"n":1,"punto":"Configuración del canal: nombre, banner, descripción, enlaces y tráiler","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"@FreddyBernalOficial (ID UCmgsjmWHdagC0LuJE9_8OQw), creado el 15 de noviembre de 2023: 910 suscriptores, 135 vídeos, SIN banner de canal, sin pestaña Comunidad visible, contenido destacado de hace aproximadamente un año. Es el enlazado desde la web.","lead":""},{"t":"@FreddyBernal.oficial (ID UCHqsqLFI1gXpQkDYB4jHH3g), creado el 16 de enero de 2026: 175 suscriptores, 145 vídeos, SÍ tiene banner con identidad de marca coherente con la portada de Facebook, pestaña Comunidad activa, última publicación hace 6 días. NO está enlazado desde ninguna propiedad oficial.","lead":""},{"t":"Ninguno de los dos canales tiene tráiler de canal. El canal antiguo carece además de banner. Son elementos de configuración básica que no requieren producción nueva.","lead":""}],"accion":"Consolidar en un solo canal. Como el activo concentra la producción reciente y la identidad visual, y el antiguo concentra los suscriptores y el histórico de vistas, la opción de menor pérdida es migrar la publicación al canal con más suscriptores y redirigir el otro, no al revés.","tabla":{"headers":["Atributo","@FreddyBernalOficial","@FreddyBernal.oficial"],"rows":[["Creado","15 nov 2023","16 ene 2026"],["Suscriptores","910","175"],["Vídeos","135","145"],["Banner de canal","No tiene","Sí, con identidad de marca"],["Pestaña Comunidad","No visible","Sí"],["Última publicación","Contenido destacado de ~1 año","Hace 6 días"],["Enlazado desde su web","SÍ","NO"]]}},{"n":2,"punto":"Arquitectura de playlists y organización del contenido","estado":"VERIFICADO","prioridad":"BAJA","hallazgo":[{"t":"Ninguno de los dos canales presenta arquitectura de listas de reproducción. Con 255 emisiones acumuladas del programa semanal y dos canales que suman 280 vídeos, la ausencia de organización hace prácticamente inservible el archivo: no hay forma de que un ciudadano encuentre la emisión que trata su municipio o su problema.","lead":""}],"accion":"Crear listas por eje temático y por año. Es configuración, no producción."},{"n":3,"punto":"Estrategia Shorts vs. video largo: proporción y rendimiento","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"La estrategia actual es prácticamente todo vídeo largo: la práctica establecida consiste en publicar la emisión completa de 115 minutos de media.","lead":""},{"t":"El dato interno que contradice esa estrategia: entre las piezas cortas de 2 a 3 minutos que conviven en el canal, una de 1 minuto 47 segundos sobre cultura y raíces alcanzó 179 visualizaciones, POR ENCIMA de la media de 88,1 de las emisiones de dos horas. Otras piezas cortas rindieron igualmente bajo («Consulta 2026» con 2 visualizaciones, «Honor y gloria a los caídos» con 11, reinauguración de un módulo de salud con 22), de modo que lo corto no garantiza el resultado — pero el techo lo marca una pieza corta, no una larga.","lead":""},{"t":"Un programa de 115 minutos publicado íntegro es un formato de televisión trasladado a una plataforma que no lo premia.","lead":""}],"accion":"Mantener la emisión completa como archivo y derivar de cada episodio entre cinco y ocho piezas cortas, cada una con un solo asunto y titulada por ese asunto."},{"n":4,"punto":"Títulos: extensión, palabras clave, curiosidad y CTR asociado","estado":"DATO INTERNO DE LA CUENTA","prioridad":"MEDIA","hallazgo":[{"t":"Los títulos siguen una fórmula estable: número de emisión seguido de un lema institucional en mayúsculas — «TÁCHIRA ES TRABAJO CONJUNTO Y RESPUESTA CONCRETA», «TRABAJAMOS JUNTOS POR TÁCHIRA», «VENEZUELA TODA EN DEFENSA DE SU SOBERANÍA».","lead":""},{"t":"Son lemas de comunicación institucional, no titulares construidos para búsqueda ni para decisión de clic. Ninguno nombra el asunto concreto —la obra, el municipio, la decisión—, de modo que ninguno es localizable por búsqueda.","lead":""},{"t":"El CTR asociado a cada título es dato de YouTube Studio y requiere credenciales del titular.","lead":""}],"accion":"Un título que nombre el asunto concreto es localizable; un lema no lo es. Reescribir la fórmula de titulación."},{"n":5,"punto":"Miniaturas: diseño, legibilidad móvil, rostro, texto y CTR","estado":"DATO INTERNO DE LA CUENTA","prioridad":"MEDIA","hallazgo":[{"t":"Las miniaturas reproducen el fotograma o la placa del programa. No hay diseño de miniatura como pieza propia: ni rostro recortado, ni texto grande superpuesto, ni contraste construido para pantalla pequeña.","lead":""},{"t":"Es el mismo patrón documentado en el M09 para las portadas de destacadas de Instagram: se usa un fotograma en vez de una plantilla.","lead":""}],"accion":"Diseñar una plantilla de miniatura con rostro, tres o cuatro palabras grandes y color de marca."},{"n":6,"punto":"Descripciones: primeras líneas, enlaces, palabras clave y capítulos","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"No se detectó uso de capítulos (marcas de tiempo) en las emisiones. En un vídeo de 115 minutos, la ausencia de capítulos hace que el contenido sea prácticamente inaccesible: no hay forma de saltar al tramo de interés.","lead":""},{"t":"El detalle completo de primeras líneas, enlaces y palabras clave por vídeo exigía inspección individual de las 22 emisiones, que corresponde a la fase siguiente.","lead":""}],"accion":"Añadir capítulos a cada emisión. Es la corrección de mayor rendimiento en formato largo y no requiere reeditar el vídeo."},{"n":7,"punto":"Etiquetas y SEO interno del canal","estado":"DATO INTERNO DE LA CUENTA","prioridad":"MEDIA","hallazgo":[{"t":"Las etiquetas de vídeo no son públicamente visibles desde la interfaz de YouTube. El SEO interno del canal (palabras clave de canal, descripción larga) requiere acceso a YouTube Studio.","lead":""},{"t":"El indicio externo es negativo: como se documenta en el M07, ninguno de los dos canales aparece en la primera pantalla de resultados de Google para la consulta exacta del nombre del sujeto, mientras que sí aparecen dos vídeos sobre él publicados por un canal de terceros (Globovisión).","lead":""}],"accion":"Auditoría de SEO interno con credenciales del canal."},{"n":8,"punto":"Retención de audiencia y duración media de reproducción","estado":"DATO INTERNO DE LA CUENTA","prioridad":"ALTA","hallazgo":[{"t":"La retención de audiencia y la duración media de reproducción residen exclusivamente en YouTube Studio. Sin credenciales del titular, ningún analista externo puede obtenerlas.","lead":""},{"t":"El dato sustituto disponible es demoledor por sí solo: 46 visualizaciones por hora de programa producida. Cualquiera que sea la curva de retención interna, la magnitud del problema no está en cuántos se quedan sino en cuántos llegan.","lead":""}],"accion":"Capturar en YouTube Studio."},{"n":9,"punto":"Tarjetas, pantallas finales y enlaces internos entre videos","estado":"VERIFICADO","prioridad":"BAJA","hallazgo":[{"t":"No se detectó uso de tarjetas ni de pantallas finales que enlacen entre vídeos del canal. Con 280 vídeos entre los dos canales, la ausencia de enlaces internos significa que cada pieza es un callejón sin salida.","lead":""},{"t":"Coherente con el patrón general del ecosistema documentado en el M01: no hay arquitectura de conversión en ninguna plataforma.","lead":""}],"accion":"Configurar pantalla final estándar en todas las piezas nuevas."},{"n":10,"punto":"Pestaña Comunidad: uso, frecuencia y engagement","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"La pestaña Comunidad está DISPONIBLE en el canal activo (@FreddyBernal.oficial) y SIN USO. En el canal antiguo no es visible.","lead":""},{"t":"Es el mecanismo nativo para sostener conversación entre emisiones, y el dato de un solo comentario en 22 episodios indica exactamente que ese vacío existe.","lead":""}],"accion":"Activar y usar la pestaña Comunidad del canal activo."},{"n":11,"punto":"Transmisiones en vivo: frecuencia, duración, audiencia y reutilización","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"«Reporte Bernal» es el activo audiovisual central: un programa semanal que a la fecha del estudio alcanza la emisión número 255. Se analizaron las 22 emisiones del periodo enero–agosto de 2026 (números 234 a 255).","lead":""},{"t":"Duración media por emisión: 115 minutos. Horas de programa producidas: 42,1 en algo más de siete meses. Visualizaciones totales de las 22 emisiones: 1.939. Media por emisión: 88,1. Mediana: 84. Rango: 20 a 222. Me gusta totales de las 22 emisiones: 43. Comentarios totales de las 22 emisiones: 1. Visualizaciones por hora de programa producida: 46.","lead":""},{"t":"La media de 88 visualizaciones debe leerse contra los 175 suscriptores del canal —cada emisión alcanza a la mitad de quienes se suscribieron voluntariamente— y contra el resto de la presencia digital del sujeto, que suma 602.800 seguidores en X y 318.600 en TikTok. El programa no llega a una fracción perceptible de esa audiencia.","lead":""},{"t":"Un solo comentario en 22 emisiones no es engagement bajo: es ausencia total de conversación. Para un formato cuyos títulos invocan sistemáticamente «trabajo conjunto», «participación» y «poder popular», la métrica contradice frontalmente la promesa declarada.","lead":""},{"t":"REUTILIZACIÓN: es donde está la oportunidad. Como se documenta en el M08 y el M11, de ese programa sí se derivan recortes que circulan en TikTok e Instagram con rendimiento incomparablemente mayor. El problema es que la derivación es informal, no sistemática, y arrastra el defecto de reencuadre vertical documentado en el M08.","lead":"REUTILIZACIÓN:"}],"accion":"Replantear el formato: mantener la emisión íntegra como archivo y derivar sistemáticamente de cinco a ocho piezas cortas por episodio, cada una con un solo asunto.","tabla":{"headers":["Indicador","Valor"],"rows":[["Emisiones analizadas","22 (números 234 a 255)"],["Periodo","17 ene – 28 ago 2026"],["Duración media por emisión","115 minutos"],["Horas de programa producidas","42,1 h"],["Visualizaciones totales","1.939"],["Visualizaciones medias por emisión","88,1"],["Mediana","84"],["Rango","20 – 222"],["Me gusta totales de las 22 emisiones","43"],["Comentarios totales de las 22 emisiones","1"],["Visualizaciones por hora de programa producida","46"]]}},{"n":12,"punto":"Subtítulos, traducciones y accesibilidad","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Coherente con lo documentado en el M08 y el M09 para el resto del ecosistema: los subtítulos que circulan en las piezas derivadas están quemados en la imagen, no son pista de texto real, y por tanto no son accesibles para lectores de pantalla ni traducibles automáticamente.","lead":""},{"t":"En YouTube, a diferencia de TikTok e Instagram, el subtitulado automático es nativo y gratuito, y las traducciones se generan sobre esa pista. Es la plataforma donde la carencia tiene menos justificación técnica.","lead":""}],"accion":"Activar el subtitulado automático de YouTube y revisarlo. Es coste cero."},{"n":13,"punto":"Frecuencia de publicación y consistencia del calendario","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"El canal activo mantiene ritmo semanal consistente: 22 emisiones entre el 17 de enero y el 28 de agosto de 2026, con publicación hace 6 días en el momento del corte. La consistencia del calendario del programa es, de hecho, buena.","lead":""},{"t":"El canal antiguo —el enlazado desde la web— lleva aproximadamente once meses sin publicar. El último vídeo se sitúa hacia octubre de 2025.","lead":""},{"t":"Es un caso llamativo: la consistencia existe, pero se está aplicando en el canal invisible.","lead":""}],"accion":"Corregir el enlace del sitio oficial. Es una corrección de minutos y probablemente la de mejor relación esfuerzo-resultado de todo el estudio."},{"n":14,"punto":"Top 15 videos por vistas, retención y conversión","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"Dentro de la serie de 22 emisiones analizadas, el rango va de 20 a 222 visualizaciones, con mediana de 84. El techo de la serie completa (222) sigue siendo inferior a lo que cualquier pieza mediana de TikTok consigue en minutos.","lead":""},{"t":"El mejor rendimiento relativo del canal no corresponde a una emisión sino a una pieza corta: 179 visualizaciones para 1 minuto 47 segundos sobre cultura y raíces.","lead":""},{"t":"Retención y conversión por vídeo requieren YouTube Studio.","lead":""}],"accion":"Con acceso al canal, construir el top 15 real cruzando vistas con retención."},{"n":15,"punto":"Bottom 15 videos y diagnóstico de bajo rendimiento","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"Los peores registros identificados son piezas cortas de contenido protocolario o administrativo: «Consulta 2026» con 2 visualizaciones, «Honor y gloria a los caídos» con 11, la reinauguración de un módulo de salud con 22.","lead":""},{"t":"El diagnóstico coincide con el del resto del ecosistema: el contenido protocolario sin protagonista ni gancho rinde mal en cualquier plataforma. La diferencia es que en YouTube el suelo es tan bajo que la distinción entre el top y el bottom pierde significado operativo.","lead":""}],"accion":"El problema de este canal no está en el bottom sino en el techo. La acción es de arquitectura, no de contenido."},{"n":16,"punto":"Fuentes de tráfico: búsqueda, sugeridos, externos y navegación","estado":"DATO INTERNO DE LA CUENTA","prioridad":"ALTA","hallazgo":[{"t":"El desglose de fuentes de tráfico reside en YouTube Studio.","lead":""},{"t":"El indicio externo disponible sí es concluyente en una dirección: el sitio oficial enlaza al canal INACTIVO, de modo que todo el tráfico que la comunicación oficial genera hacia YouTube se pierde en un canal sin contenido nuevo. Es una fuga de tráfico externo documentada sin necesidad de la analítica.","lead":""}],"accion":"Corregir el enlace del sitio y después medir el efecto en la fuente «externos»."},{"n":17,"punto":"Comentarios: volumen, sentimiento y moderación","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"UN comentario en 22 emisiones, 42,1 horas de programa y 1.939 visualizaciones. No hay volumen sobre el que medir sentimiento ni moderación.","lead":""},{"t":"Es el dato más elocuente del módulo, y su lectura correcta no es que la audiencia sea hostil o indiferente sino que no existe: no hay suficiente gente viendo para que se produzca conversación.","lead":""}],"accion":"El comentario llegará cuando llegue la audiencia. La prioridad es el punto 11 y el 13, no la moderación."}]},{"id":"M05","titulo":"ANÁLISIS DE FACEBOOK","estado_modulo":"DIAGNÓSTICO COMPLETO — el tipo de cuenta es el hallazgo","alcance":"Lectura directa de perfil · 10 líneas de análisis","fuente":"Estudio de Presencia Digital y Reputación, capítulo 5 (M05). Corte: 4 de septiembre de 2026, lectura directa de perfil.","calificacion":"Cuenta viva y bien atendida en lo visual. El problema es de arquitectura, no de contenido","resumen":[{"t":"El hallazgo es el tipo de cuenta. Se trata de un PERFIL PERSONAL, no de una Página. La diferencia es determinante y explica por qué la mitad de los puntos de este módulo no puede entregarse: un perfil personal de Facebook no genera estadísticas nativas, no admite alcance pagado, no reporta demografía de audiencia, no admite roles de administrador y no se vincula a un Business Manager.","lead":""},{"t":"No es que falten datos por falta de acceso: la configuración elegida no los produce para nadie, ni siquiera para el titular.","lead":""}],"puntos":[{"n":1,"punto":"Tipo de presencia: perfil personal, página, o ambos (y su coherencia)","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"En el bloque «Detalles» consta «Perfil · Creador(a) digital». Es un perfil personal, no una Página. 32.000 seguidores, 12 seguidos, última publicación hace 10 horas.","lead":""},{"t":"La categoría «Creador digital» es la que Facebook asigna por defecto a perfiles con seguidores públicos activados; no implica una decisión deliberada. Lo que sí implica es que nunca se realizó la conversión a Página.","lead":""},{"t":"La cuenta está viva y bien atendida en lo visual: portada diseñada («Freddy Bernal · Gobernador»), línea gráfica coherente con el banner del canal de YouTube activo, publicación diaria. Foto de perfil: bandera de Venezuela con lazo negro, coherente con las demás plataformas. Pestañas activas: Publicaciones, Información, Reels, Fotos, Amigos, Música.","lead":""},{"t":"Consecuencia directa: cinco de los diez puntos de este módulo —alcance orgánico frente a pagado, perfil demográfico por rango etario, métricas de eventos, estadísticas de transmisiones en vivo y tiempo de respuesta medido— son INEXISTENTES mientras la presencia sea un perfil.","lead":""},{"t":"Riesgo adicional documentado en el M01: el perfil mantiene la lista de amigos pública y publica una fecha de nacimiento (16 de junio de 1961) que no coincide con la de las fuentes públicas (16 de junio de 1962).","lead":""}],"accion":"Convertir el perfil en Página. Es la recomendación de mayor impacto estructural del estudio. Facebook ofrece una herramienta nativa de conversión que preserva seguidores y contenido, y desbloquea de golpe estadísticas nativas, elegibilidad para contenido promocionado, demografía de audiencia, métricas de vídeo y de directo, y tiempos de respuesta medidos."},{"n":2,"punto":"Configuración de página: información, categorías, botones de acción","estado":"HALLAZGO ESTRUCTURAL","prioridad":"ALTA","hallazgo":[{"t":"Un perfil personal no dispone de la configuración de Página: no tiene botones de acción (Contactar, Enviar mensaje, Reservar), ni categorías institucionales, ni campos de información de organización.","lead":""},{"t":"La categoría declarada es «Creador(a) digital», asignada por defecto.","lead":""},{"t":"Esta carencia se suma al patrón documentado en el M01: en ninguna plataforma existe una vía de contacto declarada.","lead":""}],"accion":"Se resuelve con el punto 1. Tras la conversión, configurar categoría de funcionario gubernamental y botón de acción."},{"n":3,"punto":"Frecuencia y formatos de publicación (foto, video, enlace, texto)","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"Publicación diaria confirmada: última publicación hace 10 horas en el momento del corte, y hace 6 horas en la verificación del M01. Es, junto con Instagram y TikTok, uno de los canales con ritmo sostenido.","lead":""},{"t":"Pestañas de Reels y Música habilitadas SIN USO APARENTE. Reels es actualmente el formato con mayor distribución orgánica de la plataforma y no se está utilizando.","lead":""},{"t":"El conteo exacto por formato corresponde a la fase de profundización.; el M20 lo registra como «activa, sin conteo específico» al calcular la capacidad de producción total del equipo.","lead":""}],"accion":"Aprovechar Reels, hoy el formato de mayor distribución orgánica de la plataforma y habilitado sin uso."},{"n":4,"punto":"Alcance orgánico vs. alcance pagado","estado":"HALLAZGO ESTRUCTURAL","prioridad":"ALTA","hallazgo":[{"t":"Un perfil personal no admite alcance pagado ni reporta alcance orgánico. No hay estadísticas nativas que consultar, ni con acceso del titular.","lead":""},{"t":"Advertencia cruzada con el M16: incluso tras la conversión a Página, la elegibilidad publicitaria debe verificarse antes de presupuestar cualquier partida de pauta, porque las plataformas de Meta y Google aplican listas de sanciones a anunciantes y a cuentas comerciales.","lead":""}],"accion":"Se desbloquea con la conversión a Página, y debe verificarse elegibilidad publicitaria antes de planificar inversión."},{"n":5,"punto":"Rendimiento de video y transmisiones en vivo","estado":"HALLAZGO ESTRUCTURAL","prioridad":"MEDIA","hallazgo":[{"t":"Las métricas de vídeo y de directo son funcionalidad de Página. Un perfil no las produce.","lead":""},{"t":"Contexto útil: el M04 documenta que el programa semanal se publica en YouTube y el M03 que hay actividad de directos en TikTok. Facebook, con 32.000 seguidores y portada de marca coherente, no está participando de ese circuito.","lead":""}],"accion":"Se desbloquea con la conversión."},{"n":6,"punto":"Grupos: participación, administración y comunidades afines","estado":"DIAGNÓSTICO POR EVIDENCIA","prioridad":"BAJA","hallazgo":[{"t":"No se registró participación del perfil en grupos ni administración de comunidades afines en la inspección realizada. El punto corresponde a la fase de profundización.","lead":""},{"t":"Indicio relevante: el ratio de 12 cuentas seguidas frente a 32.000 seguidores configura un canal de emisión estrictamente unidireccional, lo que hace poco probable una práctica activa de participación en comunidades.","lead":""}],"accion":"Verificar internamente si existe participación en grupos locales, que en Venezuela siguen siendo un canal vecinal relevante."},{"n":7,"punto":"Eventos: uso, convocatoria y conversión a asistencia","estado":"HALLAZGO ESTRUCTURAL","prioridad":"BAJA","hallazgo":[{"t":"La herramienta de Eventos con métricas de convocatoria y conversión a asistencia es funcionalidad de Página.","lead":""},{"t":"El M09 documenta además que no existe ninguna plantilla gráfica de convocatoria en todo el sistema de diseño: ni pieza de evento con fecha, hora y lugar. La carencia es doble, de herramienta y de formato.","lead":""}],"accion":"Se desbloquea con la conversión. Crear en paralelo la plantilla de convocatoria que falta (ver M09, punto 4)."},{"n":8,"punto":"Comentarios y mensajes: volumen, sentimiento y tiempo de respuesta","estado":"HALLAZGO ESTRUCTURAL","prioridad":"ALTA","hallazgo":[{"t":"El tiempo de respuesta medido y la tasa de respuesta a mensajes son indicadores de Página. Un perfil no los reporta.","lead":""},{"t":"Lo que sí puede afirmarse por coherencia con los módulos M02, M03 y M19: la tasa de atención a la comunidad es esencialmente cero en las tres plataformas principales, y no hay ningún indicio de que Facebook sea la excepción.","lead":""},{"t":"El M19 documenta la consecuencia más grave de ese vacío: los ciudadanos están dejando peticiones de auxilio reales en una cuenta suplantadora inactiva de Instagram porque no encuentran ningún canal oficial de atención.","lead":""}],"accion":"Asignar a una persona la respuesta de comentarios y mensajes, en Facebook igual que en Instagram."},{"n":9,"punto":"Perfil demográfico de la audiencia (clave por rango etario en esta red)","estado":"HALLAZGO ESTRUCTURAL","prioridad":"ALTA","hallazgo":[{"t":"Es el punto donde la configuración duele más. Facebook es, de las plataformas del ecosistema, aquella cuya audiencia tiene el perfil etario más alto, y por tanto la más útil para segmentar por edad — y es justamente en la que no hay dato demográfico alguno, ni siquiera para el titular.","lead":""},{"t":"El M19 documenta la misma carencia en Instagram y TikTok, con la diferencia de que allí SÍ existe el dato y solo hace falta entrar con la cuenta. Aquí no existe.","lead":""}],"accion":"Se desbloquea con la conversión a Página. Es el argumento más fuerte para hacerla."},{"n":10,"punto":"Top y bottom de publicaciones con análisis de causas","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"Sin estadísticas nativas, el análisis de top y bottom solo puede apoyarse en las interacciones visibles públicamente, lo que produce un ranking sesgado hacia lo que la plataforma muestra y no hacia lo que realmente alcanzó.","lead":""},{"t":"El patrón de causas identificado en el análisis cruzado de las tres plataformas principales (M13) es transversal y aplica también aquí: funciona el vídeo con gancho en la primera línea, la frase corta, la autoridad con resultado verificable y el contenido humano sin carga política; falla la apertura institucional larga, el texto reciclado de boletín en tercera persona y el acto interno de partido.","lead":""}],"accion":"Se completa tras la conversión, con estadísticas nativas."}]},{"id":"M06","titulo":"ANÁLISIS DE X (TWITTER)","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"193 publicaciones + 40 reposts + 108 respuestas recibidas · 10 líneas de análisis","fuente":"Análisis de X (Twitter) @FreddyBernal. Periodo: marzo–septiembre de 2026 con contexto de enero y febrero. Corte: 3 de septiembre de 2026. Base: 193 publicaciones del periodo marzo–septiembre, más 17 de enero–mayo para contexto, 40 reposts y 108 respuestas recibidas, recogidas por navegación directa con sesión iniciada.","calificacion":"Audiencia heredada de 16 años, gestionada de forma intermitente, sin arquitectura de perfil ni estrategia de conversación","resumen":[{"t":"La cuenta tiene 602.800 seguidores y una media de 3.399 visualizaciones por publicación. Eso es un 0,56% de la audiencia propia: de cada mil seguidores, cinco ven lo que publica.","lead":""},{"t":"Es la plataforma más cara de la cotización ($180) y la que peor rinde del ecosistema. También es la única donde se documenta un incidente reputacional activo.","lead":""},{"t":"Diagnóstico: una cuenta con audiencia heredada de 16 años, gestionada de forma intermitente, sin arquitectura de perfil, sin estrategia de conversación y con un problema de percepción de clase que su propio contenido amplifica.","lead":""}],"puntos":[{"n":1,"punto":"Perfil: nombre, bio, imagen, encabezado, enlace y fijado","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"Tres de los cinco elementos visuales y estructurales del perfil —foto, encabezado y publicación fijada— están sin resolver. Son correcciones de minutos, sin coste, y afectan a cada una de las visitas al perfil.","lead":""},{"t":"LO QUE ESTÁ BIEN. El @usuario @FreddyBernal es óptimo: limpio, deducible, sin sufijos; es el mejor identificador de todo su ecosistema. La biografía («Tachirense / Gobernador reelecto del estado Táchira 💛🖤❤️») es la mejor de sus ocho plataformas: declara origen, cargo exacto con la reelección y usa los colores del Táchira. Es la plantilla que deberían copiar las demás. El enlace a freddybernaloficial.com está presente y es la única plataforma suya que enlaza a un destino propio. La antigüedad —alta en febrero de 2010, más de 16 años— es un activo de autoridad considerable e infrautilizado.","lead":"LO QUE ESTÁ BIEN."}],"accion":"Poner imagen de encabezado y publicación fijada. Cambiar la ubicación de «Venezuela» a «San Cristóbal, Táchira». Fijar fecha de retorno del retrato.","tabla":{"headers":["Elemento","Estado actual","Evaluación"],"rows":[["Nombre visible","Freddy Bernal","Correcto: es la forma con la que la ciudadanía y la prensa lo buscan."],["@usuario","@FreddyBernal","ÓPTIMO. El mejor identificador de todo su ecosistema."],["Biografía","«Tachirense / Gobernador reelecto del estado Táchira 💛🖤❤️»","LA MEJOR de sus ocho plataformas. Plantilla a replicar."],["Ubicación","Venezuela","Demasiado amplia. Debería decir San Cristóbal o Táchira: es un cargo regional y la geolocalización afecta al alcance local."],["Enlace","freddybernaloficial.com","Presente y correcto. Única plataforma suya que enlaza a destino propio."],["Antigüedad","Alta en febrero de 2010","Más de 16 años. Activo de autoridad infrautilizado."],["Foto de perfil","Bandera de Venezuela con lazo negro","PROBLEMA. No es un retrato. A 40 píxeles no se ve su cara. Sin fecha de retorno, la pérdida es permanente."],["Encabezado","NO TIENE. Gris liso.","PROBLEMA GRAVE. El espacio gráfico más visible de la plataforma, en el perfil con 602.800 seguidores, está vacío."],["Publicación fijada","NO TIENE","PROBLEMA. Es el único contenido que ve el 100% de quien visita el perfil. Desaprovechada."],["Insignia","NO TIENE","CRÍTICO. Sin verificación, con 602.800 seguidores y antecedentes de suplantación."]]}},{"n":2,"punto":"Frecuencia de publicación y distribución horaria","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"EL HALLAZGO CENTRAL DEL ANÁLISIS. Entre el 6 de marzo y el 4 de junio de 2026 hay un vacío de casi tres meses sin una sola publicación: una en marzo, cero en abril, cero en mayo. En ese periodo el estado no dejó de tener gobierno, pero el canal principal del gobernador —el que concentra la mitad de su audiencia digital— dejó de existir para sus 602.800 seguidores.","lead":"EL HALLAZGO CENTRAL DEL ANÁLISIS."},{"t":"Y no es un episodio aislado: el patrón se repite. La cuenta se enciende con la Feria en enero, se apaga en febrero, revive con el terremoto en junio. Publica cuando hay acontecimiento, no cuando hay gestión. La reactivación de junio no fue una decisión editorial: la disparó el terremoto del 24.","lead":""},{"t":"LA DISTRIBUCIÓN HORARIA es, de hecho, lo mejor gestionado de la cuenta. Sobre las 192 publicaciones del trimestre activo: 00:00–06:59 el 3% (5 publicaciones, correcto); 07:00–11:59 el 26% (49, mañana consistente con arranque a las 8); 12:00–16:59 el 31% (59, franja más cargada con picos a las 12 y a las 14); 17:00–21:59 el 32% (61, la franja de mayor consumo móvil, bien cubierta); 22:00–23:59 el 7% (14). El 92% de las publicaciones cae entre las 8 y las 22 horas. No hay indicio de programación automática rígida: el patrón es orgánico y coherente con una agenda de actos públicos.","lead":""},{"t":"DISTRIBUCIÓN SEMANAL: Lun 17 · Mar 32 · Mié 29 · Jue 36 · Vie 25 · Sáb 33 · Dom 20. El jueves es el día más activo y el lunes el más flojo, un patrón inverso al habitual en comunicación institucional, donde el lunes marca agenda. El fin de semana concentra el 28% del volumen, coherente con recorridos territoriales.","lead":"DISTRIBUCIÓN SEMANAL:"}],"accion":"Establecer un mínimo de publicación innegociable: tres al día en días laborables, incluidos los periodos sin acontecimiento. El silencio de marzo a mayo es el mayor daño acumulado del semestre. Reforzar el lunes.","tabla":{"headers":["Mes (2026)","Publicaciones","Lectura"],"rows":[["Enero","13","Reactivación el 14 de enero: «Volvemos a retomar este espacio para mantenernos conectados». El volumen lo sostiene la Feria de San Sebastián."],["Febrero","1","Caída total."],["Marzo","1","Última publicación el día 6."],["Abril","0","SILENCIO ABSOLUTO"],["Mayo","0","SILENCIO ABSOLUTO"],["Junio","43","Reactivación el 4 de junio. El volumen se dispara tras el terremoto del 24."],["Julio","62","Sostenido. Gestión de la emergencia."],["Agosto","84","Máximo del periodo. Media de 2,7 publicaciones diarias."],["1–3 septiembre","3","Ritmo estable."]]}},{"n":3,"punto":"Tipología de publicación: original, respuesta, cita, hilo, repost","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"El vídeo es el formato dominante (111 publicaciones, 58%) y es una decisión acertada: X prioriza el vídeo nativo y seis de sus siete publicaciones más vistas del semestre lo llevan. La imagen (61, 32%) es complemento correcto. El texto plano (20, 10%) es bajo, y es donde se concentran sus peores resultados: las ocho publicaciones menos vistas del semestre son todas de texto plano.","lead":""},{"t":"LA AUSENCIA DE CITAS ES UNA ANOMALÍA NOTABLE: cero citas en todo el periodo. La cita es la herramienta que permite a un cargo público entrar en una conversación ajena aportando contexto, corregir una información errónea sin amplificarla como respuesta, o respaldar públicamente el trabajo de un equipo. Cero usos en seis meses significa que la cuenta no participa en ninguna conversación que no haya iniciado ella misma. Combinado con las 9 respuestas a terceros y las 16 menciones (8%), el perfil es un altavoz cerrado.","lead":"LA AUSENCIA DE CITAS ES UNA ANOMALÍA NOTABLE:"},{"t":"El 45% de las publicaciones lleva hashtag, predominando #Tachira y #Venezuela.","lead":""}],"accion":"Incorporar el formato cita, hoy en cero usos. Es la vía para entrar en conversaciones ajenas y para respaldar a equipos y aliados sin coste.","tabla":{"headers":["Tipo","Cantidad","Peso"],"rows":[["Vídeo","111","58%"],["Imagen","61","32%"],["Solo texto","20","10%"],["Publicaciones en hilo","35","18%"],["Respuestas a terceros","9 en 3 meses","—"],["Citas (quote)","0","0% — NO USA EL FORMATO"],["Reposts","40 en 3 semanas","—"],["Con hashtag","86","45%"],["Con mención a otra cuenta","16","8% — muy bajo"]]}},{"n":4,"punto":"Hilos: estructura, extensión, ganchos y cierre","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"35 de las 192 publicaciones del trimestre (18%) forman parte de un hilo, identificables por la numeración explícita al final del texto (1/2, 2/2, 1/3).","lead":""},{"t":"ESTRUCTURA: predominan los hilos de dos entregas, con algunos de tres. No hay hilos largos de cinco o más, que son los que generan permanencia en el timeline. La numeración es correcta y visible, en formato n/n al cierre, y es una buena práctica. El encadenamiento es correcto: las continuaciones se publican como respuesta a la propia publicación anterior — de las 27 respuestas emitidas en el trimestre, 18 son precisamente continuaciones de hilo propio.","lead":"ESTRUCTURA:"},{"t":"GANCHOS: es el punto más débil de la estructura. Los hilos abren con fórmulas institucionales y no con tensión narrativa. Ejemplo del periodo: «Bajo la orientación de la Presidenta @delcyrodriguezv y en perfecta unión entre el gobierno nacional, regional, municipal y el poder popular…» — la primera línea la ocupa el reconocimiento jerárquico, no el hecho. Mejor construido: «Nuestro objetivo es claro: dar la batalla definitiva contra la fiebre aftosa.»","lead":"GANCHOS:"},{"t":"El contraste con sus publicaciones más vistas es revelador: las que funcionan abren con un dato duro o una escena («La Guaira enfrenta el reto de gestionar 1.248 millones de toneladas de escombros») o con una frase corta y tajante («¡El que se vuelva loco y quiera delinquir irá preso!»). El hilo institucional entierra el dato en la segunda o tercera línea.","lead":""},{"t":"CIERRE: los hilos cierran con fórmulas de compromiso genérico y sin llamada a la acción. Ninguno de los revisados termina con un enlace, una vía de contacto, un dato verificable o una petición concreta. Dado que el perfil SÍ tiene enlace al sitio propio, el cierre de hilo es la ocasión natural para dirigir tráfico y no se usa nunca.","lead":"CIERRE:"}],"accion":"Invertir el orden: dato o escena en la primera línea, atribución institucional en la última. Cerrar siempre con destino: un enlace, un teléfono, una dirección."},{"n":5,"punto":"Tono, agresividad y manejo de confrontación pública","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"TONO DOMINANTE: institucional-afectivo. Primera persona del plural, apelación al pueblo tachirense, vocabulario de fe y de familia, emojis de la bandera regional. Es un tono cálido y coherente con el personaje público («Siempre he sido y seré un hombre de fe como la mayoría de los tachirenses», «Orgulloso de mis hijas Miranda y Melania porque culminaron su año escolar»). Sobre ese fondo aparece un segundo registro, de autoridad tajante, en materia de seguridad («¡El que se vuelva loco y quiera delinquir irá preso!», «ordené la captura inmediata del responsable»), que es el que mejor rinde en métricas.","lead":"TONO DOMINANTE:"},{"t":"EL EPISODIO DEL 4 AL 6 DE AGOSTO. En 48 horas la cuenta abandona ambos registros y entra en confrontación personal con ciudadanos críticos. Es el único episodio de este tipo en todo el periodo y concentra cuatro de las cinco interacciones con particulares del trimestre.","lead":"EL EPISODIO DEL 4 AL 6 DE AGOSTO."},{"t":"CUATRO OBSERVACIONES. Asimetría de coste: las cuatro respuestas suman 104 visualizaciones. Son irrelevantes en alcance, pero quedan permanentemente asociadas a la cuenta y son material listo para captura de pantalla y difusión por terceros; el riesgo reputacional es muy superior al alcance obtenido. Errores de redacción: «Le falso acá eres tú» y «creo que soy demasiado importa de para yo» contienen faltas evidentes, indican escritura impulsiva y sin revisión, casi con certeza desde el móvil, y confirman que la cuenta la opera él personalmente al menos en parte. Descalificación del interlocutor: llamar «boot contratado» a una ciudadana y corregirle la ortografía a otro traslada la discusión del asunto a l
