a persona, que es exactamente el movimiento que sus críticos buscan. Concentración temporal: que todo ocurra en 48 horas sugiere un episodio de reacción puntual, no una política de comunicación — y eso es una buena noticia, porque es corregible con un protocolo.","lead":"CUATRO OBSERVACIONES."},{"t":"FUERA DE ESE EPISODIO, la respuesta a la crítica es el silencio. Publicaciones que acumulan cientos de respuestas adversas no reciben ninguna réplica, aclaración ni corrección. No hay desmentidos, ni hilos de contexto, ni rectificaciones.","lead":""}],"accion":"Protocolo de no confrontación: ninguna respuesta a críticas personales. Si hay que corregir una información falsa, se hace con una cita o un hilo propio, nunca con una respuesta personal.","tabla":{"headers":["Fecha","Destinatario","Texto literal","Vistas"],"rows":[["4 ago","@javiergon56","«Le falso acá eres tú!»","31"],["4 ago","@MedinaNoelito","«Aprende a escribir primero y después hablamos.»","25"],["4 ago","@saludenlacomuna","«Jajajajajaja creo que soy demasiado importa de para yo, que no paras de escribir.»","19"],["6 ago","@DanielaAlv186","«Un simple boot contratado!»","29"]]}},{"n":6,"punto":"Interacción con periodistas, medios y líderes de opinión","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"RESPUESTAS EMITIDAS (junio–septiembre): 27 en total, de las cuales 18 (67%) son continuación de hilo propio —no son conversación, son estructura de publicación— y solo 9 (33%) son respuestas a terceros: tres al mes de media. De esas nueve, cuatro fueron a cuentas institucionales (@Minhvi_Oficial, @Cancilleria_ve, @CapitanEscalon, @mippci_ven) y cinco a ciudadanos particulares, de las cuales cuatro fueron confrontativas y una cordial («Saludos compatriota. Bendiciones!»).","lead":""},{"t":"A PERIODISTAS O MEDIOS: NINGUNA en todo el periodo.","lead":"A PERIODISTAS O MEDIOS:"},{"t":"REPOSTS (10 de agosto – 1 de septiembre): 40 en tres semanas. @Tachira_Natural 9, @VTVcanal8 5, @PartidoPSUV 4, @CapitanEscalon 4, @NicolasMaduro 3, @ElCuartoRoj0 3, @Minhvi_Oficial / @delcyrodriguezv / @mippci_ven 2 cada una, y una cada uno @ConElMazoDando, @mintransporteve, @ivt_tachira, @MaduroJefe, @Cancilleria_ve y @jaarreaza. Medios independientes o periodistas: NINGUNO.","lead":""},{"t":"El 100% de la amplificación procede del ecosistema estatal y partidista. No hay un solo repost, mención o respuesta dirigida a un periodista, un medio regional independiente, una universidad, una cámara empresarial, un gremio o una organización de la sociedad civil del Táchira. Para un gobernador de un estado fronterizo, la ausencia total de interlocución con el tejido no gubernamental de su propia región es una limitación estratégica: reduce el alcance a quienes ya están convencidos y cede el terreno de la conversación pública regional a otros.","lead":""},{"t":"El único gesto de apertura detectado en el semestre es la interacción con @Cancilleria_ve el 23 de agosto («Que viva Venezuela y Colombia!!!!») y el contenido sobre Cúcuta y la relación binacional.","lead":""}],"accion":"Abrir interlocución con el tejido regional no gubernamental: gremios, universidades, cámaras, alcaldías."},{"n":7,"punto":"Aprovechamiento de tendencias y coyuntura","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"El 45% de las publicaciones lleva hashtag, casi siempre #Tachira o #Venezuela. Son etiquetas de identidad, no de tendencia: no generan descubrimiento porque no compiten por ningún tema activo. Sí hay un uso correcto de etiqueta de acontecimiento con #24Jun para el terremoto, que funciona como agregador. No hay evidencia de aprovechamiento de tendencias ajenas ni de conversaciones nacionales fuera de la agenda oficial.","lead":""},{"t":"LA OPORTUNIDAD DESAPROVECHADA. El Táchira es frontera con Colombia. La cuenta toca el eje binacional de forma episódica —el peluche de los niños de Cúcuta, el saludo a la Cancillería, la cabalgata binacional— y siempre con buen resultado: el vídeo del peluche es la segunda publicación más vista del semestre, con 39.316 visualizaciones. Es un eje diferencial, propio del cargo, que ningún otro gobernador venezolano puede ocupar, y se usa por accidente en lugar de por estrategia.","lead":"LA OPORTUNIDAD DESAPROVECHADA."}],"accion":"Convertir el eje binacional con Colombia en línea editorial estable y no en episodio. Es su activo diferencial y ya demuestra rendimiento.","tabla":{"headers":["Coyuntura","Periodo","Respuesta de la cuenta","Evaluación"],"rows":[["Feria Internacional de San Sebastián","Enero","Reactivación tras silencio. 13 publicaciones. Mejores cifras del mes: 5.665 y 4.308 visualizaciones.","Bien aprovechada. El error es que se apaga en cuanto termina."],["Situación de Nicolás Maduro y Cilia Flores","Enero","Serie de publicaciones de campaña por su liberación. La del 23 de enero alcanza 36.747 visualizaciones y 400 reposts.","Contenido con mayor amplificación de todo el periodo, muy por encima de cualquier contenido de gestión regional. El músculo de difusión está en la agenda nacional, no en la regional."],["Terremoto del 24 de junio en La Guaira","Junio–julio","Motor de la reactivación. Ayuda humanitaria, gestión de escombros (1.248 millones de toneladas), solidaridad de Cúcuta.","EL MEJOR TRABAJO DEL SEMESTRE: contenido útil, cifras concretas y coordinación visible."],["Seguridad ciudadana","Junio y agosto","«Ordené la captura inmediata del responsable» (35.184 v.), «¡El que se vuelva loco y quiera delinquir irá preso!» (21.000 v.)","El eje que mejor rinde de forma consistente. Su registro más eficaz."],["Fiebre aftosa y sector productivo","Agosto","Hilo sobre la batalla contra la aftosa, abastecimiento y exportación.","Bien construido pero con alcance bajo. No se apoyó en gremios ni productores para amplificarlo."]]}},{"n":8,"punto":"Spaces: uso, frecuencia y audiencia","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Resultado: cero. Nunca ha usado Spaces. La búsqueda en la plataforma, sin restricción de fechas, no devuelve ningún resultado en toda la historia de la cuenta desde 2010.","lead":""},{"t":"Es una ausencia significativa por tres razones concretas. Primera: el formato encaja con su perfil. Su registro natural es oral, directo y de improvisación —lo demuestran sus vídeos, que son el 58% de su contenido y donde obtiene sus mejores resultados—, y Spaces es exactamente ese registro sin necesidad de producción audiovisual. Segunda: resolvería el problema de conversación. La cuenta emite y no dialoga; un Space semanal de treinta minutos permite atender preguntas de ciudadanos en un marco controlado, con moderación, sin exponerse al hilo abierto de respuestas donde hoy solo hay hostilidad. Tercera: cubriría el vacío de atención ciudadana, documentado en el M01 y el M19 — los ciudadanos están dejando peticiones en una cuenta suplantadora inactiva porque no existe ninguna vía de contacto oficial.","lead":""},{"t":"El M11 refuerza el argumento con dato propio: acumula más de 250 emisiones de un programa de radio de dos horas. Es el formato donde su ventaja de oficio es mayor. Y el M17 documenta que ningún competidor regional lo usa.","lead":""}],"accion":"Un Space quincenal de 30 minutos, con tema anunciado 48 horas antes, moderado por el equipo de prensa y con dos o tres invitados del ámbito regional. Es la acción de mayor retorno potencial de todo el informe, porque ataca simultáneamente la falta de conversación, la ausencia de canal de atención y la nula interlocución con el tejido no gubernamental."},{"n":9,"punto":"Top y bottom de publicaciones con análisis de causas","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"Media del periodo: 3.399 visualizaciones, 37 me gusta, 24 reposts y 20 respuestas por publicación. Sobre 602.800 seguidores, la media de visualizaciones equivale al 0,56% de la audiencia.","lead":""},{"t":"PATRÓN GENERAL. Lo que funciona: vídeo, frase corta, autoridad, cifra concreta, historia con protagonista distinto del emisor. Lo que no funciona: texto plano, fórmula institucional larga, agradecimiento genérico, respuesta en el hilo. Lo que funciona pero perjudica: contenido personal cotidiano en contexto de penuria, y preguntas abiertas sin moderación — ambos maximizan alcance a costa de la reputación.","lead":"PATRÓN GENERAL."},{"t":"LAS OCHO MENOS VISTAS comparten tres rasgos: son respuestas, son de texto plano y son de una sola línea. La plataforma no distribuye las respuestas fuera del hilo. La conclusión operativa es doble: el contenido de valor nunca debe publicarse como respuesta; y las cuatro confrontaciones del 4 al 6 de agosto obtuvieron entre 19 y 31 visualizaciones — el coste reputacional fue muy alto y el alcance, nulo.","lead":""}],"accion":"El contenido de valor nunca se publica como respuesta.","tabla":{"headers":["Fecha","Contenido","Vistas","♥ / RT / 💬","Causa del resultado"],"rows":[["31 ago","Vídeo comiéndose un helado en un Farmatodo de Caracas: «¡Más nada pues!»","72.356","160 / 73 / 365","Máximo alcance del semestre, pero por polémica, no por adhesión. Más del doble de respuestas que de me gusta."],["2 jul","Vídeo del peluche enviado por niños de Cúcuta para los de La Guaira","39.316","177 / 108 / 68","EL MEJOR RENDIMIENTO CUALITATIVO: alto alcance con reacción favorable y baja fricción."],["18 jun","«Ordené la captura inmediata del responsable. Ya está bajo custodia»","35.184","105 / 47 / 97","Autoridad y respuesta inmediata. Mensaje corto, primera persona, resultado verificable."],["11 jun","«Esto me lo hizo la juventud patriótica del #Táchira. ¿Cuál les gusta más? Los leo»","23.111","35 / 35 / 217","6,2 respuestas por cada me gusta: el peor ratio del semestre. Pregunta abierta a audiencia adversa sin moderación."],["8 ago","«¡El que se vuelva loco y quiera delinquir irá preso!»","21.000","184 / 124 / 56","Frase corta, tajante, sin adorno institucional. El registro de autoridad."],["2 ago","Imagen sin texto","19.003","299 / 176 / 114","Mayor número de me gusta y reposts del semestre. La pieza gráfica funciona incluso sin copy."],["10 jul","Gestión de 1.248 millones de toneladas de escombros en La Guaira","17.931","156 / 130 / 111","El mejor contenido de gestión: cifra concreta, magnitud comprensible, plan asociado."],["— BOTTOM —","«Trabajo en equipo, triunfo seguro!!!!» (1 sep)","12","Respuesta, texto","La menos vista del semestre."],["","«Jajajajajaja creo que soy demasiado importa de para yo…» (4 ago)","19","Respuesta, texto","Confrontación."],["","«Saludos compatriota. Bendiciones!» (4 ago)","23","Respuesta, texto",""],["","«Aprende a escribir primero y después hablamos.» (4 ago)","25","Respuesta, texto","Confrontación."],["","«Un simple boot contratado!» (6 ago)","29","Respuesta, texto","Confrontación."],["","«Le falso acá eres tú!» (4 ago)","31","Respuesta, texto","Confrontación."],["","«Un Gobierno Nacional que responde de manera oportuna…» (4 ago)","58","Respuesta, texto",""],["","«Que viva Venezuela y Colombia!!!!» (23 ago)","62","Respuesta, texto","Buen tema, publicado como respuesta."]]}},{"n":10,"punto":"Análisis de respuestas recibidas: sentimiento y detractores recurrentes","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"VOLUMEN DE FRICCIÓN: 15 de las 192 publicaciones del trimestre (8%) reciben más respuestas que me gusta. En comunicación política esa inversión es el indicador más fiable de rechazo: la gente se toma la molestia de escribir en lugar de la de aprobar. Los casos más extremos: «¿Cuál les gusta más? Los leo» con ratio 6,2 (35 me gusta / 217 respuestas); «Siempre he sido y seré un hombre de fe» con 4,0 (26 / 105); «Ser policía es ser portador de paz» con 3,1 (134 / 418); el vídeo del helado con 2,3 (160 / 365).","lead":"VOLUMEN DE FRICCIÓN:"},{"t":"EL PATRÓN ES CLARO: las publicaciones de tono personal, moral o de fe son las que más fricción generan. El contenido operativo y de gestión pasa sin ruido. Cuando el gobernador habla de sí mismo —su familia, su fe, su helado—, la respuesta es hostil; cuando habla de escombros, aftosa o detenciones, no lo es.","lead":"EL PATRÓN ES CLARO:"},{"t":"COMPOSICIÓN DEL SENTIMIENTO sobre una muestra de 108 respuestas a la publicación de mayor alcance: contraste privilegio/penuria 30% (el eje dominante con diferencia; compara su consumo con la situación económica del ciudadano, con referencias a sueldos de docentes y médicos); insulto directo 13%; fallos de servicios públicos 9% (cortes de luz de más de seis horas diarias, agua, hospitales, escuelas — la crítica más accionable de todas); acusaciones de corrupción 8%; situación de Maduro y Cilia Flores 5%; peso colombiano y casas de cambio 2% (tema técnico, local y de su competencia directa); apoyo explícito 4%.","lead":""},{"t":"La proporción es de aproximadamente una respuesta favorable por cada quince críticas. Es un entorno de respuestas hostil de forma estructural, no episódica.","lead":""},{"t":"DETRACTORES RECURRENTES: dentro de una sola publicación se detectan cuentas que intervienen repetidamente —una con cuatro respuestas y otra con dos. La reincidencia dentro de un mismo hilo indica participación deliberada más que reacción espontánea. No obstante, la muestra de una publicación no basta para construir un mapa fiable: para eso hace falta cruzar las respuestas de veinte o treinta publicaciones e identificar qué cuentas aparecen en todas.","lead":"DETRACTORES RECURRENTES:"},{"t":"MATIZ CRÍTICO DEL M19: este sentimiento hostil procede casi por completo de X, que es la plataforma con la audiencia más envejecida y el menor alcance real. En TikTok e Instagram, donde está la audiencia viva, el entorno es sustancialmente más favorable. Tomar decisiones de comunicación leyendo solo los comentarios de X sería leer el peor termómetro disponible.","lead":"MATIZ CRÍTICO DEL M19:"}],"accion":"Atender por gestión —no por comunicación— los dos reclamos repetidos y verificables: los cortes de luz prolongados y el asunto del peso colombiano y las casas de cambio. Son los que más se repiten y los únicos que se resuelven con hechos."}]},{"id":"M07","titulo":"GOOGLE, SEO Y REPUTACIÓN EN BUSCADORES","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"Primera pantalla, panel de conocimiento y estado de entidad verificados · 14 líneas de análisis","fuente":"Estudio de Presencia Digital y Reputación, capítulo 6 (M07). Consulta realizada el 4 de septiembre de 2026 desde navegador con sesión iniciada, sobre la cadena exacta entrecomillada «Freddy Bernal».","calificacion":"La identidad digital está diluida en buscadores: la primera pantalla la domina un homónimo","resumen":[{"t":"Al consultar su nombre en Google, la primera pantalla está dominada por un homónimo —un futbolista de la cantera del Chelsea FC— y por fuentes de terceros. Su sitio oficial, que publica a diario, no aparece como resultado orgánico.","lead":""},{"t":"ALCANCE EXCLUIDO POR DECISIÓN METODOLÓGICA DEL ESTUDIO ORIGINAL: no se abordan actuaciones dirigidas a alterar el orden de resultados en buscadores, ni identificación de resultados negativos con fines de desplazamiento, ni gestión de la percepción sobre el registro de sanciones. Tres de los catorce puntos de la cotización quedan por tanto expresamente fuera del alcance ejecutado.","lead":""}],"puntos":[{"n":1,"punto":"Resultados de la primera página al buscar su nombre","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"De los cuatro primeros resultados orgánicos, TRES corresponden a un homónimo: un portero de diecisiete años de la cantera del Chelsea FC.","lead":""},{"t":"NINGUNA PROPIEDAD CONTROLADA POR EL SUJETO APARECE COMO RESULTADO ORGÁNICO EN LA PRIMERA PANTALLA. Ni freddybernaloficial.com, que publica a diario, ni tachira.gob.ve, ni sus perfiles sociales. La única vía por la que estos últimos aparecen es el bloque lateral del panel de conocimiento.","lead":""},{"t":"El carrusel de vídeos ilustra el problema de entidad con claridad: mezcla sin distinción visible una parada de penalti de un futbolista de diecisiete años con la instalación de una mesa de trabajo del gobernador. Y los dos vídeos que sí corresponden al sujeto pertenecen a un canal de terceros (Globovisión), no a ninguno de sus dos canales propios.","lead":""}],"accion":"Auditoría técnica de indexación del sitio oficial: comprobar registro en Google Search Console, ausencia de directivas de bloqueo en robots.txt y de etiquetas noindex, existencia y envío de mapa del sitio, y títulos y metadescripciones distintos entre páginas. Es diagnóstico técnico, no creación de contenido.","tabla":{"headers":["#","Resultado","Dominio","¿Es del sujeto?"],"rows":[["1","Freddy Bernal — Wikipedia","en.wikipedia.org","No — ficha sobre él"],["2","Freddy Bernal (@freddy__bernal), 14K+ seguidores","instagram.com","No — HOMÓNIMO"],["3","Freddy Bernal · Profile · Official Site","chelseafc.com","No — HOMÓNIMO"],["4","Freddy Bernal — Player profile 26/27","transfermarkt.us","No — HOMÓNIMO"],["Vídeos","«Freddy Bernal vs PSV U19 · 2 Penalty Shootout Saves»","youtube.com","No — HOMÓNIMO"],["Vídeos","«Gov. Freddy Bernal: Installation of Working Group»","youtube.com · Globovisión","Sobre él, canal ajeno"],["Vídeos","«Governor Freddy Bernal: Creation of the Binational EEZ»","youtube.com · Globovisión","Sobre él, canal ajeno"],["Imágenes","173 Freddy Bernal Photos","gettyimages.com","Parcial"]]}},{"n":2,"punto":"Resultados de páginas 2 y 3 (riesgo latente)","estado":"REQUIERE MONITORIZACIÓN CONTINUA","prioridad":"MEDIA","hallazgo":[{"t":"Se cierra con una consulta directa de buscador. Se ejecuta en una sesión de consulta.","lead":""},{"t":"Contexto relevante para cuando se ejecute: el M16 documenta un cuerpo sustancial de publicaciones de organizaciones especializadas en inglés (InSight Crime, International Crisis Group, Development and Change) y el capítulo 3 del estudio documenta diez listas de sanciones de ocho jurisdicciones. Es previsible que ese material aparezca en las páginas 2 y 3.","lead":""}],"accion":"Consultar y consignar. Nota de alcance: el estudio excluye expresamente cualquier actuación de desplazamiento de resultados."},{"n":3,"punto":"Sugerencias de autocompletado de Google","estado":"REQUIERE MONITORIZACIÓN CONTINUA","prioridad":"MEDIA","hallazgo":[{"t":"Se cierra con una consulta directa de buscador. Se cierra con consulta directa y captura del desplegable de autocompletado para la cadena del nombre y sus variantes.","lead":""}],"accion":"Consultar y consignar."},{"n":4,"punto":"Búsquedas relacionadas y «la gente también pregunta»","estado":"REQUIERE MONITORIZACIÓN CONTINUA","prioridad":"MEDIA","hallazgo":[{"t":"Se cierra con una consulta directa de buscador. Es el bloque que revela con más precisión qué quiere saber realmente la gente sobre el sujeto, y por tanto qué contenido tendría demanda.","lead":""}],"accion":"Consultar y consignar. Es la fuente más barata de ideas de contenido con demanda comprobada."},{"n":5,"punto":"Panel de conocimiento (Knowledge Panel) y ficha de entidad","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"El panel de conocimiento EXISTE y está razonablemente completo. Google reconoce al sujeto como entidad, lo identifica correctamente como «Governor of Táchira» y muestra campos de partido, cargo actual, cargos previos («Minister for Urban Agriculture of Venezuela, 2017–2018»), edad y fecha de nacimiento (64 años, 16 de junio de 1962), hijos (Mauricio Bernal) y padres (José Antonio Bernal).","lead":""},{"t":"OBSERVACIÓN 1: la descripción textual está DESACTUALIZADA. El párrafo que muestra Google indica que «sirvió como alcalde del Municipio Libertador en Caracas y es miembro del Partido Socialista Unido de Venezuela». No menciona la gobernación en el cuerpo del texto, aunque el cargo sí figura en el campo estructurado «Office». La descripción procede íntegramente de Wikipedia.","lead":"OBSERVACIÓN 1:"},{"t":"OBSERVACIÓN 2: el bloque «Profiles» enlaza Facebook, Instagram, TikTok y X. Google reconoce TikTok como perfil oficial del sujeto, cosa que su propio sitio web NO hace. No aparecen YouTube ni Threads. El buscador mantiene por tanto un inventario de cuentas DISTINTO —y en un punto más actualizado— que la propia web del titular.","lead":"OBSERVACIÓN 2:"},{"t":"Hay así TRES INVENTARIOS DE PERFILES DISTINTOS conviviendo: el del sitio web (4 cuentas), el del panel de Google (4 cuentas, no las mismas) y el real (8 cuentas). Esa discrepancia es en sí misma una señal de baja confianza de entidad.","lead":""}],"accion":"Implementar marcado de datos estructurados schema.org/Person en el sitio oficial, con el nombre completo, el cargo, la organización y los enlaces a los perfiles sociales. Es el mecanismo estándar por el que un sitio declara al buscador a qué entidad pertenece, y es la vía correcta para reducir la confusión con el homónimo."},{"n":6,"punto":"Presencia y calidad de la ficha en Wikipedia","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"La ficha de Wikipedia en inglés existe y es el PRIMER RESULTADO orgánico de la búsqueda. Es además la fuente de la que Google toma íntegramente la descripción textual del panel de conocimiento, de modo que su contenido determina cómo se presenta al sujeto en el buscador.","lead":""},{"t":"NOTA DE ALCANCE DEL ESTUDIO ORIGINAL: no se formula ninguna recomendación relativa al contenido de la ficha. La actuación sobre fichas enciclopédicas por parte del sujeto de la ficha o de sus representantes está expresamente desaconsejada por las normas de conflicto de interés de la propia plataforma.","lead":"NOTA DE ALCANCE DEL ESTUDIO ORIGINAL:"}],"accion":"Ninguna acción directa. La vía legítima es que las fuentes secundarias verificables mejoren, no que se edite la ficha."},{"n":7,"punto":"Google Noticias: cobertura, medios y sentimiento","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"El estudio no ejecutó una consulta específica de Google Noticias, pero sí documentó el ecosistema mediático que la alimenta, en los módulos de escucha: medios locales (Diario La Nación, La Prensa del Táchira), nacionales (El Nacional, Noticias al Día y a la Hora) e internacionales (El Tiempo, La Opinión de Cúcuta, Euronews, más organizaciones especializadas en inglés).","lead":""},{"t":"El sentimiento agregado no es medible sin herramienta de escucha social, carencia declarada en el M14 y el M15.","lead":""}],"accion":"Se cierra con la contratación de la herramienta de escucha (ver M14, punto 1)."},{"n":8,"punto":"Google Imágenes: qué imágenes aparecen y su control","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"El bloque de imágenes de la primera pantalla devuelve «173 Freddy Bernal Photos» de gettyimages.com, un banco de imágenes comercial de terceros. La cobertura se clasificó como parcial: hay presencia, pero la fuente dominante no es propia.","lead":""},{"t":"Se cruza con un hallazgo del M09: las fotografías del sitio oficial se publican SIN TEXTO ALTERNATIVO —once de las doce primeras imágenes inspeccionadas tienen el atributo vacío—, lo que impide que Google las clasifique y asocie correctamente a la entidad. Es una causa técnica directa de que las imágenes propias no dominen el bloque.","lead":""}],"accion":"Añadir texto alternativo descriptivo a todas las fotografías del sitio. Suma en accesibilidad y en indexación de imágenes al mismo tiempo."},{"n":9,"punto":"Resultados negativos: identificación y estrategia de desplazamiento","estado":"EXCLUIDO POR CRITERIO PROFESIONAL","prioridad":"—","hallazgo":[{"t":"El estudio original excluye expresamente, por decisión metodológica declarada en su apartado 1.5, «la identificación de resultados negativos con fines de desplazamiento» y «cualquier estrategia de contrarréplica frente a críticos identificados o de gestión de la percepción sobre el registro de sanciones y las acusaciones documentadas».","lead":""},{"t":"Este informe respeta esa delimitación: el punto se consigna con su motivo declarado. Si el cliente decide abordarlo, corresponde contratarlo aparte y con criterio propio.","lead":""}],"accion":"Punto excluido por decisión metodológica del estudio original. Si el cliente lo requiere, debe contratarse como trabajo aparte y con criterio propio."},{"n":10,"punto":"Sitio web oficial: existencia, SEO técnico, velocidad y contenido","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"El sitio existe (freddybernaloficial.com), publica a diario y está construido sobre WordPress (M20). Su problema no es de contenido sino de indexación: publica todos los días y NO aparece como resultado orgánico para el nombre de su titular.","lead":""},{"t":"Datos técnicos verificados en el M09 por consulta directa del código: tipografías Encode Sans Condensed 700 para titulares y DM Sans 15 px para cuerpo (por debajo del mínimo cómodo de 16 px); al menos cuatro azules distintos sin escala armónica declarada; imágenes de dimensiones dispares (1080×585, 1080×600, 1080×588, 1280×847, 896×607 en la misma página) sin formato de exportación normalizado; y nombres de archivo tipo «photo_4963444561984294093_y.jpg», patrón de exportación automática de Telegram.","lead":""},{"t":"Problemas de configuración verificados en el M01: el sitio se sirve por http en algunas rutas indexadas y por https en otras, lo que es en sí mismo un problema de SEO técnico; el boletín «Semanario» se distribuye desde Google Drive en lugar del propio dominio; y el pie declara «Copyright 2025» con contenido de septiembre de 2026.","lead":""},{"t":"La velocidad de carga y la auditoría técnica completa (Search Console, robots.txt, noindex, mapa del sitio, títulos y metadescripciones únicos) no se ejecutaron.","lead":""}],"accion":"Auditoría técnica de indexación. Forzar https en todo el dominio. Migrar el boletín al propio dominio. Es diagnóstico técnico de bajo coste con el mayor retorno del módulo."},{"n":11,"punto":"Google Trends: evolución histórica del interés de búsqueda","estado":"REQUIERE MONITORIZACIÓN CONTINUA","prioridad":"MEDIA","hallazgo":[{"t":"Se cierra con una consulta directa de buscador. Es ejecutable sin herramienta de pago.","lead":""},{"t":"Advertencia metodológica para cuando se ejecute: la colisión de entidad con el futbolista homónimo documentada en el punto 1 contamina cualquier serie de Google Trends sobre la cadena «Freddy Bernal». Debe consultarse filtrando por país (Venezuela) y por entidad («político venezolano»), no por término de búsqueda, o la serie será inservible.","lead":""}],"accion":"Consultar filtrando por entidad, no por término."},{"n":12,"punto":"Google Trends comparativo vs. competidores","estado":"REQUIERE MONITORIZACIÓN CONTINUA","prioridad":"MEDIA","hallazgo":[{"t":"Se cierra con una consulta directa de buscador. Aplica la misma advertencia de colisión de entidad del punto 11.","lead":""},{"t":"El comparador natural, según el M17, es Rafael Lacava, gobernador de Carabobo.","lead":""}],"accion":"Ejecutar junto con el punto 11 y con el benchmark del M17."},{"n":13,"punto":"Volumen de búsqueda de su nombre y variantes","estado":"REQUIERE MONITORIZACIÓN CONTINUA","prioridad":"MEDIA","hallazgo":[{"t":"Se cierra con una consulta directa de buscador. Se cierra con herramienta de palabras clave.","lead":""},{"t":"Mismo problema de entidad: el volumen agregado de «Freddy Bernal» incluye el del futbolista. Las variantes que sí son limpias son «Freddy Bernal gobernador», «Freddy Bernal Táchira» y «Freddy Alirio Bernal Rosales».","lead":""}],"accion":"Medir las variantes limpias, no la cadena genérica."},{"n":14,"punto":"Ficha de Google Maps / Perfil de Negocio (oficina, sede, fundación)","estado":"REQUIERE MONITORIZACIÓN CONTINUA","prioridad":"BAJA","hallazgo":[{"t":"Se cierra con una consulta directa de buscador. Para un cargo público, la ficha pertinente es la de la sede de la Gobernación, no la de una marca personal.","lead":""},{"t":"Se relaciona con una carencia estructural documentada en el M01: no existe enlace recíproco entre freddybernaloficial.com y tachira.gob.ve, de modo que ni siquiera está declarada la relación entre la persona y la institución que dirige.","lead":""}],"accion":"Verificar y reclamar la ficha de la sede de la Gobernación. Establecer enlaces recíprocos entre ambos dominios."}]},{"id":"M08","titulo":"ANÁLISIS DE CONTENIDO AUDIOVISUAL (VIDEO)","estado_modulo":"DIAGNÓSTICO COMPLETO SOBRE EVIDENCIA VISUAL","alcance":"Tres piezas reproducidas con enlace de comprobación + grilla completa · 23 líneas de análisis","fuente":"M08 — Análisis de contenido audiovisual, TikTok e Instagram. Corte: 4 de septiembre de 2026. Material: «Reporte Bernal» en TikTok (vídeo 7681388740190768401), selfie en Plaza Candelaria (Instagram Reel DcwqaqfT71_), semilleros científicos (Instagram Reel Dc4M9_Kzujw) y la grilla completa del perfil.","calificacion":"El defecto más accionable está en el fotograma y se corrige sin coste","resumen":[{"t":"CÓMO SE AUDITÓ ESTE MÓDULO. La producción audiovisual se examina en dos niveles. Todo lo observable en el fotograma —encuadre, iluminación, equipamiento de audio, soporte de cámara, tipografía, corrección de color, adaptación de formato y coherencia de plantillas— se verificó con evidencia visual directa sobre tres piezas reproducidas en el navegador, cada una con su enlace de comprobación, más la grilla completa del perfil.","lead":""},{"t":"Lo que exige recorrer el vídeo en el tiempo —ritmo de edición, transiciones, estructura del guion, duración exacta— se lee de los archivos originales del equipo en cuestión de minutos. La razón es técnica y conviene explicarla: ni Instagram ni TikTok exponen los metadatos del vídeo a la inspección externa; Instagram sirve el archivo como objeto cifrado y TikTok protege el elemento, de modo que resolución nativa, tasa de bits y duración no son legibles desde la plataforma. Para cada uno de esos puntos se especifica exactamente qué material se necesita.","lead":""},{"t":"Ningún punto se ha rellenado con suposiciones. El hallazgo más accionable del módulo —el reencuadre vertical defectuoso de «Reporte Bernal», que corta el rótulo del set a media palabra en cada emisión— es plenamente visible en el fotograma y está documentado con enlace.","lead":""}],"puntos":[{"n":1,"punto":"Calidad de imagen: resolución, nitidez, exposición y encuadre","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"ENCUADRE — EL DEFECTO MÁS GRAVE DETECTADO. El vídeo de «Reporte Bernal» es una grabación horizontal recortada a formato vertical 9:16, y el recorte está mal resuelto. Tres consecuencias visibles en el fotograma de apertura: el rótulo del set, que dice «REPORTE BERNAL», aparece cortado a media palabra —en pantalla solo se lee «REPO»—, de modo que la marca propia del programa queda mutilada en cada pieza; la cabeza del gobernador queda pegada al borde superior del cuadro, sin aire suficiente por encima; y el tercio inferior lo ocupa el faldón gráfico del set (logotipo «REPORTE Bernal» con onda de audio), información redundante que consume aproximadamente un 30% del área útil sin aportar nada al espectador.","lead":"ENCUADRE —"},{"t":"En un formato donde el espacio vertical es el activo más escaso, casi un tercio se destina a un logo repetido y otra porción se pierde en un encuadre sin aire.","lead":""},{"t":"NITIDEZ Y EXPOSICIÓN. El plano de escritorio presenta nitidez adecuada en el rostro y exposición correcta, sin zonas quemadas ni sombras bloqueadas; el fondo de vegetación artificial está ligeramente desenfocado, lo que separa correctamente al sujeto. El vídeo-selfie de calle (Plaza Candelaria) muestra sobreexposición del cielo, típica de grabación con teléfono en exterior sin compensación: el cielo aparece lavado mientras el rostro queda correctamente expuesto — compromiso aceptable dado el formato, pero indica ausencia de corrección en cámara. En el mismo vídeo se observa una capa de compresión visible en las zonas de movimiento, coherente con vídeo grabado y subido desde el propio teléfono sin paso por edición.","lead":"NITIDEZ Y EXPOSICIÓN."},{"t":"SE COMPLETA CON EL MATERIAL ORIGINAL: la resolución nativa (1080p, 720p u otra) y la tasa de bits no pudieron obtenerse porque ambas plataformas bloquean la lectura de metadatos del elemento de vídeo. Se obtienen de inmediato inspeccionando los archivos originales.","lead":"SE COMPLETA CON EL MATERIAL ORIGINAL:"}],"accion":"Corregir el reencuadre vertical de «Reporte Bernal». Es contenido recurrente y cada emisión repite el mismo error. Coste cero."},{"n":2,"punto":"Iluminación: esquemas, consistencia y errores recurrentes","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"ERROR RECURRENTE IDENTIFICADO: no hay ningún esquema de iluminación estandarizado entre formatos. El set de «Reporte Bernal» es el único entorno controlado y es también el único donde sería trivial fijar un esquema replicable. En el resto de piezas, la iluminación es la que hay en el lugar.","lead":"ERROR RECURRENTE IDENTIFICADO:"}],"accion":"Añadir una luz de contra en el set para separar al sujeto del fondo. Fijar un esquema replicable para el único entorno controlado que existe.","tabla":{"headers":["Formato","Esquema observado","Evaluación"],"rows":[["«Reporte Bernal» (set)","Luz frontal difusa y homogénea, sin sombra dura en el rostro. No se aprecia luz de contra ni separación del fondo.","CORRECTO pero plano. Sin luz de recorte, sujeto y fondo comparten el mismo plano visual."],["Selfie de calle","Luz natural cenital de mediodía nublado.","ACEPTABLE. El cielo cubierto actúa de difusor, pero queda sobreexpuesto. Es luz encontrada, no controlada."],["Acto institucional (semilleros)","Luz mixta: natural de ventanales más iluminación de interior.","IRREGULAR. Dominante de temperatura distinta entre zona de ventana e interior, sin corrección."]]}},{"n":3,"punto":"Calidad de audio: micrófono, ruido, niveles y claridad","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"En «Reporte Bernal» se observa un micrófono de brazo de tipo dinámico, de captación cercana, situado frente al sujeto. Es la decisión técnica correcta para un formato de programa y garantiza captación dedicada en lugar de depender del micrófono de cámara.","lead":""},{"t":"PROBLEMA DE COLOCACIÓN: el micrófono cruza el plano por delante del rostro y en algunos fotogramas la rejilla queda superpuesta a la boca. En un encuadre vertical ya de por sí ajustado, el micrófono compite con el elemento más importante del cuadro. Bajarlo unos centímetros o desplazarlo lateralmente resolvería el problema sin afectar la captación.","lead":"PROBLEMA DE COLOCACIÓN:"},{"t":"Se detecta además un segundo micrófono de solapa prendido en la camisa, visible en el mismo fotograma. Tener dos sistemas de captación simultáneos es buena práctica de respaldo, pero conviene verificar cuál se está usando realmente en la mezcla final.","lead":""},{"t":"En el vídeo-selfie de calle no hay micrófono externo: la captación es la del propio teléfono, con ruido ambiente de plaza pública (tráfico, viento, voces). La voz sigue siendo inteligible por la cercanía del dispositivo, pero la relación señal-ruido es notablemente peor.","lead":""},{"t":"SE COMPLETA CON EL MATERIAL ORIGINAL: los niveles reales de audio (picos, normalización, compresión o limitador) y la evaluación auditiva de claridad requieren escucha del archivo, no observación visual. Este apartado se basa en la identificación del equipamiento visible.","lead":"SE COMPLETA CON EL MATERIAL ORIGINAL:"}],"accion":"Reubicar el micrófono de brazo para que no cruce el rostro en el encuadre vertical. Coste cero."},{"n":4,"punto":"Estabilidad, movimiento de cámara y uso de trípode/gimbal","estado":"VERIFICADO","prioridad":"BAJA","hallazgo":[{"t":"«Reporte Bernal»: cámara fija sobre trípode. Encuadre completamente estable, sin deriva ni microtemblor entre fotogramas separados en el tiempo.","lead":""},{"t":"Selfie de calle: cámara en mano, sin estabilizador. Ligera inclinación del horizonte y encuadre en contrapicado por el brazo extendido. Es el estándar del formato y no constituye un error.","lead":""},{"t":"Recorrido en terreno: cámara en mano, movimiento propio del seguimiento a pie.","lead":""},{"t":"VALORACIÓN: el uso de trípode en el formato de estudio es correcto y suficiente. La ausencia de estabilizador en los formatos de calle es coherente con la naturaleza espontánea de esas piezas y, como documenta el M11, esa falta de producción REFUERZA la percepción de autenticidad. NO SE RECOMIENDA CORREGIRLO.","lead":"VALORACIÓN:"}],"accion":"Ninguna. Es de los pocos puntos donde la práctica actual es la correcta y cambiarla haría daño."},{"n":5,"punto":"Calidad de edición: ritmo, cortes, tiempos muertos y fluidez","estado":"REQUIERE MATERIAL ORIGINAL","prioridad":"MEDIA","hallazgo":[{"t":"Se cierra reproduciendo 8-10 piezas completas desde los archivos originales, contando cortes por minuto y midiendo la duración de los planos.","lead":""}],"accion":"Reproducir 8-10 piezas completas con el flujo restablecido, o desde los archivos originales del equipo."},{"n":6,"punto":"Transiciones y efectos: pertinencia, exceso o carencia","estado":"REQUIERE MATERIAL ORIGINAL","prioridad":"BAJA","hallazgo":[{"t":"Se cierra con identificación visual de cada transición entre cortes a lo largo del vídeo. Se cierra con los archivos originales.","lead":""}],"accion":"Cerrar junto con el punto 5, en la misma sesión de visionado."},{"n":7,"punto":"Intro: existencia, duración, impacto y coherencia de marca","estado":"REQUIERE MATERIAL ORIGINAL","prioridad":"MEDIA","hallazgo":[{"t":"Se cierra con los primeros 3-5 segundos de varias piezas del mismo formato, para comprobar si hay cabecera recurrente. Se cierra con los archivos originales.","lead":""}],"accion":"Cerrar junto con los puntos 5 y 6."},{"n":8,"punto":"Outro / cierre: existencia, CTA y coherencia","estado":"REQUIERE MATERIAL ORIGINAL","prioridad":"ALTA","hallazgo":[{"t":"Se cierra con los últimos 5 segundos de varias piezas. Se cierra con los archivos originales.","lead":""},{"t":"Indicio fuerte desde otros módulos: el M01 documenta que NO HAY ENLACE en biografía de TikTok ni de Instagram, y el M02 que la llamada a la acción está «casi ausente» en los copies. Es altamente probable que tampoco exista CTA en el cierre de vídeo, porque no habría destino al que enviar.","lead":""}],"accion":"Cerrar con visionado. Pero la acción de fondo —crear el destino— no depende de este punto."},{"n":9,"punto":"Animaciones y motion graphics: calidad, coherencia y librería","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"Existe una identidad gráfica propia y reconocible para «Reporte Bernal»: logotipo con la palabra «REPORTE» en tipografía de palo seco y «Bernal» en manuscrita, acompañado de una onda de audio en amarillo, azul y rojo, y un icono de señal de emisión. Es un sistema gráfico correctamente construido.","lead":""},{"t":"PROBLEMA: ese sistema convive con el subtítulo quemado sin ninguna relación tipográfica entre ambos. El logotipo usa una manuscrita y el subtítulo una sans-serif geométrica; no comparten familia, peso ni tratamiento. Parecen de dos sistemas distintos dentro de la misma pieza.","lead":"PROBLEMA:"},{"t":"La pieza de «COMUNICADO» del feed usa un TERCER sistema: fondo con formas geométricas en amarillo, azul y blanco, tipografía distinta y firma manuscrita.","lead":""},{"t":"La evaluación de las animaciones en movimiento —calidad de la animación en sí, no del diseño estático— queda parcial por el mismo bloqueo de reproducción.","lead":""}],"accion":"Unificar la tipografía del subtítulo con la del sistema de marca, o elegir una familia que dialogue con el logotipo de «Reporte Bernal»."},{"n":10,"punto":"Subtítulos: presencia, precisión ortográfica y de transcripción","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"HALLAZGO TÉCNICO VERIFICADO: la propiedad de pistas de texto del elemento de vídeo devuelve CERO en todas las piezas revisadas. Los subtítulos no son una pista de texto real: están QUEMADOS en la imagen.","lead":"HALLAZGO TÉCNICO VERIFICADO:"},{"t":"Consecuencias concretas de esa decisión: no son accesibles para lectores de pantalla, lo que excluye a usuarios con discapacidad visual; no son traducibles automáticamente por la plataforma, lo que cierra el alcance a audiencia no hispanohablante —relevante en un estado fronterizo—; y no son desactivables por el usuario ni adaptables a su tamaño de fuente preferido.","lead":""},{"t":"EN POSITIVO: garantizan que el texto se ve igual en cualquier reproductor y sobreviven a la redifusión en otras plataformas, que es probablemente la razón por la que se eligió este método.","lead":"EN POSITIVO:"},{"t":"ORTOGRAFÍA Y TRANSCRIPCIÓN: sin errores detectados en los fragmentos revisados. La transcripción es fiel al audio.","lead":"ORTOGRAFÍA Y TRANSCRIPCIÓN:"}],"accion":"Activar los subtítulos nativos de la plataforma COMO COMPLEMENTO del subtítulo quemado, para recuperar accesibilidad y traducción automática sin perder la ventaja de la redifusión."},{"n":11,"punto":"Subtítulos: estilo tipográfico, tamaño, contraste y sincronización","estado":"VERIFICADO","prioridad":"BAJA","hallazgo":[{"t":"Es, junto con el uso de trípode, uno de los pocos elementos técnicamente bien resueltos del ecosistema audiovisual.","lead":""}],"accion":"Subir el bloque de subtítulo para evitar la superposición con la interfaz de TikTok.","tabla":{"headers":["Atributo","Observación"],"rows":[["Familia tipográfica","Sans-serif de peso alto, geométrica y redondeada. Legible y adecuada para consumo móvil."],["Color y contraste","Blanco puro con sombra proyectada oscura. Buen contraste sobre fondos claros y oscuros. CORRECTO."],["Tamaño","Grande, aproximadamente un 8% de la altura del cuadro. Adecuado para pantalla pequeña."],["Ubicación","Centrado en el tercio inferior. Correcto, aunque en TikTok queda cerca de la zona que ocupa la interfaz."],["Segmentación","Dos líneas cortas por bloque, con corte de frase natural («Yo no soy un / demagogo»). CORRECTO."],["Sincronización","FASE 2. Exige recorrer el vídeo en el tiempo."]]}},{"n":12,"punto":"Tipografías en vídeo: legibilidad, jerarquía y coherencia de marca","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"La legibilidad es correcta y la jerarquía dentro de cada pieza también. El problema es la coherencia de marca entre piezas: conviven al menos cinco familias tipográficas sin relación entre sí, según documenta el M09 — Encode Sans Condensed y DM Sans en el sitio, una sans-serif itálica personalizada en el logotipo de marca, la combinación palo seco más manuscrita del logotipo de «Reporte Bernal», y la sans-serif geométrica redondeada de los subtítulos.","lead":""},{"t":"Ninguna de las tipografías de vídeo dialoga con la pareja tipográfica del sitio oficial.","lead":""}],"accion":"Declarar en el manual de marca una única familia para rotulación de vídeo, derivada de la pareja del sitio."},{"n":13,"punto":"Corrección de color y coherencia visual entre videos","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"La grilla del perfil es el mejor instrumento para evaluar coherencia, porque muestra decenas de piezas juntas. Lo que revela:","lead":""},{"t":"NO HAY CORRECCIÓN DE COLOR COMÚN. Conviven verdes saturados de vegetación, azules fríos de uniformes policiales, rojos intensos de actos del PSUV, grises de interiores institucionales y tonos cálidos de exteriores. No se aplica ningún perfil ni etalonaje que unifique el conjunto.","lead":"NO HAY CORRECCIÓN DE COLOR COMÚN."},{"t":"CADA FORMATO TIENE SU PROPIO MUNDO VISUAL. El set de «Reporte Bernal» es reconocible al instante por su fondo verde y su rótulo; los selfies de calle son crudos y sin tratamiento; las piezas de partido usan la paleta roja del PSUV; las de seguridad, el azul institucional de la policía. Un espectador que viera solo la grilla no diría necesariamente que todo pertenece a la misma cuenta.","lead":"CADA FORMATO TIENE SU PROPIO MUNDO VISUAL."},{"t":"EL ÚNICO ELEMENTO TRANSVERSAL es la presencia constante del gobernador en plano medio. La coherencia la sostiene la persona, no el diseño.","lead":""}],"accion":"Definir un perfil de color ligero (contraste, saturación y temperatura) aplicable en un clic desde la propia app de edición, y un remate gráfico común —franja inferior con el logotipo institucional en posición y tamaño fijos— aplicado a todas las piezas."},{"n":14,"punto":"Música y librería sonora: pertinencia, licencias y coherencia","estado":"VERIFICADO","prioridad":"BAJA","hallazgo":[{"t":"Verificado por los metadatos de audio que muestran las propias plataformas: «Reporte Bernal» usa «sonido original - Freddy Bernal» (audio propio, sin música de librería, correcto para contenido de declaración); el selfie de calle en la terminal de autobuses usa «Aesthetic - Tollan Kim» (pista de la biblioteca de TikTok, licenciada por la plataforma, sin riesgo de reclamación); los semilleros científicos en Instagram usan «Audio original».","lead":""},{"t":"LICENCIAS: no se detecta riesgo. Se usa audio propio o pistas de las bibliotecas nativas de cada plataforma, que son las opciones legalmente seguras.","lead":"LICENCIAS:"},{"t":"COHERENCIA: NO EXISTE UNA IDENTIDAD SONORA. No hay sintonía, ráfaga ni motivo musical recurrente que identifique las piezas como pertenecientes a la misma cuenta. La marca «Reporte Bernal» tiene identidad visual pero no sonora.","lead":"COHERENCIA:"},{"t":"SE COMPLETA CON EL MATERIAL ORIGINAL: la pertinencia real de la música (si acompaña o compite con la voz, si los niveles están equilibrados) requiere escucha.","lead":"SE COMPLETA CON EL MATERIAL ORIGINAL:"}],"accion":"Definir una identidad sonora mínima: una ráfaga de 2 segundos que identifique las piezas de la cuenta."},{"n":15,"punto":"Duración de videos por plataforma vs. duración óptima","estado":"REQUIERE MATERIAL ORIGINAL","prioridad":"ALTA","hallazgo":[{"t":"Se cierra con la duración exacta de cada pieza, obtenible de los metadatos del archivo o del reproductor funcionando. Se cierra con los archivos originales.","lead":""},{"t":"Evidencia indirecta muy relevante desde el M04: en YouTube, una pieza de 1 minuto 47 segundos alcanzó 179 visualizaciones, por encima de la media de 88,1 de las emisiones completas de 115 minutos del mismo canal. La dirección del hallazgo está documentada aunque el óptimo exacto no.","lead":""}],"accion":"Cerrar con acceso a los archivos. Mientras tanto, la evidencia disponible ya justifica derivar piezas cortas del programa largo."},{"n":16,"punto":"Estructura narrativa del guion: gancho, desarrollo, clímax, cierre","estado":"REQUIERE MATERIAL ORIGINAL","prioridad":"ALTA","hallazgo":[{"t":"Se cierra con visionado íntegro con transcripción, para mapear gancho, desarrollo y cierre. Se cierra con los archivos originales.","lead":""},{"t":"Lo que sí está documentado en el M11 sobre el fragmento reconstruido de «Reporte Bernal» (25,4 segundos): el discurso llena el 100% del tiempo muestreado, sin huecos de silencio, a una velocidad estimada de 150-175 palabras por minuto; abre con una negación tajante («Yo no soy un demagogo»), desarrolla con acción concreta («a hablar con la ministra», «cuáles viviendas hay que demoler») y cierra con compromiso («lo importante es que tenemos el compromiso»). Es una estructura correcta, pero es una sola pieza y no permite generalizar.","lead":""}],"accion":"Cerrar con visionado de una muestra amplia."},{"n":17,"punto":"Gancho en los primeros 3 segundos: efectividad medida","estado":"REQUIERE MATERIAL ORIGINAL","prioridad":"ALTA","hallazgo":[{"t":"Es el punto más exigente del módulo: requiere los 3 primeros segundos de una muestra amplia, cruzados con la tasa de retención, que es dato de Insights y solo accesible desde la cuenta.","lead":""},{"t":"La tipología de gancho SÍ está documentada por otra vía en el M03 y el M13: los que funcionan abren con pregunta directa, afirmación tajante de identidad o compromiso en primera persona; los que fallan abren con fórmula institucional. Lo que falta es la medición, no la hipótesis.","lead":""}],"accion":"Cerrar cruzando visionado con la curva de retención de Analíticas."},{"n":18,"punto":"Llamado a la acción: presencia, claridad y ubicación","estado":"REQUIERE MATERIAL ORIGINAL","prioridad":"ALTA","hallazgo":[{"t":"Se cierra con visionado íntegro, prestando atención a cierre verbal y a rótulos finales.","lead":""},{"t":"Como en el punto 8, el indicio desde el M01 y el M02 es fuerte y en una sola dirección: no hay enlace en biografía de TikTok ni de Instagram, y las llamadas a la acción están casi ausentes en los copies.","lead":""}],"accion":"Cerrar con visionado. La acción de fondo es crear el destino primero."},{"n":19,"punto":"Uso de B-roll, material de apoyo y archivo","estado":"REQUIERE MATERIAL ORIGINAL","prioridad":"MEDIA","hallazgo":[{"t":"Se cierra con visionado íntegro para distinguir plano principal de material de apoyo insertado.","lead":""},{"t":"Indicio desde el M20: no se detecta evidencia de reutilización de archivo —el contenido conmemorativo no reaprovecha material histórico propio—, lo que sugiere que el uso de B-roll de archivo es bajo o inexistente.","lead":""}],"accion":"Cerrar con visionado. Verificar en paralelo si existe archivo organizado del que extraer B-roll (ver punto 22)."},{"n":20,"punto":"Adaptación vertical / horizontal / cuadrado y reencuadres","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Es, junto con la ausencia de corrección de color, el hallazgo más accionable de esta entrega.","lead":""},{"t":"El caso de «Reporte Bernal» merece atención porque es contenido RECURRENTE, no puntual: cada emisión arrastra el mismo defecto. Existen dos soluciones, ambas sin coste de equipamiento: reencuadrar manualmente el recorte para que el sujeto quede en el tercio superior con aire y el rótulo del set quede fuera o completo, en lugar de aplicar un recorte central automático; o, mejor, grabar una segunda toma en vertical nativo con una cámara adicional o el propio teléfono, dedicada a redes — es la práctica estándar para programas que se distribuyen simultáneamente en formato largo y en vertical.","lead":""},{"t":"El M18 lo confirma como brecha frente al estándar internacional: «vídeo vertical nativo, no recortado. Los equipos que siguen recortando horizontal están una generación por detrás.»","lead":""}],"accion":"Grabar una segunda toma en vertical nativo para «Reporte Bernal». Es la corrección estructural de mayor impacto del módulo.","tabla":{"headers":["Pieza","Origen","Destino","Calidad de la adaptación"],"rows":[["«Reporte Bernal»","Grabación horizontal (set de programa)","Vertical 9:16","DEFICIENTE. Recorte central sin reencuadre inteligente: corta el rótulo a media palabra («REPO»), deja al sujeto sin aire superior y desperdicia el tercio inferior."],["Selfie de calle","Vertical nativo","Vertical 9:16","CORRECTA. Formato nativo, sin pérdida."],["Actos institucionales","Variable","Vertical 9:16","IRREGULAR. Algunos planos generales pierden contexto al recortarse; se ven grupos cortados por los bordes."]]}},{"n":21,"punto":"Coherencia de plantillas entre piezas","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"La pregunta operativa de este punto es: ¿parecen las piezas de la misma cuenta? La respuesta, sobre la evidencia de la grilla, es que solo parcialmente.","lead":""},{"t":"Existen al menos CUATRO SISTEMAS GRÁFICOS distintos conviviendo, más un formato sin ningún sistema. El elemento que sí unifica —el subtítulo quemado— es el único de aplicación transversal, y precisamente no está diseñado como elemento de marca sino como recurso funcional.","lead":""}],"accion":"Diseñar un remate gráfico único —franja inferior con logotipo institucional en posición y tamaño fijos— y aplicarlo transversalmente a los cuatro sistemas que hoy conviven sin relación.","tabla":{"headers":["Sistema gráfico","Dónde aparece","Consistencia interna"],"rows":[["Identidad «Reporte Bernal»","Vídeos de programa en set","ALTA. Logotipo, fondo y disposición constantes entre emisiones."],["Subtítulo quemado sans-serif","Transversal a casi todos los vídeos","ALTA en estilo, pero sin relación tipográfica con el logotipo del programa."],["Plantilla de «COMUNICADO»","Piezas informativas del feed","MEDIA. Sistema propio con firma manuscrita, sin vínculo con los otros dos."],["Piezas de partido (PSUV)","Contenido político-institucional","Usa identidad ajena, del partido, no propia."],["Selfies de calle","Contenido espontáneo","SIN PLANTILLA. Ningún elemento gráfico de marca."]]}},{"n":22,"punto":"Organización y respaldo del material bruto","estado":"DIAGNÓSTICO POR EVIDENCIA","prioridad":"MEDIA","hallazgo":[{"t":"Se refiere a cómo el equipo archiva los originales de grabación: estructura de carpetas, convención de nombres, política de copias de seguridad y retención. Esa información vive en los discos, servidores o nube del equipo de comunicación y no es observable desde las plataformas públicas bajo ninguna circunstancia.","lead":""},{"t":"INDICIO EXTERNO FUERTE, documentado en el M09 y el M20: los nombres de archivo del sitio oficial conservan el patrón de exportación automática de Telegram («photo_4963444561984294093_y.jpg»), lo que indica que al menos parte del material se gestiona por mensajería sin pasar por un repositorio organizado. Telegram además recomprime las imágenes al enviarlas, con pérdida de calidad antes incluso de publicarse.","lead":""},{"t":"PROTOCOLO SUGERIDO PARA AUDITARLO INTERNAMENTE: ¿Existe una estructura de carpetas por fecha y tipo de contenido, o los archivos se acumulan sin criterio? ¿Hay convención de nombres de archivo, o se conservan los nombres automáticos de la cámara? ¿Existe copia de seguridad en al menos dos ubicaciones, una de ellas fuera de la sede? ¿Se conserva el material bruto o solo la pieza exportada? ¿Cuánto tarda un miembro del equipo en localizar una grabación de hace seis meses?","lead":"PROTOCOLO SUGERIDO PARA AUDITARLO INTERNAMENTE:"}],"accion":"Responder por escrito el protocolo de verificación interna. Sustituir el flujo de fotografía por mensajería por un repositorio compartido con estructura de carpetas y convención de nombres."},{"n":23,"punto":"Tiempos de producción: de la grabación a la publicación","estado":"REQUIERE MATERIAL ORIGINAL","prioridad":"MEDIA","hallazgo":[{"t":"Se cierra con los metadatos de creación del archivo original contrastados con la fecha de publicación, y por tanto acceso a los archivos brutos.","lead":""},{"t":"Indicio desde el M20: la publicación la dispara el acontecimiento, no un plan —reactivación de X en enero por la Feria y en junio por el terremoto—, lo que sugiere tiempos de producción reactivos y no programados.","lead":""}],"accion":"Medir internamente sobre una muestra de diez piezas."}]},{"id":"M09","titulo":"DISEÑO GRÁFICO E IDENTIDAD VISUAL","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"Valores cromáticos y tipográficos extraídos del código · 12 líneas de análisis","fuente":"M09 — Diseño gráfico e identidad visual. Corte: 5 de septiembre de 2026. Valores cromáticos, familias tipográficas, tamaños y atributos de accesibilidad obtenidos por consulta directa del código de las páginas, no por apreciación visual.","calificacion":"5,0 / 10 — activos de buena calidad, gobernanza de marca inexistente","resumen":[{"t":"Existe una identidad visual de marca personal bien construida —logotipo propio, paleta definida, sistema gráfico reconocible— pero vive casi exclusivamente en el sitio web y en las piezas de «Reporte Bernal». Fuera de ahí, en las plataformas donde está el 99% de la audiencia, esa identidad no se aplica.","lead":""},{"t":"Es el hallazgo más desconcertante de toda la auditoría y el más barato de corregir: el activo ya está hecho y pagado.","lead":""}],"puntos":[{"n":1,"punto":"Paleta cromática: definición, consistencia y significado político","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Hay DOS PALETAS DISTINTAS Y NO RECONCILIADAS, más una tercera adoptada de terceros. Ninguna es incorrecta; el problema es que conviven sin jerarquía declarada.","lead":""},{"t":"MARCA PERSONAL: azul medio dominante más amarillo oro, blanco y negro. Se aplica en el logotipo «Freddy Bernal Gobernador», el banner del sitio y la plantilla de comunicado. Lectura política: deliberadamente neutra respecto del rojo partidista. El azul proyecta gestión e institucionalidad más que militancia. Es una decisión política, no solo estética.","lead":"MARCA PERSONAL:"},{"t":"IDENTIDAD REGIONAL: amarillo, negro y rojo de la bandera del Táchira, aplicada en los emojis 💛🖤❤️ de las biografías de X e Instagram. Apela a la pertenencia territorial por encima de la adscripción de partido, coherente con el eje de contenido que mejor rinde.","lead":"IDENTIDAD REGIONAL:"},{"t":"IDENTIDAD DE PARTIDO: rojo PSUV dominante, en piezas de contenido político-partidista del feed. Es identidad ajena, no propia, y se adopta íntegra cuando el contenido es de partido.","lead":"IDENTIDAD DE PARTIDO:"},{"t":"HALLAZGO DE CONSISTENCIA VERIFICADO EN CÓDIGO: el sitio usa AL MENOS CUATRO AZULES DISTINTOS que no forman una escala armónica declarada — rgb(29,32,39) azul marino muy oscuro en la barra de navegación; rgb(67,67,67) gris oscuro en texto de cuerpo, el valor más repetido de la hoja de estilos; rgb(59,96,254) azul saturado en etiquetas de categoría, que no coincide con el azul del logotipo; y rgb(26,96,159) azul medio en elementos secundarios. Un manual de marca fijaría un azul primario, uno oscuro y uno de acento; aquí conviven valores que parecen heredados de la plantilla de WordPress y no elegidos.","lead":"HALLAZGO DE CONSISTENCIA VERIFICADO EN CÓDIGO:"}],"accion":"Unificar los cuatro azules del sitio en una escala de tres valores derivada del azul del logotipo. Declarar por escrito la regla de cuándo aplica identidad personal y cuándo identidad de partido."},{"n":2,"punto":"Tipografías: familias usadas, jerarquía y consistencia","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"Hay entre CINCO Y SEIS FAMILIAS TIPOGRÁFICAS en circulación. Dos de ellas —Encode Sans Condensed peso 700 para titulares y DM Sans 15 px para cuerpo, ambas de código abierto y sin coste de licencia— están bien emparejadas entre sí en el sitio y forman una jerarquía correcta.","lead":""},{"t":"El problema es que ese emparejamiento NO GOBIERNA NADA FUERA DEL SITIO: ni el logotipo (sans-serif itálica personalizada con contorno y sombra), ni el logotipo de «Reporte Bernal» (palo seco en mayúsculas más manuscrita), ni los subtítulos de vídeo (sans-serif geométrica redondeada), ni la firma manuscrita de las piezas.","lead":""},{"t":"DETALLE MENOR PERO CORREGIBLE EN UN MINUTO: el tamaño base de 15 px del cuerpo de texto del sitio está por debajo del mínimo recomendado de 16 px para lectura cómoda en pantalla.","lead":"DETALLE MENOR PERO CORREGIBLE EN UN MINUTO:"}],"accion":"Declarar una pareja tipográfica única para todas las piezas. Subir el cuerpo del sitio de 15 a 16 píxeles."},{"n":3,"punto":"Logotipo / marca personal: existencia, calidad y versiones","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"EL ACTIVO EXISTE Y ES BUENO. El logotipo de marca personal está construido con criterio profesional: composición en dos niveles («Freddy» en itálica ligera y «Bernal» en peso pesado, creando jerarquía y dinamismo), descriptor de cargo («GOBERNADOR») en caja alta sobre banda amarilla claramente subordinado al nombre, elemento gráfico de barras diagonales amarillas que aporta movimiento y funciona como recurso reutilizable, y tratamiento de contorno blanco y sombra que garantiza legibilidad sobre fondos fotográficos.","lead":"EL ACTIVO EXISTE Y ES BUENO."},{"t":"EL PROBLEMA: EXISTE PERO NO SE DESPLIEGA. Se invirtió en construir una marca personal de calidad y luego se dejó de aplicar en los ocho puntos de contacto donde la ve la audiencia.","lead":"EL PROBLEMA:"},{"t":"VERSIONES: no se localizó evidencia de versiones alternativas (monocroma, reducida para avatar, horizontal para cabecera, sobre fondo oscuro). La existencia de esas variantes es precisamente lo que permitiría desplegarlo, y su ausencia probablemente explica por qué no se usa.","lead":"VERSIONES:"}],"accion":"Generar las versiones que faltan (monocroma, reducida para avatar, horizontal para cabecera, sobre fondo oscuro) y desplegar el logotipo en los ocho puntos de contacto. El activo ya está hecho y pagado.","tabla":{"headers":["Punto de contacto","¿Aparece el logotipo?"],"rows":[["Banner del sitio oficial","SÍ — es su único uso confirmado"],["Foto de perfil de X","NO — bandera con lazo de luto"],["Foto de perfil de Instagram","NO — bandera con lazo de luto"],["Foto de perfil de TikTok","NO — bandera con lazo de luto"],["Foto de perfil de Facebook","NO — bandera con lazo de luto"],["Cabecera de X","NO — sin imagen, gris liso"],["Piezas de vídeo","NO — usan la identidad de «Reporte Bernal»"],["Portadas de historias destacadas","NO — fotogramas del contenido, sin plantilla"]]}},{"n":4,"punto":"Plantillas de piezas: existencia, variedad y calidad","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"El diagnóstico es que existe una plantilla EXCELENTE («REPORTE BERNAL — COMUNICADO»: fondo claro con formas geométricas azul y amarilla en esquinas opuestas, logotipo del programa arriba, cuerpo de texto justificado, firma manuscrita y cargo al pie; bien compuesta, jerarquía clara, uso correcto del espacio en blanco) que demuestra capacidad de diseño, y que esa capacidad NO SE HA EXTENDIDO a las tipologías de pieza que se publican a diario. Se diseñó para el caso excepcional y no para el caso frecuente.","lead":""}],"accion":"Crear las cuatro plantillas de tipología que faltan. La de «COMUNICADO» ya demuestra que existe capacidad para hacerlas bien.","tabla":{"headers":["Plantilla","Calidad","Frecuencia"],"rows":[["«REPORTE BERNAL — COMUNICADO»","ALTA. Bien compuesta, jerarquía clara.","Puntual — solo para avisos"],["Identidad de set «Reporte Bernal»","MEDIA. Funciona en horizontal pero se corta en el recorte vertical.","Recurrente — cada emisión"],["Piezas de partido","No evaluable como marca propia — identidad ajena del PSUV","Ocasional"],["Contenido de vídeo general","BAJA — sin plantilla: solo subtítulo quemado","Mayoritaria"]]}},{"n":5,"punto":"Jerarquía visual y legibilidad en pantalla móvil","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"POSITIVO: los subtítulos de vídeo están correctamente dimensionados para móvil —cuerpo grande, dos líneas cortas por bloque, corte de frase natural, blanco con sombra proyectada—. Es el elemento mejor resuelto en términos de legibilidad móvil.","lead":"POSITIVO:"},{"t":"POSITIVO: el logotipo de marca tiene contorno y sombra, lo que garantiza legibilidad sobre fotografía sin necesidad de caja de fondo.","lead":"POSITIVO:"},{"t":"NEGATIVO: la plantilla de «COMUNICADO» usa texto justificado en párrafos largos. En una pieza cuadrada vista a tamaño de móvil, ese bloque es difícil de leer sin ampliar. Debería usar cuerpo mayor, menos palabras y alineación izquierda.","lead":"NEGATIVO:"},{"t":"NEGATIVO: el cuerpo de texto del sitio a 15 px queda por debajo del mínimo cómodo de 16 px.","lead":"NEGATIVO:"},{"t":"NEGATIVO: la foto de perfil (bandera con lazo) es ilegible como identificador a 32-40 píxeles, que es su tamaño real junto a un comentario. No hay rostro ni marca reconocible a ese tamaño.","lead":"NEGATIVO:"}],"accion":"Rediseñar la plantilla de COMUNICADO para móvil: cuerpo mayor, menos palabras, alineación izquierda."},{"n":6,"punto":"Uso de fotografía: calidad, retoque, dirección de arte y banco","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"HALLAZGO SOBRE EL ORIGEN DEL MATERIAL. Los nombres de archivo del sitio revelan el flujo de trabajo real: varias fotografías publicadas conservan nombres del tipo «photo_4963444561984294093_y.jpg», que es el patrón de nomenclatura automática de exportación de Telegram. Es decir: el material fotográfico llega al equipo por mensajería y se sube al sitio sin renombrar ni procesar.","lead":"HALLAZGO SOBRE EL ORIGEN DEL MATERIAL."},{"t":"Consecuencias: Telegram recomprime las imágenes al enviarlas, con pérdida de calidad antes incluso de publicarse; los nombres de archivo no describen el contenido, lo que impide cualquier búsqueda posterior en el banco; y no hay paso por una herramienta de edición — se publica el archivo tal como llegó.","lead":""},{"t":"CALIDAD Y DIMENSIONES: las fotografías del sitio tienen dimensiones dispares. Se detectaron imágenes de 1080×585, 1080×600, 1080×588, 1280×847 y 896×607 píxeles en la misma página. No hay formato de exportación normalizado.","lead":"CALIDAD Y DIMENSIONES:"},{"t":"DIRECCIÓN DE ARTE: el estilo fotográfico es de reportaje documental, fotografía de acto, sin puesta en escena ni retoque aparente. Es coherente con el registro de autenticidad que refuerza su comunicación y NO SE RECOMIENDA CAMBIARLO. No hay tratamiento de color común entre fotografías. El banner del sitio sí muestra dirección de arte deliberada —composición en rombos con fotografías de obra pública, retrato central en pose de mano al pecho, paleta azul-amarilla aplicada— y es la única pieza fotográfica con dirección de arte real.","lead":"DIRECCIÓN DE ARTE:"}],"accion":"Sustituir el flujo de fotografía por mensajería por un repositorio compartido con estructura de carpetas y convención de nombres. Normalizar el formato de exportación."},{"n":7,"punto":"Coherencia con la identidad del partido / movimiento","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"Este punto tiene una lectura política además de gráfica, y el hallazgo es que la identidad personal está construida DELIBERADAMENTE PARA DIFERENCIARSE del partido, no para integrarse en él.","lead":""},{"t":"La identidad personal, cuando se aplica, proyecta un mandatario de gestión antes que un dirigente de partido. Esa decisión es coherente con los hallazgos de rendimiento de los demás módulos: el contenido de gestión e identidad regional rinde mejor que el doctrinal en todas las plataformas.","lead":""},{"t":"EL PROBLEMA NO ES LA DIVERGENCIA SINO LA ALTERNANCIA SIN CRITERIO: en el mismo feed conviven piezas con identidad personal azul y piezas con identidad PSUV roja completa, sin que exista una regla que determine cuándo corresponde cada una. Un manual de marca resolvería exactamente esto.","lead":"EL PROBLEMA NO ES LA DIVERGENCIA SINO LA ALTERNANCIA SIN CRITERIO:"}],"accion":"Redactar la regla escrita de cuándo aplica cada identidad. Es el punto donde un manual de marca produce más valor inmediato.","tabla":{"headers":["Elemento","Identidad personal","Identidad PSUV","Relación"],"rows":[["Color dominante","Azul medio","Rojo","DIVERGENTE — el azul es la elección más deliberada de toda la identidad"],["Color de acento","Amarillo oro","Amarillo (bandera nacional)","COINCIDENTE parcialmente"],["Iconografía","Barras diagonales, rombos","Estrella, rostro de Chávez","DIVERGENTE"],["Registro","Gestión y obra pública","Militancia y legado","DIVERGENTE"]]}},{"n":8,"punto":"Tipologías de pieza: cita, dato, convocatoria, agradecimiento, denuncia","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"De las seis tipologías solicitadas, solo UNA está resuelta.","lead":""},{"t":"LA AUSENCIA DE PLANTILLA DE CITA ES LA MÁS COSTOSA: el contenido de la cuenta genera frases memorables con regularidad —«Yo no soy un demagogo», «Soy un hombre de palabra, lo prometí y lo cumplí», «¡El que se vuelva loco y quiera delinquir irá preso!»— y ninguna se convierte en pieza compartible. Solo existen como subtítulo dentro del vídeo.","lead":"LA AUSENCIA DE PLANTILLA DE CITA ES LA MÁS COSTOSA:"},{"t":"La ausencia de plantilla de DATO también tiene coste medible: cifras como los 1.248 millones de toneladas de escombros de La Guaira se comunican en texto, sin visualización, cuando el M18 documenta la «pieza de cifra única» como una de las tipologías de mayor circulación del estándar internacional.","lead":""}],"accion":"Crear las cuatro plantillas que faltan: cita, dato de gestión, convocatoria y agradecimiento.","tabla":{"headers":["Tipología","¿Tiene plantilla propia?","Observación"],"rows":[["Comunicado / aviso","SÍ","La única resuelta, y bien resuelta."],["Cita destacada","NO","Las frases fuertes solo existen como subtítulo dentro del vídeo. Nunca se extraen como pieza gráfica autónoma."],["Dato / cifra de gestión","NO","Datos como los 1.248 millones de toneladas se comunican en texto, sin visualización."],["Convocatoria","NO","No se detectó plantilla de evento con fecha, hora y lugar."],["Agradecimiento","NO","Se resuelve en texto plano."],["Denuncia / desmentido","PARCIAL","Se usa la plantilla de comunicado, que cumple pero no está diseñada para este uso."]]}},{"n":9,"punto":"Consistencia visual entre plataformas","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"LO CONSISTENTE: la foto de perfil es idéntica en las cuatro plataformas sociales principales. Es correcto como principio —el mismo avatar en todas partes— aunque la imagen elegida no sea la óptima. Y los emojis 💛🖤❤️ aparecen en X e Instagram y funcionan como firma cromática reconocible: es el único elemento de marca verdaderamente transversal del ecosistema social.","lead":"LO CONSISTENTE:"},{"t":"LO INCONSISTENTE: el sitio web opera con una identidad COMPLETAMENTE DISTINTA (azul-amarillo, logotipo, tipografías definidas) que no se replica en ninguna red social. Hay una marca para el sitio y otra, distinta y más pobre, para las plataformas donde está la audiencia.","lead":"LO INCONSISTENTE:"},{"t":"LO CRÍTICO: la cabecera de X está VACÍA. Es el espacio gráfico más grande y visible del perfil con mayor número de seguidores del ecosistema, y no contiene nada.","lead":"LO CRÍTICO:"}],"accion":"Poner imagen de cabecera en X. Es el espacio gráfico más visible del perfil con más seguidores y está vacío; el banner del sitio ya existe y se adapta a 1500×500 en minutos.","tabla":{"headers":["Elemento","X","Instagram","TikTok","Sitio web"],"rows":[["Foto de perfil","Bandera + luto","Bandera + luto","Bandera + luto","Logotipo de marca"],["Cabecera","VACÍA","No aplica","No aplica","Banner completo"],["Paleta declarada","💛🖤❤️ Táchira","💛🖤❤️ Táchira","Sin emojis","Azul + amarillo"],["Logotipo aplicado","NO","NO","NO","SÍ"],["Tipografía de marca","No aplica","No aplica","No aplica","Encode Sans + DM Sans"]]}},{"n":10,"punto":"Manual de marca digital: existencia y nivel de cumplimiento","estado":"DIAGNÓSTICO POR EVIDENCIA","prioridad":"ALTA","hallazgo":[{"t":"INDICIO EXTERNO: todo lo documentado en este módulo apunta a que NO EXISTE manual de marca, o que existe y no se cumple. Cuatro azules distintos en el mismo sitio, seis familias tipográficas sin jerarquía declarada, un logotipo construido y no desplegado, y cuatro sistemas gráficos conviviendo sin regla son exactamente los síntomas de una identidad sin documento rector.","lead":"INDICIO EXTERNO:"},{"t":"PREGUNTAS PARA VERIFICARLO INTERNAMENTE: ¿Existe un documento que fije el azul primario, el amarillo de acento y sus valores exactos? ¿Existe una regla escrita sobre cuándo usar identidad personal y cuándo identidad de partido? ¿Están definidas las versiones del logotipo (monocroma, reducida, para avatar, sobre fondo oscuro)? ¿Hay una pareja tipográfica declarada para todas las piezas, o cada diseñador elige? Si el documento existe, ¿lo tiene todo el que produce contenido, incluidos quienes graban desde el teléfono?","lead":"PREGUNTAS PARA VERIFICARLO INTERNAMENTE:"}],"accion":"Redactar un manual de marca mínimo de dos páginas: azul primario y amarillo de acento con valores exactos, pareja tipográfica única, versiones del logotipo, y la regla de cuándo aplica identidad personal frente a identidad de partido."},{"n":11,"punto":"Accesibilidad visual: contraste, tamaño mínimo y daltonismo","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"CONTRASTE: cumple en todas las combinaciones verificadas. Texto gris rgb(67,67,67) sobre blanco cumple con holgura; texto blanco sobre navegación azul marino rgb(29,32,39) cumple con holgura; los subtítulos blancos con sombra cumplen en la práctica gracias a la sombra proyectada; «GOBERNADOR» en negro sobre banda amarilla es una de las combinaciones de mayor contraste posible; las etiquetas de categoría en azul rgb(59,96,254) con texto blanco cumplen, aunque con menos margen.","lead":"CONTRASTE:"},{"t":"TEXTO ALTERNATIVO — EL FALLO ESTRUCTURAL. Verificado: las fotografías del sitio se publican SIN texto alternativo. De las doce primeras imágenes inspeccionadas, once tienen el atributo vacío y solo una lleva descripción («Anuncios»), que además no describe el contenido sino la función del bloque. Un usuario con lector de pantalla no recibe ninguna información sobre las fotografías del sitio oficial del gobernador. Sumado a la ausencia de subtítulos accesibles en vídeo documentada en el M08, el ecosistema es sustancialmente inaccesible para personas con discapacidad visual.","lead":"TEXTO ALTERNATIVO —"},{"t":"DALTONISMO: la paleta de marca (azul + amarillo) es una de las combinaciones más seguras que existen frente a las formas comunes de daltonismo, porque la deficiencia rojo-verde no afecta a la distinción entre azul y amarillo. Es una decisión acertada, probablemente involuntaria pero correcta. La paleta regional (amarillo, negro y rojo) presenta más riesgo —el rojo puede confundirse con tonos oscuros en deuteranopía y protanopía— pero como se usa solo en emojis y no para transmitir información crítica, el impacto es bajo. No se detectó ningún caso donde el color sea el único portador de información, que es el error grave a evitar.","lead":"DALTONISMO:"},{"t":"TAMAÑO MÍNIMO: el cuerpo de texto del sitio a 15 px queda por debajo del mínimo cómodo de 16 px.","lead":"TAMAÑO MÍNIMO:"}],"accion":"Añadir texto alternativo a las fotografías del sitio. Es obligación de accesibilidad para una institución pública y mejora además el posicionamiento en imágenes (ver M07, punto 8)."},{"n":12,"punto":"Banco de recursos gráficos y organización de archivos editables","estado":"DIAGNÓSTICO POR EVIDENCIA","prioridad":"ALTA","hallazgo":[{"t":"INDICIO EXTERNO: los nombres de archivo tipo «photo_4963444561984294093_y.jpg» en el sitio oficial indican que al menos parte del material se gestiona por mensajería sin pasar por un repositorio organizado.","lead":"INDICIO EXTERNO:"},{"t":"PREGUNTAS PARA VERIFICARLO INTERNAMENTE: ¿Existe una carpeta central con los archivos editables del logotipo (vectorial, no solo PNG)? ¿Se conservan las plantillas editables de la pieza de «COMUNICADO», o cada aviso se rehace desde cero? ¿Hay un banco fotográfico organizado por fecha y tema, o las fotos viven en conversaciones de Telegram? ¿Qué pasa si mañana entra un diseñador nuevo: encuentra los archivos o tiene que reconstruir la marca? ¿Existe copia de seguridad de los originales vectoriales en al menos dos ubicaciones?","lead":"PREGUNTAS PARA VERIFICARLO INTERNAMENTE:"}],"accion":"Responder por escrito. Si el vectorial del logotipo no está localizable, es la primera tarea del responsable de marca."}]},{"id":"M10","titulo":"COPYWRITING, GUIONES Y NARRATIVA","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"382 publicaciones analizadas en tres plataformas · 14 líneas de análisis","fuente":"Construido sobre la evidencia medida en los módulos M02, M03, M06, M11 y M13. Cada punto declara la fuente de su hallazgo.","calificacion":"El peor contenido no falla por el tema: falla por la construcción","resumen":[{"t":"El copywriting no se audita leyendo textos sueltos: se audita cruzando qué se escribió con qué resultado obtuvo. Este módulo se construye sobre las 382 publicaciones medidas en X, Instagram y TikTok, de modo que cada afirmación sobre ganchos, extensión, voz o llamadas a la acción tiene detrás una cifra de rendimiento.","lead":""},{"t":"El hallazgo que ordena todo el módulo: el peor contenido no falla por el tema, falla por la construcción. La efeméride doctrinal de 9.974 me gusta frente a la de 322 con el mismo asunto y 1.036 caracteres de apertura institucional lo demuestra con una diferencia de treinta veces.","lead":""}],"puntos":[{"n":1,"punto":"Mensaje central: existencia, claridad y repetición estratégica","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"NO EXISTE UN MENSAJE CENTRAL DECLARADO, pero SÍ EXISTE UNO EMERGENTE Y MEDIDO. La palabra «paz» aparece en el 25% de las publicaciones recientes de TikTok y ocupa 6 de los 20 mejores resultados históricos de la cuenta, con picos de hasta 2,7 millones de reproducciones. Es, con diferencia, la palabra que más rinde en todo el ecosistema.","lead":""},{"t":"La formulación completa que el propio historial demuestra ganadora es «Táchira, territorio de paz» / «Frontera de paz», con variantes que ocupan los puestos 4, 5, 10 y 17 del top histórico de TikTok.","lead":""},{"t":"REPETICIÓN ESTRATÉGICA: no es estratégica, es accidental. El eje se repite porque funciona, no porque se haya decidido. El M13 documenta que representa apenas el 8% del contenido total del ecosistema frente a un peso ideal propuesto del 15%; el M03, medido solo sobre TikTok, lo sitúa en el 25% frente a un ideal del 30%. En X e Instagram prácticamente no aparece.","lead":"REPETICIÓN ESTRATÉGICA:"},{"t":"El M18 lo formula como recomendación de estrategia: «monotema sostenido — elegir un eje único y machacarlo durante años hasta que el nombre del político y el tema sean sinónimos». La aplicabilidad se califica de ALTA porque el eje ya está identificado por datos; lo que falta es la disciplina de sostenerlo.","lead":""}],"accion":"Declarar «paz y frontera» como mensaje central por escrito y sostenerlo en las tres plataformas, no solo en TikTok."},{"n":2,"punto":"Ejes narrativos y pilares de contenido","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Los pilares están identificados y medidos, y la distribución real está desbalanceada respecto de la que el propio rendimiento justifica. Tres pilares que juntos generan casi todo el top 20 de viralidad —paz y frontera, identidad regional y contenido humano— representan hoy en conjunto apenas una cuarta parte de la producción, mientras que la política institucional y el vocabulario doctrinal, que rinden mal en redes de alcance masivo, ocupan más de un quinto.","lead":""},{"t":"No hace falta producir más: hace falta invertir la proporción.","lead":""}],"accion":"Reequilibrar la producción según esta tabla. Es la brecha más accionable de toda la auditoría porque no requiere presupuesto, solo redistribuir lo que ya se produce.","tabla":{"headers":["Pilar de contenido","Peso real estimado","Peso ideal propuesto","Brecha"],"rows":[["Gestión operativa (obras, servicios, vialidad)","≈ 35%","25%","SOBREPRODUCIDO — rinde de forma media, no es el motor de alcance"],["Seguridad con resultado verificable","≈ 15%","15%","BIEN CALIBRADO"],["Paz y frontera","≈ 8%","15%","INFRAPRODUCIDO — es el eje de mayor rendimiento en TikTok"],["Identidad y cultura regional","≈ 10%","18%","INFRAPRODUCIDO — barato de producir y consistentemente exitoso"],["Contenido humano-cotidiano","≈ 7%","15%","INFRAPRODUCIDO — segundo eje de mayor rendimiento y el más económico"],["Política institucional y actos de partido","≈ 15%","7%","SOBREPRODUCIDO — el pilar de peor rendimiento consistente"],["Vocabulario y efemérides doctrinales","≈ 7%","3%","SOBREPRODUCIDO — reservar para el programa de radio propio"],["Fechas festivas y estacionales","≈ 3%","2%","BIEN CALIBRADO, uso oportunista correcto"]]}},{"n":3,"punto":"Promesa de campaña: claridad, credibilidad y consistencia","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"El hallazgo relevante es que YA NO HAY PROMESA DE CAMPAÑA VIGENTE, y eso es correcto: el M13 documenta que no hay ni un solo contenido de campaña electoral en los tres top de rendimiento, y el M03 confirma que en las 63 publicaciones recientes y en los 20 mejores resultado
