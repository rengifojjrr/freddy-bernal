e copiarse de las otras plataformas.","lead":""}],"accion":"Trasladar volumen de TikTok de la tarde-noche a la franja 22:00-23:59. Coste cero, impacto directo.","tabla":{"headers":["Franja (hora Venezuela)","TikTok: publicaciones","TikTok: media de reproducciones","X: peso","Instagram: peso"],"rows":[["22:00 – 23:59","7","64.498 — MEJOR FRANJA","7%","9%"],["07:00 – 11:59","12","50.380 — segunda mejor","26%","26%"],["00:00 – 06:59","1","32.100 (muestra insuficiente)","3%","2%"],["12:00 – 16:59","14","19.837 — PEOR FRANJA en TikTok","31% (la más cargada)","33% (la más cargada)"],["17:00 – 21:59","29 (46% del volumen)","16.048 — muy usada, bajo rendimiento","32%","30%"]]}},{"n":7,"punto":"Mejor y peor día de la semana por plataforma","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"EL JUEVES ES EL MEJOR DÍA EN LAS TRES PLATAFORMAS, y en TikTok además con el mejor rendimiento medio, no solo el mayor volumen. El sábado es el día más débil de las tres plataformas del ecosistema sin excepción.","lead":""},{"t":"LA ANOMALÍA CONSISTENTE: el lunes (X) o el miércoles (Instagram) —el arranque o el ecuador de la semana— quedan sistemáticamente desatendidos, mientras el jueves concentra el pico en ambas plataformas. Para una comunicación de gobierno, es preferible que el lunes marque agenda y no que sea el día más flojo.","lead":"LA ANOMALÍA CONSISTENTE:"},{"t":"LA ANOMALÍA MÁS COSTOSA, en TikTok: el MARTES tiene el mismo volumen de publicación que el jueves (11 cada uno) pero una media de reproducciones TRES VECES MENOR (15.006 frente a 47.620). Es el ejemplo más claro de esfuerzo mal invertido de toda la auditoría: se publica igual de seguido en el mejor y en uno de los peores días de la semana.","lead":""},{"t":"Ajustar esto no requiere más contenido, solo redistribuir el que ya se produce a lo largo de la semana.","lead":""}],"accion":"Redistribuir el volumen de TikTok del martes y el sábado hacia miércoles, jueves y domingo. Reforzar el lunes en X y el miércoles en Instagram.","tabla":{"headers":["Día","X (publicaciones)","Instagram (publicaciones)","TikTok (publicaciones)","TikTok: media de reproducciones"],"rows":[["Lunes","17 — el más débil","6","10","27.237"],["Martes","32","8","11","15.006 — ANOMALÍA"],["Miércoles","29","4 — el más débil","9","45.726 — segundo mejor"],["Jueves","36 — el más activo","15 — el más activo","11","47.620 — MEJOR"],["Viernes","25","13","10","20.329"],["Sábado","33","10","8","10.570 — el peor"],["Domingo","20","7","4","42.650"]]}},{"n":8,"punto":"Distribución real del contenido por pilar vs. distribución ideal","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"LA BRECHA MÁS ACCIONABLE DE TODO EL INFORME. Tres pilares que juntos generan casi todo el top 20 de viralidad —paz y frontera, identidad regional y contenido humano— representan hoy en conjunto apenas una cuarta parte de la producción, mientras que la política institucional y el vocabulario doctrinal, que rinden mal en redes de alcance masivo, ocupan más de un quinto del total.","lead":"LA BRECHA MÁS ACCIONABLE DE TODO EL INFORME."},{"t":"NO HACE FALTA PRODUCIR MÁS: HACE FALTA INVERTIR LA PROPORCIÓN.","lead":"NO HACE FALTA PRODUCIR MÁS:"},{"t":"Medido específicamente sobre TikTok (M03, por frecuencia de hashtags en 63 publicaciones), la brecha es aún más nítida: el 46% de la producción lleva la etiqueta «trabajo» sin acompañamiento emocional o temático, mientras que el eje de identidad regional —que ha dado cuatro de los veinte mejores resultados históricos con recursos de producción mínimos— apenas tiene presencia diferenciada. No hace falta grabar más: hace falta que una porción mayor de lo que ya se graba en el terreno se etiquete y encuadre en torno a paz, identidad o emoción, en vez de quedarse en el registro puramente administrativo.","lead":""}],"accion":"Reequilibrar la proporción. Es la acción de mayor impacto y menor coste de toda la auditoría, porque no requiere presupuesto ni más producción.","tabla":{"headers":["Pilar de contenido","Peso real estimado","Peso ideal propuesto","Brecha"],"rows":[["Gestión operativa (obras, servicios, vialidad)","≈ 35%","25%","SOBREPRODUCIDO"],["Seguridad con resultado verificable","≈ 15%","15%","BIEN CALIBRADO"],["Paz y frontera","≈ 8%","15%","INFRAPRODUCIDO — eje de mayor rendimiento"],["Identidad y cultura regional","≈ 10%","18%","INFRAPRODUCIDO — barato y consistentemente exitoso"],["Contenido humano-cotidiano","≈ 7%","15%","INFRAPRODUCIDO — segundo mejor y el más económico"],["Política institucional y actos de partido","≈ 15%","7%","SOBREPRODUCIDO — peor rendimiento consistente"],["Vocabulario y efemérides doctrinales","≈ 7%","3%","SOBREPRODUCIDO — reservar al programa de radio"],["Fechas festivas y estacionales","≈ 3%","2%","BIEN CALIBRADO"]]}},{"n":9,"punto":"Contenido con mayor conversión (no solo mayor alcance)","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"LÍMITE HONESTO DE ESTE APARTADO: la conversión real —clics a un enlace, registros, llamadas iniciadas— no es medible desde fuera de las cuentas, y además ni Instagram ni la mayoría de perfiles de TikTok llevan enlace en biografía. Sin ese dato, este punto usa la mejor proxy disponible: qué contenido convierte alcance en sentimiento favorable, disposición a la acción o uso real por parte del ciudadano.","lead":"LÍMITE HONESTO DE ESTE APARTADO:"},{"t":"LA LECCIÓN DEL APARTADO: alcance y conversión no son lo mismo y a veces van en direcciones opuestas. La publicación de mayor alcance absoluto de X en todo el semestre (el helado, 72.356 vistas) es también uno de sus peores resultados en términos de sentimiento, con 365 respuestas críticas frente a 160 me gusta.","lead":"LA LECCIÓN DEL APARTADO:"},{"t":"La conversión más limpia identificada —el peluche de Cúcuta y la detención tras denuncia ciudadana— comparte un rasgo: MUESTRA UNA ACCIÓN CON INICIO Y RESULTADO, NO SOLO PRESENCIA.","lead":""}],"accion":"Replicar deliberadamente el ciclo denuncia-acción-resultado. Ya hay un caso documentado funcionando y es el mayor diferencial competitivo disponible.","tabla":{"headers":["Contenido","Plataforma","Por qué convierte más allá del alcance"],"rows":[["Peluche de niños de Cúcuta para La Guaira","X (39.316 vistas)","Reacción abrumadoramente favorable y refuerzo del eje binacional de forma orgánica, sin pedir nada a cambio. El ejemplo más limpio de alcance traducido en buena voluntad medible."],["Gestión de escombros en La Guaira (1.248 millones de toneladas)","X (17.931 vistas)","Cifra concreta que generó comprensión pública de la magnitud del problema: conversión informativa, poco frecuente en el resto del contenido."],["Contenido de paz fronteriza","TikTok (varios, 1,6-2,7 M)","El volumen sostenido de reproducciones en un mismo eje temático a lo largo del tiempo es en sí mismo una señal de conversión de atención en hábito de consumo."],["Detención tras difusión de un vídeo ciudadano","Instagram (1.179 me gusta)","EL ÚNICO CASO documentado de ciclo de conversión completo: un ciudadano difunde un problema, la autoridad actúa, y el resultado se comunica de vuelta. Es el patrón que debería replicarse deliberadamente."],["Vídeo del helado en Farmatodo","X (72.356 vistas, la mayor del semestre)","CASO DE ALCANCE SIN CONVERSIÓN, Y CON CONVERSIÓN NEGATIVA. 365 respuestas críticas frente a 160 me gusta; alimentó la narrativa de contraste social."]]}},{"n":10,"punto":"Relación entre contenido de campaña y contenido de gestión/humano","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"EL CRUCE ES CONTUNDENTE: no hay un solo contenido de campaña electoral (llamada al voto, simbología de proceso electoral, promesas de futuro) en ninguno de los tres top de rendimiento. Lo que ocupa esos lugares es, en proporciones similares, gestión con resultado concreto y contenido humano sin agenda electoral.","lead":"EL CRUCE ES CONTUNDENTE:"},{"t":"LO QUE QUEDA DE CAMPAÑA, Y DÓNDE. La destacada de Instagram «PLAN GOBIERNO» mantiene una portada con llamada directa al voto («VOTE Bernal»). La cuenta secundaria de TikTok @freddybernalvzla, con 19.400 seguidores, sigue describiéndolo en su biografía como «Candidato a la gobernación del Táchira» pese a que gobierna desde diciembre de 2021 y fue reelecto en mayo de 2025. Y el material más antiguo de los blogs heredados y de Mastodon usa etiquetas de etapas ya superadas («Protector del Táchira», «Miembro de la Dirección Nacional»).","lead":"LO QUE QUEDA DE CAMPAÑA, Y DÓNDE."},{"t":"LA RELACIÓN DE FONDO: el contenido de campaña que todavía circula no es dañino porque compita con el contenido de gestión — es dañino porque es un RESIDUO SIN VIGILANCIA: nadie lo está usando de forma activa ni lo está retirando de forma activa. Mientras tanto, la fórmula que sí funciona —gestión concreta más contenido humano, sin caja electoral encima— ya está demostrada con datos propios en las tres plataformas.","lead":"LA RELACIÓN DE FONDO:"},{"t":"No hace falta inventar una estrategia nueva: hace falta retirar el residuo de campaña y producir más de lo que el propio historial de cada cuenta ya demuestra que funciona.","lead":""}],"accion":"Retirar los dos residuos activos (destacada de Instagram y biografía del TikTok secundario) y sostener la fórmula probada."}]},{"id":"M14","titulo":"ESCUCHA SOCIAL — TÁCHIRA (LOCAL)","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"Ecosistema mediático y agenda local documentados con fuente y fecha · 9 líneas de análisis","fuente":"Estudio de Presencia Digital y Reputación, capítulo 7 (M14). Corte: 4 de septiembre de 2026.","calificacion":"El tema que el propio gobernador reconoció como grave y su comunicación no atiende","resumen":[{"t":"El módulo documenta el ecosistema mediático local, la agenda comunicada con hechos verificados y fecha, los patrones de narrativa adversa y —lo más relevante— el tema que el propio gobernador ha reconocido públicamente como grave y que su comunicación no está atendiendo.","lead":""},{"t":"Una precisión que condiciona cualquier medición futura y es en sí misma un hallazgo: buena parte de lo que a primera vista parece cobertura mediática es autopublicación. El sitio de la Gobernación publica resúmenes del programa semanal del propio gobernador y la web personal republica esos mismos contenidos. El eco externo real es sensiblemente menor de lo que sugiere el volumen bruto de resultados, y cualquier instrumentación debe separar ambas categorías desde el diseño.","lead":""}],"puntos":[{"n":1,"punto":"Volumen total de menciones en el estado Táchira","estado":"REQUIERE MONITORIZACIÓN CONTINUA","prioridad":"ALTA","hallazgo":[{"t":"Se obtiene con una plataforma de monitorización de tipo Brandwatch, Meltwater o Talkwalker. En ausencia de esa herramienta, el volumen de menciones se mide con monitorización continua, no con observación puntual.","lead":""},{"t":"ADVERTENCIA METODOLÓGICA CRÍTICA PARA CUANDO SE INSTRUMENTE, y es el hallazgo más valioso de este módulo: buena parte de lo que a primera vista parece cobertura mediática es en realidad AUTOPUBLICACIÓN. El sitio de la Gobernación (tachira.gob.ve) publica resúmenes del programa semanal del propio gobernador, y su web personal (freddybernaloficial.com) republica esos mismos contenidos. El eco externo real es sensiblemente menor de lo que sugiere el volumen bruto de resultados.","lead":""}],"accion":"Contratar la herramienta. Es la infraestructura que convierte la escucha en una serie medible y comparable entre periodos."},{"n":2,"punto":"Análisis de sentimiento local: positivo, negativo, neutro","estado":"REQUIERE MONITORIZACIÓN CONTINUA","prioridad":"ALTA","hallazgo":[{"t":"El porcentaje de sentimiento exige monitorización continua: una observación puntual no lo produce con rigor.","lead":""},{"t":"LO QUE SÍ ESTÁ MEDIDO, por otra vía y con muestra propia (M19): el tono varía radicalmente por plataforma. En X el entorno es HOSTIL, con aproximadamente una respuesta favorable por cada quince críticas sobre una muestra de 108. En TikTok es MIXTO Y CONCRETO: convive el apoyo con la demanda específica y verificable. En Instagram es FAVORABLE, el entorno más amable del ecosistema.","lead":""},{"t":"CONSECUENCIA ESTRATÉGICA: tomar decisiones de comunicación leyendo solo los comentarios de X sería leer el peor termómetro disponible, porque X es además la plataforma con la audiencia más envejecida y el menor alcance real (0,56% sobre seguidores).","lead":"CONSECUENCIA ESTRATÉGICA:"}],"accion":"Instrumentar. Mientras tanto, no confundir el sentimiento de X con el sentimiento general."},{"n":3,"punto":"Temas y palabras asociadas a su nombre en Táchira","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"La AGENDA COMUNICADA sí está documentada con hechos verificados y fecha: servicios públicos —el propio gobernador reporta apagones de hasta 10 horas y anuncia notificación a la presidencia, con la declaración «Sin agua y sin luz no se puede» (junio de 2026); seguridad ciudadana —reunión con alcaldes y organismos para el Plan de Seguridad Ciudadana (16 de agosto de 2026); religiosidad popular —condecoración a la Virgen de la Consolación de Táriba en su 426 aniversario, con cobertura de la peregrinación en tres plataformas (14-15 de agosto de 2026); comunicación institucional —emisión número 255 del programa semanal (28 de agosto de 2026); compromiso público —«¡Soy hombre de palabra y lo que prometo cumplo. No hablo bolserías!» en X (3 de septiembre de 2026).","lead":""},{"t":"Lo que NO está medido es qué palabras asocia la CONVERSACIÓN PÚBLICA a su nombre, que es cosa distinta de qué comunica él. Eso requiere la herramienta.","lead":""}],"accion":"Instrumentar para medir la asociación real, no solo la agenda emitida."},{"n":4,"punto":"Líderes de opinión e influencers locales: postura hacia el candidato","estado":"EXCLUIDO POR CRITERIO PROFESIONAL","prioridad":"MEDIA","hallazgo":[{"t":"El estudio original excluye expresamente el registro nominal de líderes de opinión con su postura, por la misma razón metodológica por la que el M19 excluye el listado nominal de detractores: se trata mayoritariamente de personas cuya catalogación por postura política excede lo comunicacional.","lead":""},{"t":"Lo que sí es legítimo y está entregado es el análisis de patrón y el mapa de medios (punto 5).","lead":""}],"accion":"Punto excluido por decisión metodológica. Si se requiere, debe contratarse aparte y con criterio propio."},{"n":5,"punto":"Análisis de comentarios en publicaciones de medios locales","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"ECOSISTEMA MEDIÁTICO LOCAL IDENTIFICADO. Los medios digitales del estado que cubren al sujeto de forma recurrente son Diario La Nación (lanacionweb.com) y La Prensa del Táchira (laprensatachira.com). A ellos se suman dos canales que NO SON PRENSA sino comunicación institucional propia: tachira.gob.ve, sitio de la Gobernación, y freddybernaloficial.com, su web personal.","lead":"ECOSISTEMA MEDIÁTICO LOCAL IDENTIFICADO."},{"t":"LA DISTINCIÓN ES RELEVANTE Y ES EL APORTE PRINCIPAL DEL PUNTO: el sitio de la Gobernación publica resúmenes del programa semanal del propio gobernador y la web personal republica esos mismos contenidos. Cualquier medición futura debe separar ambas categorías antes de contar.","lead":"LA DISTINCIÓN ES RELEVANTE Y ES EL APORTE PRINCIPAL DEL PUNTO:"},{"t":"El análisis sistemático de los comentarios en las publicaciones de esos medios se incorpora al panel de monitorización. El M06 sí documenta que los comentarios ciudadanos en X citan repetidamente cuentas de noticias tachirenses como fuente alternativa sobre vialidad y servicios, lo que confirma que los medios locales ocupan ese espacio informativo.","lead":""}],"accion":"Separar autopublicación de cobertura en toda medición, desde el diseño."},{"n":6,"punto":"Percepción por municipio (San Cristóbal, Táriba, Rubio, etc.)","estado":"REQUIERE MONITORIZACIÓN CONTINUA","prioridad":"MEDIA","hallazgo":[{"t":"Se cierra con instrumentación con geolocalización de menciones.","lead":""},{"t":"INDICIO PARCIAL DESDE EL M19: los comentarios ciudadanos citan por nombre la carretera Rubio–San Cristóbal en varias intervenciones independientes, incluyendo una que afirma que lleva tres años en mal estado. Es la única señal municipal específica documentada, y apunta al eje Rubio–San Cristóbal como foco de reclamo.","lead":"INDICIO PARCIAL DESDE EL M19:"}],"accion":"Instrumentar. El eje Rubio–San Cristóbal ya está señalado como foco."},{"n":7,"punto":"Comparativa de conversación vs. otros líderes del estado","estado":"REQUIERE MONITORIZACIÓN CONTINUA","prioridad":"MEDIA","hallazgo":[{"t":"Se obtiene con monitorización continua.","lead":""},{"t":"NOTA DEL M17 sobre la selección de competidores: tras las elecciones de mayo de 2025, en las que la Plataforma Unitaria no participó, no existe un contrapeso opositor con presencia digital estructurada en el estado que constituya un competidor medible. El comparador interno más relevante en el propio territorio es la cuenta institucional de la Gobernación, que compite por la misma audiencia con el mismo mensaje.","lead":""}],"accion":"Instrumentar. Priorizar la comparación con la cuenta institucional, que es la única accionable internamente."},{"n":8,"punto":"Narrativas en contra circulando localmente","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"La medición de circulación exige monitorización continua.","lead":""},{"t":"REPROCHE DE CLASE: es el patrón dominante, 30% de la muestra de 108 comentarios. Toma cualquier contenido personal del gobernador y lo contrapone a la penuria económica. No ataca la gestión, ataca la legitimidad para disfrutar. Riesgo ALTO: se activa solo, sin coordinación, y crece cuando el contenido es cotidiano en contexto de escasez.","lead":"REPROCHE DE CLASE:"},{"t":"RECLAMO DE SERVICIO CONVERTIDO EN ATAQUE: un ciudadano con una queja real (luz, vialidad) la formula en tono agresivo por acumulación de frustración. Riesgo MEDIO: es recuperable, porque detrás hay una demanda legítima que puede atenderse.","lead":"RECLAMO DE SERVICIO CONVERTIDO EN ATAQUE:"},{"t":"INSULTO SIN CONTENIDO: 13% de la muestra. Bajo en sí mismo, pero es el que provocó el episodio de confrontación del 4 al 6 de agosto.","lead":"INSULTO SIN CONTENIDO:"},{"t":"ACUSACIONES DE CORRUPCIÓN: 8% de la muestra, genéricas y no accionables.","lead":"ACUSACIONES DE CORRUPCIÓN:"},{"t":"Adicionalmente, el capítulo 3 del estudio documenta un cuerpo de acusaciones publicadas por fuentes identificables —de InSight Crime, el gobierno de Colombia ante la OEA, Connectas y Transparencia Venezuela— sobre las que no consta condena firme. La distinción entre acusación publicada y hecho probado es deliberada y debe mantenerse.","lead":""}],"accion":"El reproche de clase se neutraliza evitando contenido de consumo en contexto de escasez, no respondiéndolo. El reclamo de servicio se neutraliza con gestión."},{"n":9,"punto":"Temas locales sin atender que la gente reclama","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"Este punto cuenta con evidencia sólida que NO requiere escucha social, porque la fuente es el propio gobernador: en junio de 2026 reportó públicamente apagones de hasta diez horas y anunció que lo notificaría a la presidencia, con la declaración «Sin agua y sin luz no se puede».","lead":""},{"t":"EXISTE POR TANTO UNA DISTANCIA OBSERVABLE entre los ejes que dominan su comunicación —actos institucionales, religiosidad popular, seguridad— y un problema de servicios que ÉL MISMO HA RECONOCIDO PÚBLICAMENTE COMO GRAVE. La evidencia no es una inferencia sobre la conversación pública: es una declaración del titular.","lead":""},{"t":"El M19 confirma la demanda desde el otro lado con muestra propia de comentarios y aporta las tres demandas repetidas, verificables y de competencia regional: cortes de energía eléctrica (aparece en X y TikTok, con detalle de horas), vialidad —con la carretera Rubio–San Cristóbal citada por nombre en varios comentarios independientes—, y el asunto del peso colombiano y las casas de cambio, minoritario en volumen pero muy específico, propio de una economía fronteriza y sin competencia informativa.","lead":""},{"t":"Estas tres son las únicas demandas del corpus que se resuelven con GESTIÓN y no con comunicación. Responderlas con hechos tendría más efecto sobre el sentimiento que cualquier ajuste de contenido.","lead":""}],"accion":"Cerrar la distancia entre agenda comunicada y agenda reconocida. Con independencia de la solución del problema, la ausencia de comunicación sobre un asunto que el titular ha declarado grave es una decisión editorial con coste."}]},{"id":"M15","titulo":"ESCUCHA SOCIAL — NACIONAL","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"Momentos de exposición nacional documentados con cita textual y fecha · 10 líneas de análisis","fuente":"Estudio de Presencia Digital y Reputación, capítulo 8 (M15). Corte: 4 de septiembre de 2026.","calificacion":"El momento de mayor exposición nacional del periodo no fue capitalizado por la estructura propia","resumen":[{"t":"El módulo documenta los momentos de mayor exposición nacional del periodo con cita textual y fecha, los temas nacionales a los que se le asocia, y la variable estructural que condiciona toda planificación posterior: el registro de sanciones internacionales.","lead":""},{"t":"El episodio del 2 de junio de 2026 es el dato de posicionamiento más significativo de todo el estudio, y se analiza en detalle en el punto 8.","lead":""}],"puntos":[{"n":1,"punto":"Volumen total de menciones a nivel nacional","estado":"REQUIERE MONITORIZACIÓN CONTINUA","prioridad":"ALTA","hallazgo":[{"t":"Se obtiene con una plataforma de monitorización. El estudio no contiene ninguna cifra de volumen nacional y así se declara. Aplica la misma advertencia del M14 sobre separar autopublicación de cobertura real.","lead":""}],"accion":"Contratar la herramienta. Instrumentar antes de necesitarlo."},{"n":2,"punto":"Análisis de sentimiento nacional","estado":"REQUIERE MONITORIZACIÓN CONTINUA","prioridad":"ALTA","hallazgo":[{"t":"El porcentaje de sentimiento nacional exige monitorización continua. La muestra propia disponible (108 respuestas en X) es de una sola publicación y no es representativa a escala nacional.","lead":""}],"accion":"Instrumentar."},{"n":3,"punto":"Cobertura de medios digitales nacionales: alcance y tono","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"MEDIOS NACIONALES IDENTIFICADOS que han publicado sobre el sujeto en el periodo: El Nacional (elnacional.com), que cubrió tanto el episodio de los retratos del 2 de junio de 2026 como el reporte de apagones de hasta diez horas en junio de 2026; y Noticias al Día y a la Hora (noticiasaldiayalahora.co), que cubrió la notificación a Delcy Rodríguez por los apagones bajo el titular «sin agua y sin luz no se puede».","lead":""},{"t":"El alcance y el tono agregados de esa cobertura requieren instrumentación.","lead":""},{"t":"OBSERVACIÓN RELEVANTE: los dos episodios de cobertura nacional documentados en el periodo son ambos de contenido crítico o de confrontación —la oposición a la directriz sobre los retratos y la denuncia del déficit eléctrico—, no de gestión. Es lo que la prensa nacional recoge de él.","lead":"OBSERVACIÓN RELEVANTE:"}],"accion":"Instrumentar para medir alcance y tono. Observar que la cobertura nacional se activa con la confrontación, no con la gestión."},{"n":4,"punto":"Periodistas e influencers nacionales: menciones y postura","estado":"EXCLUIDO POR CRITERIO PROFESIONAL","prioridad":"MEDIA","hallazgo":[{"t":"El estudio original excluye expresamente el registro nominal de periodistas e influencers con su postura, por la misma razón metodológica aplicada en el M14 y el M19.","lead":""},{"t":"DATO RELEVANTE DEL M06 sobre la relación con la prensa: en todo el periodo analizado en X (junio–septiembre de 2026) NO HAY UNA SOLA respuesta, mención o repost dirigido a un periodista o a un medio independiente. El 100% de la amplificación procede del ecosistema estatal y partidista. La ausencia de relación es en sí misma el hallazgo.","lead":""}],"accion":"Punto excluido por decisión metodológica. La ausencia total de interlocución con prensa sí está documentada en el M06 y es accionable."},{"n":5,"punto":"Participación en la conversación (share of voice) vs. otros políticos","estado":"REQUIERE MONITORIZACIÓN CONTINUA","prioridad":"ALTA","hallazgo":[{"t":"El share of voice exige medir el volumen propio contra el de un conjunto de comparables en el mismo periodo. Se obtiene con monitorización continua.","lead":""},{"t":"PROXY DISPONIBLE, del M12: frente a Rafael Lacava, el comparador natural, la brecha en Instagram es de 8 a 1 (244.000 frente a 2.000.000 de seguidores). No es share of voice, pero es el único contraste cuantificado disponible.","lead":""}],"accion":"Instrumentar con un conjunto definido de comparables: Lacava, Adán Chávez, José Alejandro Terán y la Gobernación del Táchira."},{"n":6,"punto":"Temas nacionales a los que se le asocia","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Tres temas nacionales documentados con fecha y fuente. Primero, y el más significativo: la CONFRONTACIÓN PÚBLICA CON LA DIRECTRIZ DEL GOBIERNO INTERINO SOBRE LOS RETRATOS (2 de junio de 2026). Segundo: la DENUNCIA DEL DÉFICIT ELÉCTRICO ante el gobierno central (junio de 2026). Tercero: su REELECCIÓN Y PROCLAMACIÓN ante el CNE (mayo de 2025).","lead":""},{"t":"Adicionalmente, y de forma estructural, el capítulo 3 del estudio documenta que está designado en diez listas de sanciones de ocho jurisdicciones (EE.UU. — OFAC lista SDN, Consolidated Screening List y exclusiones de contratación SAM; UE — Financial Sanctions Files y prohibiciones de viaje; Reino Unido — FCDO; Canadá; Suiza — SECO; Francia; Bélgica; Mónaco), y que existe un cuerpo de acusaciones publicadas por fuentes identificables (InSight Crime, gobierno de Colombia ante la OEA, Connectas, Transparencia Venezuela, International Crisis Group) sobre las que no consta condena firme.","lead":""},{"t":"Ese registro es condicionante de todo lo anterior en un aspecto concreto y operativo: afecta a la elegibilidad publicitaria en las plataformas de Meta y Google, a los procesos de verificación de identidad de las redes sociales, y al tratamiento por parte de medios y organizaciones internacionales. Cualquier planificación de comunicación que ignore esta variable partirá de un supuesto falso.","lead":""},{"t":"DATO DE MAYOR RELEVANCIA TEMPORAL: la persistencia de las designaciones tras la transición política de enero de 2026. Mientras la presidenta encargada fue excluida de la lista SDN el 1 de abril de 2026, no consta acción equivalente sobre el sujeto, y existe un registro de inhabilitación federal de contratación fechado en marzo de 2026, posterior a la transición. Las exclusiones de lista en este ciclo son individuales y negociadas, no generales.","lead":"DATO DE MAYOR RELEVANCIA TEMPORAL:"}],"accion":"Documentar la restricción de forma explícita en cualquier plan de comunicación. Condiciona qué tácticas son ejecutables."},{"n":7,"punto":"Narrativas en contra a nivel nacional","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"La medición de circulación exige monitorización continua. Las narrativas identificadas por muestra propia (M06, M19) son las mismas que a nivel local: reproche de clase (30% de la muestra), acusaciones genéricas de corrupción (8%) y referencias a la situación de Maduro y Cilia Flores (5%).","lead":""},{"t":"A nivel de fuentes documentales, el capítulo 3 recoge el cuerpo de acusaciones publicadas con origen y fecha, manteniendo la distinción entre acusación publicada y hecho probado. Ese material es el sustrato factual sobre el que cualquier narrativa adversa nacional se construye.","lead":""}],"accion":"Instrumentar para medir circulación real."},{"n":8,"punto":"Momentos de mayor exposición nacional y sus causas","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"EL 2 DE JUNIO DE 2026 es el dato de posicionamiento más significativo de todo el estudio. El gobierno interino encabezado por Delcy Rodríguez y Jorge Rodríguez emitió la directriz de retirar los retratos de Hugo Chávez y Nicolás Maduro de organismos e instituciones públicas. El sujeto se opuso públicamente y ordenó lo contrario en su estado.","lead":""},{"t":"Declaración recogida por El Nacional el 2 de junio de 2026: «En la gobernación del Táchira, es de carácter obligatorio, en todas las instituciones, Bolívar, Comandante Hugo Chávez y Nicolás Maduro Moros.» Y: «En tiempos de asedio, más Bolívar, más Chávez y Nicolás Maduro, presidente constitucional de la República Bolivariana de Venezuela.»","lead":""},{"t":"ES SIGNIFICATIVO POR TRES RAZONES. Primera: es un ACTO DE DIFERENCIACIÓN DELIBERADO Y VERBALIZADO. No es una posición inferida del análisis de contenido: es una instrucción administrativa acompañada de una declaración ante cámara. En términos de marca, es el momento en que el sujeto define explícitamente qué representa y frente a quién. Segunda: LO SITÚA ENFRENTADO A LA LÍNEA DE SU PROPIO BLOQUE POLÍTICO en un momento de reordenamiento interno — no es una confrontación con la oposición, que sería esperable y poco informativa, sino con el gobierno del que formalmente forma parte. Tercera: ES CONTENIDO DE ALTO POTENCIAL DE CIRCULACIÓN QUE LA ESTRUCTURA PROPIA NO CAPITALIZÓ. El episodio fue difundido por un medio nacional, con vídeo. Un contenido de ese perfil es exactamente lo que un aparato de comunicación bien engrasado amplifica y reutiliza; contrasta con el rendimiento del programa semanal descrito en el M04 (42,1 horas producidas para 1.939 visualizaciones).","lead":"ES SIGNIFICATIVO POR TRES RAZONES."},{"t":"CONTEXTO NACIONAL DEL PERIODO, que condiciona la lectura de todo el estudio: 3-5 de enero de 2026, ataques aéreos estadounidenses y salida de Nicolás Maduro del poder; 5 de enero, Delcy Rodríguez asume como presidenta encargada; 5 de marzo, restablecimiento de relaciones diplomáticas entre EE.UU. y Venezuela; 14 de marzo, reapertura de la embajada estadounidense en Caracas; 1 de abril, OFAC excluye a Delcy Rodríguez de la lista SDN; 30 de abril, reanudación de vuelos comerciales.","lead":""}],"accion":"Establecer un procedimiento de capitalización de picos: quién detecta el pico, en cuánto tiempo se derivan piezas, a qué plataformas. Un protocolo básico convierte cobertura ajena en activo propio.","tabla":{"headers":["Fecha","Hecho de exposición nacional"],"rows":[["2 jun. 2026","Confrontación pública con la directriz del gobierno interino sobre los retratos"],["Jun. 2026","Denuncia del déficit eléctrico ante el gobierno central"],["Mayo 2025","Reelección y proclamación ante el CNE"]]}},{"n":9,"punto":"Presencia en agregadores, portales y prensa digital","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"Presencia documentada en El Nacional, Noticias al Día y a la Hora, La Prensa del Táchira, La Opinión (Cúcuta), El Tiempo (Colombia), Euronews y Wikipedia. El M07 documenta además que la ficha de Wikipedia en inglés es el PRIMER resultado orgánico de Google para su nombre.","lead":""},{"t":"La presencia en agregadores propiamente dichos (Google Noticias, agregadores de prensa venezolana) no se midió.","lead":""}],"accion":"Completar con consulta de Google Noticias y agregadores nacionales."},{"n":10,"punto":"Comparativa de reputación nacional vs. reputación local","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"El dato duro disponible: aprobación de gestión del 61% en diciembre de 2024, frente al 73% de Rafael Lacava en el mismo estudio (M12, M17). Es el único indicador de reputación cuantificado del encargo, y es de fuente de opinión pública, no de escucha social.","lead":""},{"t":"LA DISTANCIA CUALITATIVA ENTRE AMBOS PLANOS SÍ ES OBSERVABLE. En el plano LOCAL, su comunicación se centra en gestión, religiosidad popular y seguridad, y el M19 documenta un entorno de comentarios mixto en TikTok y favorable en Instagram. En el plano NACIONAL, los dos episodios documentados de exposición son de confrontación —los retratos y el déficit eléctrico— y el registro de sanciones internacionales condiciona el tratamiento por parte de medios y organizaciones.","lead":"LA DISTANCIA CUALITATIVA ENTRE AMBOS PLANOS SÍ ES OBSERVABLE."},{"t":"Existe además una incoherencia señalada por el propio estudio: se observa una posición explícita y de alto contraste, tomada en junio, que no aparece reflejada de forma sostenida en la comunicación posterior. Con independencia del contenido de esa posición, la incoherencia entre un acto de diferenciación fuerte y una comunicación que no lo desarrolla resta credibilidad a ambos.","lead":""}],"accion":"Definir el eje de posicionamiento nacional y sostenerlo, o no abrirlo. Una posición fuerte que no se desarrolla resta credibilidad."}]},{"id":"M16","titulo":"ESCUCHA SOCIAL — INTERNACIONAL","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"Diez listas de sanciones, siete medios y seis organizaciones verificados · 6 líneas de análisis","fuente":"Estudio de Presencia Digital y Reputación, capítulo 9 (M16). Corte: 4 de septiembre de 2026. Es el módulo con más material verificable porque la exposición internacional no depende de la conversación en redes sino de registros oficiales y de investigación publicada por organizaciones establecidas.","calificacion":"El módulo mejor documentado del estudio, y el que más condiciona la planificación","resumen":[{"t":"Es el módulo con más material verificable de todo el encargo: nada de lo que contiene procede de escucha social, todo procede de documentos consultables.","lead":""},{"t":"El patrón verificable es una concentración en dos focos: COLOMBIA, por razones fronterizas, y ORGANIZACIONES ESPECIALIZADAS EN CRIMEN ORGANIZADO Y DERECHOS HUMANOS QUE PUBLICAN EN INGLÉS. No se localizó cobertura en portugués.","lead":""}],"puntos":[{"n":1,"punto":"Menciones en medios internacionales","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Cobertura documentada en siete medios y organizaciones internacionales, con dos focos claros: Colombia (por frontera) y publicaciones en inglés de organizaciones especializadas.","lead":""},{"t":"No se localizó cobertura en portugués.","lead":""}],"accion":"Monitorizar sistemáticamente estas siete fuentes. Conocer lo publicado en el momento de su publicación, no descubrirlo por vía de terceros.","tabla":{"headers":["Medio","País / idioma","Enfoque predominante"],"rows":[["El Tiempo","Colombia / español","Señalamiento ante la OEA, frontera"],["La Opinión (Cúcuta)","Colombia / español","Reelección, agenda fronteriza"],["Noticias al Día y a la Hora","Colombia / español","Crisis de servicios públicos"],["InSight Crime","EE.UU. / INGLÉS","Crimen organizado y gobernanza guerrillera"],["International Crisis Group","Bélgica / INGLÉS","Grupos armados en Venezuela"],["Wikipedia","INGLÉS","Ficha biográfica; primer resultado de Google"],["Euronews","Europa / español","Transición venezolana de enero de 2026"]]}},{"n":2,"punto":"Conversación en la diáspora venezolana (Colombia, EE.UU., España, Chile)","estado":"REQUIERE MONITORIZACIÓN CONTINUA","prioridad":"MEDIA","hallazgo":[{"t":"La conversación de la diáspora venezolana no es medible sin herramienta de escucha y se cubre con monitorización continua.","lead":""},{"t":"INDICIO PARCIAL DESDE EL M19: los comentarios recogidos permiten afirmar que existe audiencia significativa fuera del Táchira —transportistas describiendo rutas nacionales completas, audiencia de La Guaira durante el terremoto— y el contenido de «frontera de paz» y la relación con Cúcuta sugieren audiencia colombiana, aunque no es verificable sin el dato de plataforma.","lead":"INDICIO PARCIAL DESDE EL M19:"}],"accion":"Instrumentar. Capturar en paralelo el dato de geografía de audiencia en Insights (M19, punto 2), que es gratuito y cubre parte de esto."},{"n":3,"punto":"Menciones en otros idiomas (inglés, portugués)","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"INGLÉS: es el idioma de la cobertura internacional más consistente y más crítica. InSight Crime publicó «Guerrilla Governance: The ELN's Social Control in Táchira» el 8 de diciembre de 2025 —la pieza internacional más reciente que involucra al sujeto— y «Controversial Venezuela Official Named 'Protector' of Colombia Border State» el 6 de febrero de 2018. International Crisis Group publicó «A Glut of Arms: Curbing the Threat to Venezuela from Violent Groups». Development and Change (Wiley) publicó en 2026 «State–Crime Cooperation and Extra-legal Governance in Colombia and Venezuela». Y la ficha de Wikipedia en inglés es el primer resultado orgánico de Google para su nombre.","lead":"INGLÉS:"},{"t":"PORTUGUÉS: no se localizó cobertura.","lead":"PORTUGUÉS:"},{"t":"CONSECUENCIA OPERATIVA DIRECTA, cruzada con el M08: los subtítulos de sus vídeos están quemados en la imagen y por tanto NO SON TRADUCIBLES automáticamente por las plataformas. En un contexto donde la conversación internacional sobre él se produce mayoritariamente en inglés, esa decisión técnica cierra el único canal barato de contrapeso en ese idioma.","lead":""}],"accion":"Activar subtítulos nativos como pista de texto, que sí son traducibles. Es la vía más barata de existir en inglés con voz propia."},{"n":4,"punto":"Menciones por parte de organismos, ONG y observatorios","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"Es el punto con el cuerpo documental más extenso del estudio. Todas las entradas son acusaciones o señalamientos publicados por fuentes identificables; NO CONSTA CONDENA FIRME SOBRE NINGUNA, y la distinción es deliberada y debe mantenerse.","lead":""},{"t":"REGISTRO DE SANCIONES: diez listas de ocho jurisdicciones. EE.UU. — OFAC lista SDN (ofac-12884), motivo declarado: socavar procesos democráticos y violaciones de derechos humanos, por sus funciones al frente de los CLAP y como comisario general del SEBIN. EE.UU. — Consolidated Screening List (ofac-12884), exclusión de contratación derivada de la designación. EE.UU. — SAM, exclusiones de contratación: inhabilitación federal de contratación. UE — Financial Sanctions Files (eu-fsf-eu-4636-90), socavar la democracia y violaciones graves de derechos humanos. UE — prohibiciones de viaje (eu-tb-logical-117539). Reino Unido — FCDO (gb-fcdo-ven0013), manipulación democrática. Canadá — lista consolidada (ca-sema-96f54c86…), subversión democrática y violaciones de derechos humanos. Suiza — SECO (ch-seco-39341), «responsable de socavar la democracia mediante la manipulación del programa CLAP». Francia — gels d'avoirs (fr-ga-1653), congelación de activos. Bélgica — designación de 25/6/2018. Mónaco — congelación de fondos.","lead":"REGISTRO DE SANCIONES:"},{"t":"Designaciones originales documentadas: Estados Unidos 2011 (Kingpin List, presunto suministro de armas a las FARC), Canadá septiembre de 2017, OFAC noviembre de 2017, Panamá marzo de 2018, Unión Europea 25 de junio de 2018 y Suiza 10 de julio de 2018. El instrumento europeo es la Decisión del Consejo publicada en el Diario Oficial el 25 de junio de 2018 (CELEX 32018D0901).","lead":""},{"t":"ACUSACIONES DOCUMENTADAS. Gobierno de Colombia ante la OEA (12 de septiembre de 2019): señalado como «el eslabón estratégico» entre alias 'Lenin', del ELN, y el gobierno venezolano, en documento de 14 páginas presentado por el canciller Carlos Holmes Trujillo. InSight Crime (8 de diciembre de 2025): sostiene que «The ELN's relationship with Bernal has been central to its consolidation of power in Táchira», que la alianza le resultó provechosa y que el ELN pudo facilitar su elección de 2021. InSight Crime (6 de febrero de 2018): descrito como «one of the most powerful actors in the Maduro government» e «infamous for his connections to the armed actors» de la frontera. Connectas: «Códigos del protectorado» para introducir mercancía por trochas; 3 millones de dólares semanales según la entonces gobernadora Laidy Gómez; 288 millones de dólares de recaudación aduanera perdida en dos años; estructura administrativa paralela. Transparencia Venezuela (abril de 2020): informe sobre el programa CLAP que dirigía.","lead":"ACUSACIONES DOCUMENTADAS."},{"t":"VOLUMEN Y PATRÓN: los señalamientos sobre control fronterizo y CLAP proceden de al menos tres fuentes independientes entre sí —un Estado ante un foro multilateral, investigación periodística especializada, y la propia motivación declarada de la designación OFAC de 2017—, lo que constituye un patrón documentado y no un señalamiento aislado.","lead":"VOLUMEN Y PATRÓN:"}],"accion":"Monitorizar sistemáticamente las publicaciones de estas organizaciones. Y verificar la restricción antes de planificar cualquier táctica que dependa de elegibilidad publicitaria o de cadena de pago."},{"n":5,"punto":"Oportunidades de posicionamiento internacional","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"DELIMITACIÓN PREVIA: conforme al apartado 1.5 del estudio original, no se formulan recomendaciones dirigidas a modificar la percepción internacional del sujeto, a responder a las organizaciones citadas ni a gestionar la comunicación sobre el registro de sanciones o las acusaciones documentadas. Las recomendaciones de este apartado son exclusivamente OPERATIVAS.","lead":"DELIMITACIÓN PREVIA:"},{"t":"LA OPORTUNIDAD REAL Y VERIFICADA ES BINACIONAL, NO GLOBAL, y está documentada en el M17 y el M18 como el mayor activo diferencial del sujeto. Ningún otro gobernador venezolano tiene frontera activa con Colombia en las condiciones del Táchira; ni Lacava ni Adán Chávez pueden ocupar ese territorio.","lead":""},{"t":"Y ya demostró rendimiento con datos propios: el vídeo del peluche de los niños de Cúcuta fue la segunda publicación más vista del semestre en X (39.316 visualizaciones) y el mejor rendimiento cualitativo del periodo; y el contenido de «frontera de paz» domina su top histórico de TikTok con picos de 1,6 a 2,7 millones de reproducciones.","lead":""},{"t":"Los interlocutores naturales están identificados en el M18: la Gobernación de Norte de Santander y la Alcaldía de Cúcuta, que son la contraparte territorial directa del Táchira y comparten población, flujo comercial y problemática fronteriza. Merecen un análisis específico de sus cuentas, que es la primera profundización recomendada de este módulo.","lead":""}],"accion":"Convertir el eje binacional en línea editorial estable. Es la recomendación única que el M18 destaca si solo se pudiera hacer una."},{"n":6,"punto":"Riesgos reputacionales de alcance internacional","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"RIESGO 1 — ELEGIBILIDAD PUBLICITARIA. Las plataformas de Meta y Google aplican listas de sanciones a anunciantes y a cuentas comerciales. Antes de presupuestar cualquier partida de pauta, corresponde comprobar si las cuentas del sujeto y la entidad pagadora son elegibles. Planificar inversión publicitaria sin resolver este punto expone el plan a un rechazo en fase de ejecución. Es prioridad ALTA y es una comprobación previa de viabilidad, no una recomendación de comunicación.","lead":"RIESGO 1 —"},{"t":"RIESGO 2 — VIABILIDAD DE LA CADENA DE PAGO Y DE PROVEEDORES. El mismo criterio aplica a pasarelas de pago, herramientas de suscripción, plataformas de correo y proveedores con exposición a jurisdicciones sancionadoras. Es también comprobación previa de viabilidad.","lead":"RIESGO 2 —"},{"t":"RIESGO 3 — VERIFICACIÓN DE CUENTAS. El M01 identifica la verificación como la prioridad estructural del ecosistema (1,17 millones de seguidores dependen de ella). El M07 añade el matiz decisivo: los programas de verificación de Meta y de X son servicios de pago sujetos a comprobaciones de identidad y de cumplimiento normativo, y las listas de sanciones intervienen en esas comprobaciones. El resultado de una solicitud no es previsible desde fuera del estudio. Esto NO desaconseja solicitarla —sigue siendo la acción correcta— pero sí obliga a no construir el plan sobre el supuesto de que se concederá.","lead":"RIESGO 3 —"},{"t":"RIESGO 4 — DESACTUALIZACIÓN DEL SEGUIMIENTO. La pieza más reciente que involucra al sujeto es de diciembre de 2025. Sin seguimiento sistemático, el equipo conoce lo publicado por vía de terceros y en el peor momento posible.","lead":"RIESGO 4 —"},{"t":"NOTA DE PERSISTENCIA, ya señalada en el M15: el dato de mayor relevancia no es la existencia de las designaciones sino su permanencia tras el cambio político de enero de 2026, con un registro de inhabilitación federal de contratación fechado en marzo de 2026, posterior a la transición.","lead":""}],"accion":"Documentar la restricción de forma explícita en el plan. Un plan que la omita estará construido sobre un supuesto que no se sostiene."}]},{"id":"M17","titulo":"ANÁLISIS DE COMPETIDORES DIRECTOS","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"Cinco competidores seleccionados y fichados · 15 líneas de análisis","fuente":"M17 — Análisis de competidores directos. Corte: 5 de septiembre de 2026. Datos de seguidores y publicaciones de fuentes públicas; datos de aprobación de gestión de estudios de opinión publicados en prensa en diciembre de 2024.","calificacion":"La matriz se entrega con lo verificable; las estimaciones no sustituyen a la medición","resumen":[{"t":"«Competidor» para un gobernador no significa solo rival electoral: en términos de comunicación digital, compite por la atención de la misma audiencia. Con ese criterio se seleccionaron y ficharon cinco competidores en tres categorías, se documentaron sus ejes narrativos, se construyó la matriz comparativa y el FODA de cada uno, y se identificó lo más valioso del módulo: los cinco espacios que nadie está ocupando.","lead":""},{"t":"La medición completa de cada competidor —replicar sobre ellos el mismo protocolo aplicado al candidato en los módulos M01 a M12— se especifica con su método y su estimación de esfuerzo. La recomendación es ejecutarla solo sobre Rafael Lacava, que es el único competidor cuyo resultado cambiaría decisiones.","lead":""}],"puntos":[{"n":1,"punto":"Identificación y selección de competidores a analizar (3 a 5)","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"«Competidor» para un gobernador no significa solo rival electoral: en términos de comunicación digital, compite por la atención de la misma audiencia. Con ese criterio se seleccionaron cinco competidores en tres categorías distintas.","lead":""},{"t":"SE DESCARTÓ DELIBERADAMENTE incluir figuras opositoras del Táchira: tras las elecciones de mayo de 2025, en las que la Plataforma Unitaria no participó, no existe un contrapeso opositor con presencia digital estructurada en el estado que constituya un competidor medible. Incluirlo habría sido forzar la comparación.","lead":""}],"accion":"Priorizar Lacava en cualquier trabajo de medición: es el único cuyo resultado cambiaría decisiones.","tabla":{"headers":["Competidor","Categoría","Por qué se incluye"],"rows":[["Rafael Lacava — Gobernador de Carabobo","Referente interno del oficialismo","Mismo partido, mismo cargo, reelecto igual. Es el listón contra el que se mide cualquier gobernador venezolano."],["Adán Chávez — Gobernador de Barinas","Contraste interno","Máximo capital político simbólico posible con presencia digital mínima. Demuestra que el capital político no se convierte solo en audiencia."],["Gobernación del Táchira (cuenta institucional)","Competidor en su propio territorio","Compite por la misma audiencia tachirense con el mismo mensaje de gestión. Es el competidor más próximo y el menos evidente."],["Medios regionales del Táchira","Competidor por la atención local","Disputan la conversación sobre el estado. En los comentarios de X aparecen como fuente alternativa sobre servicios y vialidad."],["José Alejandro Terán — Gobernador de La Guaira","Comparable directo","Reelecto en el mismo ciclo, estado de tamaño comparable, y protagonista del mismo acontecimiento (terremoto de junio de 2026)."]]}},{"n":2,"punto":"Ficha completa por competidor (cuentas, seguidores, antigüedad)","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"RAFAEL LACAVA. Gobernador de Carabobo, reelecto desde 2017 (tres periodos). Instagram @lacava10oficial: 2.000.000 seguidores, 9.465 publicaciones, 12 cuentas seguidas. Cuenta secundaria detectada: @lacavagobernador, 16.000 seguidores, 20 publicaciones, cuenta de campaña residual. Aprobación de gestión (dic. 2024): 73%. X y TikTok pendientes de medición. DATO REVELADOR: sigue solo a 12 cuentas frente a las 366 del candidato. Es una decisión de arquitectura: emite y no consume, lo que concentra su algoritmo en su propia audiencia.","lead":"RAFAEL LACAVA."},{"t":"ADÁN CHÁVEZ. Gobernador de Barinas desde 2025; anteriormente gobernador 2008-2017, embajador en Cuba y ministro. Instagram @adanchavezoficial: 6.219 seguidores, 892 publicaciones, 96 cuentas seguidas. LECTURA: con el apellido de mayor peso simbólico del chavismo, tiene 39 veces menos audiencia en Instagram que el candidato y 320 veces menos que Lacava. Demuestra que el capital político heredado no genera audiencia digital por sí solo.","lead":"ADÁN CHÁVEZ."},{"t":"GOBERNACIÓN DEL TÁCHIRA. Cuenta institucional del gobierno regional que él mismo dirige. Cuenta de prensa @gobernaciondeltachira, citada al pie de las notas institucionales. Portal tachira.gob.ve. NO EXISTE ENLACE CRUZADO: el sitio personal no enlaza al portal institucional ni viceversa. Métricas pendientes.","lead":"GOBERNACIÓN DEL TÁCHIRA."},{"t":"MEDIOS REGIONALES Y JOSÉ ALEJANDRO TERÁN: fichas pendientes. Ambos requieren identificación y medición de cuentas que no pudo ejecutarse. En el caso de los medios regionales, el M06 documentó su presencia indirecta: los comentarios ciudadanos citan repetidamente cuentas de noticias tachirenses como fuente sobre vialidad y servicios.","lead":"MEDIOS REGIONALES Y JOSÉ ALEJANDRO TERÁN:"}],"accion":"Completar las fichas de Lacava (X y TikTok), de la Gobernación del Táchira y de Terán."},{"n":3,"punto":"Frecuencia de publicación por competidor y plataforma","estado":"FASE 2 — PROFUNDIZACIÓN","prioridad":"MEDIA","hallazgo":[{"t":"Se cierra con extraer entre 60 y 130 publicaciones recientes por plataforma y competidor, con fecha y hora. Único dato disponible: el volumen histórico acumulado de Lacava en Instagram (9.465 publicaciones frente a 4.396 del candidato), que sugiere mayor capacidad de producción o mayor antigüedad de cuenta, pero no permite calcular frecuencia actual.","lead":""}],"accion":"Extraer. Estimación de esfuerzo: 4 a 6 horas por competidor."},{"n":4,"punto":"Formatos y tipos de contenido que privilegia cada uno","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"LACAVA: se muestra en ropa deportiva, en la calle, reconociendo errores propios. Documentado: publicó un vídeo riéndose de sí mismo tras ser salpicado por aguas negras, señalando que la lección era para gobernantes como él que permiten eso. Formato de vídeo espontáneo con registro humorístico.","lead":"LACAVA:"},{"t":"ADÁN CHÁVEZ: registro institucional y conmemorativo, bajo volumen, baja innovación de formato.","lead":"ADÁN CHÁVEZ:"},{"t":"GOBERNACIÓN DEL TÁCHIRA: nota de prensa, formato boletín, tercera persona.","lead":"GOBERNACIÓN DEL TÁCHIRA:"},{"t":"MEDIOS REGIONALES: denuncia ciudadana y cobertura de servicios públicos.","lead":"MEDIOS REGIONALES:"},{"t":"La medición sistemática de proporción por formato queda pendiente.","lead":""}],"accion":"Completar con extracción."},{"n":5,"punto":"Calidad de producción audiovisual de cada competidor","estado":"REQUIERE MATERIAL ORIGINAL","prioridad":"MEDIA","hallazgo":[{"t":"Se cierra con reproducir entre 3 y 5 piezas de vídeo por competidor. Se ejecuta en la fase siguiente.","lead":""}],"accion":"Visionar 3-5 piezas por competidor, priorizando Lacava."},{"n":6,"punto":"Calidad de diseño gráfico de cada competidor","estado":"FASE 2 — PROFUNDIZACIÓN","prioridad":"BAJA","hallazgo":[{"t":"Se cierra con inspeccionar la grilla de cada competidor. Se ejecuta en la fase siguiente.","lead":""}],"accion":"Inspeccionar grillas junto con el punto 5."},{"n":7,"punto":"Mensajes y ejes narrativos de cada competidor","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"EL HALLAZGO NARRATIVO CENTRAL: Lacava ocupa de forma sistemática y deliberada el mismo territorio que en el caso del candidato solo aparece por excepción —el registro humano, cotidiano y autoirónico— y ha construido con él ocho veces más audiencia en Instagram. La diferencia no está en el mensaje disponible sino en la decisión de convertirlo en línea editorial permanente en vez de en episodio ocasional.","lead":"EL HALLAZGO NARRATIVO CENTRAL:"}],"accion":"La brecha no se cierra imitando a Lacava. Se cierra haciendo sistemático lo que ya funciona en los datos propios.","tabla":{"headers":["Competidor","Eje narrativo dominante","Recursos característicos"],"rows":[["Rafael Lacava","El gobernante cercano y autoirónico. Construye «fama de ejecutor» sin recurrir al lenguaje doctrinal.","Humor sobre sí mismo, autocrítica pública, espontaneidad, presencia constante en calle."],["Adán Chávez","El legado. Su posicionamiento descansa en el apellido y la continuidad histórica.","Registro institucional y conmemorativo. Bajo volumen, baja innovación de formato."],["Gobernación del Táchira","Gestión institucional pura: obras, jornadas, contrataciones.","Nota de prensa, formato boletín, tercera persona."],["Medios regionales","Servicio y fiscalización: qué falla, qué falta, qué se prometió.","Denuncia ciudadana, cobertura de servicios públicos."],["FREDDY BERNAL (referencia)","Autoridad y paz fronteriza, con aperturas humanas puntuales. Registro mixto: institucional-doctrinal en gran parte, humano y regional en su contenido de mejor rendimiento.","«Dar la cara», seguridad con resultado, identidad tachirense, y ocasionalmente cotidiano (la tizana, el sapote)."]]}},{"n":8,"punto":"Crecimiento de seguidores por competidor (trimestre y año)","estado":"FASE 2 — PROFUNDIZACIÓN","prioridad":"MEDIA","hallazgo":[{"t":"Sin acceso a analíticas ni histórico de terceros, no es reconstruible desde fuera. Aplica exactamente la misma limitación documentada en el M12 para el propio candidato.","lead":""}],"accion":"Solo alcanzable con herramienta de seguimiento con histórico."},{"n":9,"punto":"Engagement rate por competidor","estado":"FASE 2 — PROFUNDIZACIÓN","prioridad":"ALTA","hallazgo":[{"t":"Se cierra con calcular interacciones sobre seguidores o sobre reproducciones, según plataforma, para cada competidor.","lead":""},{"t":"Es el dato que más cambiaría la lectura: el M12 documenta que la cuenta de Bernal con más seguidores (X, 602.800) es la menos viva (0,56% de alcance), y la más pequeña de las tres principales (TikTok, 319.200) es la más sana (4,87%). Sin el engagement de Lacava, no sabemos si sus 2 millones de Instagram son audiencia viva o inflada.","lead":""}],"accion":"Medir. Es el punto que más cambiaría decisiones."},{"n":10,"punto":"Contenido más viral de cada competidor","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"El único caso documentado es el vídeo de Lacava riéndose de sí mismo tras ser salpicado por aguas negras. El ranking sistemático por competidor no se construyó.","lead":""}],"accion":"Construir usando el ranking nativo de cada plataforma, como se hizo con TikTok en el M03."},{"n":11,"punto":"Inversión estimada en pauta por competidor","estado":"DIAGNÓSTICO POR EVIDENCIA","prioridad":"BAJA","hallazgo":[{"t":"La biblioteca de anuncios de Meta permite ver anuncios activos de contenido político en algunos mercados, pero no ofrece el gasto real ni cubre TikTok o X con detalle. Estimar una cifra a partir de ahí sería especulación.","lead":""},{"t":"Lo que sí puede inferirse, con cautela: el volumen de 9.465 publicaciones de Lacava en Instagram frente a las 4.396 del candidato sugiere un equipo de producción de mayor capacidad o mayor antigüedad de cuenta, pero no permite cuantificarlo.","lead":""}],"accion":"No perseguir este dato. La biblioteca de anuncios de Meta puede consultarse como aproximación cualitativa, no cuantitativa."},{"n":12,"punto":"Tamaño y estructura estimada del equipo de cada competidor","estado":"DIAGNÓSTICO POR EVIDENCIA","prioridad":"BAJA","hallazgo":[{"t":"El tamaño y estructura del equipo de comunicación de otro gobernador no es información pública en ningún caso.","lead":""}],"accion":"No perseguir este dato."},{"n":13,"punto":"Matriz comparativa consolidada (candidato vs. todos)","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"La matriz está DELIBERADAMENTE INCOMPLETA y se entrega así: rellenar las casillas pendientes con estimaciones convertiría una herramienta de decisión en un documento decorativo. Completarla exige medir cada competidor con el método aplicado al candidato en los módulos M01 a M12.","lead":""}],"accion":"Completar solo las casillas de Lacava. El resto no cambiaría decisiones.","tabla":{"headers":["Indicador","Bernal","Lacava","Adán Chávez","Gobernación Táchira"],"rows":[["Instagram — seguidores","244.000","2.000.000","6.219","Pendiente"],["Instagram — publicaciones","4.396","9.465","892","Pendiente"],["Instagram — cuentas seguidas","366","12","96","Pendiente"],["X — seguidores","602.800","Pendiente","Pendiente","Pendiente"],["TikTok — seguidores","319.200 (+19.400 secundaria)","Pendiente","Pendiente","Pendiente"],["Audiencia total conocida","≈1.223.000","Pendiente","Pendiente","Pendiente"],["Verificación","NINGUNA plataforma","Pendiente","Pendiente","Pendiente"],["Enlace en biografía IG","NO","Pendiente","Pendiente","Pendiente"],["Aprobación de gestión (dic. 2024)","61%","73%","Sin dato","No aplica"],["Registro dominante","Institucional con aperturas","Humano y autoirónico","Conmemorativo","Boletín"]]}},{"n":14,"punto":"FODA digital por competidor","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"RAFAEL LACAVA. Fortalezas: 2 millones en Instagram, registro humano consolidado y diferenciado, cuenta de emisión pura (sigue a 12), aprobación del 73%, reconocimiento nacional como referente digital del oficialismo. Debilidades: cuenta secundaria residual de campaña sin cerrar (@lacavagobernador, 16.000 seguidores, 20 publicaciones) — el mismo problema documentado en el candidato; dependencia alta de su personalidad, la marca es él y es difícil de delegar. Oportunidades: su capital digital lo posiciona para ambiciones nacionales. Amenazas: su popularidad por encima de la del liderazgo nacional lo expone políticamente; la autoironía tiene techo, funciona hasta que un problema real exige respuesta seria.","lead":"RAFAEL LACAVA."},{"t":"ADÁN CHÁVEZ. Fortalezas: capital simbólico máximo dentro del chavismo, trayectoria institucional extensa. Debilidades: presencia digital marginal (6.219 seguidores en Instagram), bajo volumen, sin adaptación a formatos actuales. Oportunidades: cualquier inversión mínima produciría crecimiento porcentual alto desde una base tan baja. Amenazas: irrelevancia digital creciente frente a gobernadores que sí comunican.","lead":"ADÁN CHÁVEZ."},{"t":"GOBERNACIÓN DEL TÁCHIRA. Fortalezas: legitimidad institucional, capacidad de producir contenido de gestión con respaldo documental. Debilidades: registro de boletín, tercera persona, sin atractivo para consumo social; sin enlace cruzado con la cuenta personal. Oportunidades: PODRÍA ABSORBER EL CONTENIDO INSTITUCIONAL PESADO Y LIBERAR A LA CUENTA PERSONAL PARA EL REGISTRO HUMANO QUE MEJOR RINDE. Amenazas: duplicar mensaje con la cuenta personal diluye ambos canales.","lead":"GOBERNACIÓN DEL TÁCHIRA."},{"t":"FODA DEL CANDIDATO FRENTE A ESTE PANORAMA. Fortalezas: audiencia total de 1,22 millones, segunda mayor conocida del conjunto; TikTok con engagement del 4,87% y picos de 2,7 millones; eje de paz fronteriza sin competencia; autenticidad audiovisual alta. Debilidades: cero verificaciones; sin enlace en biografía de Instagram; engagement de X en 0,56%; ocho cuentas dispersas con seis convenciones de usuario; activos huérfanos y residuo de campaña activo. Oportunidades: el registro que Lacava explota con éxito ya está probado en sus propios datos y sin producir; la frontera con Colombia es territorio narrativo exclusivo. Amenazas: la brecha con Lacava se amplía cada trimestre; el handle antiguo de Instagram sigue libre; la cuenta suplantadora acumula peticiones ciudadanas reales sin atender.","lead":"FODA DEL CANDIDATO FRENTE A ESTE PANORAMA."}],"accion":"El reparto de roles con la Gobernación es la oportunidad más accionable y depende solo de una decisión interna."},{"n":15,"punto":"Brechas y oportunidades: qué nadie está haciendo","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"Es el apartado de mayor valor del módulo, porque no depende de medir a los competidores sino de identificar el espacio vacío.","lead":""},{"t":"LA BRECHA QUE HAY QUE CERRAR, NO ABRIR. Frente a Lacava, la brecha de 8 a 1 en Instagram no se cierra imitándolo. Se cierra haciendo sistemático lo que ya funciona en los datos propios. Los módulos anteriores demostraron que su contenido humano y de identidad regional entra en el top de rendimiento de las tres plataformas y que representa menos de una cuarta parte de lo que produce, mientras que la política institucional y el vocabulario doctrinal —que rinden peor— ocupan más de un quinto. La palanca no es copiar a otro: es reequilibrar la propia producción.","lead":"LA BRECHA QUE HAY QUE CERRAR, NO ABRIR."}],"accion":"Cinco espacios vacíos identificados, todos ocupables sin presupuesto significativo. El binacional es el de mayor retorno probado.","tabla":{"headers":["Oportunidad","Por qué está vacía","Ventaja para el candidato"],"rows":[["COMUNICACIÓN BINACIONAL","Ningún otro gobernador venezolano tiene frontera activa con Colombia en las condiciones del Táchira. Lacava no puede ocuparlo, Adán Chávez tampoco.","Territorio exclusivo, y ya demostró rendimiento: el peluche de Cúcuta fue la segunda publicación más vista del semestre en X, y «frontera de paz» domina su top histórico de TikTok con picos de 1,6 a 2,7 millones."],["CANAL DE WHATSAPP OFICIAL","No se detectó que ningún gobernador venezolano haya construido un canal de difusión verificado como infraestructura central.","WhatsApp es la plataforma de mayor penetración del país. Sería el primero en ocuparla de forma estructurada, y resolvería el vacío de atención ciudadana."],["ATENCIÓN CIUDADANA MEDIBLE","El estándar regional es emitir sin canal de retorno. El candidato tampoco lo tiene, y su ausencia ya produjo un daño concreto: ciudadanos dejando peticiones de auxilio en una cuenta suplantadora inactiva.","Ser el primer gobernador con un ciclo visible de denuncia-acción-resultado sería un diferencial competitivo real, no cosmético. Ya tiene un caso probado de ese ciclo funcionando."],["SPACES / AUDIO EN VIVO","No se detectó uso de este formato entre los competidores. El candidato tampoco lo ha usado nunca.","Su registro natural es oral y tiene más de 250 emisiones de programa propio de radio. Es el formato donde su ventaja de oficio es mayor y donde nadie compite."],["ACCESIBILIDAD","Nadie en el panorama regional trabaja subtítulos accesibles ni texto alternativo.","Diferencial de bajo coste con lectura política positiva para una institución pública."]]}}]},{"id":"M18","titulo":"BENCHMARK INTERNACIONAL DE POLÍTICOS DEL MISMO RANGO","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"Cinco referentes internacionales · 10 líneas de análisis","fuente":"M18 — Benchmark internacional. Corte: 5 de septiembre de 2026. Módulo estratégico apoyado en el análisis de patrones de comunicación política subnacional contrastados con los hallazgos medidos en los módulos M01 a M17.","calificacion":"El módulo menos dependiente de extracción de datos y el más dependiente de criterio","resumen":[{"t":"DOS ADVERTENCIAS HONESTAS. Primera: las cifras de seguidores de los referentes internacionales citados son ÓRDENES DE MAGNITUD para dar contexto, no mediciones verificadas en esta sesión. Segunda: la información sobre cargos y situaciones políticas concretas puede haber cambiado; conviene verificar el estado actual de cualquier referente antes de citarlo públicamente.","lead":""},{"t":"A diferencia de los módulos anteriores, ocho de sus diez puntos piden identificar estrategias, formatos, casos de éxito y tendencias, no medir métricas.","lead":""}],"puntos":[{"n":1,"punto":"Selección de 5 a 10 referentes internacionales del mismo rango","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"El criterio de selección no fue «los políticos más famosos» sino «los que enfrentan un problema comunicacional comparable al del Táchira»: gobierno subnacional, recursos limitados, audiencia que consume en móvil, y necesidad de mostrar gestión concreta. Se añadieron dos referentes de frontera por su pertinencia directa.","lead":""},{"t":"NOTA DE ALCANCE: los dos referentes fronterizos colombianos son los más valiosos de la lista y los menos evidentes. Merecen un análisis específico de sus cuentas que no se pudo ejecutar y que se recomienda priorizar.","lead":"NOTA DE ALCANCE:"}],"accion":"Priorizar el análisis específico de las cuentas de Norte de Santander y de la Alcaldía de Cúcuta.","tabla":{"headers":["Referente","Rango","Por qué es pertinente"],"rows":[["Nayib Bukele — El Salvador","Jefe de Estado, pero es el modelo de referencia obligado","Definió el manual de comunicación política digital latinoamericana: seguridad como eje central, comunicación directa sin intermediación de prensa, estética unificada."],["Gobernación de Norte de Santander — Colombia","Gobierno subnacional fronterizo","Es la contraparte territorial directa del Táchira. Comparte población, flujo comercial y problemática fronteriza."],["Alcaldía de Cúcuta — Colombia","Gobierno municipal fronterizo","La ciudad colombiana con relación cotidiana con el Táchira. Ya apareció orgánicamente en su contenido: el vídeo del peluche fue su segunda publicación más vista del semestre en X."],["Gobernadores de estados de EE. UU. con alta actividad digital","Gobierno subnacional","Referentes de producción y de uso de vídeo vertical institucional con estándares altos."],["Alcaldías de grandes capitales latinoamericanas","Gobierno subnacional","Referentes en comunicación de servicios públicos, que es precisamente la crítica más repetida en sus comentarios (luz, agua, vialidad)."]]}},{"n":2,"punto":"Frecuencia de publicación de cada referente por plataforma","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"PATRONES DEL ESTÁNDAR INTERNACIONAL. Jefe de Estado con estrategia digital intensiva: varias publicaciones diarias, con picos en momentos de crisis o anuncio; lógica de ocupación permanente del espacio informativo. Gobierno subnacional de alto rendimiento: 1 a 3 publicaciones diarias por plataforma, con calendario editorial semanal; lógica de sostenibilidad — prefieren constancia a volumen.","lead":"PATRONES DEL ESTÁNDAR INTERNACIONAL."},{"t":"FREDDY BERNAL (referencia medida): TikTok casi diaria, Instagram 3,05 diarias, X 2,1 diarias en periodo activo pero con TRES MESES DE SILENCIO TOTAL entre marzo y mayo de 2026.","lead":""},{"t":"LA DIFERENCIA CLAVE CON EL ESTÁNDAR INTERNACIONAL NO ES CUÁNTO SE PUBLICA SINO LA AUSENCIA DE INTERRUPCIONES. El volumen es competitivo; la constancia no. Ningún referente de primer nivel se permite tres meses de silencio en su plataforma principal.","lead":""}],"accion":"El problema no es de volumen. Es de constancia. Mínimo innegociable en X."},{"n":3,"punto":"Formatos y estructuras de contenido de cada referente","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"VÍDEO VERTICAL NATIVO, NO RECORTADO. El estándar es grabar en vertical desde el origen o disponer de una segunda cámara dedicada. El recorte de horizontal, que es lo que hace «Reporte Bernal», se lee como producción de segunda.","lead":"VÍDEO VERTICAL NATIVO, NO RECORTADO."},{"t":"SUBTÍTULOS SIEMPRE, y cada vez más como pista accesible además de quemada, para ganar traducción automática y accesibilidad.","lead":""},{"t":"PIEZAS DE DATO. Visualización simple de una cifra de gestión, en formato cuadrado o vertical. Es una tipología que el candidato NO TIENE, según el M09.","lead":"PIEZAS DE DATO."},{"t":"DIRECTOS RECURRENTES con horario fijo y anunciado, no espontáneos.","lead":""},{"t":"CONTENIDO DE PROCESO, no solo de resultado: mostrar la obra en construcción, no únicamente la inauguración. Genera más contenido con el mismo hecho y construye credibilidad.","lead":""}],"accion":"Cuatro de los cinco formatos del estándar no se están usando. Los cuatro son de coste bajo."},{"n":4,"punto":"Calidad y estándar de producción de cada referente","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"El listón internacional para un gobierno subnacional serio incluye cuatro elementos: identidad gráfica aplicada con plantilla común en todas las piezas, corrección de color mínima pero consistente, audio con micrófono dedicado siempre, y un remate de marca fijo.","lead":""},{"t":"En el M08 y el M09 se documentó que el candidato CUMPLE PARCIALMENTE EL TERCERO (micrófono dedicado en el set, aunque mal colocado, y sin micrófono en los formatos de calle) Y NO CUMPLE LOS OTROS TRES.","lead":""}],"accion":"Tres de los cuatro elementos del estándar están sin cumplir, y los tres se resuelven con procedimiento, no con equipamiento."},{"n":5,"punto":"Estrategias narrativas y de posicionamiento identificadas","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"Cinco estrategias identificadas, con su aplicabilidad al caso concreto evaluada contra los datos medidos en los módulos anteriores.","lead":""}],"accion":"Adoptar el monotema (paz y frontera), el gobernante humano y el ciclo denuncia-acción-resultado. Los tres están probados con datos propios.","tabla":{"headers":["Estrategia","En qué consiste","Aplicabilidad al Táchira"],"rows":[["MONOTEMA SOSTENIDO","Elegir un eje único y machacarlo durante años hasta que el nombre del político y el tema sean sinónimos. Bukele y la seguridad es el caso paradigmático.","ALTA. El eje ya está identificado por datos: paz y frontera domina su top histórico de TikTok con picos de 2,7 millones. Lo que falta es la disciplina de sostenerlo en vez de alternarlo con contenido doctrinal."],["COMUNICACIÓN DIRECTA SIN INTERMEDIARIOS","Anunciar decisiones primero en redes propias, antes que en rueda de prensa.","MEDIA-ALTA. Ya lo hace parcialmente con «Reporte Bernal». El límite es que ese programa nació como radio y no se ha rediseñado para digital."],["EL GOBERNANTE HUMANO","Mostrar rutina, familia, aficiones, errores propios. Es la estrategia de Lacava en el plano nacional.","ALTA Y PROBADA. La tizana de El Mirador y el sapote entran en su top 15 sin ninguna carga política. Es el registro más rentable y menos producido."],["CICLO DENUNCIA-ACCIÓN-RESULTADO","Recoger públicamente un problema ciudadano, actuar, y comunicar el resultado cerrando el círculo.","MUY ALTA. Ya tiene un caso documentado funcionando (detención tras difusión de un vídeo ciudadano). Convertirlo en formato recurrente sería su mayor diferencial."],["TRANSPARENCIA DE DATOS","Publicar indicadores de gestión de forma periódica y visual.","MEDIA. Se cierra con infraestructura de datos que no consta."]]}},{"n":6,"punto":"Innovaciones de formato detectadas (qué es nuevo y funciona)","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"EL VÍDEO DE PROCESO EN SERIE. Documentar una obra desde el inicio hasta la entrega, en entregas cortas numeradas. Convierte una inauguración en veinte piezas de contenido y construye expectativa.","lead":"EL VÍDEO DE PROCESO EN SERIE."},{"t":"EL FORMATO «RESPONDO», donde el político toma comentarios reales y los responde en vídeo. Resuelve el problema de conversación sin exponerse al hilo abierto. Especialmente pertinente dado que el candidato NO RESPONDE COMENTARIOS EN NINGUNA PLATAFORMA.","lead":""},{"t":"EL RECORRIDO EN PRIMERA PERSONA con cámara en mano, sin equipo visible. El candidato YA LO HACE de forma natural en sus vídeos-selfie y es donde su autenticidad puntúa más alto.","lead":""},{"t":"LA PIEZA DE CIFRA ÚNICA: un dato grande, una frase, fondo de color de marca. Barata, muy compartible, y el candidato NO LA PRODUCE.","lead":"LA PIEZA DE CIFRA ÚNICA:"},{"t":"CANALES DE DIFUSIÓN EN MENSAJERÍA como infraestructura central, no como accesorio.","lead":""}],"accion":"El formato «respondo» y la pieza de cifra única son los dos de implantación más rápida y mayor retorno."},{"n":7,"punto":"Casos de éxito documentados y sus factores","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Al revisar qué tienen en común los referentes que han construido audiencias masivas desde gobiernos subnacionales, se repiten CINCO FACTORES.","lead":""},{"t":"CONSTANCIA POR ENCIMA DE VOLUMEN. Publicar todos los días algo modesto rinde más que ráfagas intensas seguidas de silencios. (Contraste directo con los tres meses de silencio en X.)","lead":"CONSTANCIA POR ENCIMA DE VOLUMEN."},{"t":"UN SOLO EJE RECONOCIBLE, sostenido durante años. (El eje existe —paz y frontera— y no se sostiene.)","lead":""},{"t":"PERSONA ANTES QUE CARGO. Las cuentas que crecen son las del político, no las de la institución.","lead":"PERSONA ANTES QUE CARGO."},{"t":"PRODUCCIÓN SUFICIENTE, NO PERFECTA. La sobreproducción resta autenticidad; lo que no se perdona es el descuido evidente, como un rótulo cortado a media palabra. (Contraste directo con el defecto de reencuadre de «Reporte Bernal».)","lead":"PRODUCCIÓN SUFICIENTE, NO PERFECTA."},{"t":"CONVERSIÓN DISEÑADA. Todos tienen enlace, destino y llamada a la acción. Es exactamente lo que falta en el ecosistema auditado: 618.000 seguidores sin ninguna ruta de salida.","lead":"CONVERSIÓN DISEÑADA."}],"accion":"De los cinco factores, el candidato cumple parcialmente uno (persona antes que cargo) e incumple los otros cuatro."},{"n":8,"punto":"Uso de IA y tecnología en comunicación política internacional","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"USOS CONSOLIDADOS Y DE BAJO RIESGO. Transcripción y subtitulado automático: ADOPTAR YA, resuelve directamente el problema de accesibilidad documentado en el M08 y M09. Traducción automática de contenido: útil en contexto fronterizo, y crítica dado que la conversación internacional sobre el sujeto es mayoritariamente en inglés (M16). Análisis de comentarios a escala: ALTA PRIORIDAD, permitiría detectar de forma sistemática los reclamos repetidos (cortes de luz, peso colombiano) que hoy se pierden en el ruido. Asistencia en redacción de borradores: útil, con revisión humana obligatoria. Edición asistida de vídeo con reencuadre inteligente vertical: MUY PERTINENTE, resolvería el defecto de «Reporte Bernal» documentado en el M08.","lead":"USOS CONSOLIDADOS Y DE BAJO RIESGO."},{"t":"USOS DE ALTO RIESGO QUE CONVIENE EVITAR. Generación de imágenes o vídeo sintético de personas o hechos: para un cargo público el riesgo reputacional es desproporcionado, basta un caso detectado para contaminar toda la comunicación posterior. Respuestas automáticas en comentarios sin supervisión: la autenticidad es el principal activo del candidato según el M11, y automatizar la conversación lo destruiría. Amplificación artificial: además del riesgo de sanción de plataforma, contradice el diagnóstico del M12 — su audiencia de TikTok es real y activa, y ese es su mayor activo.","lead":"USOS DE ALTO RIESGO QUE CONVIENE EVITAR."},{"t":"REGLA PRÁCTICA RECOMENDADA: usar IA para producir más rápido lo que ya se hace, nunca para sustituir la presencia real de la persona.","lead":"REGLA PRÁCTICA RECOMENDADA:"},{"t":"El M20 documenta que el nivel de adopción actual es NULO O MUY BAJO, lo que significa que todas las mejoras de eficiencia accesibles están sin explotar.","lead":""}],"accion":"Adoptar los cinco usos de bajo riesgo. Prohibir por escrito los tres de alto riesgo."},{"n":9,"punto":"Tendencias globales de comunicación política vigentes","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"VÍDEO VERTICAL COMO FORMATO POR DEFECTO, no como adaptación. Los equipos que siguen recortando horizontal están una generación por detrás.","lead":""},{"t":"DESPLAZAMIENTO DEL TEXTO AL AUDIOVISUAL. Las plataformas de texto pierden peso relativo. El caso del candidato lo ilustra con precisión: X tiene el doble de seguidores que TikTok y una fracción de su alcance real.","lead":"DESPLAZAMIENTO DEL TEXTO AL AUDIOVISUAL."},{"t":"MENSAJERÍA COMO CANAL PRINCIPAL, no como complemento. En países con alta penetración de WhatsApp, el canal de difusión sustituye a la lista de correo.","lead":""},{"t":"DE LA AUDIENCIA AL SERVICIO. La tendencia dominante en gobierno subnacional es convertir el canal social en punto de atención real, con trazabilidad de la solicitud.","lead":"DE LA AUDIENCIA AL SERVICIO."},{"t":"AUTENTICIDAD POR ENCIMA DE PRODUCCIÓN. El contenido evidentemente producido genera desconfianza; el contenido crudo pero honesto crece. (Es la tendencia donde el candidato ya está alineado.)","lead":"AUTENTICIDAD POR ENCIMA DE PRODUCCIÓN."},{"t":"ACCESIBILIDAD COMO ESTÁNDAR, no como añadido, especialmente exigible a instituciones públicas.","lead":""},{"t":"FRAGMENTACIÓN DE PLATAFORMAS. La estrategia de cuenta única por plataforma con identidad unificada gana frente a la dispersión de cuentas. (Contraste directo con las ocho cuentas y seis convenciones de usuario documentadas en el M01.)","lead":"FRAGMENTACIÓN DE PLATAFORMAS."}],"accion":"De las siete tendencias, el candidato está alineado con una (autenticidad) y desalineado con seis."},{"n":10,"punto":"Recomendaciones de adaptación al contexto tachirense/venezolano","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"Una recomendación internacional que no considere el contexto local es inútil. Estas están filtradas por tres condicionantes reales del Táchira: conectividad intermitente, cortes eléctricos documentados en los propios comentarios ciudadanos, y economía fronteriza bimonetaria.","lead":""},{"t":"ADOPTAR DIRECTAMENTE. Canal de WhatsApp como infraestructura central: es la tendencia global que mejor encaja con el contexto — funciona con conectividad pobre, consume pocos datos y tiene penetración casi universal en Venezuela, y ningún competidor regional lo ha ocupado. Subtitulado automático por IA en todos los vídeos: resuelve accesibilidad y permite consumo sin sonido, relevante donde los datos móviles son caros. El ciclo denuncia-acción-resultado como formato recurrente: es la tendencia de «audiencia a servicio» aplicada a su realidad, y los comentarios ya están llenos de denuncias concretas y verificables sobre luz, agua y vialidad. Piezas de cifra única para comunicar gestión: bajo coste, alta compartibilidad, y cubre la tipología ausente del M09.","lead":"ADOPTAR DIRECTAMENTE."},{"t":"ADAPTAR CON MATICES. El monotema funciona, pero el eje debe ser «paz y frontera» —que es el suyo por datos y por territorio exclusivo— y no una importación: la seguridad como monotema al estilo Bukele chocaría con la realidad de que sus críticos le reclaman servicios básicos, no seguridad. El registro humano es aplicable y probado, pero con una precaución que YA SE MATERIALIZÓ: el vídeo del helado fue su mayor alcance y su mayor desgaste; en un contexto de penuria económica, lo cotidiano debe mostrar CERCANÍA, NO CONSUMO — la tizana en un negocio local funciona, el helado en una cadena de Caracas no. Los directos recurrentes: su oficio de radio lo hace idóneo, pero conviene empezar por Spaces o directos cortos y con tema acotado, no formato abierto.","lead":"ADAPTAR CON MATICES."},{"t":"DESCARTAR EN ESTE CONTEXTO. Producción de alto acabado: su activo es la autenticidad y sobreproducir lo debilitaría. Cualquier contenido sintético generado por IA. Estrategias que dependan de conectividad estable o de consumo intensivo de datos.","lead":"DESCARTAR EN
