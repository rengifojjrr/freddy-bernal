<title>Diagnóstico Digital 360 · Freddy Bernal</title>
<style>
/* ---------- tokens: paleta validada para daltonismo ---------- */
:root{
  --blue:#2a78d6; --orange:#eb6834; --aqua:#1baf7a; --red:#d03b3b; --dim:#b9bec7;
  --navy:#1d2027; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --base:#c3c2b7; --surface:#ffffff; --plane:#f7f8fa;

  --verde:#1d6f42; --dorado:#9a6b00; --marino:#1d2027; --gris:#6b6b6b;

  --bg:var(--plane);
  --card:var(--surface);
  --texto:var(--ink);
  --texto2:var(--ink2);
  --linea:var(--grid);
  --linea2:var(--base);
  --sombra:0 1px 2px rgba(11,11,11,.04);
  --tinte:#f2f4f7;
  --barra-base:#c8ccd3;
  --banda:#eef1f5;

  --sobre-color:#ffffff;

  --r:3px;
  --lectura:70ch;
  --sidebar:288px;
  --topbar:60px;
}

/* modo oscuro: juego de tonos propio, no una inversion */
:root:not([data-theme="light"]){
  @media (prefers-color-scheme: dark){
    color-scheme:dark;
  }
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --blue:#6aa6ee; --orange:#f28a5f; --aqua:#3fcb99; --red:#e86a6a; --dim:#6a707a;
    --ink:#e9e7e2; --ink2:#b0aea8; --muted:#84827d;
    --grid:#282c33; --base:#3b414a; --surface:#15181c; --plane:#0d0f12;
    --verde:#4fbc82; --dorado:#d8a63c; --marino:#a8bdd8; --gris:#8c8c8c;
    --bg:var(--plane); --card:var(--surface);
    --texto:var(--ink); --texto2:var(--ink2);
    --linea:var(--grid); --linea2:var(--base);
    --sombra:0 1px 2px rgba(0,0,0,.35);
    --tinte:#1b1f25;
    --barra-base:#454b55;
    --banda:#1d222a;
    --sobre-color:#0d0f12;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --blue:#6aa6ee; --orange:#f28a5f; --aqua:#3fcb99; --red:#e86a6a; --dim:#6a707a;
  --ink:#e9e7e2; --ink2:#b0aea8; --muted:#84827d;
  --grid:#282c33; --base:#3b414a; --surface:#15181c; --plane:#0d0f12;
  --verde:#4fbc82; --dorado:#d8a63c; --marino:#a8bdd8; --gris:#8c8c8c;
  --bg:var(--plane); --card:var(--surface);
  --texto:var(--ink); --texto2:var(--ink2);
  --linea:var(--grid); --linea2:var(--base);
  --sombra:0 1px 2px rgba(0,0,0,.35);
  --tinte:#1b1f25;
  --barra-base:#454b55;
  --banda:#1d222a;
  --sobre-color:#0d0f12;
  color-scheme:dark;
}

/* ---------- base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0; padding-top:var(--topbar);
  background:var(--bg); color:var(--texto);
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
  font-size:15.5px; line-height:1.65;
  overflow-x:hidden;
}
h1,h2,h3,h4{margin:0; font-weight:600; line-height:1.25; letter-spacing:-.011em}
p{margin:0}
a{color:var(--blue)}
img{max-width:100%}
[hidden]{display:none !important}
button,input{font:inherit; color:inherit}

.saltar{
  position:absolute; left:-9999px; top:0; z-index:200;
  background:var(--card); color:var(--texto); padding:10px 16px;
  border:1px solid var(--linea2); border-radius:var(--r);
}
.saltar:focus{left:12px; top:12px}

:focus-visible{outline:2px solid var(--blue); outline-offset:2px; border-radius:2px}

/* ---------- barra superior ---------- */
.topbar{
  position:fixed; top:0; left:0; right:0; z-index:60;
  display:flex; align-items:center; gap:14px;
  height:var(--topbar); padding:0 18px;
  background:var(--card); border-bottom:1px solid var(--linea);
}
.marca{display:flex; flex-direction:column; line-height:1.15; flex:none}
.marca b{font-size:13px; font-weight:650; letter-spacing:.02em}
.marca span{font-size:11px; color:var(--muted)}

.buscador{position:relative; flex:1 1 auto; max-width:460px; min-width:0}
.buscador input{
  width:100%; padding:9px 32px 9px 34px;
  background:var(--bg); color:var(--texto);
  border:1px solid var(--linea2); border-radius:var(--r);
  font-size:14px;
}
.buscador input::placeholder{color:var(--muted)}
.buscador .lupa{
  position:absolute; left:10px; top:50%; transform:translateY(-50%);
  width:14px; height:14px; opacity:.5; pointer-events:none;
}
.buscador .limpiar{
  position:absolute; right:6px; top:50%; transform:translateY(-50%);
  border:0; background:none; cursor:pointer; color:var(--muted);
  font-size:16px; line-height:1; padding:4px 6px; border-radius:var(--r);
}
.buscador .limpiar:hover{color:var(--texto)}

.contador{
  font-size:12px; color:var(--texto2); white-space:nowrap;
  font-variant-numeric:tabular-nums; flex:none;
}
.contador b{color:var(--texto); font-weight:650}

.acciones{display:flex; gap:6px; margin-left:auto; flex:none}
.btn{
  display:inline-flex; align-items:center; gap:6px;
  padding:6px 11px; font-size:12.5px;
  background:var(--card); color:var(--texto2);
  border:1px solid var(--linea2); border-radius:var(--r);
  cursor:pointer; white-space:nowrap;
}
.btn:hover{border-color:var(--muted); color:var(--texto)}
.btn[aria-pressed="true"]{background:var(--tinte); color:var(--texto); border-color:var(--muted)}
.btn svg{width:14px; height:14px; flex:none}
#btn-editar{
  background:var(--aqua); border-color:var(--aqua); color:#07281c; font-weight:650;
  margin-left:auto;
}
#btn-editar:hover{border-color:var(--aqua); color:#07281c; filter:brightness(1.05)}
#btn-editar[aria-pressed="true"]{
  background:var(--card); color:var(--texto); border-color:var(--muted); font-weight:500;
}
.topbar #btn-editar ~ .acciones{margin-left:0}


/* ---------- estructura ---------- */
.shell{display:flex; align-items:flex-start}

.sidebar{
  position:sticky; top:var(--topbar); flex:none;
  width:var(--sidebar); height:calc(100vh - var(--topbar));
  overflow-y:auto; overscroll-behavior:contain;
  background:var(--card); border-right:1px solid var(--linea);
  padding:20px 0 60px;
}
.nav-grupo{margin-bottom:22px}
.nav-titulo{
  padding:0 20px 7px; font-size:10.5px; font-weight:650;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
}
.nav-a{
  display:flex; align-items:baseline; gap:9px;
  padding:6px 20px; font-size:13px; color:var(--texto2);
  text-decoration:none; border-left:2px solid transparent;
}
.nav-a:hover{background:var(--tinte); color:var(--texto)}
.nav-a.activo{border-left-color:var(--blue); color:var(--texto); font-weight:600; background:var(--tinte)}
.nav-a .id{
  flex:none; font-size:11px; font-weight:650; color:var(--muted);
  font-variant-numeric:tabular-nums; width:26px;
}
.nav-a.activo .id{color:var(--blue)}
.nav-a .tx{
  flex:1; min-width:0; text-transform:none;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
  overflow:hidden; line-height:1.35;
}
.nav-a .crit{
  flex:none; font-size:10px; font-weight:700; color:var(--sobre-color); background:var(--red);
  border-radius:9px; padding:1px 6px; line-height:1.5;
  font-variant-numeric:tabular-nums;
}

main{flex:1 1 auto; min-width:0; padding:0 0 120px}
.seccion{padding:56px 40px 8px; scroll-margin-top:calc(var(--topbar) + 12px)}
.seccion + .seccion{border-top:1px solid var(--linea)}
.seccion-cab{margin-bottom:32px; padding-bottom:16px; border-bottom:1px solid var(--linea2)}
.seccion-cab h2{font-size:25px; letter-spacing:-.024em; text-wrap:balance}
.seccion-cab .sub{margin-top:8px; font-size:14px; color:var(--texto2); max-width:var(--lectura)}
.eyebrow{
  font-size:10.5px; font-weight:650; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted); margin-bottom:7px;
}

.prosa{max-width:var(--lectura)}
.prosa p{margin:0 0 .85em}
.prosa p:last-child{margin-bottom:0}
.lead{font-weight:650; color:var(--texto)}

/* ---------- portada ---------- */
.portada{padding:52px 40px 8px}
.portada h1{font-size:34px; letter-spacing:-.028em; line-height:1.1}
.portada .sub{font-size:17px; color:var(--texto2); margin-top:6px; font-weight:400}
.portada .sujeto{margin-top:22px; font-size:19px; font-weight:600}
.portada .cargo{font-size:14px; color:var(--texto2); margin-top:2px}
.ficha{
  margin-top:26px; display:grid; gap:0;
  grid-template-columns:max-content 1fr;
  border-top:1px solid var(--linea); max-width:820px;
}
.ficha dt{
  padding:9px 22px 9px 0; font-size:10.5px; font-weight:650;
  letter-spacing:.09em; text-transform:uppercase; color:var(--muted);
  border-bottom:1px solid var(--linea); white-space:nowrap;
}
.ficha dd{
  margin:0; padding:9px 0; font-size:13.5px; color:var(--texto2);
  border-bottom:1px solid var(--linea);
}

.cifras{
  display:grid; gap:1px; margin:30px 0 6px;
  grid-template-columns:repeat(auto-fit,minmax(132px,1fr));
  background:var(--linea); border:1px solid var(--linea);
  border-radius:var(--r); overflow:hidden;
}
.cifra{background:var(--card); padding:15px 16px}
.cifra b{display:block; font-size:25px; font-weight:650; letter-spacing:-.025em; font-variant-numeric:tabular-nums}
.cifra span{display:block; font-size:11px; color:var(--muted); margin-top:2px; letter-spacing:.02em}

/* ---------- hallazgos del resumen ---------- */
.hallazgos{display:grid; gap:1px; background:var(--linea); border:1px solid var(--linea); border-radius:var(--r); overflow:hidden}
.hallazgo{background:var(--card); padding:20px 22px; display:flex; gap:16px}
.hallazgo .num{
  flex:none; width:26px; height:26px; border-radius:50%;
  background:var(--tinte); border:1px solid var(--linea2); color:var(--texto2);
  display:flex; align-items:center; justify-content:center;
  font-size:12px; font-weight:650; font-variant-numeric:tabular-nums;
}
.hallazgo h3{font-size:15.5px; margin-bottom:6px}
.hallazgo p{font-size:14px; color:var(--texto2); max-width:var(--lectura)}

/* ---------- tablas ---------- */
.tabla-caja{overflow-x:auto; margin:14px 0; border:1px solid var(--linea); border-radius:var(--r); background:var(--card)}
table{border-collapse:collapse; width:100%; font-size:13px}
thead th{
  text-align:left; padding:9px 13px; font-size:10.5px; font-weight:650;
  letter-spacing:.07em; text-transform:uppercase; color:var(--muted);
  border-bottom:1px solid var(--linea2); white-space:nowrap; background:var(--card);
}
tbody td{padding:9px 13px; border-bottom:1px solid var(--linea); vertical-align:top; color:var(--texto2)}
tbody tr:last-child td{border-bottom:0}
tbody td:first-child{color:var(--texto); font-weight:500}
tbody tr.total td{font-weight:650; color:var(--texto); background:var(--tinte)}

/* tabla-resumen de modulos */
.t-modulos tbody tr{cursor:pointer}
.t-modulos tbody tr:hover{background:var(--tinte)}
.t-modulos td.n{font-variant-numeric:tabular-nums; text-align:right; white-space:nowrap}
.t-modulos td.alc{font-size:12px; color:var(--muted)}
.pill{
  display:inline-block; min-width:20px; text-align:center;
  padding:1px 6px; border-radius:9px; font-size:11px; font-weight:650;
  font-variant-numeric:tabular-nums;
}
.pill.c{background:var(--red); color:var(--sobre-color)}
.pill.a{background:var(--orange); color:var(--sobre-color)}
.pill.cero{background:transparent; color:var(--muted); font-weight:400}

/* ---------- modulo ---------- */
.modulo{margin:0 0 68px; scroll-margin-top:calc(var(--topbar) + 12px)}
.modulo-cab{padding-bottom:18px; border-bottom:2px solid var(--texto); margin-bottom:24px}
.modulo-cab .id{
  font-size:11px; font-weight:700; letter-spacing:.12em; color:var(--blue);
}
.modulo-cab h2{font-size:22px; margin-top:6px; letter-spacing:-.022em; text-wrap:balance}
.modulo-cifras{display:flex; flex-wrap:wrap; gap:7px; margin-top:14px}
.mp{
  display:inline-flex; align-items:baseline; gap:6px;
  padding:3px 10px; border-radius:12px; font-size:11.5px;
  background:var(--tinte); color:var(--texto2); border:1px solid var(--linea);
  font-variant-numeric:tabular-nums; white-space:nowrap;
}
.mp b{font-weight:700; color:var(--texto)}
.mp.c{border-color:var(--red); color:var(--red)} .mp.c b{color:var(--red)}
.mp.a{border-color:var(--orange); color:var(--orange)} .mp.a b{color:var(--orange)}
.modulo-meta{
  display:grid; gap:9px 22px; margin-top:16px; font-size:12.5px; color:var(--texto2);
  grid-template-columns:max-content 1fr; align-items:baseline;
}
.modulo-meta dt{
  font-size:10px; font-weight:650; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted); white-space:nowrap;
}
.modulo-meta dd{margin:0}
.modulo-resumen{margin:20px 0 30px}

/* pasar al modulo anterior o siguiente sin volver al indice */
.modulo-pasos{
  display:flex; gap:10px; margin-top:26px; padding-top:18px;
  border-top:1px solid var(--linea);
}
.paso{
  flex:1 1 0; min-width:0; display:flex; flex-direction:column; gap:3px;
  padding:12px 14px; text-decoration:none; border-radius:var(--r);
  border:1px solid var(--linea2); background:var(--card); color:var(--texto);
}
.paso:hover{border-color:var(--muted); background:var(--tinte)}
.paso span{font-size:10px; font-weight:650; letter-spacing:.09em; text-transform:uppercase; color:var(--muted)}
.paso b{font-size:13px; font-weight:600; line-height:1.3;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden}
.paso.sig{text-align:right}
.paso.vacio{visibility:hidden}

/* ---------- punto ---------- */
.punto{
  position:relative;
  background:var(--card); border:1px solid var(--linea); border-radius:var(--r);
  margin-bottom:18px; box-shadow:var(--sombra);
  scroll-margin-top:calc(var(--topbar) + 12px);
}
/* los 37 puntos criticos se localizan sin leer: un filo rojo en el borde */
.punto[data-prioridad="CRÍTICA"]{border-left:3px solid var(--red)}
.punto[data-prioridad="CRÍTICA"] .punto-cab{padding-left:17px}
.punto-cab{
  display:flex; gap:14px; align-items:flex-start;
  padding:16px 20px; width:100%; text-align:left;
  background:none; border:0; cursor:default;
}
.compacto .punto-cab, .punto.plegado .punto-cab{cursor:pointer}
.punto-n{
  flex:none; font-size:12px; font-weight:650; color:var(--muted);
  font-variant-numeric:tabular-nums; padding-top:2px; min-width:22px;
}
.punto-tit{flex:1; min-width:0}
.punto-tit h3{font-size:15.5px; letter-spacing:-.008em}
.distintivos{display:flex; flex-wrap:wrap; gap:6px; margin-top:9px}
.chev{
  flex:none; width:16px; height:16px; margin-top:4px; opacity:0;
  transition:transform .12s ease; color:var(--muted);
}
.compacto .chev, .punto.plegado .chev{opacity:1}
.punto.abierto .chev{transform:rotate(90deg)}

.badge{
  display:inline-flex; align-items:center; gap:5px;
  padding:2px 8px; border-radius:var(--r);
  font-size:10.5px; font-weight:650; letter-spacing:.05em; text-transform:uppercase;
  border:1px solid currentColor; white-space:nowrap; text-decoration:none;
}
.badge::before{content:""; width:5px; height:5px; border-radius:50%; background:currentColor; flex:none}
.badge.p-critica{color:var(--red)}
.badge.p-alta{color:var(--orange)}
.badge.p-media{color:var(--blue)}
.badge.p-baja{color:var(--aqua)}
.badge.p-info{color:var(--dim)}
.badge.e-verde{color:var(--verde)}
.badge.e-marino{color:var(--marino)}
.badge.e-dorado{color:var(--dorado)}
.badge.e-gris{color:var(--gris)}
a.badge:hover{background:var(--tinte)}

.punto-cuerpo{padding:0 20px 18px 56px}
.compacto .punto:not(.abierto) .punto-cuerpo{display:none}
.punto.plegado:not(.abierto) .punto-cuerpo{display:none}

.accion{
  margin-top:16px; padding:13px 16px;
  background:var(--tinte); border-left:3px solid var(--blue);
  border-radius:0 var(--r) var(--r) 0;
}
.accion .et{
  font-size:10px; font-weight:700; letter-spacing:.11em;
  text-transform:uppercase; color:var(--blue); display:block; margin-bottom:4px;
}
.accion p{font-size:13.5px; color:var(--texto2); max-width:var(--lectura)}

/* ---------- figuras ---------- */
figure{margin:16px 0; break-inside:avoid}
figure img{
  display:block; width:100%; height:auto; cursor:zoom-in;
  border:1px solid var(--linea); border-radius:var(--r); background:var(--bg);
}
figcaption{margin-top:7px; font-size:12px; color:var(--muted); max-width:var(--lectura)}
figcaption b{color:var(--texto2); font-weight:650}

/* ---------- graficos ---------- */
.gr{margin:20px 0; break-inside:avoid}
.gr-cab{margin-bottom:10px}
.gr-cab h4{font-size:14px}
.gr-cab .sub{font-size:12.5px; color:var(--texto2); margin-top:2px; max-width:var(--lectura)}
.gr svg{display:block; width:100%; height:auto; overflow:visible}
.gr-nota{margin-top:8px; font-size:11.5px; color:var(--muted); max-width:var(--lectura)}
.gr .rejilla{stroke:var(--linea); stroke-width:1; shape-rendering:crispEdges}
.gr .eje{stroke:var(--linea2); stroke-width:1; shape-rendering:crispEdges}
.gr .cat{fill:var(--texto2); font-size:13px}
.gr .val{fill:var(--texto); font-size:13px; font-weight:650; font-variant-numeric:tabular-nums}
.gr .det{fill:var(--muted); font-size:11.5px}
.gr .tick{fill:var(--muted); font-size:11px; font-variant-numeric:tabular-nums}
.gr .panel-tit{fill:var(--texto); font-size:12px; font-weight:650}
.gr .val-col{font-size:17px}
.gr .veredicto{font-size:12px; font-weight:700; letter-spacing:.03em}
.gr .banda{fill:var(--banda)}
.gr .barra rect.b{transition:opacity .1s}
.gr .barra:hover rect.b{opacity:.78}
.gr-tiles{display:flex; flex-wrap:wrap; gap:1px; background:var(--linea); border:1px solid var(--linea); border-radius:var(--r); overflow:hidden; margin-bottom:16px}
.gr-tile{background:var(--card); padding:14px 18px; flex:1 1 150px}
.gr-tile b{display:block; font-size:23px; font-weight:650; letter-spacing:-.025em; font-variant-numeric:tabular-nums}
.gr-tile span{display:block; font-size:11.5px; color:var(--texto2); margin-top:3px}
.gr-tile em{display:block; font-size:11px; color:var(--muted); font-style:normal; margin-top:3px}

#tip{
  position:fixed; z-index:120; pointer-events:none; opacity:0;
  max-width:280px; padding:7px 10px;
  background:var(--navy); color:#f4f3f0; font-size:12px; line-height:1.4;
  border-radius:var(--r); box-shadow:0 4px 14px rgba(0,0,0,.22);
  transition:opacity .1s;
}
#tip b{display:block; font-weight:650; margin-bottom:1px}
#tip i{display:block; font-style:normal; opacity:.75; margin-top:2px}

/* ---------- plan ---------- */
.progreso-global{
  display:flex; align-items:center; gap:14px; margin-bottom:26px;
  padding:15px 18px; background:var(--card);
  border:1px solid var(--linea); border-radius:var(--r);
}
.barra-p{flex:1; height:6px; background:var(--tinte); border-radius:3px; overflow:hidden}
.barra-p i{display:block; height:100%; background:var(--aqua); border-radius:3px; transition:width .2s}
.progreso-global .n{font-size:12.5px; color:var(--texto2); white-space:nowrap; font-variant-numeric:tabular-nums}

.bloque{margin-bottom:32px; scroll-margin-top:calc(var(--topbar) + 8px)}
.bloque-cab{padding-bottom:11px; border-bottom:1px solid var(--linea2); margin-bottom:6px}
.bloque-cab h3{font-size:15px; letter-spacing:.01em}
.bloque-cab .desc{font-size:13px; color:var(--texto2); margin-top:5px; max-width:var(--lectura)}
.bloque-cab .mini{display:flex; align-items:center; gap:10px; margin-top:10px}
.bloque-cab .mini .barra-p{max-width:170px}
.bloque-cab .mini .n{font-size:11.5px; color:var(--muted); font-variant-numeric:tabular-nums}

.tarea{display:flex; gap:13px; padding:13px 2px; border-bottom:1px solid var(--linea)}
.tarea:last-child{border-bottom:0}
.tarea input{
  flex:none; width:18px; height:18px; margin-top:1px; cursor:pointer;
  accent-color:var(--aqua);
}
.tarea label{padding:2px 0}
.tarea .cont{flex:1; min-width:0}
.tarea .fila{display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
.tarea .num{font-size:11px; font-weight:650; color:var(--muted); font-variant-numeric:tabular-nums}
.tarea label{font-size:14px; font-weight:600; cursor:pointer}
.tarea .mods{font-size:10.5px; font-weight:650; letter-spacing:.05em; color:var(--blue)}
.tarea .det{font-size:13px; color:var(--texto2); margin-top:4px; max-width:var(--lectura)}
.tarea.hecha label{color:var(--muted); text-decoration:line-through}
.tarea.hecha .det{opacity:.6}

/* ---------- profundizacion / fuentes ---------- */
.cat{
  margin-bottom:22px; padding:20px 22px; background:var(--card);
  border:1px solid var(--linea); border-radius:var(--r); box-shadow:var(--sombra);
}
.cat h3{font-size:15px; margin-bottom:11px}
.cat ul{margin:0; padding-left:19px}
.cat li{margin-bottom:.6em; font-size:13.5px; color:var(--texto2); max-width:var(--lectura)}
.cat li:last-child{margin-bottom:0}
.cat .esfuerzo{
  margin-top:13px; padding-top:12px; border-top:1px solid var(--linea);
  font-size:12.5px; color:var(--texto2);
}
.lista-fuentes{margin:0; padding-left:19px}
.lista-fuentes li{margin-bottom:.5em; font-size:13px; color:var(--texto2); max-width:var(--lectura)}

/* ---------- filtros ---------- */
.filtros{
  position:sticky; top:var(--topbar); z-index:50;
  margin:0 -40px 22px; padding:12px 40px;
  background:var(--bg);
  border-top:1px solid var(--linea); border-bottom:1px solid var(--linea);
}
.filtro-fila{display:flex; align-items:center; gap:9px; flex-wrap:wrap; margin-bottom:7px}
.filtro-fila:last-child{margin-bottom:0}
.filtro-et{
  font-size:10px; font-weight:650; letter-spacing:.09em; text-transform:uppercase;
  color:var(--muted); width:64px; flex:none;
}
.chip{
  padding:3px 10px; font-size:11.5px; font-weight:600;
  background:var(--card); color:var(--texto2);
  border:1px solid var(--linea2); border-radius:11px; cursor:pointer;
  white-space:nowrap;
}
.chip:hover{border-color:var(--muted); color:var(--texto)}
.chip[aria-pressed="true"]{background:var(--texto); color:var(--card); border-color:var(--texto)}
.chip .c{opacity:.62; font-weight:400; margin-left:3px; font-variant-numeric:tabular-nums}
.chip.limpiar{border-style:dashed; color:var(--muted)}

.sin-resultados{
  padding:44px 40px; text-align:center; color:var(--muted); font-size:14px;
}
mark{background:rgba(235,104,52,.26); color:inherit; border-radius:2px; padding:0 1px}

/* ---------- lightbox ---------- */
#lightbox{
  position:fixed; inset:0; z-index:150; display:none;
  background:rgba(8,9,11,.93); padding:28px;
  align-items:center; justify-content:center;
}
#lightbox.abierto{display:flex}
#lightbox img{max-width:100%; max-height:calc(100vh - 128px); object-fit:contain; border-radius:var(--r)}
#lightbox figcaption{
  position:absolute; left:28px; right:28px; bottom:20px;
  color:#d8d6d1; text-align:center; font-size:12.5px; max-width:none;
}
#lightbox .cerrar{
  position:absolute; top:18px; right:20px; width:34px; height:34px;
  background:rgba(255,255,255,.1); color:#fff; border:0; border-radius:var(--r);
  font-size:19px; cursor:pointer; line-height:1;
}

/* ---------- piezas que solo existen en el móvil ---------- */
.solo-movil{display:none !important}
.zona-controles{display:none}

.fondo-sheet{
  position:fixed; top:var(--topbar); left:0; width:100vw; bottom:0;
  z-index:69; background:rgba(8,9,11,.5);
  opacity:0; pointer-events:none; transition:opacity .18s;
}
.fondo-sheet.abierto{opacity:1; pointer-events:auto}

#btn-filtros .n{
  min-width:16px; padding:0 4px; border-radius:8px; font-size:10px; font-weight:700;
  background:var(--blue); color:#fff; line-height:16px; text-align:center;
}

.fab{
  position:fixed; right:12px; bottom:14px; z-index:58;
  width:40px; height:40px; border-radius:50%;
  background:var(--card); color:var(--texto2);
  border:1px solid var(--linea2); box-shadow:0 3px 12px rgba(0,0,0,.16);
  cursor:pointer; display:none; align-items:center; justify-content:center;
  opacity:0; pointer-events:none; transition:opacity .16s;
}
.fab svg{width:17px; height:17px}
.fab{backdrop-filter:saturate(1.2) blur(6px)}
.fab.visible{opacity:1; pointer-events:auto}

/* ---------- responsive ---------- */
@media (max-width:1040px){
  :root{--sidebar:250px}
  .seccion,.filtros,.portada{padding-left:28px; padding-right:28px}
}

@media (max-width:860px){
  :root{--topbar:56px; --lectura:none}

  .solo-movil{display:inline-flex !important}
  .topbar{z-index:75}
  .topbar .btn{min-height:38px; padding:8px 10px}
  .acciones .btn .et{display:none}
  .marca,.contador,.chev{display:none}
  .zona-controles #diag{align-self:center}
  .topbar{gap:8px; padding:0 12px}

  .shell{display:block}

  /* el índice baja como panel desplegable */
  .sidebar{
    position:fixed; top:var(--topbar); left:0; right:auto; z-index:68;
    width:100vw; max-width:100vw; max-height:calc(100vh - var(--topbar));
    overflow-x:hidden;
    border-right:0; border-bottom:1px solid var(--linea2);
    box-shadow:0 10px 28px rgba(0,0,0,.16);
    padding:14px 0 24px;
  }
  .sidebar[hidden]{display:none !important}
  .zona-controles{
    display:flex; gap:8px; padding:0 18px 16px; margin-bottom:14px;
    border-bottom:1px solid var(--linea);
  }
  .zona-controles .btn{flex:1; justify-content:center; padding:11px 8px; min-height:42px}
  .zona-controles .btn .et{display:inline}
  .nav-a{padding:11px 18px; font-size:14px}
  .nav-titulo{padding-left:18px; padding-right:18px}

  /* los filtros pasan a ser una hoja que sube desde abajo */
  .filtros{
    position:fixed; left:0; right:auto; bottom:0; top:auto; z-index:70;
    margin:0; border-top:1px solid var(--linea2);
    width:100vw; max-width:100vw;
    max-height:72vh; overflow-y:auto; overflow-x:hidden; overscroll-behavior:contain;
    padding:18px 18px calc(18px + env(safe-area-inset-bottom, 0px));
    background:var(--card); border-top:1px solid var(--linea2); border-bottom:0;
    border-radius:14px 14px 0 0; box-shadow:0 -8px 30px rgba(0,0,0,.2);
    transform:translateY(101%); transition:transform .2s ease;
  }
  .filtros[hidden]{display:block !important}
  .filtros.abierta{transform:none}
  .filtros::before{
    content:""; display:block; width:38px; height:4px; border-radius:2px;
    background:var(--linea2); margin:-6px auto 16px;
  }
  .filtro-fila{margin-bottom:14px}
  .filtro-et{width:auto; display:block; margin-bottom:2px}
  .chip{padding:8px 13px; font-size:13px; border-radius:16px}
  #cerrar-filtros{
    position:sticky; bottom:0; z-index:2;
    display:block; width:100%; margin-top:10px; padding:14px;
    background:var(--texto); color:var(--card); border:0; border-radius:var(--r);
    font-size:15px; font-weight:650; cursor:pointer;
    box-shadow:0 -10px 16px -6px var(--card);
  }
  .filtros{padding-bottom:calc(10px + env(safe-area-inset-bottom, 0px))}
  .chip{padding:9px 14px}

  .fab{display:flex}

  .seccion{padding:36px 18px 8px}
  .portada{padding:34px 18px 8px}
  .seccion + .seccion{border-top:0}
  .seccion-cab h2{font-size:21px}
  .portada h1{font-size:27px}
  .ficha{grid-template-columns:1fr; gap:0}
  .ficha dt{border-bottom:0; padding:10px 0 0}
  .ficha dd{padding:2px 0 10px}

  .modulo{margin-bottom:48px}
  .modulo-meta{grid-template-columns:1fr; gap:2px 0}
  .modulo-meta dd{margin-bottom:10px}
  .modulo-cab h2{font-size:19px}

  /* en el móvil los puntos llegan plegados: se recorre el módulo de un vistazo */
  .punto{margin-bottom:10px}
  .punto-cab{padding:15px 16px; gap:12px}
  .punto-tit h3{font-size:15px}
  .punto-cuerpo{padding:0 16px 16px}
  .punto[data-prioridad="CRÍTICA"] .punto-cab{padding-left:13px}
  .compacto .chev{display:block}
  .hallazgo{padding:17px 16px; gap:13px}
  .cat{padding:17px 16px}
  .accion{padding:13px 14px}
  .tarea{padding:16px 2px}
  .tarea input{width:24px; height:24px; margin-top:0}
  .tarea label{font-size:15px; line-height:1.45}
  .modulo-pasos{flex-direction:column}
}

@media (max-width:540px){
  /* el buscador necesita sitio: con tres botones rotulados no le queda */
  #btn-menu .et,#btn-filtros .et{display:none}
}

@media (max-width:420px){
  .seccion,.portada{padding-left:14px; padding-right:14px}
  .punto-cab{padding:14px}
  .punto-cuerpo{padding:0 14px 14px}
  .portada h1{font-size:24px}
  .cifras{grid-template-columns:repeat(2,1fr)}
}

/* el iOS de Safari amplía la página si el campo baja de 16 px */
@media (max-width:860px){
  .buscador input{font-size:16px; padding:10px 34px 10px 36px}
}


/* ======================= EDICIÓN =======================
   Solo se enciende donde el almacén está disponible. En el archivo
   local y en GitHub Pages no hay dónde guardar, así que no aparece. */

.notas{margin-top:26px; padding-top:18px; border-top:1px dashed var(--linea2)}
.notas-et{
  font-size:10px; font-weight:650; letter-spacing:.09em;
  text-transform:uppercase; color:var(--muted); margin-bottom:8px;
}
body:not(.puede-editar) .notas:not(.con-contenido){display:none}

#diag{
  display:inline-flex; align-items:center; gap:6px; flex:none; cursor:pointer;
  padding:4px 10px; border-radius:12px; font-size:11px; font-weight:650;
  letter-spacing:.03em; white-space:nowrap;
  background:var(--tinte); color:var(--texto2); border:1px solid var(--linea2);
}
#diag::before{content:""; width:7px; height:7px; border-radius:50%; background:currentColor}
#diag.ok{color:var(--verde); border-color:var(--verde); background:rgba(27,175,122,.12)}
#diag.mal{color:var(--red); border-color:var(--red); background:rgba(208,59,59,.12)}
#diag-panel{
  position:fixed; z-index:130; right:14px; top:calc(var(--topbar) + 8px);
  width:min(420px, calc(100vw - 24px)); max-height:70vh; overflow:auto;
  padding:16px 18px; border-radius:var(--r);
  background:var(--card); border:1px solid var(--linea2);
  box-shadow:0 10px 34px rgba(0,0,0,.2); display:none;
}
#diag-panel.abierto{display:block}
#diag-panel h4{font-size:13px; margin-bottom:10px}
#diag-panel dl{display:grid; grid-template-columns:max-content 1fr; gap:6px 12px; font-size:12px}
#diag-panel dt{color:var(--muted); white-space:nowrap}
#diag-panel dd{margin:0; color:var(--texto2); word-break:break-word}
#diag-panel dd.si{color:var(--verde); font-weight:600}
#diag-panel dd.no{color:var(--red); font-weight:600}
#diag-panel .pie{margin-top:12px; padding-top:10px; border-top:1px solid var(--linea); font-size:11.5px; color:var(--muted)}

.modo{
  display:inline-flex; align-items:center; gap:6px; flex:none;
  padding:4px 10px; border-radius:12px; font-size:11px; font-weight:650;
  letter-spacing:.04em; text-transform:uppercase; white-space:nowrap;
  background:rgba(27,175,122,.14); color:var(--verde);
  border:1px solid var(--verde);
}
.modo::before{content:""; width:6px; height:6px; border-radius:50%; background:currentColor}

.zona{position:relative}
.zona.vacia:empty::before,
.zona.vacia > p:only-child:empty::before{
  content:"Sin notas."; color:var(--muted); font-size:13px;
}
.zona .prosa{max-width:var(--lectura)}

/* marca discreta de lo que se ha tocado */
.zona.editada::after{
  content:""; position:absolute; left:-14px; top:2px; bottom:2px; width:2px;
  background:var(--aqua); border-radius:1px;
}
.punto[data-prioridad="CRÍTICA"] .zona.editada::after{left:-11px}

/* modo edición */
body.editando .zona{
  outline:1px dashed var(--linea2); outline-offset:6px; border-radius:2px;
  min-height:1.4em;
}
body.editando .zona:hover{outline-color:var(--muted)}
body.editando .zona:focus-within,
body.editando .zona[contenteditable="true"]:focus{
  outline:2px solid var(--blue); outline-offset:6px;
}
.zona[contenteditable="true"]{cursor:text}
.zona[contenteditable="true"] img{
  max-width:100%; height:auto; border-radius:var(--r);
  border:1px solid var(--linea); cursor:default;
}
.zona img.subida{display:block; margin:12px 0; max-width:100%; height:auto;
  border:1px solid var(--linea); border-radius:var(--r)}
.zona.soltando{outline:2px dashed var(--aqua) !important; background:var(--tinte)}

/* lo que se puede escribir con la barra de herramientas */
.zona h4{font-size:15.5px; font-weight:650; margin:16px 0 6px; letter-spacing:.005em}
.zona h4:first-child{margin-top:0}
.zona blockquote{
  margin:10px 0; padding:2px 0 2px 14px;
  border-left:3px solid var(--linea2); color:var(--muted);
}
.zona ul,.zona ol{margin:8px 0 8px 22px; padding:0}
.zona li{margin:3px 0}
.zona a{color:var(--blue); text-decoration:underline; text-underline-offset:2px}
.zona s,.zona strike{text-decoration:line-through; opacity:.72}

/* --------- herramientas de edición ---------
   Dos sitios para lo mismo: la cinta de abajo, siempre a la vista mientras se
   edita, y la burbuja que sale sobre el texto seleccionado en pantalla ancha.
   Las dos se dibujan del mismo listado y las atiende el mismo manejador. */

/* botones, comunes a la cinta y a la burbuja */
#cinta button,#formato button{
  flex:none; min-width:31px; height:31px; padding:0 7px; border:0; border-radius:5px;
  background:transparent; color:#f2f1ee; font-size:13px; line-height:1; cursor:pointer;
  display:inline-flex; align-items:center; justify-content:center; gap:5px;
}
#cinta button:hover,#formato button:hover{background:rgba(255,255,255,.14)}
#cinta button.on,#formato button.on{background:rgba(255,255,255,.24); box-shadow:inset 0 0 0 1px rgba(255,255,255,.28)}
#cinta button:disabled,#formato button:disabled{opacity:.3; cursor:default; background:transparent}
#cinta .sep,#formato .sep{
  flex:none; width:1px; align-self:stretch; margin:3px 4px; background:rgba(255,255,255,.22);
}
#cinta .tinta,#formato .tinta{
  width:17px; height:17px; border-radius:50%; border:1.5px solid rgba(255,255,255,.45);
}
#cinta b,#formato b{font-weight:800}
#cinta .et,#formato .et{font-size:12px; letter-spacing:.01em}
#cinta .glifo,#formato .glifo{font-size:15px}
#cinta svg,#formato svg{display:block; flex:none}
#cinta .letra,#formato .letra{
  font-weight:650; line-height:1; display:block; width:1em; text-align:center;
}

/* burbuja sobre la selección */
#formato{
  position:fixed; z-index:110; display:none; gap:2px; padding:5px;
  background:var(--navy); border-radius:7px; box-shadow:0 6px 20px rgba(0,0,0,.28);
}
#formato.visible{display:flex; flex-wrap:wrap; max-width:min(92vw,344px)}

/* panel de abajo: cinta de herramientas y estado */
#panel-edicion{
  position:fixed; left:0; right:0; bottom:0; z-index:80;
  display:none; flex-direction:column;
  background:var(--navy); color:#f2f1ee;
  box-shadow:0 -4px 18px rgba(0,0,0,.2);
}
body.editando #panel-edicion,
body.pendiente #panel-edicion{display:flex}
/* fuera del modo edición solo interesa saber si se guardó, no las herramientas */
body.pendiente:not(.editando) #cinta{display:none}
#cinta{
  display:flex; align-items:center; gap:2px; padding:7px 12px 6px;
  overflow-x:auto; overflow-y:hidden; scrollbar-width:thin;
  scrollbar-color:rgba(255,255,255,.28) transparent;
  border-bottom:1px solid rgba(255,255,255,.14);
  -webkit-overflow-scrolling:touch;
}
#cinta::-webkit-scrollbar{height:5px}
#cinta::-webkit-scrollbar-thumb{background:rgba(255,255,255,.28); border-radius:3px}
#cinta::-webkit-scrollbar-track{background:transparent}
#cinta .grupo{display:flex; align-items:center; gap:2px; flex:none}
/* en pantalla ancha caben en dos filas y se ven todas; en el móvil no hay
   sitio para dos filas, así que allí se desliza a lo largo con el dedo */
@media (min-width:761px){
  #cinta{flex-wrap:wrap; overflow-x:visible; row-gap:4px}
}

/* barra de estado de la edición */
#barra-edicion{
  display:none; align-items:center; gap:12px; flex-wrap:wrap;
  padding:9px 14px calc(9px + env(safe-area-inset-bottom,0px));
}
body.editando #barra-edicion,
body.pendiente #barra-edicion{display:flex}
#barra-edicion .estado{font-size:12.5px; opacity:.85; flex:1; min-width:120px}
#barra-edicion .estado b{opacity:1; font-weight:600}
#barra-edicion .estado.mal{opacity:1; color:#ffb4ac}
#barra-edicion .estado.mal b{color:#ffb4ac}
#barra-edicion button{
  padding:8px 14px; border-radius:var(--r); border:1px solid rgba(255,255,255,.28);
  background:transparent; color:#f2f1ee; font-size:13px; cursor:pointer; white-space:nowrap;
}
#barra-edicion button:hover{background:rgba(255,255,255,.12)}
#barra-edicion button.primario{background:var(--aqua); border-color:var(--aqua); color:#07281c; font-weight:650}
#barra-edicion .punto-rojo{width:7px; height:7px; border-radius:50%; background:var(--orange); flex:none}
#barra-edicion .corta{display:none}

/* el panel no puede taparle a nadie el último párrafo: su altura se mide en
   marcha y se le devuelve al documento como hueco */
body.editando,body.pendiente{padding-bottom:var(--panel-edicion,118px)}
body.editando .fab,body.pendiente .fab{bottom:calc(var(--panel-edicion,118px) + 12px)}

@media (max-width:760px){
  /* con la cinta siempre a mano, la burbuja solo estorbaría: en el móvil pelea
     con el menú de selección del propio sistema */
  #formato{display:none !important}
  #cinta{padding:7px 8px 6px}
  #barra-edicion{gap:8px; padding:8px 10px calc(8px + env(safe-area-inset-bottom,0px))}
  #barra-edicion button{padding:8px 11px; font-size:12.5px}
  #barra-edicion .estado{flex:1 1 100%; order:-1; min-width:0}
  #barra-edicion .larga{display:none}
  #barra-edicion .corta{display:inline}
}

/* aviso de solo lectura */
#aviso-lectura{
  position:fixed; left:50%; transform:translateX(-50%); bottom:18px; z-index:112;
  padding:10px 16px; border-radius:20px; font-size:13px;
  background:var(--navy); color:#f2f1ee; box-shadow:0 4px 16px rgba(0,0,0,.24);
  opacity:0; pointer-events:none; transition:opacity .2s;
}
#aviso-lectura.visible{opacity:1}
body.editando #aviso-lectura,
body.pendiente #aviso-lectura{bottom:calc(var(--panel-edicion,118px) + 14px)}

@media print{
  #formato,#panel-edicion,#aviso-lectura,.notas-et{display:none !important}
  body.editando{padding-bottom:0}
  .zona{outline:0 !important}
  .zona.editada::after{display:none}
  .notas{display:block !important}
}

/* quien pide menos movimiento no lo tiene */

<script type="application/json" id="datos">{"meta":{"titulo":"DIAGNÓSTICO DIGITAL 360","subtitulo":"Informe técnico completo","sujeto":"Freddy Alirio Bernal Rosales","cargo":"Gobernador del estado Táchira — República Bolivariana de Venezuela","cliente":"Gobernación del estado Táchira — Gobernador","base_contractual":"Cotización N° ID-20260824-8092 · Impulso Digital · Auditoría y Estrategia Digital","alcance":"21 módulos de análisis · 267 puntos auditados · 8 cuentas y 6 plataformas","fuentes":"Observación directa en plataforma entre el 3 y el 5 de septiembre de 2026","documento":"Informe final — 5 de septiembre de 2026","total_modulos":21,"total_puntos":267,"total_tablas":69,"total_capturas":10,"total_acciones":47,"total_graficos":10,"capturas_aparte":true},"portada":{"lineas":["DIAGNÓSTICO DIGITAL 360","Informe técnico completo","Freddy Alirio Bernal Rosales","Gobernador del estado Táchira — República Bolivariana de Venezuela","CLIENTE Gobernación del estado Táchira — Gobernador","BASE CONTRACTUAL Cotización N° ID-20260824-8092 · Impulso Digital · Auditoría y Estrategia Digital","ALCANCE 21 módulos de análisis · 267 puntos auditados · 8 cuentas y 6 plataformas","FUENTES Observación directa en plataforma entre el 3 y el 5 de septiembre de 2026","DOCUMENTO Informe final — 5 de septiembre de 2026","Informe técnico completo del diagnóstico digital 360. Recorre los veintiún módulos de análisis y, dentro de cada uno, todos los puntos contratados con el hallazgo verificado que le corresponde, su evidencia, su prioridad y la acción recomendada.","Todas las cifras de este informe proceden de observación directa en plataforma con sesión iniciada entre el 3 y el 5 de septiembre de 2026. 382 publicaciones clasificadas una a una, 8 cuentas, 6 plataformas y 20 figuras de verificación."],"campos":{"CLIENTE":"Gobernación del estado Táchira — Gobernador","BASE CONTRACTUAL":"Cotización N° ID-20260824-8092 · Impulso Digital · Auditoría y Estrategia Digital","ALCANCE":"21 módulos de análisis · 267 puntos auditados · 8 cuentas y 6 plataformas","FUENTES":"Observación directa en plataforma entre el 3 y el 5 de septiembre de 2026","DOCUMENTO":"Informe final — 5 de septiembre de 2026"},"titulo":"DIAGNÓSTICO DIGITAL 360","subtitulo":"Informe técnico completo","sujeto":"Freddy Alirio Bernal Rosales","cargo":"Gobernador del estado Táchira — República Bolivariana de Venezuela","descripcion":["Informe técnico completo del diagnóstico digital 360. Recorre los veintiún módulos de análisis y, dentro de cada uno, todos los puntos contratados con el hallazgo verificado que le corresponde, su evidencia, su prioridad y la acción recomendada.","Todas las cifras de este informe proceden de observación directa en plataforma con sesión iniciada entre el 3 y el 5 de septiembre de 2026. 382 publicaciones clasificadas una a una, 8 cuentas, 6 plataformas y 20 figuras de verificación."]},"como_leer":[["Qué es este documento",[{"t":"Este es el informe técnico completo del diagnóstico digital 360 de Freddy Bernal. Usa la estructura de la cotización ID-20260824-8092 como índice: recorre los veintiún módulos de análisis en su orden, y dentro de cada uno recorre todos los puntos contratados, uno por uno, con el hallazgo verificado que le corresponde.","lead":""},{"t":"Cada punto lleva su hallazgo, el tipo de evidencia que lo sostiene, la prioridad de la corrección que exige y la acción recomendada. Son 267 puntos de análisis sobre 8 cuentas, 6 plataformas y 382 publicaciones clasificadas una a una.","lead":""}]],["Cómo se obtuvieron los datos",[{"t":"El trabajo se hizo en dos fases. La documental reconstruyó la trayectoria digital completa a partir del sitio oficial, los blogs heredados, prensa venezolana y colombiana, registros oficiales de sanciones y publicaciones de organizaciones especializadas. La de inspección navegó directamente a cada perfil con sesión iniciada entre el 3 y el 5 de septiembre de 2026, con captura de pantalla de cada uno.","lead":""},{"t":"De ahí proceden todas las cifras de seguidores, biografías, insignias, fotografías, portadas y enlaces que contiene este informe. No son datos inferidos de buscadores: son la lectura de la pantalla en esa fecha, y las capturas que ilustran cada módulo son las de esa misma sesión.","lead":""},{"t":"Sobre esa base se clasificaron 127 publicaciones de Instagram, 192 de X y 63 de TikTok con fecha y hora exactas, se midieron 24 Reels en reproducciones, se recorrió el histórico completo de TikTok mediante su ranking nativo, se reprodujeron tres piezas de vídeo con audio y se analizaron 108 respuestas recibidas y las muestras de comentarios de las tres plataformas.","lead":""}]],["Hallazgo y recomendación no son lo mismo",[{"t":"El informe mantiene esa distinción en todo momento, y conviene tenerla presente al leerlo. Los HALLAZGOS están verificados con fuente y fecha: son hechos observados. Las RECOMENDACIONES son interpretación profesional del analista sobre esos hallazgos, y así se identifican.","lead":""},{"t":"Donde un dato no pudo verificarse con rigor, se consigna como tal en lugar de estimarse. Las proyecciones, cuando aparecen, se presentan como escenarios explícitos con su supuesto declarado. Ningún punto de este informe se ha rellenado con suposiciones.","lead":""}]],["Qué significa cada tipo de evidencia",[{"t":"VERIFICADO el hallazgo procede de observación directa en pantalla o de medición sobre una muestra clasificada.","lead":"VERIFICADO"},{"t":"DIAGNÓSTICO POR EVIDENCIA el punto se refiere a algo interno de la organización (procesos, archivos, estructura de equipo) y se diagnostica leyendo el resultado publicado como radiografía del proceso que lo produjo. Se acompaña siempre de un protocolo de verificación interna.","lead":"DIAGNÓSTICO POR EVIDENCIA"},{"t":"HALLAZGO ESTRUCTURAL el dato no existe porque la configuración elegida no lo genera. El caso claro es Facebook: al ser un perfil personal y no una Página, no produce estadísticas nativas ni para el propio titular. La ausencia del dato ES el hallazgo.","lead":"HALLAZGO ESTRUCTURAL"},{"t":"DATO INTERNO DE LA CUENTA la información existe y está disponible dentro del panel de estadísticas de la propia cuenta. El informe indica la ruta exacta, pantalla por pantalla, para capturarla.","lead":"DATO INTERNO DE LA CUENTA"},{"t":"REQUIERE MONITORIZACIÓN CONTINUA se trata de una métrica de serie (volumen de menciones, sentimiento, share of voice) que exige una plataforma de escucha midiendo de forma continua. Una observación puntual no la produce con rigor.","lead":"REQUIERE MONITORIZACIÓN CONTINUA"},{"t":"REQUIERE MATERIAL ORIGINAL el dato está en los archivos de grabación del equipo y se lee de ellos en minutos.","lead":"REQUIERE MATERIAL ORIGINAL"},{"t":"EXCLUIDO POR CRITERIO PROFESIONAL el punto se excluyó deliberadamente. Se explica el motivo en cada caso.","lead":"EXCLUIDO POR CRITERIO PROFESIONAL"}]],["Cómo está organizado",[{"t":"Tras este apartado vienen el índice de módulos y el resumen ejecutivo, con los seis hallazgos que definen la situación. Después, los veintiún módulos punto por punto, que son el cuerpo del informe. El documento cierra con la hoja de ruta priorizada a 90 días, el capítulo de profundización, y los anexos de fuentes y metodología.","lead":""},{"t":"Las capturas de pantalla que ilustran cada módulo permiten verificar el hallazgo sin salir del documento. Los gráficos sintetizan las distribuciones y comparaciones que sostienen las conclusiones principales.","lead":""}]]],"resumen":{"intro":{"t":"Seis hallazgos definen la situación. Todos están verificados con observación directa y ninguno depende de estimación.","lead":""},"hallazgos":[["1,22 millones de audiencia declarada. Aproximadamente 1.700 personas de comunidad real.",{"t":"El ecosistema suma 1.223.893 seguidores en ocho cuentas. Pero la comunidad activa —quienes efectivamente interactúan— se sitúa en el orden de 1.700 personas por ciclo de publicación. En X, la cuenta más grande, de cada 100.000 seguidores unos 9 interactúan. En TikTok, con la mitad de seguidores que X, la comunidad es 17 veces mayor. La cifra grande sirve para el titular; la pequeña es la que sostiene cualquier movilización real, y no está donde está la audiencia.","lead":""}],["Cero verificaciones, una cuenta suplantadora activa y un handle histórico libre.",{"t":"Ninguna de las siete plataformas tiene insignia de verificación. Existe una cuenta que suplanta al gobernador en Instagram, escribe en primera persona y acumula 3.266 seguidores: está inactiva desde mayo de 2022, pero los ciudadanos siguen comentando en ella, y entre esos comentarios hay peticiones de auxilio reales —incluida la de una mujer que expone la desaparición forzada de su esposo— que nadie ha leído en más de un año. Y el antiguo @usuario de Instagram, freddybernalr, está LIBRE y comprobado en pantalla: cualquiera puede registrarlo hoy y heredar una década de enlaces entrantes desde la propia infraestructura del gobernador.","lead":""}],["618.000 personas —el 50,6% de la audiencia— no tienen ninguna ruta de salida.",{"t":"Solo X, con 602.800 seguidores, enlaza a un destino propio. TikTok (319.200), Instagram (244.000), Facebook, Threads y YouTube no tienen ningún enlace en biografía. Con una mediana de 16.600 reproducciones por Reel y tres publicaciones diarias, solo Instagram genera del orden de un millón y medio de impresiones al mes que no pueden terminar en ningún sitio. Es el mayor desperdicio detectado y la corrección de mayor retorno y menor esfuerzo del informe: se ejecuta en treinta segundos por cuenta.","lead":""}],["La fórmula que funciona está probada con tres años de datos propios y representa una cuarta parte de la producción.",{"t":"Cuatro ejes dominan el top de rendimiento de las tres plataformas: paz y frontera, seguridad con resultado verificable, identidad y cultura regional, y contenido humano sin carga política. Los veinte contenidos de mayor alcance de todo el ecosistema son vídeos de TikTok, el más antiguo de octubre de 2021 y el más reciente de diciembre de 2025 — no es una moda, es un patrón sostenido durante toda la gestión. Esos tres pilares representan hoy en conjunto menos de una cuarta parte de lo que se produce, mientras la política institucional y el vocabulario doctrinal, que rinden peor, ocupan más de un quinto. No hace falta producir más: hace falta invertir la proporción.","lead":""}],["El cuello de botella no es la capacidad de producción. Es la arquitectura sobre la que se apoya.",{"t":"El equipo produce entre 30 y 42 piezas semanales, más 42,1 horas de programa de televisión en siete meses. Es una capacidad alta, propia de un equipo dedicado. Y sin embargo: el programa semanal acumula 1.939 visualizaciones y UN comentario en 22 emisiones; el sitio oficial enlaza al canal de YouTube inactivo en lugar del activo; el rótulo del set aparece cortado a media palabra en cada emisión desde hace meses; conviven cuatro sistemas gráficos y un logotipo profesional sin desplegar en ninguno de los ocho puntos de contacto; y X estuvo tres meses sin publicar mientras Instagram mantenía el ritmo. Nueve de las doce acciones de prioridad alta del estudio de reputación son de configuración, arquitectura o instrumentación, no de producción de contenido.","lead":""}],["El registro de sanciones internacionales condiciona qué tácticas son ejecutables.",{"t":"El sujeto está designado en diez listas de sanciones de ocho jurisdicciones. No es un dato biográfico accesorio: afecta a la elegibilidad publicitaria en las plataformas de Meta y Google, a los procesos de verificación de identidad de las redes sociales, a la viabilidad de la cadena de pago y de proveedores, y al tratamiento por parte de medios y organizaciones internacionales. Cualquier planificación de comunicación que ignore esta variable partirá de un supuesto falso. El dato de mayor relevancia temporal es la persistencia de las designaciones tras la transición política de enero de 2026, con un registro de inhabilitación federal de contratación fechado en marzo de 2026, posterior a la transición.","lead":""}]],"calificaciones":[["Madurez digital general (M01)","4,0 / 10","Alcance sobresaliente, gobernanza deficiente"],["Canal de Instagram (M02)","5,5 / 10","Producción alta y formato correcto, arquitectura de conversión inexistente"],["Identidad visual (M09)","5,0 / 10","Activos de buena calidad, gobernanza de marca inexistente"],["Engagement TikTok (M12)","4,87%","SALUDABLE — la mejor cifra del ecosistema"],["Engagement Instagram (M12)","0,264%","POR DEBAJO de la referencia, y en caída del 31% en un mes"],["Alcance X sobre seguidores (M12)","0,56%","MUY POR DEBAJO de la referencia de 2-5%"],["Aprobación de gestión (dic. 2024)","61%","12 puntos por debajo del comparador natural (Lacava, 73%)"]],"calificaciones_headers":["Indicador","Valor","Lectura"],"cierre":[]},"modulos":[{"id":"M01","titulo":"DIAGNÓSTICO GENERAL Y AUDITORÍA DE PRESENCIA DIGITAL","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"Inventario verificado en pantalla · 8 líneas de análisis","fuente":"Auditoría de Presencia Digital — Versión 3 FINAL, verificada en plataforma. Corte: 3 de septiembre de 2026. (Versiones 1 y 2 conservadas como trazabilidad.)","calificacion":"4,0 / 10 — alcance sobresaliente, gobernanza deficiente","resumen":[{"t":"Hay diez activos digitales bajo el nombre del gobernador y una audiencia acumulada de aproximadamente 1.221.000 seguidores. El alcance es notable; la gestión de ese alcance es el problema.","lead":""},{"t":"La versión 3 cerró los trece puntos que las versiones anteriores dejaban como NO VERIFICADO mediante inspección directa en pantalla con sesión iniciada. Esa inspección localizó dos activos que ningún barrido anterior había detectado y confirmó como real el riesgo más grave que la versión 2 solo planteaba como hipótesis: la cuenta suplantadora de Instagram.","lead":""},{"t":"La nota baja respecto de las versiones anteriores precisamente porque la verificación directa convirtió riesgos hipotéticos en riesgos confirmados.","lead":""}],"puntos":[{"n":1,"punto":"Inventario completo de cuentas oficiales en todas las plataformas","estado":"VERIFICADO","prioridad":"—","hallazgo":[{"t":"Se localizaron diez activos digitales bajo el nombre del gobernador, todos observados en pantalla el 3 de septiembre de 2026. La audiencia total acumulada es de aproximadamente 1.221.000 seguidores, distribuida de forma muy desigual: X concentra el 49,4%, TikTok principal el 26,1%, Instagram el 20,0%, Facebook el 2,6% y el resto el 1,9%.","lead":""},{"t":"Advertencia sobre la cifra: el total no equivale a personas únicas. Es previsible un solapamiento alto entre las tres plataformas principales, por lo que la audiencia real de personas distintas es sustancialmente menor.","lead":""}],"accion":"Publicar en el sitio oficial una página fija «Cuentas oficiales» que liste los ocho activos sociales, declare cuáles están abandonados y enlazarla desde cada biografía.","tabla":{"headers":["Plataforma","@usuario","Seguidores","Insignia","Última actividad"],"rows":[["X","@FreddyBernal","602.800","NO","Activo, diario"],["TikTok principal","@freddybernalr","319.200 (3 M me gusta)","NO","Activo"],["Instagram","@freddybernalven","244.000","NO","Activo"],["Facebook","perfil personal (…706206)","32.000","NO","Activo, hace 6 horas"],["TikTok secundario","@freddybernalvzla","19.400","NO","Activo"],["Mastodon","@FreddyBernal@mastodon.social","2.900","N/A","Junio 2020 — ABANDONADA"],["Threads","@freddybernalven","2.683","NO","Hace 3 días"],["YouTube","@FreddyBernalOficial","910 suscriptores","NO","Hace 11 meses — ABANDONADO"],["Sitio web","freddybernaloficial.com","—","—","Activo, diario"],["Blogs heredados","freddybernalrosales / bernalfreddy (WordPress)","—","—","Junio 2016 — ABANDONADOS"]]}},{"n":2,"punto":"Detección de cuentas no oficiales, parodias y suplantaciones","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"SUPLANTACIÓN CONFIRMADA — @freddybernalven1 en Instagram. Verificada en pantalla. Usa fotografías del gobernador y piezas gráficas de su propia campaña institucional: «Freddy Bernal GOBERNADOR», la proclamación en la Plaza Bolívar del 24 de noviembre, el saludo de cumpleaños junto a Nicolás Maduro y la acreditación como miembro de la Dirección Nacional del PSUV. Acumula 3.266 seguidores, 7 publicaciones, 498 seguidos y 153 me gusta. Su última publicación es del 2 de mayo de 2022 y está redactada en primera persona: afirma no dar descanso hasta lograr los objetivos y declararse gobernador de todos los tachirenses.","lead":"SUPLANTACIÓN CONFIRMADA —"},{"t":"Es el hallazgo más grave de toda la auditoría, y no por la cuenta en sí sino por lo que ocurre dentro de ella. Los comentarios muestran que la ciudadanía la usa como si fuera el canal real del gobernador: siguen llegando comentarios hasta hace 30 semanas, y entre ellos hay peticiones de auxilio dirigidas a él por su nombre, incluida la de una mujer que expone la desaparición forzada de su esposo. Esos mensajes llevan más de un año sin que nadie los lea. No es solo un riesgo de marca: es un canal de atención ciudadana fantasma.","lead":""},{"t":"HANDLE LIBRE — instagram.com/freddybernalr. Comprobado en pantalla: la dirección devuelve «Esta página no está disponible». Fue el @usuario oficial de Instagram, declarado como tal en los artículos que el propio gobernador firmaba en 2016, y la cuenta de Mastodon sigue enlazándolo hoy. Cualquiera puede registrarlo y heredar una década de enlaces entrantes legítimos, incluidos los de su propia infraestructura.","lead":"HANDLE LIBRE —"},{"t":"HOMÓNIMOS DESCARTADOS. @fredybernaloficial (1.362 seguidores) es «Fredy Bernal», artista, ingeniero y DJ, con contenido familiar y musical, sin ninguna relación; la coincidencia del handle con la palabra «oficial» es casual y se mantiene solo como nota de vigilancia por confusión en buscador. @bernalfreddy (80 seguidores) es una persona distinta con contenido familiar. Quedan pendientes de revisión rutinaria @freddybernal3030, @freddybernal59 y @freddybernal20, todos con audiencias mínimas y sin uso de imagen institucional.","lead":"HOMÓNIMOS DESCARTADOS."},{"t":"ANTECEDENTES DOCUMENTADOS. Enero y marzo de 2020: suspensión e inhabilitación de la cuenta de X, entonces con más de 472.000 seguidores. Diciembre de 2022: denuncia pública de usurpación de identidad — un tercero se hizo pasar por el gobernador desde números de Movilnet y Digitel para proponer negocios indebidos y extorsionar a familiares, contactos y funcionarios. Desde 2016: reportes de organizaciones de prensa sobre uso de cuentas falsas en el entorno informativo del Táchira.","lead":"ANTECEDENTES DOCUMENTADOS."}],"accion":"Registrar instagram.com/freddybernalr HOY como cuenta defensiva. Reportar @freddybernalven1 ante Instagram como suplantación de figura pública, pero capturando antes los comentarios: contienen peticiones ciudadanas reales que deben canalizarse en lugar de perderse al eliminarse la cuenta."},{"n":3,"punto":"Estado de verificación (insignias) por plataforma","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"Resultado: cero insignias en todo el ecosistema. Se inspeccionó cada perfil con sesión iniciada y ninguno presenta marca de verificación de ningún tipo.","lead":""},{"t":"Un ecosistema de 1,22 millones de seguidores sin una sola marca de autenticidad, con dos episodios previos de suplantación documentados, una cuenta suplantadora activa y un handle histórico libre. La verificación no es un adorno: es la única defensa estructural disponible frente a la suplantación y hoy no existe ninguna.","lead":""}],"accion":"Iniciar en 15 días los expedientes de verificación en X (insignia gubernamental), TikTok e Instagram. De ellos dependen 1,17 millones de seguidores.","tabla":{"headers":["Plataforma","Audiencia","Insignia","Vía correcta","Prioridad"],"rows":[["X","602.800","NO","Insignia gris de organización gubernamental, no la azul de suscripción individual","CRÍTICA"],["TikTok","319.200","NO","Verificación de figura pública; audiencia y cargo cumplen el umbral","CRÍTICA"],["Instagram","244.000","NO","Notoriedad pública o Meta Verified; exige corregir antes la categoría","CRÍTICA"],["Facebook","32.000","NO","Meta Verified; exige migrar antes de perfil personal a Página","ALTA"],["TikTok secundario","19.400","NO","Resolver primero si la cuenta debe existir","MEDIA"],["Threads","2.683","NO","Hereda la verificación de Instagram","DERIVADA"],["YouTube","910","NO","No alcanza el umbral de 100.000 suscriptores. Inviable a corto plazo","BAJA"],["Mastodon","2.900","N/A","No usa insignias: la autenticidad se acredita con enlace recíproco verificado. No existe","Resolver por cierre"]]}},{"n":4,"punto":"Coherencia de nombre, @usuario y palabras clave entre plataformas","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"Existen SEIS convenciones distintas de @usuario. X y Mastodon usan «FreddyBernal» (deducible por un ciudadano, y por eso Mastodon es peligrosa); Instagram y Threads usan «freddybernalven» (parcialmente deducible); TikTok principal usa «freddybernalr» y el secundario «freddybernalvzla» (no deducibles); YouTube usa «FreddyBernalOficial»; Facebook usa «Freddy-Alirio-Bernal-Rosales» más un identificador numérico.","lead":""},{"t":"Los dos TikTok son el caso más confuso: dos cuentas activas, con handles distintos, ambas del gobernador, una remitiendo a la otra desde su biografía, y ninguna enlazada desde el sitio oficial.","lead":""},{"t":"CUATRO CARGOS SIMULTÁNEOS, todos publicados y accesibles hoy. «Gobernador reelecto del estado Táchira» en X es la única formulación exacta. «Gobernador del estado Táchira» en Instagram y TikTok es correcta pero incompleta: omite la reelección de mayo de 2025. «Candidato a la gobernación del Táchira» en el TikTok secundario, con 19.400 seguidores activos, es FALSA: gobierna desde diciembre de 2021. «Protector del Táchira» en Mastodon es CADUCA: cargo abandonado en diciembre de 2021. «Miembro de la Dirección Nacional» en los blogs de WordPress es CADUCA, material de 2016.","lead":""},{"t":"CATEGORÍAS MAL ASIGNADAS. Instagram clasifica el perfil como «Blog personal»; la categoría correcta para un mandatario en ejercicio es «Funcionario gubernamental» o «Figura pública», y la categoría influye en la elegibilidad para verificación. Facebook lo clasifica como «Creador(a) digital», mantiene la lista de amigos pública y publica una fecha de nacimiento (16 de junio de 1961) que no coincide con la que consta en su biografía oficial y en las fuentes públicas (16 de junio de 1962).","lead":"CATEGORÍAS MAL ASIGNADAS."},{"t":"NOMBRE VISIBLE. «Freddy Bernal» en X y TikTok principal; «Freddy Alirio Bernal Rosales» en Instagram, Facebook, Threads y TikTok secundario. Ninguna incorpora el cargo. Los emojis 💛🖤❤️ de la bandera del Táchira aparecen solo en X e Instagram y son el único elemento de marca coherente detectado.","lead":"NOMBRE VISIBLE."},{"t":"Ninguna biografía ofrece una vía de contacto. Quien llega a cualquiera de los perfiles no encuentra cómo iniciar un trámite ni a dónde dirigir una denuncia. Ese vacío es exactamente lo que está llenando la cuenta suplantadora.","lead":""}],"accion":"Corregir HOY la biografía del TikTok secundario. Homogeneizar todas las biografías tomando la de X como plantilla, con los emojis extendidos a todas las plataformas."},{"n":5,"punto":"Coherencia visual de foto de perfil, portada y banners","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"CUATRO FOTOGRAFÍAS DE PERFIL DISTINTAS. La bandera de Venezuela con lazo negro de luto se usa de forma coherente en X, TikTok principal, Instagram y Facebook —lo cual es correcto como principio—, pero no es un retrato: a 40 píxeles en un timeline móvil el ciudadano ve una mancha tricolor, no la cara del gobernador. Como duelo temporal es legítimo; como estado permanente elimina el reconocimiento facial, que es el activo de identidad más valioso de un cargo electo. Threads usa un retrato en camisa blanca, el TikTok secundario otro retrato distinto y YouTube un cuarto con taza y traje azul.","lead":"CUATRO FOTOGRAFÍAS DE PERFIL DISTINTAS."},{"t":"X NO TIENE IMAGEN DE PORTADA. El encabezado está vacío, en gris liso. Es el perfil con 602.800 seguidores, el principal del ecosistema, y desaprovecha por completo el espacio gráfico más visible de la plataforma.","lead":"X NO TIENE IMAGEN DE PORTADA."},{"t":"MASTODON conserva como banner una pieza de la campaña presidencial «Juntos Podemos Más — Nicolás Maduro presidente», material de 2018: ocho años desactualizado, en una cuenta abandonada, con 2.900 seguidores expuestos. Facebook sí tiene portada, coherente con la línea gráfica de gestión. YouTube está sin imagen de canal visible.","lead":""},{"t":"DESTACADOS DE INSTAGRAM. El perfil mantiene siete destacadas visibles en el barrido general (#SANTOCRISTO, OBRAS, VIRGEN TÁRIBA, EL COROZO, JURAMENTACIÓN, PLAN GOBIERNO y JORNADAS; el conteo completo del M02 eleva la cifra a catorce). La portada de «PLAN GOBIERNO» es una pieza de campaña con llamada al voto. Mantener material electoral fijado en el perfil de un mandatario en ejercicio mezcla la etapa de campaña con la de gestión.","lead":"DESTACADOS DE INSTAGRAM."}],"accion":"Poner imagen de portada en X (el banner del sitio ya existe y se adapta a 1500×500 en minutos). Fijar fecha de retorno del retrato. Sustituir la portada de «PLAN GOBIERNO»."},{"n":6,"punto":"Auditoría de enlaces: link in bio, sitio web, WhatsApp, formularios","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"De 1,22 millones de seguidores, solo los 602.800 de X tienen una ruta hacia un destino propio. El 50,6% restante —más de 618.000 personas— está en plataformas sin ningún enlace. Es el mayor desperdicio de audiencia detectado en toda la auditoría.","lead":""},{"t":"El sitio oficial enlaza 4 de 8 activos sociales. Están AUSENTES los dos TikTok (338.600 seguidores fuera de todo inventario oficial), Threads, WhatsApp —canal dominante en Venezuela—, cualquier formulario de contacto o sección de trámites, y tachira.gob.ve: el sitio personal no enlaza al portal institucional que dirige.","lead":""},{"t":"RIESGOS DE ENLACE Y DATOS. ROTO: la biografía de Mastodon apunta a instagram.com/freddybernalr, que no existe, legitimando el handle huérfano ante 2.900 seguidores. EXPOSICIÓN: los blogs heredados publican al pie de cada artículo una dirección personal de Gmail —debe comprobarse si es correo de recuperación de alguna cuenta vigente, porque entonces el riesgo es de toma de control, no de spam. EXPOSICIÓN: el perfil de Facebook mantiene la lista de amigos pública. FRÁGIL: el boletín «Semanario» se distribuye desde un archivo en Google Drive en lugar del propio dominio. SEGURIDAD: el sitio se sirve por http en algunas rutas indexadas y por https en otras. MENOR: el pie del sitio declara «Copyright 2025» con contenido de septiembre de 2026.","lead":"RIESGOS DE ENLACE Y DATOS."}],"accion":"Añadir enlace en biografía en TikTok, Instagram, Threads, Facebook y YouTube. Recupera 618.000 seguidores hoy sin ruta de conversión y es la corrección de mayor retorno y menor esfuerzo de todo el informe.","tabla":{"headers":["Plataforma","Audiencia","Enlace en biografía","Consecuencia"],"rows":[["X","602.800","freddybernaloficial.com","Correcto. Única plataforma que convierte."],["TikTok principal","319.200","NINGUNO","La segunda mayor audiencia sin salida hacia ningún destino propio."],["Instagram","244.000","NINGUNO","La tercera tampoco. Entre TikTok e Instagram, 563.200 seguidores sin ruta."],["Facebook","32.000","No visible","Sin ruta clara."],["TikTok secundario","19.400","NINGUNO","Sin ruta."],["Threads","2.683","NINGUNO","Sin biografía siquiera."],["Mastodon","2.900","Tres enlaces, uno ROTO","Enlaza a un Instagram inexistente."],["YouTube","910","No visible","Sin ruta."]]}},{"n":7,"punto":"Antigüedad de cuentas y evolución histórica de nombres","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"El rastro digital más antiguo es de julio de 2009 (primera entrada archivada del blog de WordPress): diecisiete años. El activo social más antiguo es la cuenta de X, dada de alta en febrero de 2010: más de 16 años, un activo de autoridad considerable e infrautilizado.","lead":""},{"t":"EVOLUCIÓN DE LA AUDIENCIA EN X. De más de 472.000 seguidores en enero de 2020 a 602.800 en septiembre de 2026: unos 131.000 nuevos en seis años, en torno a un 28% acumulado. Ritmo bajo para un periodo que incluyó una elección ganada y una reelección. Base consolidada pero estancada.","lead":"EVOLUCIÓN DE LA AUDIENCIA EN X."},{"t":"EL PATRÓN DE FONDO. Cada cambio de etapa política genera un canal nuevo y ninguno de los anteriores se cierra ni se actualiza. Blog de 2009 para la etapa de dirigente. Mastodon de 2020 para la etapa de protector. TikTok de 2022 reutilizando un handle de Instagram ya migrado. Segundo TikTok para la campaña, todavía descrito como candidatura. El resultado son cinco estratos históricos vivos simultáneamente y un ciudadano sin criterio para distinguir el vigente. No es descuido puntual: es la ausencia de un procedimiento de cierre de canales.","lead":"EL PATRÓN DE FONDO."}],"accion":"Establecer un procedimiento de cierre de canales: ningún activo se abandona sin actualizar biografía, redirigir enlaces o cerrarlo.","tabla":{"headers":["Fecha","Hecho","Estado hoy"],"rows":[["Julio 2009","Primera entrada del blog de WordPress","En línea, abandonado"],["Febrero 2010","Alta de la cuenta de X","Activo, canal principal"],["Marzo 2014","Cabecera del blog con lema de campaña de la época","En línea"],["2015–2016","Artículos de opinión. Declara «Instagram: FREDDYBERNALR» como canal oficial","Ese handle hoy está LIBRE"],["Junio 2016","Última entrada del blog","Abandonado, en línea"],["2018","Pieza gráfica de la campaña presidencial","Hoy sigue de banner en Mastodon"],["Ene y mar 2020","Suspensión e inhabilitación de X, con más de 472.000 seguidores","Recuperada"],["Abril 2020","Apertura de Mastodon en el contexto de esas suspensiones","Abandonada desde junio de 2020"],["Diciembre 2021","Asume la Gobernación el día 4. «Protector» queda obsoleto","Sigue publicado en Mastodon"],["Mayo 2022","Última publicación de la cuenta suplantadora @freddybernalven1","Sigue recibiendo comentarios ciudadanos"],["Noviembre 2022","Publicación más antigua localizada en TikTok","Activo, 319.200 seguidores"],["Diciembre 2022","Denuncia pública de usurpación de identidad con fines de extorsión","—"],["Mayo 2025","Reelección como gobernador","Solo reflejada en X"],["Octubre 2025 (aprox.)","Último vídeo publicado en YouTube @FreddyBernalOficial","Canal abandonado"],["Diciembre 2025","Carga del favicon actual del sitio","Vigente"],["Septiembre 2026","Actividad diaria en X, TikTok, Instagram, Facebook y el sitio","Vigente"]]}},{"n":8,"punto":"Brecha entre presencia actual y estándar esperado para el cargo","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"Contraste con lo esperable de un gobernador de un estado fronterizo de aproximadamente 1,3 millones de habitantes, con competencias en seguridad, salud, vivienda y relación binacional. Se identifican cuatro brechas críticas, seis altas y cinco medias.","lead":""}],"accion":"Las cuatro brechas críticas se atacan en el Bloque 0 y el Bloque 1 del plan de acción (primeras 24 horas y primeros 15 días).","tabla":{"headers":["Dimensión","Estándar esperado","Situación verificada","Brecha"],"rows":[["Verificación","Insignia oficial en las plataformas principales","Cero insignias en las siete plataformas","CRÍTICA"],["Canal de atención ciudadana","Vía de contacto oficial y monitorizada","No existe. El vacío lo ocupa una cuenta suplantadora donde llegan peticiones de auxilio que nadie lee","CRÍTICA"],["Control del perímetro","Todo activo bajo su nombre controlado o cerrado","Cuatro activos huérfanos y un handle histórico libre","CRÍTICA"],["Conversión de audiencia","Enlace a destino propio en toda plataforma","El 50,6% de la audiencia (618.000 personas) sin ningún enlace","CRÍTICA"],["Coherencia del cargo","Un solo cargo declarado, el vigente","Cuatro versiones simultáneas, dos falsas o caducas","ALTA"],["Identificador único","Un mismo @usuario replicado","Seis convenciones distintas, incluidos dos TikTok activos","ALTA"],["Inventario oficial de canales","Página pública que liste las cuentas auténticas","Inexistente. El sitio enlaza 4 de 8 y omite los dos TikTok (338.600 seguidores)","ALTA"],["Higiene de datos","Sin datos personales expuestos","Correo personal en los blogs; lista de amigos pública en Facebook","ALTA"],["Presencia en WhatsApp","Canal de difusión verificado","Ausente, pese a que la suplantación de 2022 se ejecutó por mensajería","ALTA"],["Identidad visual","Misma fotografía y portadas actualizadas","Cuatro fotografías distintas; X sin portada; Mastodon con banner de 2018","ALTA"],["Categorización de perfiles","Categoría de funcionario gubernamental","«Blog personal» en Instagram y «Creador digital» en Facebook","MEDIA"],["Formato de Facebook","Página institucional","Perfil personal: no admite verificación ni gestión por equipo","MEDIA"],["Vídeo largo","Canal de YouTube activo como archivo de gestión","910 suscriptores y once meses sin publicar, pese a estar enlazado desde el sitio","MEDIA"],["Separación persona/institución","Enlace recíproco con la gobernación","Ambos ecosistemas existen sin enlazarse","MEDIA"],["Transparencia de gestión","Sección de rendición de cuentas","El sitio es un portal de noticias, sin datos ni indicadores","MEDIA"]]}}]},{"id":"M02","titulo":"ANÁLISIS DE INSTAGRAM","estado_modulo":"DIAGNÓSTICO COMPLETO","alcance":"127 publicaciones clasificadas · 24 Reels medidos · 14 destacadas · 19 líneas de análisis","fuente":"M02 — Análisis de Instagram @freddybernalven. Corte: 3 de septiembre de 2026. Base: 127 publicaciones clasificadas en dos ventanas independientes (13 ago–3 sep, 63 piezas; 13 jul–2 ago, 64 piezas), 24 Reels medidos en reproducciones, 14 destacadas y la pestaña de etiquetados.","calificacion":"5,5 / 10 — producción alta y formato correcto, arquitectura de conversión inexistente","resumen":[{"t":"Instagram es su tercera plataforma por tamaño (244.000 seguidores) pero la primera en volumen de trabajo: publica algo más de tres veces al día, todos los días. El problema no es el esfuerzo: es que ese esfuerzo no se convierte.","lead":""},{"t":"Dos límites declarados. Instagram aplicó limitación de tasa durante la recolección, por lo que los tramos de 6 y 12 meses son proyección y no medición. Y el alcance desglosado entre seguidores y no seguidores, la retención de Lives, las métricas de Historias y el tiempo de reacción en comentarios solo son accesibles desde Insights, es decir, entrando con la cuenta.","lead":""}],"puntos":[{"n":1,"punto":"Biografía: estructura, palabras clave, propuesta de valor y CTA","estado":"VERIFICADO","prioridad":"CRÍTICA","hallazgo":[{"t":"FALLO CRÍTICO: el perfil no tiene enlace. Ninguno. Sin enlace en biografía, sin botón de contacto, sin llamada a la acción. 244.000 personas no tienen a dónde ir desde ahí.","lead":"FALLO CRÍTICO:"},{"t":"El coste es cuantificable: con una mediana de 16.600 reproducciones por Reel y unas tres publicaciones diarias, la cuenta genera del orden de un millón y medio de impresiones al mes, y ninguna puede terminar en el sitio oficial, en un formulario de atención o en un canal de contacto, porque no hay dónde pulsar. Es la corrección de mayor retorno y menor esfuerzo de todo el informe, y se ejecuta en treinta segundos.","lead":""},{"t":"La biografía usa 38 de los 150 caracteres disponibles («Gobernador del estado Táchira 💛🖤❤️»). Declara el cargo pero omite la reelección que sí figura en X, y no incluye municipio, periodo ni ámbito de competencia. Las únicas palabras clave son «Gobernador» y «Táchira»; ausentes San Cristóbal, Gobernación, frontera y atención al ciudadano, pese a que Instagram indexa el campo de biografía en su buscador.","lead":""},{"t":"El nombre visible es «Freddy Alirio Bernal Rosales», la forma legal completa, mientras en X y TikTok usa «Freddy Bernal». El campo nombre es indexable: quien escriba «Freddy Bernal» encuentra peor este perfil que a otros homónimos.","lead":""},{"t":"La categoría es «Blog personal» para un gobernador en ejercicio. Debería ser «Funcionario gubernamental» o «Figura pública»: afecta a la elegibilidad para verificación y al tratamiento del contenido político.","lead":""},{"t":"PROPUESTA DE BIOGRAFÍA: «Gobernador reelecto del estado Táchira 💛🖤❤️ | San Cristóbal, Venezuela | Gestión, obras y atención al ciudadano 👇» más enlace a una página de destino que agrupe sitio oficial, canal de WhatsApp y formulario de contacto.","lead":"PROPUESTA DE BIOGRAFÍA:"}],"accion":"Añadir enlace en biografía HOY. Cambiar la categoría. Reescribir la biografía."},{"n":2,"punto":"Foto de perfil: legibilidad, encuadre y reconocimiento en miniatura","estado":"VERIFICADO","prioridad":"ALTA","hallazgo":[{"t":"La imagen es la bandera de Venezuela con lazo negro de luto, la misma que en X, TikTok y Facebook. La coherencia entre plataformas es correcta; la imagen elegida no.","lead":""},{"t":"RECONOCIMIENTO EN MINIATURA: FALLA. A 32 píxeles, que es el tamaño real junto a un comentario o en la barra de historias, se ve una mancha tricolor. No hay rostro que reconocer. DIFERENCIACIÓN: FALLA. La bandera de Venezuela es el recurso gráfico más repetido del país y no distingue esta cuenta de ninguna otra. El encuadre circular es correcto (el lazo queda centrado) y el contraste es aceptable sobre fondo claro y oscuro.","lead":"RECONOCIMIENTO EN MINIATURA:"},{"t":"VIGENCIA: SIN RESOLVER. No consta fecha de retorno al retrato. Un duelo sin fecha de salida se convierte en estado permanente.","lead":"VIGENCIA:"}],"accion":"Fijar fecha de retorno a un retrato en plano medio corto, fondo liso y rostro ocupando al menos el 60% del círculo."},{"n":3,"punto":"Historias destacadas: portadas, orden, nombres y vigencia","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"Hay 14 destacadas. VIGENCIA: tres (4F 2024, FISS2024, #23Ene 2024) son de hace más de dos años y medio; ocupan las últimas posiciones pero siguen siendo archivo público abierto a cualquiera.","lead":""},{"t":"MATERIAL DE CAMPAÑA: la portada de «PLAN GOBIERNO» mantiene la llamada al voto («VOTE Bernal»). Es material electoral fijado en el perfil de un mandatario en ejercicio.","lead":"MATERIAL DE CAMPAÑA:"},{"t":"NOMENCLATURA INCONSISTENTE: conviven mayúsculas, hashtags (#SANTOCRISTO, #23Ene), siglas sin explicar (SS, FISS), anglicismos (MASTER PLAN) y dos criterios para el mismo nombre (FISS 2025 con espacio, FISS2024 sin él).","lead":"NOMENCLATURA INCONSISTENTE:"},{"t":"ORDEN: no responde a ningún criterio de utilidad. «OBRAS», la carpeta con más valor para un ciudadano que quiere ver gestión, aparece en segunda posición, por debajo de una devoción religiosa.","lead":""},{"t":"PORTADAS: se usan fotogramas del propio contenido, sin plantilla gráfica común.","lead":"PORTADAS:"},{"t":"FALTA LO ESENCIAL: no hay destacada de «CÓMO CONTACTAR», «TRÁMITES» ni «PREGUNTAS FRECUENTES». Dado que no hay enlace en biografía, una destacada de contacto sería hoy la única vía de atención visible del perfil.","lead":"FALTA LO ESENCIAL:"}],"accion":"Archivar las tres destacadas de 2024, unificar nomenclatura, sustituir la portada de PLAN GOBIERNO y crear una destacada «CONTACTO Y TRÁMITES» en primera posición.","tabla":{"headers":["Orden","Nombre","Lectura"],"rows":[["1","#SANTOCRISTO","Devoción regional. Vigente."],["2","OBRAS","Gestión. Es la más valiosa y debería ser la primera."],["3","VIRGEN TÁRIBA","Devoción regional. Vigente."],["4","EL COROZO","Territorial. Vigente."],["5","JURAMENTACIÓN","Acto protocolario. Valor decreciente."],["6","PLAN GOBIERNO","PROBLEMA: portada de campaña con llamada al voto."],["7","JORNADAS SOCIAL","Gestión. Nombre truncado e incompleto."],["8","MASTER PLAN","Anglicismo, incoherente con el resto."],["9","SS 2025","Siglas sin desarrollar."],["10","FISS 2025","Feria de San Sebastián 2025. Vigente hasta enero."],["11","PROSPERIDAD","Genérico."],["12","4F 2024","CADUCA. Dos años y medio."],["13","FISS2024","CADUCA. Además sin espacio, a diferencia de «FISS 2025»."],["14","#23Ene 2024","CADUCA. Dos años y medio."]]}},{"n":4,"punto":"Feed: composición de grilla, patrón visual y coherencia cromática","estado":"VERIFICADO","prioridad":"MEDIA","hallazgo":[{"t":"COMPOSICIÓN: la grilla está dominada por fotogramas de vídeo (los Reels son entre el 71% y el 84% de lo publicado). Al ser capturas y no piezas diseñadas, la grilla se lee como un mosaico de escenas sueltas.","lead":"COMPOSICIÓN:"},{"t":"PATRÓN VISUAL: no existe. No hay retícula de tres, ni alternancia programada, ni piezas de separación. La única regularidad detectable es la presencia constante del gobernador en plano medio.","lead":"PATRÓN VISUAL:"},{"t":"COHERENCIA CROMÁTICA: baja y no gestionada. Conviven verdes de vegetación, azules de uniformes policiales, rojos de actos del partido y grises de interiores institucionales. No hay filtro común ni paleta aplicada.","lead":"COHERENCIA CROMÁTICA:"},{"t":"ELEMENTO REPETIDO CON FUERZA: las piezas de seguridad (detenidos ante murales de la Policía del Estado Táchira) aparecen con regularidad y tienen identidad gráfica propia muy marcada. Es el único subgénero visual reconocible del feed.","lead":"ELEMENTO REPETIDO CON FUERZA:"},{"t":"Sí hay rótulos incrustados en los vídeos («de esos que andan por ahí hablando bolserías», «DUDAR ES TRAICIÓN», «Activación de Drenaje de la Laguna»), lo cual es acertado para consumo sin sonido, pero la tipografía y la ubicación cambian de pieza a pieza.","lead":""},{"t":"ETIQUETADOS: la pestaña contiene solo 12 elementos, volumen muy bajo para una cuenta de 244.000 seguidores. Sugiere que no existe práctica de etiquetado recíproco con instituciones, alcaldías, gremios ni medio
